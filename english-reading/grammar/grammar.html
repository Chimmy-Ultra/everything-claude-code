數。"}, {"h": "看起來能數、其實不能數的字", "body": ["最麻煩的是一群「中文覺得可以數、英文卻不能數」的名詞。商業英文裡天天看到的有：<em>equipment<\/em>（設備）、<em>information<\/em>（資訊）、<em>advice<\/em>（建議）、<em>furniture<\/em>（家具）、<em>luggage<\/em> 或 <em>baggage<\/em>（行李）、<em>feedback<\/em>（意見回饋）、<em>merchandise<\/em>（商品）、<em>machinery<\/em>（機器）、<em>clothing<\/em>（衣物）。", "它們有一個共通點：都是<b>一整類東西的總稱<\/b>，不是單一個東西的名字。<em>furniture<\/em> 指的是「家具這一類」，裡面有椅子、桌子、櫃子；<em>luggage<\/em> 是「行李這一類」，裡面有箱子、袋子。總稱沒辦法一個一個數，加 <em>-s<\/em> 或 <em>a<\/em> 都不對。", "真的要數的時候有兩個辦法。一是借一個可以數的單位：<em>a piece of advice<\/em>、<em>two pieces of furniture<\/em>、<em>three pieces of luggage<\/em>。二是換成意思接近、本來就可數的字：想說「兩件家具」，可以直接說 <em>two desks<\/em>；想說「幾個建議」，可以說 <em>a few suggestions<\/em>。", "還有一個外表騙人的字：<em>news<\/em>。它結尾有 <em>s<\/em>，但它是不可數名詞，動詞用單數：<em>The news is good.<\/em>"], "table": {"head": ["不可數（不加 <em>a<\/em>、不加 <em>-s<\/em>）", "要數的時候", "意思接近的可數名詞"], "rows": [["<em>equipment<\/em> 設備", "<em>a piece of equipment<\/em>", "<em>machines<\/em>、<em>tools<\/em>、<em>devices<\/em>"], ["<em>information<\/em> 資訊", "<em>a piece of information<\/em>", "<em>details<\/em>、<em>facts<\/em>"], ["<em>advice<\/em> 建議", "<em>a piece of advice<\/em>", "<em>suggestions<\/em>、<em>tips<\/em>"], ["<em>furniture<\/em> 家具", "<em>a piece of furniture<\/em>", "<em>chairs<\/em>、<em>desks<\/em>"], ["<em>luggage<\/em> 行李", "<em>a piece of luggage<\/em>", "<em>bags<\/em>、<em>suitcases<\/em>"], ["<em>feedback<\/em> 意見回饋", "<em>a piece of feedback<\/em>", "<em>comments<\/em>"]]}, "ex": [{"en": "The new <u>equipment<\/u> arrives on Monday.", "zh": "新設備星期一到。", "note": "<em>equipment<\/em> 不可數，動詞用單數 <em>arrives<\/em>。"}, {"en": "Ms. Odell gave me a useful piece of <u>advice<\/u> about pricing.", "zh": "Odell 女士給了我一個關於定價的實用建議。"}, {"en": "Each passenger may check two pieces of <u>luggage<\/u> free of charge.", "zh": "每位旅客可以免費託運兩件行李。"}, {"en": "We received a lot of positive <u>feedback<\/u> on the new menu.", "zh": "新菜單收到很多正面的意見。"}], "quiz": [{"type": "tap", "q": "這句有一個字錯了。點出那個字。", "sentence": "The consultant gave us some useful advices on pricing.", "answer": [6], "why": "<em>advice<\/em> 是不可數名詞，沒有 <em>advices<\/em> 這個形式。可以寫 <em>some useful advice<\/em>，或換成可數的 <em>some useful suggestions<\/em>。<em>some<\/em> 不可數和複數都能接，所以它沒錯。"}], "takeaway": "<em>equipment<\/em>、<em>information<\/em>、<em>advice<\/em>、<em>furniture<\/em>、<em>luggage<\/em> 是一整類東西的總稱，不加 <em>a<\/em>、不加 <em>-s<\/em>；要數就用 <em>a piece of<\/em>。"}, {"h": "many 和 much：看名詞，不看中文", "body": ["中文的「很多」只有一個說法，英文分成兩個：<em>many<\/em> 接複數可數名詞，<em>much<\/em> 接不可數名詞。選哪一個，看的是後面名詞的種類，跟「多」的程度、中文怎麼翻都沒有關係。", "所以先判斷名詞。<em>boxes<\/em> 可數，用 <em>many boxes<\/em>；<em>equipment<\/em> 不可數，就算你心裡想的是一大堆機器，也只能說 <em>much equipment<\/em>。<em>many equipment<\/em> 壞在哪裡？<em>many<\/em> 告訴讀者「後面是一個一個分開的東西」，可是 <em>equipment<\/em> 沒辦法分開，兩個字互相矛盾。", "問句也一樣：問數目用 <em>How many<\/em>，問份量用 <em>How much<\/em>。<em>How many rooms<\/em>、<em>How much time<\/em>。", "<em>much<\/em> 比較常用在否定句和問句（<em>We don't have much time.<\/em>）；肯定句裡一般說 <em>a lot of<\/em>。<em>a lot of<\/em> 兩種名詞都能接，拿不準的時候用它最安全。"], "ex": [{"en": "How <u>many<\/u> boxes did the supplier send?", "zh": "供應商送了幾箱？"}, {"en": "We don't have <u>much<\/u> time before the product launch.", "zh": "離產品上市沒剩多少時間了。"}, {"en": "This month we received <u>a lot of<\/u> orders and <u>a lot of<\/u> feedback.", "zh": "這個月我們收到很多訂單，也收到很多意見。", "note": "<em>orders<\/em> 可數，<em>feedback<\/em> 不可數，<em>a lot of<\/em> 都能接。"}], "quiz": [{"type": "choose", "q": "<em>How ___ luggage are you bringing on the trip?<\/em>", "options": ["many", "much"], "answer": 1, "why": "<em>luggage<\/em> 是不可數名詞（沒有 <em>luggages<\/em>），所以用 <em>much<\/em>。如果想問箱子的數目，就換成可數名詞：<em>How many bags<\/em>。"}], "takeaway": "<em>many<\/em> 配複數可數名詞，<em>much<\/em> 配不可數名詞；拿不準就用 <em>a lot of<\/em>。"}, {"h": "few、a few、little、a little：差一個 a，意思相反", "body": ["這四個字分成兩組。<em>few<\/em> 和 <em>a few<\/em> 接複數可數名詞（<em>a few seats<\/em>）；<em>little<\/em> 和 <em>a little<\/em> 接不可數名詞（<em>a little space<\/em>）。分組的方法跟 <em>many<\/em>、<em>much<\/em> 一樣，看名詞。", "每一組裡，有沒有 <em>a<\/em> 決定意思的方向。有 <em>a<\/em>：「有一些」，重點在「有」，通常是夠用、正面的。沒有 <em>a<\/em>：「很少、幾乎沒有」，重點在「少」，通常是不夠、負面的。", "拿掉 <em>a<\/em> 會怎樣？比較這兩句：<em>A few clients replied, so we can start the analysis.<\/em>（有幾位客戶回覆了，所以可以開始分析）；<em>Few clients replied, so we extended the deadline.<\/em>（幾乎沒有客戶回覆，所以延長了期限）。回覆的人數可能差不多，但一句在說「有」，一句在說「不夠」，後面接的結果也就相反。", "讀句子時可以看後半當線索：結果是正面的（可以開始、還來得及），通常是有 <em>a<\/em> 的；結果是負面的（取消、延期、很難），通常是沒有 <em>a<\/em> 的。這只是線索，真正的差別是說話的人覺得夠不夠。"], "table": {"head": ["名詞種類", "有一些（夠用）", "很少（不夠）"], "rows": [["複數可數名詞", "<em>a few seats<\/em>", "<em>few seats<\/em>"], ["不可數名詞", "<em>a little space<\/em>", "<em>little space<\/em>"]]}, "ex": [{"en": "<u>A few<\/u> applicants have more than ten years of experience.", "zh": "有幾位應徵者有十年以上的經驗。"}, {"en": "<u>Few<\/u> applicants met all the requirements, so we reopened the position.", "zh": "幾乎沒有應徵者符合所有條件，所以我們重新開缺。"}, {"en": "We still have <u>a little<\/u> money left in the training budget.", "zh": "訓練預算還剩一點錢。"}, {"en": "There is <u>little<\/u> demand for the older model.", "zh": "舊款幾乎沒什麼需求。"}], "quiz": [{"type": "choose", "q": "<em>___ people signed up for the workshop, so we can hold it as planned.<\/em>", "options": ["A few", "Few"], "answer": 0, "why": "後半句是正面的結果（照原訂計畫舉行），表示報名的人「有一些、夠了」，用有 <em>a<\/em> 的 <em>A few<\/em>。<em>Few<\/em> 是「很少、幾乎沒有」，不會導出「可以照計畫舉行」。"}], "takeaway": "有 <em>a<\/em> 是「有一些、夠用」，沒有 <em>a<\/em> 是「很少、不夠」；<em>few<\/em> 配可數，<em>little<\/em> 配不可數。"}, {"h": "fewer 和 less：比較少，也分可數不可數", "body": ["「比較少」也分兩個字。<em>fewer<\/em> 接複數可數名詞（<em>fewer errors<\/em>、<em>fewer complaints<\/em>），<em>less<\/em> 接不可數名詞（<em>less paper<\/em>、<em>less time<\/em>）。<em>fewer<\/em> 是 <em>few<\/em> 的比較級，<em>less<\/em> 是 <em>little<\/em> 的比較級（比較級的觀念見第 12 章），所以分組跟上一節一模一樣。", "日常口語裡常聽到有人把 <em>less<\/em> 放在可數名詞前面，但正式的書面英文分得很清楚。寫報告或信件時先判斷名詞：如果它是一個一個數的人或東西（<em>two errors<\/em>、<em>two clients<\/em>），就用 <em>fewer<\/em>。", "有一個看起來像例外的地方：<em>than<\/em> 後面接數字的時候。數字後面是時間、金額、距離、重量，用 <em>less than<\/em>：<em>less than 30 minutes<\/em>、<em>less than $500<\/em>。這時英文把「30 分鐘」「500 元」看成一整個量，不是一分鐘一分鐘地數。數字後面是一個一個數的人或東西，還是用 <em>fewer than<\/em>：<em>fewer than 50 employees<\/em>、<em>fewer than ten complaints<\/em>。"], "ex": [{"en": "The new software makes <u>fewer<\/u> errors and uses <u>less<\/u> memory.", "zh": "新軟體出錯比較少，佔用的記憶體也比較少。"}, {"en": "We printed <u>fewer<\/u> brochures this year to save paper.", "zh": "今年我們少印了一些手冊，以節省紙張。"}, {"en": "The drive to the airport takes <u>less than<\/u> 40 minutes.", "zh": "開車到機場不到四十分鐘。", "note": "時間、金額的數字前面用 <em>less than<\/em>。"}, {"en": "<u>Fewer than<\/u> 50 employees attended the safety briefing.", "zh": "出席安全說明會的員工不到五十人。", "note": "員工是一個一個數的，數字前面用 <em>fewer than<\/em>；時間和金額的數字才用 <em>less than<\/em>。"}], "quiz": [{"type": "choose", "q": "<em>The new air conditioners use ___ electricity than the old ones.<\/em>", "options": ["fewer", "less"], "answer": 1, "why": "<em>electricity<\/em>（電）不可數，不能說 <em>two electricities<\/em>，所以「比較少」用 <em>less<\/em>。"}], "takeaway": "能數的「比較少」用 <em>fewer<\/em>，不能數的用 <em>less<\/em>；數字前面，時間、金額這種一整個量用 <em>less than<\/em>，一個一個數的人或東西用 <em>fewer than<\/em>。"}, {"h": "a number of、the number of、a large amount of", "body": ["<em>a number of<\/em> 的意思是「好幾個、一些」，後面接複數可數名詞，動詞也用複數：<em>A number of guests have complained.<\/em> 這句真正的主詞是 <em>guests<\/em>，<em>a number of<\/em> 只是在說有多少。", "把 <em>a<\/em> 換成 <em>the<\/em>，意思就變了。<em>the number of<\/em> 是「……的數目」，主詞變成 <em>number<\/em> 這個數字本身，所以動詞用單數：<em>The number of guests has doubled.<\/em>（住客的數目增加了一倍）。一個字的差別，讓主詞從「住客」變成「數目」，動詞也跟著從複數變單數。主詞和動詞要一致，第 7 章講過。", "不可數名詞不能用 <em>number<\/em>（數目），要用 <em>amount<\/em>（份量）：<em>a large amount of money<\/em>、<em>the amount of paperwork<\/em>。<em>a large amount of<\/em>（也可以是 <em>a small amount of<\/em>）後面接不可數名詞，動詞用單數。", "到這裡，數量詞可以照後面接的名詞分成三組，整理在下表。"], "table": {"head": ["只接複數可數名詞", "只接不可數名詞", "兩種都可以"], "rows": [["<em>many<\/em>", "<em>much<\/em>", "<em>a lot of<\/em>、<em>lots of<\/em>"], ["<em>a few<\/em>、<em>few<\/em>", "<em>a little<\/em>、<em>little<\/em>", "<em>some<\/em>、<em>any<\/em>"], ["<em>fewer<\/em>", "<em>less<\/em>", "<em>more<\/em>、<em>most<\/em>"], ["<em>a number of<\/em>、<em>several<\/em>", "<em>a large amount of<\/em>、<em>a great deal of<\/em>", "<em>all<\/em>、<em>no<\/em>、<em>plenty of<\/em>"]]}, "ex": [{"en": "<u>A number of<\/u> guests <u>have<\/u> asked for a late checkout.", "zh": "有好幾位住客要求延後退房。"}, {"en": "<u>The number of<\/u> online orders <u>has<\/u> doubled since March.", "zh": "線上訂單的數量從三月以來增加了一倍。"}, {"en": "<u>A large amount of<\/u> money <u>was<\/u> spent on repairs last year.", "zh": "去年花了一大筆錢在維修上。"}], "quiz": [{"type": "tap", "q": "點出必須互相配合單複數的兩個字：這句主詞的中心名詞，和它的動詞。", "sentence": "The number of applicants is higher this year.", "answer": [1, 4], "why": "主詞的中心名詞是 <em>number<\/em>（數目）。一個數目是單數，所以動詞用 <em>is<\/em>。<em>applicants<\/em> 雖然是複數，但它在 <em>of<\/em> 後面，只是說明這是什麼的數目。"}], "takeaway": "<em>a number of<\/em> 是「好幾個」，動詞跟著後面的複數名詞；<em>the number of<\/em> 是「數目」本身，動詞用單數；不可數的量用 <em>amount<\/em>。"}, {"h": "each 和 every：一次看一個，所以用單數", "body": ["第 7 章第 3 節講過 <em>each<\/em>、<em>every<\/em> 配單數動詞；這一節從後面接的名詞再看一次。<em>each<\/em> 和 <em>every<\/em> 都是「每一個」。它們把一群東西拆開，一次只看其中一個，所以後面接<b>單數<\/b>可數名詞，動詞也用<b>單數<\/b>：<em>Each room has a desk.<\/em>、<em>Every invoice needs a signature.<\/em>", "<em>Every employees have …<\/em> 壞在哪裡？<em>every<\/em> 說「一個一個看」，<em>-s<\/em> 卻說「很多個一起」，兩個字在同一個名詞上打架。中文說「每位員工都有」，「每位」後面也不會加「們」，道理一樣。", "<em>each<\/em> 還可以接 <em>of<\/em>：<em>each of the rooms<\/em>。這時 <em>of<\/em> 後面是複數（從一群裡挑），但主詞還是 <em>each<\/em>，動詞仍然用單數：<em>Each of the rooms has a balcony.<\/em> <em>every<\/em> 不能直接接 <em>of<\/em>，要寫成 <em>every one of the rooms<\/em>。", "有一個例外是頻率：<em>every<\/em> 加數字表示「每隔多久」，名詞用複數，例如 <em>every three months<\/em>（每三個月）。"], "ex": [{"en": "<u>Each<\/u> room <u>has<\/u> a desk and a coffee maker.", "zh": "每間房都有一張書桌和一台咖啡機。"}, {"en": "<u>Every<\/u> invoice <u>needs<\/u> a signature from the finance team.", "zh": "每張發票都需要財務部簽名。"}, {"en": "<u>Each of<\/u> our branches <u>sends<\/u> a sales report every Friday.", "zh": "我們每家分店每週五都會交一份業績報告。"}, {"en": "The air filters are replaced <u>every<\/u> three <u>months<\/u>.", "zh": "空氣濾網每三個月換一次。", "note": "<em>every<\/em> 加數字表示頻率，名詞用複數。"}], "quiz": [{"type": "choose", "q": "<em>Each of the new laptops ___ with a two-year warranty.<\/em>", "options": ["come", "comes"], "answer": 1, "why": "主詞是 <em>Each<\/em>，一次看一台，動詞用單數 <em>comes<\/em>。<em>laptops<\/em> 在 <em>of<\/em> 後面，只是說明從哪一群裡挑。"}], "takeaway": "<em>each<\/em>、<em>every<\/em> 一次只看一個，名詞和動詞都用單數；<em>each of the<\/em> 後面的名詞是複數，動詞仍然單數。"}, {"h": "most、some、all 和 most of the", "body": ["<em>most<\/em>、<em>some<\/em>、<em>all<\/em> 有兩種用法。直接加名詞，是<b>泛指<\/b>：<em>Most hotels offer free Wi-Fi.<\/em>（大部分的飯店，不限哪些）。加 <em>of<\/em>，是從<b>特定的一群<\/b>裡面挑：<em>Most of the hotels on this street are full.<\/em>（這條街上的那些飯店）。", "門檻在 <em>of<\/em> 後面：要先有 <em>the<\/em>、<em>these<\/em>、<em>our<\/em>、<em>Mr. Lee's<\/em> 這種把範圍指定好的字，或是 <em>them<\/em>、<em>us<\/em> 這類代名詞。<em>most of employees<\/em> 壞在哪裡？<em>of<\/em> 的意思是「從某一群裡面」，可是 <em>employees<\/em> 沒說是哪一群，讀者找不到範圍。要嘛拿掉 <em>of<\/em> 變泛指（<em>most employees<\/em>），要嘛補上範圍（<em>most of the employees<\/em>）。<em>all<\/em> 比較寬鬆，<em>all the employees<\/em> 和 <em>all of the employees<\/em> 都可以。", "動詞跟著 <em>of<\/em> 後面的名詞走（第 7 章第 2 節的例外）：名詞是複數，動詞用複數（<em>Most of the rooms face the harbor.<\/em>）；名詞不可數，動詞用單數（<em>Some of the equipment is in storage.<\/em>）。這點跟上一節的 <em>each of<\/em> 不一樣：<em>each<\/em> 本身就是「一個」；<em>most<\/em>、<em>some<\/em> 是「一部分」，這一部分算單數還是複數，要看後面是什麼。", "<em>most<\/em> 也別跟 <em>almost<\/em> 搞混。<em>almost<\/em> 是副詞（第 1 章），意思是「幾乎」，它要修飾別的字，不能拿來當「大部分」直接放在名詞前面：要說 <em>almost all employees<\/em> 或 <em>almost every employee<\/em>，不能說 <em>almost employees<\/em>。<em>almost<\/em> 後面接數字是另一回事：<em>almost 200 employees<\/em> 是「將近兩百位員工」。"], "ex": [{"en": "<u>Most<\/u> hotels in the area offer free parking.", "zh": "這一帶大部分的飯店都提供免費停車。"}, {"en": "<u>Most of the<\/u> rooms on this floor <u>face<\/u> the harbor.", "zh": "這層樓大部分的房間都面向港口。"}, {"en": "<u>Some of the<\/u> equipment <u>is<\/u> still in storage.", "zh": "有一部分設備還在倉庫裡。"}, {"en": "<u>Almost all<\/u> employees use the new expense app.", "zh": "幾乎所有員工都在用新的報帳 App。"}], "quiz": [{"type": "choose", "q": "哪一句對？", "options": ["Most of employees work from home on Fridays.", "Most of the employees work from home on Fridays.", "Most of the employees works from home on Fridays."], "answer": 1, "why": "<em>most of<\/em> 後面要先有 <em>the<\/em> 這類指定範圍的字，所以第一句錯。動詞跟著 <em>of<\/em> 後面的 <em>employees<\/em>（複數），要用 <em>work<\/em>，所以第三句錯。"}], "takeaway": "<em>most<\/em>、<em>some<\/em>、<em>all<\/em> 直接加名詞是泛指；加了 <em>of<\/em> 就要先有 <em>the<\/em>、<em>our<\/em> 這類字，動詞跟著 <em>of<\/em> 後面的名詞。"}, {"h": "another、other、the other、others", "body": ["這四個字都是「別的」，差別在兩件事：後面接什麼，以及是不是「剩下的全部」。", "<em>another<\/em> 是 <em>an<\/em> 和 <em>other<\/em> 黏在一起，裡面已經有一個 <em>an<\/em>，所以後面接<b>單數<\/b>可數名詞：<em>another room<\/em>（再一間房，而且還有別間可選）。<em>another rooms<\/em> 壞在 <em>an<\/em> 和 <em>-s<\/em> 互相矛盾。只有加數字時例外：<em>another two weeks<\/em>（再兩週），把兩週當成一段。", "<em>other<\/em> 單獨用時，後面接<b>複數<\/b>或不可數名詞，意思是「其他的一些」，不特定是哪些：<em>other options<\/em>、<em>other equipment<\/em>。", "加上 <em>the<\/em>，就變成「<b>剩下的全部<\/b>」。<em>the other room<\/em>：只有兩間，除了這間，就是那一間。<em>the other rooms<\/em>：除了這間，剩下的每一間。<em>the<\/em> 表示範圍已經確定，讀者知道指的是哪些。", "<em>others<\/em> 是代名詞（第 1 章），等於 <em>other<\/em> 加複數名詞，名詞已經包在裡面了，所以後面<b>不再接名詞<\/b>：<em>Some guests prefer tea; others prefer coffee.<\/em> 這裡的 <em>others<\/em> 就是 <em>other guests<\/em>。寫成 <em>others guests<\/em>，等於把名詞說了兩次。", "<em>the other<\/em> 和 <em>others<\/em> 也可以單獨出現，後面不接名詞。<em>the other<\/em> 單獨用，指剩下的那一個：<em>one is near the port, and the other is next to the airport<\/em>。要指剩下的全部，用 <em>the others<\/em>：<em>Three of us went to the trade fair; the others stayed in the office.<\/em> <em>others<\/em> 沒有 <em>the<\/em>，是「其他的一些人或東西」，不特定；<em>the others<\/em> 有 <em>the<\/em>，是「剩下的全部」，範圍已經確定。"], "table": {"head": ["字", "後面接", "意思", "例子"], "rows": [["<em>another<\/em>", "單數可數名詞", "再一個（還有別的可選）", "<em>another room<\/em>"], ["<em>other<\/em>", "複數或不可數名詞", "其他的一些（不特定）", "<em>other options<\/em>"], ["<em>the other<\/em>", "名詞，或不接名詞（<em>the other<\/em>、<em>the others<\/em>）", "剩下的那一個、那些（全部）", "<em>the other room<\/em>、<em>the other rooms<\/em>、<em>the others<\/em>"], ["<em>others<\/em>", "不接名詞", "其他的人或東西", "<em>Others prefer coffee.<\/em>"]]}, "ex": [{"en": "Could we book <u>another<\/u> room for the training session?", "zh": "我們可以再訂一間房給訓練課程用嗎？"}, {"en": "Are there any <u>other<\/u> questions before we finish?", "zh": "結束之前還有其他問題嗎？"}, {"en": "We have two warehouses: one is near the port, and <u>the other<\/u> is next to the airport.", "zh": "我們有兩座倉庫：一座在港口附近，另一座在機場旁邊。"}, {"en": "Some staff members drive to work; <u>others<\/u> take the train.", "zh": "有些員工開車上班，其他人搭火車。"}], "quiz": [{"type": "choose", "q": "<em>Some clients pay online; ___ pay by bank transfer.<\/em>", "options": ["other", "others", "another"], "answer": 1, "why": "空格後面直接是動詞 <em>pay<\/em>，沒有名詞，所以要用自己就是名詞的 <em>others<\/em>（等於 <em>other clients<\/em>）。<em>other<\/em> 後面要接名詞；<em>another<\/em> 是「再一個」，單數，也配不上 <em>pay<\/em>。"}], "takeaway": "<em>another<\/em> 是「再一個」，接單數；<em>the other<\/em>、<em>the others<\/em> 是「剩下的全部」；<em>others<\/em> 自己就是名詞，後面不再接名詞。"}], "mistakes": [{"wrong": "We need more informations about the shipping costs.", "right": "We need more information about the shipping costs.", "why": "<em>information<\/em> 是不可數名詞，沒有 <em>-s<\/em>。想強調一項一項，可以改說 <em>more details<\/em>。"}, {"wrong": "Every employees has to complete the survey.", "right": "Every employee has to complete the survey.", "why": "<em>every<\/em> 一次看一個，後面接單數名詞。"}, {"wrong": "There were less complaints this quarter.", "right": "There were fewer complaints this quarter.", "why": "<em>complaints<\/em> 可數，「比較少」用 <em>fewer<\/em>；<em>less<\/em> 接不可數名詞。"}, {"wrong": "Most of employees prefer the new schedule.", "right": "Most of the employees prefer the new schedule.", "why": "<em>most of<\/em> 後面要有 <em>the<\/em>、<em>our<\/em> 這類指定範圍的字；不然就拿掉 <em>of<\/em>，寫 <em>Most employees<\/em>。"}, {"wrong": "Some guests ordered tea, and others guests ordered coffee.", "right": "Some guests ordered tea, and other guests ordered coffee.", "why": "後面有名詞 <em>guests<\/em>，前面用 <em>other<\/em>。<em>others<\/em> 自己就是名詞，不再接名詞。"}], "workbook": ["quantity"]}, {"id": "parallel", "n": 14, "title": "平行結構與成對連接詞", "en": "Parallel Structure and Paired Conjunctions", "lead": "用 <em>and<\/em>、<em>or<\/em>、<em>but<\/em> 把東西接在一起時，被接起來的每一項要是<b>同一種形式<\/b>：名詞配名詞、形容詞配形容詞、原形（第 6 章）配原形。這叫平行結構。<em>both … and<\/em>、<em>either … or<\/em> 這類成對的連接詞也一樣，而且前半決定後半。這一章教你先找出被接起來的是哪幾塊，再檢查它們長得一不一樣；接著講兩個主詞用 <em>or<\/em>、<em>nor<\/em> 接起來時，動詞要跟誰；最後講 <em>not only<\/em> 放在句首時的倒裝，以及 <em>rather than<\/em> 和 <em>instead of<\/em> 的差別。", "check": [{"type": "choose", "q": "哪一句對？", "options": ["Our new assistant is friendly, organized, and works hard.", "Our new assistant is friendly, organized, and hardworking.", "Our new assistant is friendly, organization, and hardworking."], "answer": 1, "why": "三項都接在 <em>is<\/em> 後面。第一項 <em>friendly<\/em> 是形容詞，後面兩項也要是形容詞：<em>organized<\/em>、<em>hardworking<\/em>。<em>works hard<\/em> 是動詞，<em>organization<\/em> 是名詞，形式都不一樣。"}, {"type": "choose", "q": "<em>Please sign the form, ___ a copy, and return it to the HR office.<\/em>", "options": ["make", "making", "made"], "answer": 0, "why": "這是叫人做事的句子，三個動作 <em>sign<\/em>、空格、<em>return<\/em> 並排，前後都是原形，中間那一項也要用原形 <em>make<\/em>。"}, {"type": "choose", "q": "<em>The hotel offers both free breakfast ___ an airport shuttle.<\/em>", "options": ["and", "or", "but also"], "answer": 0, "why": "<em>both<\/em> 的另一半固定是 <em>and<\/em>。<em>or<\/em> 配 <em>either<\/em>，<em>but also<\/em> 配 <em>not only<\/em>。"}, {"type": "choose", "q": "<em>Neither the manager nor her assistants ___ available on Friday.<\/em>", "options": ["is", "are"], "answer": 1, "why": "用 <em>neither … nor<\/em> 接兩個主詞時，動詞跟離它比較近的那一個。離動詞近的是 <em>her assistants<\/em>（複數），所以用 <em>are<\/em>。"}], "sections": [{"h": "and、or、but 兩邊要是同一種東西", "body": ["<em>and<\/em>、<em>or<\/em>、<em>but<\/em> 也是連接詞（第 8 章），但跟 <em>because<\/em>、<em>although<\/em> 不一樣：它們兩邊是對等的，可以接兩個字、兩個片語，也可以接兩個子句（第 3 章）。條件只有一個：<b>兩邊要是同一種東西<\/b>。", "為什麼？<em>and<\/em> 告訴讀者「後面這一項跟前面那一項站在同一個位置」。讀者會把後一項放回前一項的位置去讀，形式不一樣，放回去就不通。", "所以檢查的方法是<b>拆開<\/b>：把句子拆成兩句，每一項單獨放回原來的位置，都要說得通。<em>Ms. Rowan is friendly and patient.<\/em> 拆成 <em>Ms. Rowan is friendly.<\/em> 和 <em>Ms. Rowan is patient.<\/em>，兩句都對。<em>Ms. Rowan is friendly and patience.<\/em> 拆開後變成 <em>Ms. Rowan is patience.<\/em>（Rowan 女士是耐心），這就壞了：<em>patience<\/em> 是名詞，放不進形容詞的位置。", "「同一種東西」指的是詞性（第 1 章）和形式相同，不是長度相同。<em>fast<\/em> 和 <em>easy to use<\/em> 長短不同，但都是形容詞，可以並排。常見的形式有名詞、形容詞、原形、Ving、to V（第 6 章）、片語和子句，見下表。"], "table": {"head": ["兩邊都是", "例子"], "rows": [["名詞", "<em>price and quality<\/em>"], ["形容詞", "<em>small but comfortable<\/em>"], ["原形", "<em>sign and return<\/em>"], ["Ving", "<em>reviewing and approving<\/em>"], ["to V", "<em>to reduce costs or to save time<\/em>"], ["片語", "<em>by phone or by email<\/em>"], ["子句", "<em>The office closes at six, but the store stays open until nine.<\/em>"]]}, "ex": [{"en": "Ms. Rowan is <u>friendly<\/u> and <u>patient<\/u> with customers.", "zh": "Rowan 女士對顧客友善又有耐心。"}, {"en": "You can reach us <u>by phone<\/u> or <u>by email<\/u>.", "zh": "您可以用電話或電子郵件聯絡我們。"}, {"en": "The manager <u>reviewed<\/u> the proposal and <u>approved<\/u> the budget.", "zh": "經理看過了提案，也核准了預算。"}, {"en": "<u>The office closes at six<\/u>, but <u>the store stays open until nine<\/u>.", "zh": "辦公室六點關，但店面開到九點。", "note": "<em>but<\/em> 兩邊都是完整的子句。"}], "quiz": [{"type": "tap", "q": "點出被 <em>but<\/em> 連起來、形式必須一樣的兩個字。", "sentence": "The new office is small but comfortable.", "answer": [4, 6], "why": "<em>but<\/em> 前面是 <em>small<\/em>，後面是 <em>comfortable<\/em>，兩個都是形容詞，都接在 <em>is<\/em> 後面。拆開讀：<em>The new office is small.<\/em>、<em>The new office is comfortable.<\/em>，兩句都通。"}], "takeaway": "把 <em>and<\/em>、<em>or<\/em>、<em>but<\/em> 兩邊拆開，每一項單獨放回句子裡都要說得通。"}, {"h": "三項以上：第一項定形式", "body": ["列舉三項以上時，寫法是 <em>A, B, and C<\/em>：項目之間用逗號，最後一項前面加 <em>and<\/em> 或 <em>or<\/em>。<em>and<\/em> 前面那個逗號可加可不加，這本書的例句都加。", "規則跟兩項一樣：每一項形式相同。最容易出錯的是<b>最後一項<\/b>。寫到第三項時，第一項已經離得有點遠，很容易不知不覺換成另一種說法。所以檢查時從第一項開始：看它是名詞、形容詞、原形、Ving，還是 to V，再確定後面每一項都照抄這個形式。", "拿掉這個規則會怎樣？看這句：<em>Our goals are to cut costs, to improve service, and increasing sales.<\/em> 前兩項都是「目標是要做什麼」（to V），第三項突然變成 Ving，讀者讀到最後，不確定 <em>increasing sales<\/em> 跟前面是什麼關係。改成 <em>and to increase sales<\/em>，三項就整整齊齊。"], "ex": [{"en": "Ms. Ruiz is responsible for <u>hiring<\/u>, <u>training<\/u>, and <u>evaluating<\/u> new staff.", "zh": "Ruiz 女士負責招募、訓練和考核新進員工。"}, {"en": "The room was <u>clean<\/u>, <u>quiet<\/u>, and <u>reasonably priced<\/u>.", "zh": "房間乾淨、安靜，價格也合理。", "note": "<em>reasonably priced<\/em> 比較長，但它也是形容詞，所以可以跟前兩項並排。"}, {"en": "The ideal candidate has <u>sales experience<\/u>, <u>strong language skills<\/u>, and <u>a valid driver's license<\/u>.", "zh": "理想的人選要有業務經驗、良好的語言能力，以及有效的駕照。", "note": "三項都是名詞片語。"}], "quiz": [{"type": "choose", "q": "<em>Our goals this year are to cut costs, to improve customer service, and ___ sales in Asia.<\/em>", "options": ["increasing", "to increase", "increased"], "answer": 1, "why": "第一項是 <em>to cut<\/em>，第二項是 <em>to improve<\/em>，都是 to V。第三項照抄同一個形式：<em>to increase<\/em>。"}], "takeaway": "列舉再長，先看第一項是什麼形式，後面每一項都照抄。"}, {"h": "共用的字：to、will、can 只寫一次", "body": ["很多時候，<em>and<\/em> 後面的動詞看起來孤零零的：<em>We will review your application and contact you within a week.<\/em> <em>contact<\/em> 前面沒有主詞，也沒有 <em>will<\/em>，為什麼用原形？", "因為它跟前一個動詞<b>共用<\/b>了前面的字。這句其實是 <em>We will review … and (we will) contact …<\/em>，第二次的 <em>we will<\/em> 省略了。<em>contact<\/em> 還是接在 <em>will<\/em> 後面，所以跟 <em>review<\/em> 一樣用原形。<em>to<\/em> 也一樣：<em>asked us to check the figures and send a summary<\/em>，<em>send<\/em> 共用前面的 <em>to<\/em>。", "如果把 <em>contact<\/em> 寫成 <em>contacting<\/em> 或 <em>contacted<\/em>，它就沒有地方可以掛：前面沒有任何字能讓 Ving 或過去式在這裡成立。判斷的方法是往前找：<em>and<\/em> 後面這個動詞，跟 <em>and<\/em> 前面的哪一個動詞是一對？那一個長什麼樣，它就長什麼樣。", "有時候共用的只有主詞，兩個動詞各自帶時態：<em>Ms. Chen joined the company in 2019 and became a manager last year.<\/em> <em>joined<\/em> 是過去式，<em>became<\/em> 也是過去式。"], "ex": [{"en": "We will review your application and <u>contact<\/u> you within five business days.", "zh": "我們會審閱您的申請，並在五個工作天內與您聯絡。", "note": "<em>contact<\/em> 跟 <em>review<\/em> 共用 <em>will<\/em>，所以用原形。"}, {"en": "Customers can pay online or <u>visit<\/u> any of our branches.", "zh": "顧客可以線上付款，或到任何一家分行辦理。"}, {"en": "Mr. Sandoval asked us to check the figures and <u>send<\/u> him a summary.", "zh": "Sandoval 先生請我們核對數字，再寄一份摘要給他。"}, {"en": "Ms. Chen <u>joined<\/u> the company in 2019 and <u>became<\/u> a manager last year.", "zh": "Chen 女士 2019 年進公司，去年升上經理。"}], "quiz": [{"type": "choose", "q": "<em>The technician will inspect the machine and ___ a report by Friday.<\/em>", "options": ["submit", "submitting", "submits"], "answer": 0, "why": "空格跟 <em>inspect<\/em> 共用前面的 <em>will<\/em>（<em>will inspect … and (will) submit<\/em>）。<em>will<\/em> 後面用原形，所以是 <em>submit<\/em>。"}, {"type": "tap", "q": "<em>sign<\/em> 前面沒有 <em>to<\/em>，它借用前面某個動詞的 <em>to<\/em>。點出跟 <em>sign<\/em> 共用同一個 <em>to<\/em> 的另一個動詞（不要點 <em>sign<\/em> 自己）。", "sentence": "The supervisor asked the new staff to read the manual and sign the safety form.", "answer": [7], "why": "<em>to<\/em> 後面的第一個動詞是 <em>read<\/em>，<em>and<\/em> 後面的 <em>sign<\/em> 跟它共用這個 <em>to<\/em>，所以兩個都是原形。<em>asked<\/em> 在 <em>to<\/em> 前面，是主詞 <em>The supervisor<\/em> 的動詞，不跟 <em>sign<\/em> 配對。"}], "takeaway": "<em>and<\/em> 後面的動詞看起來孤零零，其實跟前面的動詞共用 <em>to<\/em>、<em>will<\/em> 或 <em>can<\/em>，所以形式跟它一樣。"}, {"h": "成對連接詞：前半決定後半", "body": ["有些連接詞是兩個字一組，前半先出現，預告「後面還有一半」：<em>both A and B<\/em>、<em>either A or B<\/em>、<em>neither A nor B<\/em>、<em>not only A but also B<\/em>、<em>whether A or B<\/em>。", "第一個門檻：<b>另一半是固定的<\/b>，不能換。<em>both<\/em> 只配 <em>and<\/em>，<em>either<\/em> 只配 <em>or<\/em>，<em>neither<\/em> 只配 <em>nor<\/em>，<em>not only<\/em> 配 <em>but also<\/em>。看到前半，就該知道後半是什麼。<em>both … or<\/em> 壞在哪裡？<em>both<\/em> 說「兩個都」，<em>or<\/em> 說「其中一個」，前後意思打架。", "第二個門檻：<b>A 和 B 也要平行<\/b>。成對連接詞就是加強版的 <em>and<\/em>、<em>or<\/em>，前面幾節的規則全部適用。<em>either on Saturday or on Monday<\/em>：兩邊都是 <em>on<\/em> 片語。", "<em>neither … nor<\/em> 本身就是否定，句子裡不要再加 <em>not<\/em>。<em>Neither the hotel nor the airline offered a refund.<\/em>（飯店和航空公司都沒有退款）的動詞 <em>offered<\/em> 是肯定的形式，否定的意思由 <em>neither<\/em> 和 <em>nor<\/em> 負責。"], "table": {"head": ["成對連接詞", "意思", "例子"], "rows": [["<em>both A and B<\/em>", "A 和 B 兩個都", "<em>both lighter and quieter<\/em>"], ["<em>either A or B<\/em>", "A 或 B 其中一個", "<em>either on Saturday or on Monday<\/em>"], ["<em>neither A nor B<\/em>", "A 和 B 都不", "<em>neither the hotel nor the airline<\/em>"], ["<em>not only A but also B<\/em>", "不只 A，還有 B", "<em>not only free but also open to the public<\/em>"], ["<em>whether A or B<\/em>", "不管是 A 還是 B；是 A 還是 B", "<em>whether you pay by card or by bank transfer<\/em>"]]}, "ex": [{"en": "The new model is <u>both<\/u> lighter <u>and<\/u> quieter.", "zh": "新機型又輕又安靜。"}, {"en": "We can deliver the furniture <u>either<\/u> on Saturday <u>or<\/u> on Monday.", "zh": "家具可以星期六或星期一送。"}, {"en": "<u>Neither<\/u> the hotel <u>nor<\/u> the airline offered a refund.", "zh": "飯店和航空公司都沒有退款。"}, {"en": "The workshop is <u>not only<\/u> free <u>but also<\/u> open to the public.", "zh": "這場工作坊不但免費，而且開放給一般民眾參加。"}, {"en": "<u>Whether<\/u> you pay by card <u>or<\/u> by bank transfer, you will receive a receipt.", "zh": "不管是刷卡還是轉帳付款，您都會拿到收據。"}], "quiz": [{"type": "choose", "q": "<em>You can submit the form ___ by email or at the front desk.<\/em>", "options": ["both", "either", "neither"], "answer": 1, "why": "後半是 <em>or<\/em>，前半就是 <em>either<\/em>。<em>both<\/em> 配 <em>and<\/em>，<em>neither<\/em> 配 <em>nor<\/em>。"}, {"type": "tap", "q": "點出被 <em>not only … but also<\/em> 連起來的兩個形容詞。", "sentence": "The new scheduling app is not only fast but also reliable.", "answer": [7, 10], "why": "<em>not only<\/em> 後面是 <em>fast<\/em>，<em>but also<\/em> 後面是 <em>reliable<\/em>，兩個都是形容詞，都接在 <em>is<\/em> 後面。<em>new<\/em> 也是形容詞，但它修飾 <em>app<\/em>，不在這一對裡面。"}], "takeaway": "看到 <em>both<\/em>、<em>either<\/em>、<em>neither<\/em>、<em>not only<\/em>、<em>whether<\/em>，先找它固定的另一半；兩半後面接的東西也要同一種形式。"}, {"h": "兩個主詞用 or、nor 接起來：動詞跟近的那一個", "body": ["成對連接詞也能把兩個主詞接在一起。這時動詞用單數還是複數（主詞和動詞一致，第 7 章）？分兩種情況。", "<em>both A and B<\/em>：兩個加起來，一定是複數。<em>Both the printer and the scanner need repairs.<\/em>", "<em>either A or B<\/em>、<em>neither A nor B<\/em>：意思是「其中一個」或「兩個都不」，沒有把兩個加起來，所以不能直接算複數。英文的做法是：<b>動詞跟離它比較近的那個主詞<\/b>，也就是 B。<em>not only A but also B<\/em> 也照這個規則。", "比較這一對：<em>Neither the manager nor the interns were told.<\/em>、<em>Neither the interns nor the manager was told.<\/em> 兩句意思一樣，只是順序換了，靠近動詞的主詞變了，動詞就跟著變。自己寫的時候，把複數的那一個放在後面，句子念起來比較順。"], "table": {"head": ["結構", "動詞跟誰", "例子"], "rows": [["<em>both A and B<\/em>", "複數（兩個加起來）", "<em>Both the CEO and the CFO are<\/em> …"], ["<em>either A or B<\/em>", "B（比較近的那個）", "<em>Either the drivers or the dispatcher has<\/em> …"], ["<em>neither A nor B<\/em>", "B（比較近的那個）", "<em>Neither the manager nor the interns were<\/em> …"], ["<em>not only A but also B<\/em>", "B（比較近的那個）", "<em>Not only the staff but also the director is<\/em> …"]]}, "ex": [{"en": "<u>Both<\/u> the printer <u>and<\/u> the scanner <u>need<\/u> repairs.", "zh": "印表機和掃描器都需要修理。"}, {"en": "Neither the interns nor the <u>manager<\/u> <u>was<\/u> told about the change.", "zh": "實習生和經理都沒有被告知這項變動。"}, {"en": "Neither the manager nor the <u>interns<\/u> <u>were<\/u> told about the change.", "zh": "經理和實習生都沒有被告知這項變動。", "note": "順序一換，靠近動詞的主詞變了，動詞也跟著變。"}, {"en": "Either the drivers or the <u>dispatcher<\/u> <u>has<\/u> a copy of the schedule.", "zh": "司機或調度員手上會有一份時刻表。"}], "quiz": [{"type": "tap", "q": "點出必須互相配合單複數的兩個字：決定動詞單複數的那個名詞，和那個動詞。", "sentence": "Neither the supervisor nor the technicians were aware of the problem.", "answer": [5, 6], "why": "<em>neither … nor<\/em> 的動詞跟離它比較近的主詞。離 <em>were<\/em> 最近的是 <em>technicians<\/em>（複數），所以用 <em>were<\/em>。<em>supervisor<\/em> 離得遠，不影響動詞。"}], "takeaway": "<em>both … and<\/em> 算兩個，用複數；<em>either … or<\/em>、<em>neither … nor<\/em> 的動詞跟離它比較近的那個主詞。"}, {"h": "not only 放在句首：前半要倒裝", "body": ["<em>not only<\/em> 有時會跑到句首，接兩個完整的子句：<em>Not only is the hotel close to the station, but it also offers free parking.<\/em>", "前半的語序：不是 <em>the hotel is<\/em>，而是 <em>is the hotel<\/em>，動詞或助動詞（第 2 章）跑到主詞前面，像問句的樣子。這叫倒裝（第 10 章的 <em>Should you need …<\/em> 也是倒裝，這裡是另一種場合）。<em>not only<\/em> 這類否定的字放到句首、後面接的是一個完整子句時，那個子句要倒裝，英文固定這樣寫。不倒裝，寫成 <em>Not only the hotel is close to the station<\/em>，就是錯的。", "有一個情況要分清楚：上一節表裡的 <em>Not only the staff but also the director is …<\/em> 也是 <em>Not only<\/em> 開頭，卻沒有倒裝。差別在 <em>not only<\/em> 後面接什麼。那一句 <em>not only<\/em> 後面只有一個名詞（<em>the staff<\/em>），接著 <em>but also<\/em> 另一個名詞，連接的是兩個主詞，不是兩個子句，所以不倒裝。<em>not only<\/em> 後面接著主詞加動詞（<em>the hotel is<\/em>），連接的是兩個子句，才倒裝。", "<em>be<\/em> 動詞和助動詞（第 2 章）可以直接搬到主詞前面：<em>the hotel is<\/em> 變成 <em>is the hotel<\/em>，<em>the system will reduce<\/em> 變成 <em>will the system reduce<\/em>。一般動詞沒有東西可以搬，就借 <em>do<\/em>、<em>does<\/em>、<em>did<\/em> 放到主詞前面，動詞回到原形：<em>the layout saved<\/em> 變成 <em>did the layout save<\/em>。", "後半維持正常語序，而且要有自己的主詞：<em>but it also offers<\/em>。不想倒裝，就把 <em>not only<\/em> 放回句子中間：<em>The new layout not only saved space but also made the office brighter.<\/em> 意思一樣，兩種都對。"], "ex": [{"en": "<u>Not only is<\/u> the hotel close to the station, but it also offers free parking.", "zh": "這家飯店不但離車站近，還提供免費停車。", "note": "<em>be<\/em> 動詞直接搬到主詞前面：<em>the hotel is<\/em> 變成 <em>is the hotel<\/em>。"}, {"en": "<u>Not only did<\/u> the new layout save space, but it also made the office brighter.", "zh": "新的格局不但省空間，也讓辦公室更明亮。", "note": "一般動詞借 <em>did<\/em> 倒裝，<em>save<\/em> 回到原形。"}, {"en": "<u>Not only will<\/u> the new system reduce costs, but it will also shorten delivery times.", "zh": "新系統不但會降低成本，還會縮短交貨時間。", "note": "助動詞 <em>will<\/em> 直接搬到主詞前面，<em>reduce<\/em> 維持原形。"}, {"en": "The new layout <u>not only<\/u> saved space <u>but also<\/u> made the office brighter.", "zh": "新的格局不但省空間，也讓辦公室更明亮。", "note": "<em>not only<\/em> 在句子中間，不倒裝。"}], "quiz": [{"type": "choose", "q": "哪一句對？", "options": ["Not only the system is faster, but it also costs less.", "Not only is the system faster, but it also costs less."], "answer": 1, "why": "<em>Not only<\/em> 放在句首時，前半要倒裝：<em>the system is<\/em> 變成 <em>is the system<\/em>。第一句沒有倒裝，所以錯。"}], "takeaway": "<em>not only<\/em> 放句首，前半倒裝、後半照常；不想倒裝，就把它放回句子中間。"}, {"h": "rather than 和 instead of", "body": ["<em>rather than<\/em>（而不是）的作用像 <em>and<\/em>、<em>or<\/em>：把兩個形式相同的東西接起來，前面是什麼形式，後面就用什麼形式。<em>sign contracts electronically rather than print them<\/em>：兩邊都是原形。<em>by air rather than by sea<\/em>：兩邊都是 <em>by<\/em> 片語。", "<em>instead of<\/em>（代替、而不是）意思很像，但它是介系詞（第 8 章），後面只能接名詞或 Ving，不管前面是什麼形式：<em>instead of canceling the project<\/em>。", "所以同一個意思，兩種寫法後面的動詞形式不一樣：<em>We decided to rent rather than buy.<\/em>（平行，用原形）；<em>We decided to rent instead of buying.<\/em>（介系詞，用 Ving）。拿平行的規則去套 <em>instead of<\/em>，寫成 <em>instead of buy<\/em>，就錯了。"], "ex": [{"en": "Most of our clients prefer to sign contracts electronically <u>rather than<\/u> print them.", "zh": "我們大部分的客戶比較喜歡用電子方式簽約，而不是印出來簽。"}, {"en": "We shipped the samples by air <u>rather than<\/u> by sea.", "zh": "我們用空運寄樣品，而不是海運。"}, {"en": "The board approved a smaller budget <u>instead of<\/u> canceling the project.", "zh": "董事會核准了較少的預算，而沒有取消這個專案。"}], "quiz": [{"type": "choose", "q": "<em>Ms. Ward called the supplier instead of ___ another email.<\/em>", "options": ["send", "sending", "sent"], "answer": 1, "why": "<em>instead of<\/em> 是介系詞，後面接名詞或 Ving，所以用 <em>sending<\/em>。"}], "takeaway": "<em>rather than<\/em> 兩邊同形式；<em>instead of<\/em> 是介系詞，後面一律接名詞或 Ving。"}], "mistakes": [{"wrong": "The position requires strong writing skills, attention to detail, and to be able to work under pressure.", "right": "The position requires strong writing skills, attention to detail, and the ability to work under pressure.", "why": "前兩項是名詞片語，第三項也要是名詞片語。改成以名詞 <em>ability<\/em> 為中心的 <em>the ability to work<\/em>，形式就對齊了。"}, {"wrong": "Neither the hotel or the airline offered a refund.", "right": "Neither the hotel nor the airline offered a refund.", "why": "<em>neither<\/em> 的另一半固定是 <em>nor<\/em>。"}, {"wrong": "We will review your application and contacting you within a week.", "right": "We will review your application and contact you within a week.", "why": "<em>contact<\/em> 跟 <em>review<\/em> 共用 <em>will<\/em>，要用原形。"}, {"wrong": "Neither the manager nor the interns was told about the change.", "right": "Neither the manager nor the interns were told about the change.", "why": "動詞跟離它比較近的主詞。<em>interns<\/em> 是複數，所以用 <em>were<\/em>。"}, {"wrong": "Not only the new printer is faster, but it also uses less ink.", "right": "Not only is the new printer faster, but it also uses less ink.", "why": "<em>Not only<\/em> 放在句首時，前半要倒裝：<em>is the new printer<\/em>。"}], "workbook": ["parallel"]}, {"id": "prep", "n": 15, "title": "時間介系詞與常用片語", "en": "Prepositions of Time and Fixed Phrases", "lead": "介系詞（第 8 章）後面接名詞或 Ving。這一章前半講時間：<em>at<\/em>、<em>on<\/em>、<em>in<\/em> 怎麼分，<em>by<\/em> 和 <em>until<\/em>、<em>for<\/em> 和 <em>since<\/em> 為什麼不能互換，這些都有道理可推。後半講商業英文裡的固定片語，例如 <em>in charge of<\/em>、<em>on behalf of<\/em>，裡面的介系詞沒有道理可推，要整塊學起來。", "check": [{"type": "choose", "q": "<em>The new branch opens ___ March 3.<\/em>", "options": ["in", "on", "at"], "answer": 1, "why": "<em>March 3<\/em> 是某一天，日期前面用 <em>on<\/em>。只有月份的時候（<em>in March<\/em>）才用 <em>in<\/em>。"}, {"type": "choose", "q": "<em>Please submit your expense report ___ Friday.<\/em>", "options": ["by", "until"], "answer": 0, "why": "交報告是做一次就完成的動作，<em>Friday<\/em> 是最晚的期限，用 <em>by<\/em>。<em>until<\/em> 是「一直持續到」，用在會持續的狀態。"}, {"type": "choose", "q": "<em>Mr. Dunmore has worked in the downtown office ___ 2021.<\/em>", "options": ["for", "since", "during"], "answer": 1, "why": "<em>2021<\/em> 是起點，用 <em>since<\/em>。<em>for<\/em> 後面接一段長度（<em>for five years<\/em>）；<em>during<\/em> 是「在那段期間裡」，不表示從什麼時候開始。"}, {"type": "choose", "q": "<em>Ms. Novak is ___ the new training program.<\/em>", "options": ["in charge of", "in charge for", "on charge of"], "answer": 0, "why": "「負責」的固定說法是 <em>in charge of<\/em>，裡面的介系詞都不能換。這種片語沒有規則可推，要整塊學。"}, {"type": "choose", "q": "<em>In addition to ___ the new hires, Ms. Fraser manages the payroll.<\/em>", "options": ["train", "training", "trained"], "answer": 1, "why": "<em>in addition to<\/em> 整組是介系詞，最後的 <em>to<\/em> 後面放得進名詞（<em>in addition to the new hires<\/em>），所以接動作時用 Ving：<em>training<\/em>。"}], "sections": [{"h": "at、on、in：從小到大", "body": ["時間前面用哪個介系詞，看時間的「大小」。", "<em>at<\/em> 接一個<b>時刻<\/b>，像時鐘上的一個點：<em>at 9:30<\/em>、<em>at noon<\/em>、<em>at midnight<\/em>。", "<em>on<\/em> 接<b>某一天<\/b>，像日曆上的一格：<em>on Tuesday<\/em>、<em>on June 5<\/em>、<em>on New Year's Day<\/em>。", "<em>in<\/em> 接<b>比一天長的時段<\/b>，像一個範圍，事情發生在裡面：<em>in June<\/em>、<em>in 2027<\/em>、<em>in the third quarter<\/em>。一天裡的時段也用 <em>in<\/em>：<em>in the morning<\/em>、<em>in the afternoon<\/em>、<em>in the evening<\/em>。只有 <em>night<\/em> 例外，要說 <em>at night<\/em>。", "有兩個地方要特別看。第一，一天裡的時段一旦加上某一天，就變成「某一天」，改用 <em>on<\/em>：<em>in the morning<\/em>，但 <em>on Friday morning<\/em>，決定介系詞的是 <em>Friday<\/em>。第二，前面直接放 <em>this<\/em>、<em>next<\/em>、<em>last<\/em>、<em>every<\/em> 時，什麼介系詞都不加：<em>next Monday<\/em>、<em>last year<\/em>、<em>every morning<\/em>。這些字已經把時間定好位置了，不需要介系詞，寫成 <em>on next Monday<\/em> 是錯的。（前面還有 <em>the<\/em> 的說法是另一回事，例如 <em>in the next two weeks<\/em>。）"], "table": {"head": ["時間", "介系詞", "例子"], "rows": [["時刻", "<em>at<\/em>", "<em>at 9:30<\/em>、<em>at noon<\/em>"], ["星期、日期", "<em>on<\/em>", "<em>on Tuesday<\/em>、<em>on June 5<\/em>"], ["某一天的上午、下午", "<em>on<\/em>", "<em>on Friday morning<\/em>"], ["月、年、季", "<em>in<\/em>", "<em>in June<\/em>、<em>in 2027<\/em>、<em>in the third quarter<\/em>"], ["一天裡的時段", "<em>in<\/em>", "<em>in the morning<\/em>、<em>in the afternoon<\/em>"], ["前面直接放 <em>this<\/em>、<em>next<\/em>、<em>last<\/em>、<em>every<\/em>", "不加", "<em>next Monday<\/em>、<em>last year<\/em>"]]}, "ex": [{"en": "The airport shuttle leaves <u>at<\/u> 7:15 every morning.", "zh": "機場接駁車每天早上七點十五分出發。", "note": "<em>every morning<\/em> 前面不加介系詞。"}, {"en": "The board meets <u>on<\/u> the first Monday of each month.", "zh": "董事會在每個月的第一個星期一開會。"}, {"en": "Sales usually rise <u>in<\/u> the fourth quarter.", "zh": "銷售通常在第四季上升。"}, {"en": "The new manager starts <u>next<\/u> Monday.", "zh": "新經理下週一開始上班。", "note": "<em>next Monday<\/em> 前面不加 <em>on<\/em>。"}], "quiz": [{"type": "tap", "q": "<em>evening<\/em> 單獨用時是 <em>in the evening<\/em>。點出讓這句改用 <em>on<\/em> 的那個字。", "sentence": "The client dinner is on Friday evening at the Harbor Hotel.", "answer": [5], "why": "<em>Friday<\/em> 把時間定在某一天，某一天就用 <em>on<\/em>。<em>evening<\/em> 只是在說那一天的哪個時段。"}], "takeaway": "時刻用 <em>at<\/em>，某一天用 <em>on<\/em>，比一天長用 <em>in<\/em>；前面有 <em>next<\/em>、<em>last<\/em>、<em>this<\/em>、<em>every<\/em> 就不加介系詞。"}, {"h": "in two weeks 和 within two weeks", "body": ["<em>in<\/em> 後面接一段時間長度，說的是未來的事時，意思是「從現在起，過了這段時間」，也就是「……之後」：<em>The renovation will be finished in about three weeks.<\/em>（大約三週後完工）。中文很容易把它想成「三週內」，但它說的是一個時間點：大約三週後。", "「之內」要用 <em>within<\/em>：<em>within two weeks<\/em> 是「不超過兩週，這段期間內任何時候都可以」。退款、回覆、交貨的期限常用它：<em>Refunds are processed within ten business days.<\/em>", "拿兩句比：<em>We will announce the results in two weeks.<\/em>（兩週後公布）；<em>We will announce the results within two weeks.<\/em>（兩週內公布，可能更早）。想說的是「最晚不超過」，就用 <em>within<\/em>。"], "ex": [{"en": "The renovation will be finished <u>in<\/u> about three weeks.", "zh": "整修大約三週後完工。"}, {"en": "Refunds are processed <u>within<\/u> ten business days.", "zh": "退款會在十個工作天內處理完成。"}, {"en": "Please reply <u>within<\/u> 48 hours of receiving this message.", "zh": "請在收到這封訊息後四十八小時內回覆。", "note": "<em>within<\/em> + 長度 + <em>of<\/em> + 事件：從那件事算起多久之內。"}], "takeaway": "<em>in two weeks<\/em> 是「兩週後」，<em>within two weeks<\/em> 是「兩週之內」。"}, {"h": "by 和 until：做完一次，還是一直持續", "body": ["<em>by<\/em> 和 <em>until<\/em> 中文常常都翻成「到……為止」，所以很容易混。其實它們回答的是兩個不同的問題。", "<em>by<\/em> 回答「<b>最晚什麼時候要做完？<\/b>」它是期限，搭配做一次就完成的動作：交、付、回覆、抵達、完成。<em>Please submit the report by Friday.<\/em>（最晚星期五要交，星期三交也可以）", "<em>until<\/em> 回答「<b>一直持續到什麼時候？<\/b>」它搭配會持續的狀態或動作：待著、等、開著、關著、維持。<em>The lobby will remain closed until 2 p.m.<\/em>（從現在一直關著，到兩點才開）", "換錯會怎樣？<em>Please submit the report until Friday.<\/em> 變成「請一直交報告，交到星期五為止」。交報告不是能持續的事，句子就說不通。判斷時不要只看動詞，直接問那個時間的作用：它是「最晚要完成的期限」（<em>by<\/em>），還是「這個狀態一直持續到那時才結束」（<em>until<\/em>）？同樣是狀態，<em>The room must be ready by 9 a.m.<\/em>（最晚九點要準備好）用 <em>by<\/em>，<em>The room will stay closed until 9 a.m.<\/em>（一直關到九點）用 <em>until<\/em>。", "<em>until<\/em> 和否定一起用時，意思是「直到……才」：<em>The parts won't arrive until Tuesday.<\/em>（星期二才會到）。這是從「一直沒到，持續到星期二」來的。"], "table": {"head": ["比較", "<em>by<\/em>", "<em>until<\/em>"], "rows": [["回答的問題", "最晚什麼時候要做完", "一直持續到什麼時候"], ["常搭配的動詞（只是傾向）", "<em>submit<\/em>、<em>pay<\/em>、<em>reply<\/em>、<em>finish<\/em>、<em>arrive<\/em>、<em>be ready<\/em>", "<em>stay<\/em>、<em>wait<\/em>、<em>remain<\/em>、<em>be open<\/em>、<em>last<\/em>"], ["中文", "在……之前（完成）", "一直到……"]]}, "ex": [{"en": "Please return the signed contract <u>by<\/u> June 30.", "zh": "請在六月三十日（含）以前寄回簽好的合約。"}, {"en": "The lobby will remain closed <u>until<\/u> 2 p.m.", "zh": "大廳會一直關閉到下午兩點。"}, {"en": "We need the final figures <u>by<\/u> noon tomorrow.", "zh": "我們最晚明天中午需要最後的數字。"}, {"en": "The replacement parts won't arrive <u>until<\/u> next Tuesday.", "zh": "替換零件要到下週二才會到。", "note": "<em>not … until<\/em>：直到……才。"}], "quiz": [{"type": "choose", "q": "<em>The conference room is reserved for our team ___ 3 p.m., so no other group can use it before then.<\/em>", "options": ["by", "until"], "answer": 1, "why": "「被預約」是一段持續的狀態，一直持續到三點，用 <em>until<\/em>。<em>by<\/em> 是一次性動作的期限，放在這裡說不通。"}], "takeaway": "<em>by<\/em> 回答「最晚什麼時候要完成」，是期限；<em>until<\/em> 回答「一直持續到什麼時候」。"}, {"h": "for 和 since：一段長度，還是一個起點", "body": ["<em>for<\/em> 接一段<b>長度<\/b>，回答「多久」：<em>for three years<\/em>、<em>for two hours<\/em>、<em>for a long time<\/em>。", "<em>since<\/em> 接一個<b>起點<\/b>，回答「從什麼時候開始」：<em>since 2020<\/em>、<em>since March<\/em>、<em>since last Monday<\/em>、<em>since the merger<\/em>。", "同一件事兩種說法都可以，只是角度不同：<em>Ms. Grant has managed the branch for six years.<\/em>（管了六年）；<em>Ms. Grant has managed the branch since 2020.<\/em>（從 2020 年開始管）。換錯就壞：<em>since six years<\/em>，六年不是一個時間點；<em>for 2020<\/em>，2020 不是一段長度。", "<em>since<\/em> 說的是「從過去某一點一直到現在」，所以常跟現在完成式（<em>has managed<\/em>、<em>have worked<\/em>，第 4 章）一起出現。<em>for<\/em> 沒有這個限制，什麼時態都能用：<em>The training lasted for three days.<\/em>", "<em>since<\/em> 後面也可以接子句，這時它是連接詞（第 8 章）：<em>since we moved to the new office<\/em>。"], "ex": [{"en": "Ms. Grant has managed the Ferngate branch <u>for<\/u> six years.", "zh": "Grant 女士管理 Ferngate 分店已經六年了。"}, {"en": "Ms. Grant has managed the Ferngate branch <u>since<\/u> 2020.", "zh": "Grant 女士從 2020 年起管理 Ferngate 分店。"}, {"en": "The elevator has been out of service <u>since<\/u> Monday.", "zh": "電梯從星期一起就停用了。"}, {"en": "The training workshop lasted <u>for<\/u> three days.", "zh": "訓練工作坊為期三天。"}], "quiz": [{"type": "choose", "q": "<em>Our company has used this supplier ___ more than ten years.<\/em>", "options": ["for", "since"], "answer": 0, "why": "<em>more than ten years<\/em> 是一段長度（多久），用 <em>for<\/em>。<em>since<\/em> 後面要接起點，例如 <em>since 2015<\/em>。"}], "takeaway": "「多久」用 <em>for<\/em>，「從什麼時候開始」用 <em>since<\/em>；<em>since<\/em> 常跟現在完成式一起出現。"}, {"h": "during、throughout、prior to", "body": ["<em>during<\/em> 接一個<b>事件或時段的名稱<\/b>，意思是「在那段期間裡」：<em>during the meeting<\/em>、<em>during the holidays<\/em>、<em>during lunch<\/em>。它不接長度：<em>during three hours<\/em> 是錯的，長度要用 <em>for<\/em>。兩個可以一起出現：<em>Our team worked for ten hours during the system upgrade.<\/em>", "<em>during<\/em> 是介系詞，後面不能接子句。要接子句，用連接詞 <em>while<\/em>（第 8 章）：<em>during the presentation<\/em>，但 <em>while Mr. Caldwell was presenting<\/em>。", "<em>throughout<\/em> 是「<b>從頭到尾<\/b>」，強調整段期間都是這樣：<em>throughout the year<\/em>（一整年都）、<em>throughout the conference<\/em>（整個會議期間）。<em>during the conference<\/em> 可能只是會議中的某個時候；<em>throughout the conference<\/em> 是每個時候。", "<em>prior to<\/em> 就是正式一點的 <em>before<\/em>，常出現在通知和規定裡：<em>prior to the meeting<\/em>、<em>prior to departure<\/em>。它整組是一個介系詞，後面接名詞或 Ving：<em>prior to entering the building<\/em>。為什麼 <em>to<\/em> 後面不接原形，本章後面講固定片語時會說明。"], "table": {"head": ["介系詞", "後面接", "意思"], "rows": [["<em>for<\/em>", "長度（<em>three hours<\/em>）", "持續多久"], ["<em>during<\/em>", "事件、時段的名稱（<em>the meeting<\/em>）", "在那段期間裡（可能是其中某個時候，也可能是整段）"], ["<em>throughout<\/em>", "事件、時段的名稱（<em>the year<\/em>）", "從頭到尾每個時候"], ["<em>within<\/em>", "長度（<em>ten days<\/em>）", "不超過這段時間"], ["<em>prior to<\/em>", "名詞或 Ving（<em>the meeting<\/em>）", "在……之前（正式）"]]}, "ex": [{"en": "Please keep your phone on silent <u>during<\/u> the presentation.", "zh": "簡報期間請把手機調成靜音。"}, {"en": "Our support team is available <u>throughout<\/u> the holiday season.", "zh": "整個假期期間，我們的客服團隊都有人值班。"}, {"en": "All visitors must sign in <u>prior to<\/u> entering the factory.", "zh": "所有訪客進入工廠前都必須登記。"}, {"en": "Our team worked <u>for<\/u> ten hours <u>during<\/u> the system upgrade.", "zh": "系統升級期間，我們團隊工作了十個小時。"}], "quiz": [{"type": "choose", "q": "<em>Mr. Voss answered several emails ___ the training session.<\/em>", "options": ["during", "while"], "answer": 0, "why": "空格後面是 <em>the training session<\/em>，一個名詞，沒有自己的動詞，所以用介系詞 <em>during<\/em>。<em>while<\/em> 是連接詞，後面要接子句（<em>while he was waiting<\/em>）。"}], "takeaway": "<em>during<\/em> 接事件或時段的名稱，<em>throughout<\/em> 是從頭到尾，<em>prior to<\/em> 是正式的 <em>before<\/em>；三個都是介系詞，後面不能接子句。<em>during<\/em>、<em>throughout<\/em> 後面接名詞，<em>prior to<\/em> 可以接名詞或 Ving。"}, {"h": "固定片語：整塊學，不要拆", "body": ["商業英文裡有很多「介系詞 + 名詞 + 介系詞」組成的片語：<em>in charge of<\/em>、<em>on behalf of<\/em>、<em>in accordance with<\/em>、<em>with regard to<\/em>、<em>in addition to<\/em>。它們整組的作用就像一個介系詞，後面接名詞。", "這些片語裡的介系詞<b>沒有道理可推<\/b>。為什麼是 <em>in charge of<\/em>，不是 <em>on charge for<\/em>？沒有規則可以說明，英文就是固定這樣說，像中文說「打電話」，不說「做電話」。前半章「看時間大小選介系詞」的方法在這裡完全用不上，硬推只會推錯。", "學的方法是<b>整塊學<\/b>。第一，連頭帶尾一起抄下來，包括最後那個介系詞：抄 <em>in charge of<\/em>，不要只抄 <em>charge<\/em>。第二，連後面接什麼一起抄：<em>in charge of<\/em> + 工作或部門。第三，用自己工作上的事造一個句子，例如 <em>I am in charge of the monthly sales report.<\/em> 句子比單字好記。第四，讀英文時看到這些片語，整組框起來讀，不要拆開。", "整塊學的好處是：以後看到其中一個字被換掉，例如 <em>in charge for<\/em>，你會覺得不對勁，即使說不出規則。這種感覺就是從一個個整塊學來的片語累積出來的。"], "table": {"head": ["片語", "意思", "例子"], "rows": [["<em>in charge of<\/em>", "負責", "<em>in charge of the budget<\/em>"], ["<em>on behalf of<\/em>", "代表（某人或某單位）", "<em>on behalf of the company<\/em>"], ["<em>in accordance with<\/em>", "依照（規定、合約）", "<em>in accordance with our policy<\/em>"], ["<em>with regard to<\/em>", "關於", "<em>with regard to your request<\/em>"], ["<em>in addition to<\/em>", "除了……之外（還有）", "<em>in addition to the base salary<\/em>"], ["<em>according to<\/em>", "根據（某人、某資料的說法）", "<em>according to the report<\/em>"], ["<em>in response to<\/em>", "回應", "<em>in response to rising costs<\/em>"], ["<em>as a result of<\/em>", "由於", "<em>as a result of the delay<\/em>"]]}, "ex": [{"en": "Mr. Osei is <u>in charge of<\/u> the new marketing campaign.", "zh": "Osei 先生負責新的行銷活動。"}, {"en": "Ms. Varga signed the agreement <u>on behalf of<\/u> Northgate Logistics.", "zh": "Varga 女士代表 Northgate 物流簽署協議。"}, {"en": "<u>With regard to<\/u> your request, we will send a revised quote on Monday.", "zh": "關於您的要求，我們星期一會寄出修改後的報價。"}, {"en": "All refunds are issued <u>in accordance with<\/u> our return policy.", "zh": "所有退款都依照我們的退貨規定辦理。"}], "quiz": [{"type": "choose", "q": "<em>Mr. Diallo thanked the volunteers ___ the hotel's management.<\/em>", "options": ["on behalf of", "in accordance with", "with regard to"], "answer": 0, "why": "句意是 Diallo 先生「代表」飯店管理階層向志工道謝，用 <em>on behalf of<\/em>。<em>in accordance with<\/em> 是依照規定，<em>with regard to<\/em> 是關於，放進去都說不通。"}], "takeaway": "固定片語的介系詞沒有道理可推，連頭帶尾、連後面接什麼，一起整塊學。"}, {"h": "有些片語最後的 to 是介系詞，不是 to V", "body": ["<em>in addition to<\/em>、<em>with regard to<\/em>、<em>according to<\/em>、<em>prior to<\/em>、<em>in response to<\/em> 都以 <em>to<\/em> 結尾。很多人看到 <em>to<\/em> 就接原形，因為 to V（第 6 章）就是 <em>to<\/em> + 原形。", "但這些片語整組是一個介系詞，最後的 <em>to<\/em> 也是介系詞。介系詞後面接名詞或 Ving，不接原形。所以是 <em>In addition to managing the team<\/em>，不是 <em>In addition to manage the team<\/em>。", "怎麼分辨？在 <em>to<\/em> 後面放一個普通名詞試試看。<em>in addition to the salary<\/em> 說得通，表示這個 <em>to<\/em> 是介系詞，要接動詞就用 Ving。<em>We plan to the salary<\/em> 說不通，表示 <em>plan to<\/em> 的 <em>to<\/em> 是 to V，後面用原形。", "<em>look forward to<\/em> 也是同一個道理（第 6 章講過）：<em>We look forward to working with you.<\/em> 第 6 章列過的 <em>be committed to<\/em>、<em>be used to<\/em>、<em>contribute to<\/em>，後面接動作時也用 Ving。", "不是所有以 <em>to<\/em> 結尾的片語都是這樣。<em>in order to<\/em>、<em>be able to<\/em>、<em>be about to<\/em>、<em>be supposed to<\/em>、<em>have to<\/em> 裡的 <em>to<\/em> 是 to V 的 <em>to<\/em>，後面接原形：<em>in order to reduce costs<\/em>。用上面的測試：<em>in order to the salary<\/em> 說不通，所以它的 <em>to<\/em> 是 to V。"], "ex": [{"en": "<u>In addition to<\/u> <u>managing<\/u> the team, Ms. Fraser trains all new hires.", "zh": "除了管理團隊，Fraser 女士還負責訓練所有新進人員。"}, {"en": "Please read the safety guide <u>prior to<\/u> <u>using<\/u> the equipment.", "zh": "使用設備前，請先閱讀安全指南。"}, {"en": "<u>In response to<\/u> rising costs, the airline raised its baggage fees.", "zh": "因應成本上升，這家航空公司調高了行李費。", "note": "<em>to<\/em> 後面接名詞片語 <em>rising costs<\/em>。"}, {"en": "We look forward to <u>working<\/u> with you.", "zh": "我們期待與您合作。"}], "quiz": [{"type": "choose", "q": "<em>In addition to ___ free Wi-Fi, the hotel offers a free airport shuttle.<\/em>", "options": ["provide", "providing", "provided"], "answer": 1, "why": "<em>in addition to<\/em> 整組是介系詞，最後的 <em>to<\/em> 不是 to V 的 <em>to<\/em>。介系詞後面接名詞或 Ving，所以用 <em>providing<\/em>。"}], "takeaway": "<em>in addition to<\/em>、<em>prior to<\/em> 這類片語最後的 <em>to<\/em> 是介系詞，後面接名詞或 Ving；<em>in order to<\/em> 這類的 <em>to<\/em> 是 to V，後面接原形。"}, {"h": "意思相近的片語：according to 和 in accordance with", "body": ["這兩個中文都可以翻成「根據」，但用法不一樣。<em>according to<\/em> 最常見的用法是<b>引用說法<\/b>：某人、某份資料說了什麼。<em>According to the latest survey, most guests prefer mobile check-in.<\/em>", "<em>in accordance with<\/em> 只用在<b>照著規定做<\/b>：一個動作符合規定、法律、合約或指示。<em>All refunds are issued in accordance with our return policy.<\/em> 它不能用來引用說法：<em>In accordance with the forecast, sales will rise.<\/em> 就壞了，預測不是一條要遵守的規定，銷售也不是在「照著做」。", "<em>according to<\/em> 也可以表示「照著」（<em>according to plan<\/em>，照計畫），所以範圍比較大；<em>in accordance with<\/em> 範圍比較小。判斷時先問：這句在說「某某說了什麼」，還是「某個動作照著規定做」？前者只能用 <em>according to<\/em>。", "還有一點：<em>according to<\/em> 一般不用在自己的意見上。要說「依我看」，用 <em>in my opinion<\/em>，不說 <em>according to me<\/em>。"], "ex": [{"en": "<u>According to<\/u> the latest survey, most guests prefer mobile check-in.", "zh": "根據最新的調查，大部分的住客偏好用手機辦理入住。"}, {"en": "<u>According to<\/u> Mr. Reyes, the shipment left the warehouse this morning.", "zh": "根據 Reyes 先生的說法，這批貨今天早上已經從倉庫送出了。"}, {"en": "All chemicals must be stored <u>in accordance with<\/u> safety regulations.", "zh": "所有化學品都必須依照安全規定存放。"}], "quiz": [{"type": "choose", "q": "<em>___ the weather forecast, the storm will reach the coast tonight.<\/em>", "options": ["According to", "In accordance with"], "answer": 0, "why": "這句在引用天氣預報說了什麼，用 <em>According to<\/em>。<em>in accordance with<\/em> 是「照著規定做」，預報不是規定，暴風雨也不是在照著做。"}], "takeaway": "引用某人或某份資料的說法用 <em>according to<\/em>；照著規定、合約做事用 <em>in accordance with<\/em>。"}], "mistakes": [{"wrong": "Please send me the final draft until Thursday.", "right": "Please send me the final draft by Thursday.", "why": "寄稿子是一次就完成的動作，要用表示期限的 <em>by<\/em>。"}, {"wrong": "Mr. Keane has worked here since five years.", "right": "Mr. Keane has worked here for five years.", "why": "<em>five years<\/em> 是長度，用 <em>for<\/em>；<em>since<\/em> 接起點，例如 <em>since 2021<\/em>。"}, {"wrong": "The quarterly review is on next Tuesday.", "right": "The quarterly review is next Tuesday.", "why": "前面有 <em>next<\/em>，就不加介系詞。"}, {"wrong": "Ms. Ellis is in charge for the new project.", "right": "Ms. Ellis is in charge of the new project.", "why": "固定片語是 <em>in charge of<\/em>，介系詞不能換。"}, {"wrong": "All staff must complete the training prior to operate the forklift.", "right": "All staff must complete the training prior to operating the forklift.", "why": "<em>prior to<\/em> 的 <em>to<\/em> 是介系詞，後面接 Ving。"}], "workbook": ["prep"]}, {"id": "mandative", "n": 16, "title": "要求、建議後面的 that 子句用原形", "en": "The Base Form After Requests and Recommendations", "lead": "<em>The manager requested that Mr. Kim submit the report.<\/em> 這句的 <em>submit<\/em> 沒有 <em>-s<\/em>，也沒有跟著 <em>requested<\/em> 變成過去式，但它不是打錯。表示要求、建議、必要的字後面接 <em>that<\/em> 子句（第 3 章）時，美式正式書面英文讓子句裡的動詞用原形（第 6 章），英式正式書面英文也接受這個寫法，不管主詞是誰、時間是什麼時候。這一章講哪些字會帶出這個句型、為什麼要用原形，以及否定和被動怎麼寫。", "check": [{"type": "choose", "q": "依美式正式書面英文的寫法選：<em>Our director recommended that each team ___ its budget by May 1.<\/em>", "options": ["reviews", "review", "reviewed"], "answer": 1, "why": "<em>recommended<\/em> 是建議，後面的 <em>that<\/em> 子句用原形 <em>review<\/em>：不因為 <em>each team<\/em> 是單數就加 <em>-s<\/em>，也不因為 <em>recommended<\/em> 是過去式就變成 <em>reviewed<\/em>。"}, {"type": "choose", "q": "依美式正式書面英文的寫法選：<em>It is essential that every guest ___ a photo ID at check-in.<\/em>", "options": ["shows", "show", "showed"], "answer": 1, "why": "<em>essential<\/em>（必要的）後面的 <em>that<\/em> 子句也用原形，所以是 <em>show<\/em>，即使主詞 <em>every guest<\/em> 是單數。"}, {"type": "choose", "q": "依美式正式書面英文的寫法選：<em>Our lawyer recommended that the company ___ the contract until the terms are revised.<\/em>", "options": ["not sign", "does not sign", "did not sign"], "answer": 0, "why": "這個句型的否定，是把 <em>not<\/em> 直接放在原形前面：<em>not sign<\/em>。不用 <em>does<\/em> 或 <em>did<\/em>，因為子句裡的動詞不帶時態。"}, {"type": "choose", "q": "依美式正式書面英文的寫法選：<em>The contract requires that the payment ___ made in full before delivery.<\/em>", "options": ["be", "is", "was"], "answer": 0, "why": "<em>requires<\/em> 是要求，子句裡的 <em>be<\/em> 動詞用原形 <em>be<\/em>。付款是「被付清」，所以是被動 <em>be made<\/em>。"}], "sections": [{"h": "看起來像打錯的句子", "body": ["先比較兩句：<em>The manager knew that Mr. Kim submitted the report.<\/em>（經理知道 Kim 先生交了報告）；<em>The manager requested that Mr. Kim submit the report.<\/em>（經理要求 Kim 先生交報告）。兩句的骨架一樣，都是「主詞 + 動詞 + <em>that<\/em> 子句」，但第二句的 <em>submit<\/em> 看起來像打錯：主詞 <em>Mr. Kim<\/em> 是單數，照第 7 章應該加 <em>-s<\/em>；前面的 <em>requested<\/em> 是過去式，照第 4 章應該跟著變過去式。", "兩個都沒有變，是因為第二句的 <em>that<\/em> 子句說的不是「發生了什麼」，而是「<b>有人希望發生什麼<\/b>」。交報告這件事還沒發生，是被要求的內容。英文用原形來標示這種內容：不帶 <em>-s<\/em>，不帶過去式，也就是不標任何時態。這是第 2、3 章「子句裡有一個有時態的動詞」的特例：<em>submit<\/em> 沒有標時態，但它前面有自己的主詞 <em>Mr. Kim<\/em>，所以 <em>that Mr. Kim submit the report<\/em> 仍然是子句；整句有時態的動詞是 <em>requested<\/em>。", "可以這樣理解：要求的內容，本來就是一句叫人做事的話。經理對 Kim 先生說的是 <em>Submit the report.<\/em>，叫人做事的句子用原形開頭。把這句話搬進 <em>that<\/em> 子句，前面補上主詞，動詞還是原形。", "拿掉這個規則會怎樣？<em>The manager requested that Mr. Kim submitted the report.<\/em> 讀起來像在說「Kim 先生交了報告」這件已經發生的事，跟「要求」互相矛盾。", "有些文法書把這個句型放在「假設語氣」（第 10 章）底下，寫成「要求、建議 + <em>that<\/em> + 主詞 + (<em>should<\/em>) + 原形」。叫什麼名字不重要，重要的是動詞的形式：原形。"], "table": {"head": ["比較", "陳述事實的 <em>that<\/em> 子句", "要求的 <em>that<\/em> 子句"], "rows": [["前面的字", "<em>know<\/em>、<em>say<\/em>、<em>think<\/em>", "<em>request<\/em>、<em>recommend<\/em>、<em>require<\/em>"], ["子句說的是", "已經發生或正在發生的事", "有人希望發生的事"], ["動詞", "照常變化：<em>he submits<\/em>、<em>he submitted<\/em>", "一律原形：<em>he submit<\/em>"], ["例子", "<em>She says that he submits it every week.<\/em>", "<em>She asks that he submit it every week.<\/em>"]]}, "ex": [{"en": "The manager knew that Mr. Kim <u>submitted<\/u> the report on time.", "zh": "經理知道 Kim 先生準時交了報告。", "note": "陳述事實，動詞照常用過去式。"}, {"en": "The manager requested that Mr. Kim <u>submit<\/u> the report by Friday.", "zh": "經理要求 Kim 先生在星期五前交報告。", "note": "要求的內容，動詞用原形。"}], "quiz": [{"type": "tap", "q": "點出這句裡用原形的那個動詞。", "sentence": "The client asked that the invoice include a full list of charges.", "answer": [6], "why": "<em>asked that<\/em> 是要求。後面子句的主詞是單數的 <em>the invoice<\/em>，動詞卻是沒有 <em>-s<\/em> 的 <em>include<\/em>：這就是原形。<em>asked<\/em> 是主要子句的動詞，照常用過去式。"}], "takeaway": "要求、建議的 <em>that<\/em> 子句說的是「希望發生的事」，動詞用原形：不加 <em>-s<\/em>、不變過去式。"}, {"h": "哪些動詞會帶出原形", "body": ["會帶出原形的動詞，意思都跟「希望某件事發生」有關：<em>recommend<\/em>（建議）、<em>suggest<\/em>（建議、提議）、<em>request<\/em>（要求）、<em>require<\/em>（規定、要求）、<em>insist<\/em>（堅持要）、<em>ask<\/em>（要求、請求）、<em>propose<\/em>（提議）、<em>demand<\/em>（強烈要求）。句型都是：動詞 + <em>that<\/em> + 主詞 + 原形。", "這些動詞自己可以是現在式、過去式或未來式，但 <em>that<\/em> 子句裡永遠是原形，不跟著變：<em>recommends that she apply<\/em>、<em>recommended that she apply<\/em>、<em>will recommend that she apply<\/em>。一般陳述事實的 <em>that<\/em> 子句，時態要和前面的動詞對得上（第 4 章的 <em>The client said that she had already paid the deposit.<\/em>）；在這個句型裡，不要配合。", "其中幾個動詞還有另一種寫法：動詞 + 人 + to V（第 6 章），例如 <em>asked Mr. Kim to submit<\/em>、<em>required all staff to attend<\/em>。但 <em>suggest<\/em> 沒有這種寫法，<em>suggested him to call<\/em> 是錯的，要寫 <em>suggested that he call<\/em>。"], "table": {"head": ["動詞", "意思", "例子"], "rows": [["<em>recommend<\/em>", "建議", "<em>recommend that she apply<\/em>"], ["<em>suggest<\/em>", "建議、提議", "<em>suggest that Mr. Ross lead the meeting<\/em>"], ["<em>request<\/em>", "要求", "<em>request that each guest check out by noon<\/em>"], ["<em>require<\/em>", "規定、要求", "<em>require that every visitor sign in<\/em>"], ["<em>insist<\/em>", "堅持要", "<em>insist that he join the call<\/em>"], ["<em>ask<\/em>", "要求、請求", "<em>ask that each guest return the key card<\/em>"], ["<em>propose<\/em>", "提議", "<em>propose that the team meet weekly<\/em>"], ["<em>demand<\/em>", "強烈要求", "<em>demand that the supplier replace the parts<\/em>"]]}, "ex": [{"en": "Our consultant <u>recommends<\/u> that the company <u>open<\/u> a second warehouse.", "zh": "我們的顧問建議公司開第二座倉庫。"}, {"en": "Ms. Ortiz <u>suggested<\/u> that the team <u>meet<\/u> every Monday morning.", "zh": "Ortiz 女士提議團隊每週一早上開會。"}, {"en": "The new policy <u>requires<\/u> that every visitor <u>sign<\/u> in at the front desk.", "zh": "新規定要求每位訪客都要在櫃台登記。"}, {"en": "The landlord <u>insisted<\/u> that the tenant <u>pay<\/u> the full deposit.", "zh": "房東堅持房客要付全額押金。"}], "quiz": [{"type": "choose", "q": "依美式正式書面英文的寫法選：<em>Last year, the auditors recommended that the firm ___ its records every quarter.<\/em>", "options": ["update", "updated", "updates"], "answer": 0, "why": "<em>recommended<\/em> 是過去式，但 <em>that<\/em> 子句不跟著變時態，也不因為主詞 <em>the firm<\/em> 是單數就加 <em>-s<\/em>，一律用原形 <em>update<\/em>。"}], "takeaway": "主要動詞是 <em>recommend<\/em>、<em>suggest<\/em>、<em>request<\/em>、<em>require<\/em>、<em>insist<\/em>、<em>ask<\/em>、<em>propose<\/em> 這類字時，不管它是什麼時態，<em>that<\/em> 子句都用原形。"}, {"h": "It is essential that …：形容詞、名詞和被動說法也會帶出原形", "body": ["表示「必要、重要」的形容詞也一樣：<em>essential<\/em>（不可或缺的）、<em>important<\/em>（重要的）、<em>necessary<\/em>（必要的）、<em>vital<\/em>（極重要的）、<em>critical<\/em>（關鍵的）、<em>imperative<\/em>（非做不可的）。句型是 <em>It is<\/em> + 形容詞 + <em>that<\/em> + 主詞 + 原形：<em>It is essential that the shipment arrive before the store opens.<\/em>", "道理跟上一節一樣：說某件事「很必要」，就是希望它發生，而它還沒發生。", "但不是每個「<em>It is<\/em> + 形容詞 + <em>that<\/em>」都這樣。<em>clear<\/em>（很清楚）、<em>true<\/em>（是真的）、<em>likely<\/em>（很可能）是在判斷事實，子句裡的動詞照常變化：<em>It is clear that the new layout saves time.<\/em> 判斷方法還是同一個：這個形容詞在說「應該發生」，還是在說「事實是這樣」？", "意思相同的名詞，後面接 <em>that<\/em> 子句時也用原形：<em>recommendation<\/em>、<em>request<\/em>、<em>requirement<\/em>、<em>suggestion<\/em>、<em>proposal<\/em>。例如 <em>the proposal that each branch hire one more cashier<\/em>。", "公告和規定裡常見被動的說法：<em>It is recommended that all employees attend the briefing.<\/em>、<em>It is required that every visitor sign in.<\/em> 這裡的 <em>It is recommended / required / requested / suggested that<\/em> 跟形容詞的句型一樣，後面的 <em>that<\/em> 子句用原形。"], "ex": [{"en": "It is <u>essential<\/u> that the shipment <u>arrive<\/u> before the store opens.", "zh": "這批貨一定要在開店前送到。"}, {"en": "It is <u>important<\/u> that every new hire <u>complete<\/u> the safety course.", "zh": "重要的是，每位新進員工都要完成安全課程。"}, {"en": "It is <u>clear<\/u> that the new layout <u>saves<\/u> time.", "zh": "新的格局顯然省時間。", "note": "<em>clear<\/em> 是在陳述事實，所以 <em>saves<\/em> 照常加 <em>-s<\/em>。"}, {"en": "The board accepted the <u>proposal<\/u> that each branch <u>hire<\/u> one more cashier.", "zh": "董事會接受了每家分店多聘一名收銀員的提案。"}, {"en": "It is <u>recommended<\/u> that all employees <u>attend<\/u> the safety briefing.", "zh": "建議所有員工參加安全說明會。"}], "quiz": [{"type": "choose", "q": "依美式正式書面英文的寫法，哪一句對？", "options": ["It is important that each team member reviews the agenda.", "It is important that each team member review the agenda."], "answer": 1, "why": "<em>important<\/em> 表示「必要」，<em>that<\/em> 子句用原形 <em>review<\/em>，即使主詞 <em>each team member<\/em> 是單數。"}], "takeaway": "<em>It is essential / important / necessary that<\/em> 和 <em>It is recommended that<\/em> 後面用原形；在判斷事實的 <em>clear<\/em>、<em>true<\/em> 後面，動詞照常變化。"}, {"h": "否定：not 直接放在原形前面", "body": ["一般句子的否定要靠 <em>do<\/em>、<em>does<\/em>、<em>did<\/em>：<em>He does not attend the weekly meetings.<\/em> 由 <em>does<\/em> 負責帶時態和 <em>-s<\/em>，<em>not<\/em> 跟在它後面。", "可是這個句型的動詞沒有時態，也沒有 <em>-s<\/em>，<em>does<\/em> 和 <em>did<\/em> 就沒有工作可做。所以否定的寫法是把 <em>not<\/em> 直接放在原形前面：<em>The manager suggested that he not attend the meeting.<\/em>", "這又是一個「看起來像打錯」的地方：<em>he not attend<\/em> 在一般句子裡是錯的，在這裡是對的。反過來，寫成 <em>that he does not attend<\/em>，就把時態和 <em>-s<\/em> 又帶回來了。"], "ex": [{"en": "The manager suggested that Mr. Burke <u>not attend<\/u> the client meeting.", "zh": "經理建議 Burke 先生不要出席客戶會議。"}, {"en": "The committee proposed that the store <u>not open<\/u> on public holidays.", "zh": "委員會提議店面在國定假日不營業。"}, {"en": "The hotel asks that guests <u>not smoke<\/u> on the balconies.", "zh": "飯店請住客不要在陽台抽菸。"}], "quiz": [{"type": "choose", "q": "依美式正式書面英文的寫法選：<em>The supervisor asked that the new technician ___ the machine without training.<\/em>", "options": ["not operate", "does not operate", "not operates"], "answer": 0, "why": "<em>asked that<\/em> 是要求，<em>that<\/em> 子句用原形。否定就把 <em>not<\/em> 直接放在原形 <em>operate<\/em> 前面，不加 <em>does<\/em>，也不加 <em>-s<\/em>。"}], "takeaway": "否定就在原形前面加 <em>not<\/em>，不用 <em>do<\/em>、<em>does<\/em>、<em>did<\/em>。"}, {"h": "be 動詞和被動：用 be，不用 is、was、were", "body": ["<em>is<\/em>、<em>am<\/em>、<em>are<\/em>、<em>was<\/em>、<em>were<\/em> 的原形是 <em>be<\/em>。所以在這個句型裡，<em>be<\/em> 動詞一律寫成 <em>be<\/em>：<em>It is essential that the room be ready by 9 a.m.<\/em>，不是 <em>is ready<\/em>。", "被動（第 5 章）是 <em>be<\/em> 動詞 + p.p.，在這裡就是 <em>be<\/em> + p.p.：<em>The policy requires that all receipts be attached to the claim.<\/em> 收據是被附上的，所以用被動；被動裡的 <em>be<\/em> 動詞用原形 <em>be<\/em>。", "也不要寫成 <em>were<\/em>。第 10 章的 <em>If I were you<\/em> 是另一個句型；要求、建議後面的 <em>that<\/em> 子句只用 <em>be<\/em>。", "否定的被動照上一節，把 <em>not<\/em> 放在 <em>be<\/em> 前面：<em>that the file not be shared<\/em>。"], "ex": [{"en": "It is essential that the conference room <u>be<\/u> ready by 9 a.m.", "zh": "會議室一定要在早上九點前準備好。"}, {"en": "The policy requires that all receipts <u>be attached<\/u> to the expense claim.", "zh": "規定要求所有收據都要附在報帳單上。"}, {"en": "Ms. Duval requested that she <u>be informed<\/u> of any schedule changes.", "zh": "Duval 女士要求行程有任何變動都要通知她。"}, {"en": "The director asked that the file <u>not be shared<\/u> outside the team.", "zh": "總監要求這份檔案不要分享給團隊以外的人。"}], "quiz": [{"type": "tap", "q": "點出這句 <em>that<\/em> 子句裡的動詞（可以點好幾個字）。", "sentence": "The board requested that the report be translated into Spanish.", "answer": [6, 7], "why": "<em>that<\/em> 子句的主詞是 <em>the report<\/em>。報告是被翻譯的，所以動詞是被動 <em>be translated<\/em>；<em>be<\/em> 動詞用原形 <em>be<\/em>，不是 <em>is<\/em> 或 <em>was<\/em>。<em>requested<\/em> 是主要子句的動詞，不在 <em>that<\/em> 子句裡。"}], "takeaway": "<em>be<\/em> 動詞一律用 <em>be<\/em>；被動寫成 <em>be<\/em> + p.p.，不用 <em>is<\/em>、<em>was<\/em>、<em>were<\/em>。"}, {"h": "同一個字，不是在要求就照常變化", "body": ["原形只出現在「希望某件事發生」的時候。有兩個動詞特別容易被誤會，因為它們還有另一個意思。", "<em>suggest<\/em> 除了「建議」，還有「顯示、暗示」的意思：<em>The survey suggests that demand is rising.<\/em>（調查顯示需求正在上升）。這裡沒有人在要求需求上升，只是在說一個事實，所以用一般的 <em>is<\/em>。", "<em>insist<\/em> 除了「堅持要」，還有「堅稱」的意思：<em>Mr. Hall insisted that he had sent the invoice.<\/em>（Hall 先生堅稱他已經寄出發票）。他在主張一件過去的事是真的，所以用一般的時態 <em>had sent<\/em>（第 4 章）。對比 <em>Mr. Hall insisted that the invoice be sent today.<\/em>（他堅持發票今天就要寄出）：這是要求，用原形。", "所以判斷時不能只看那個字，要看意思：子句在說「應該發生的事」，用原形；在說「事實是這樣」，照常變化。"], "ex": [{"en": "The survey <u>suggests<\/u> that demand <u>is<\/u> rising in the south.", "zh": "調查顯示南部的需求正在上升。"}, {"en": "Mr. Hall <u>insisted<\/u> that he <u>had sent<\/u> the invoice.", "zh": "Hall 先生堅稱他已經寄出發票了。"}, {"en": "Mr. Hall <u>insisted<\/u> that the invoice <u>be sent<\/u> today.", "zh": "Hall 先生堅持發票今天就要寄出。"}], "quiz": [{"type": "choose", "q": "<em>The latest sales figures suggest that the campaign ___ working.<\/em>", "options": ["is", "be"], "answer": 0, "why": "銷售數字不會「建議」什麼，這裡的 <em>suggest<\/em> 是「顯示」，在說一個事實，所以用一般的 <em>is<\/em>。"}], "takeaway": "先看意思：在要求某件事發生才用原形；<em>suggest<\/em> 是「顯示」、<em>insist<\/em> 是「堅稱」時，照常用時態。"}, {"h": "英式英文的其他寫法", "body": ["這一章教的原形寫法，美式正式書面英文用它，英式正式書面英文也接受它。英式英文另外還接受兩種寫法，讀英式的文件時會看到。", "第一種是在原形前面加 <em>should<\/em>：<em>The manager requested that Mr. Kim should submit the report.<\/em> 意思跟不加 <em>should<\/em> 的版本一樣。<em>should<\/em> 後面本來就接原形，所以動詞一樣不加 <em>-s<\/em>、不變過去式。", "第二種是照常變化，跟陳述事實的 <em>that<\/em> 子句一樣：<em>It is important that the contract is signed before the launch.<\/em> 英式英文在一些情況下接受這種寫法；美式正式書面英文不用它，而用原形 <em>be signed<\/em>。", "所以這一章的題目，選項裡同時有原形和照常變化的形式時，題目會寫明「依美式正式書面英文的寫法」，答案是原形。原形在美式和英式的正式書面英文裡都通，自己寫的時候用它就不會出錯。讀到加 <em>should<\/em> 或照常變化的英式句子，知道意思跟原形一樣就好。"], "ex": [{"en": "The manager requested that Mr. Kim <u>submit<\/u> the report by Friday.", "zh": "經理要求 Kim 先生在星期五前交報告。", "note": "原形：美式和英式的正式書面英文都用。"}, {"en": "The manager requested that Mr. Kim <u>should submit<\/u> the report by Friday.", "zh": "經理要求 Kim 先生在星期五前交報告。", "note": "英式英文接受的寫法，意思相同；<em>should<\/em> 後面也是原形。"}, {"en": "It is important that the contract <u>is signed<\/u> before the launch.", "zh": "合約在上市前簽好，這一點很重要。", "note": "英式英文在一些情況下接受的寫法：照常變化。美式正式書面英文寫 <em>be signed<\/em>。"}], "takeaway": "英式英文也接受 <em>should<\/em> + 原形，有時也照常變化；原形在美式和英式的正式書面英文裡都通。"}], "mistakes": [{"wrong": "The manager requested that Ms. Ito submits the report by Friday.", "right": "The manager requested that Ms. Ito submit the report by Friday.", "why": "要求的 <em>that<\/em> 子句用原形，主詞是單數也不加 <em>-s<\/em>。英式英文有時會寫 <em>submits<\/em>，但美式正式書面英文用原形（見本章最後一節）。"}, {"wrong": "Our lawyer recommended that we did not sign the contract yet.", "right": "Our lawyer recommended that we not sign the contract yet.", "why": "否定直接在原形前面加 <em>not<\/em>，不用 <em>did<\/em>，也不跟著 <em>recommended<\/em> 變過去式。這是美式正式書面英文的寫法，英式的其他寫法見本章最後一節。"}, {"wrong": "The policy requires that all receipts are attached to the claim.", "right": "The policy requires that all receipts be attached to the claim.", "why": "在這個句型裡，<em>be<\/em> 動詞一律用原形 <em>be<\/em>；被動是 <em>be<\/em> + p.p.。<em>are attached<\/em> 在英式文字裡看得到，但不是美式正式書面英文的寫法。"}, {"wrong": "Ms. Ortiz suggested him to call the client.", "right": "Ms. Ortiz suggested that he call the client.", "why": "<em>suggest<\/em> 不能接「人 + to V」，要用 <em>that<\/em> + 主詞 + 原形。"}, {"wrong": "The figures suggest that the new store be doing well.", "right": "The figures suggest that the new store is doing well.", "why": "這裡的 <em>suggest<\/em> 是「顯示」，在陳述事實，不是要求，所以動詞照常變化。"}], "workbook": ["mandative"]}], "units": {"pos": "Parts of Speech", "tense": "Verb Tenses", "voice": "Active and Passive", "participle": "Participles: -ing and -ed", "connect": "Conjunctions, Prepositions and Linking Adverbs", "agree": "Subject–Verb Agreement", "relative": "Relative Pronouns", "pronoun": "Pronouns", "prep": "Prepositions of Time and Set Phrases", "toing": "-ing or to + Verb", "mandative": "That-Clauses with the Base Form", "conditional": "Conditionals and Inversion", "compare": "Comparisons", "quantity": "Quantifiers and Countable Nouns", "parallel": "Parallel Structure and Paired Conjunctions", "collocation": "Collocations", "synonym": "Near Synonyms", "business": "Business Vocabulary", "family": "Word Families", "qr-wh": "Responses: Wh- Questions", "qr-yesno": "Responses: Yes/No and Tag Questions", "qr-indirect": "Responses: Indirect Answers", "conv-topic": "Conversations: Topic and Setting", "conv-detail": "Conversations: Details", "conv-intent": "Conversations: Intent and Inference", "conv-next": "Conversations: What Happens Next", "talk-topic": "Talks: Topic", "talk-detail": "Talks: Details", "talk-next": "Talks: What Happens Next", "p6": "Text Completion", "p7-triple": "Three Documents"}}</script>
<script>
"use strict";
const BOOK = JSON.parse(document.getElementById("book").textContent);
const CH = BOOK.chapters, BYID = Object.fromEntries(CH.map(c => [c.id, c]));
const PARTS = [["一", "骨架", [1, 3]], ["二", "動詞", [4, 7]], ["三", "連接句子", [8, 10], "你的弱點"], ["四", "其他考點", [11, 16]]];
const WORKBOOK = "https://claude.ai/artifact/F3qr5xjhJhjDgXy4fsTe7p";
const L = "ABCD";
const $ = s => document.querySelector(s);
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function btn(cls, text, fn) { const b = el("button", cls, text); b.type = "button"; if (fn) b.onclick = fn; return b; }
function html(tag, cls, h) { const e = el(tag, cls); e.innerHTML = h; return e; }   // chapter text: only <em>, <b>, <u> (checked at build)
function shuffled(n, seed) {
  let h = 2166136261; for (const c of seed) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); }
  const a = [...Array(n).keys()];
  for (let i = n - 1; i > 0; i--) { h = Math.imul(h ^ h >>> 15, 2246822507) ^ Math.imul(h ^ h >>> 13, 3266489909); const j = (h >>> 0) % (i + 1); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function toast(t) { const e = $("#toast"); e.textContent = t; e.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => e.hidden = true, 1800); }

// ================================================================ progress: the viewer's own doc in the db, else this browser
// G = { last: chapterId, ch: { id: { read: ms, check: {ok, n, at}, skipped: ms, q: { key: true|false } } } }
let G = { last: null, ch: {} };
const Store = {
  db: null, path: null, busy: Promise.resolve(),
  async init() {
    try {
      if (!window.claude?.use) return;
      const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
      if (!db || !user) return;
      const id = await user.id(); if (!id) return;
      this.db = db; this.path = "data/users/" + id + "/grammar_progress";
    } catch { this.db = null; }
  },
  async load() {
    if (this.db) { try { const s = await this.db.doc(this.path).get(); if (s.exists) return s.data(); } catch {} }
    try { return JSON.parse(localStorage.getItem("grammar:progress") || "null"); } catch { return null; }
  },
  save() {
    const data = JSON.parse(JSON.stringify(G));
    try { localStorage.setItem("grammar:progress", JSON.stringify(data)); } catch {}
    if (!this.db) return;
    this.busy = this.busy.then(() => this.db.doc(this.path).set(data)).catch(e => { if (e?.code !== "cancelled") toast("進度沒有存到，請檢查連線。"); });
  },
};
function chState(id) { return G.ch[id] || (G.ch[id] = { q: {} }); }

// ================================================================ contents
function statusOf(c) {
  const s = G.ch[c.id]; if (!s) return ["", false];
  if (s.read) return ["讀過", true];
  if (s.skipped) return ["跳過", true];
  if (s.check) return ["小確認 " + s.check.ok + "/" + s.check.n, false];
  if (Object.keys(s.q || {}).length) return ["讀到一半", false];
  return ["", false];
}
function home() {
  const app = $("#app"); app.textContent = ""; scrollTo(0, 0);
  const mast = el("header", "mast");
  mast.append(el("div", "sc", "Grammar Foundations"), el("h1", null, "文法地基"),
    el("p", null, "從句子的骨架開始，一章一章把文法蓋回來。每章開頭有幾題小確認：全對就可以跳過那一章。"));
  app.append(mast);
  const last = G.last && BYID[G.last];
  const next = CH.find(c => !G.ch[c.id]?.read && !G.ch[c.id]?.skipped);
  const go = last && !G.ch[last.id]?.read && !G.ch[last.id]?.skipped ? last : next;
  if (go) { const p = el("p", "resume"); p.append(btn(null, (G.last ? "繼續讀：" : "從這裡開始：") + "第 " + go.n + " 章　" + go.title, () => chapter(go.id))); app.append(p); }
  for (const [no, name, [a, b], tag] of PARTS) {
    const s = el("section", "part"), h = el("h2", null, "第" + no + "部　" + name);
    if (tag) h.append(el("span", "weak", tag));
    const ol = el("ol");
    for (const c of CH.filter(c => c.n >= a && c.n <= b)) {
      const li = el("li"), r = btn("row", null, () => chapter(c.id)), [st, done] = statusOf(c);
      const t = el("span", "t", c.title); t.append(el("span", "sub", c.en));
      r.append(el("span", "n", String(c.n)), t, el("span", "st" + (done ? " done" : ""), st));
      li.append(r); ol.append(li);
    }
    s.append(h, ol); app.append(s);
  }
  const col = el("p", "colophon");
  col.append("讀完一章就去 ", Object.assign(el("a", null, "The Workbook"), { href: WORKBOOK, target: "_blank", rel: "noopener" }), " 練同一個主題的題目。例句為教學用途編寫，人名與公司名皆為虛構。");
  app.append(col);
}

// ================================================================ little questions (choose / tap)
function quiz(q, key, onDone) {
  const box = el("div", "q"), st = chState(cur.id), prev = st.q[key];
  const qq = el("p", "qq"); qq.innerHTML = q.q; box.append(qq);
  const why = () => { const w = el("p", "why"); w.append(el("span", "mk " + (st.q[key] ? "ok" : "no"), st.q[key] ? "對" : "再看一次")); w.insertAdjacentHTML("beforeend", q.why); box.append(w); };
  if (q.type === "choose") {
    const ol = el("ol", "opts"), bs = [];
    // options in a fixed shuffled order per question, so the answer is not always in the same place
    const order = shuffled(q.options.length, cur.id + ":" + key);
    order.forEach((i, pos) => {
      const li = el("li"), b = btn("opt"); b.innerHTML = `<span class="l">${L[pos]}</span><span class="w">${q.options[i]}</span>`;
      b.dataset.i = i; b.onclick = () => answer(i); bs.push(b); li.append(b); ol.append(li);
    });
    box.append(ol);
    const show = chosen => bs.forEach(b => { const i = Number(b.dataset.i); b.disabled = true; b.classList.add(i === q.answer ? "right" : i === chosen ? "wrong" : "dim"); });
    function answer(i) { st.q[key] = i === q.answer; show(i); why(); save(); onDone && onDone(st.q[key]); }
    if (prev != null) { show(prev ? q.answer : -1); why(); }
  } else {
    const words = q.sentence.split(" "), want = new Set(q.answer), sent = el("div", "sent"), toks = [];
    words.forEach((w, i) => { const t = btn("tok", w, () => { t.setAttribute("aria-pressed", String(t.getAttribute("aria-pressed") !== "true")); go.disabled = !toks.some(x => x.getAttribute("aria-pressed") === "true"); }); t.setAttribute("aria-pressed", "false"); toks.push(t); sent.append(t); });
    const go = btn("tapgo", "確認", () => check()); go.disabled = true;
    box.append(sent, go);
    const show = picked => { toks.forEach((t, i) => { t.disabled = true; const on = picked ? picked.has(i) : want.has(i); const k = want.has(i) ? (on ? "hit" : "miss") : on ? "extra" : ""; if (k) t.classList.add(k); }); go.remove(); };
    function check() {
      const picked = new Set(toks.map((t, i) => t.getAttribute("aria-pressed") === "true" ? i : -1).filter(i => i >= 0));
      st.q[key] = picked.size === want.size && [...want].every(i => picked.has(i));
      show(picked); why(); save(); onDone && onDone(st.q[key]);
    }
    if (prev != null) { show(null); why(); }
  }
  return box;
}
function save() { Store.save(); }

// ================================================================ chapter
let cur = null;
function chapter(id) {
  cur = BYID[id]; G.last = id; save();
  const c = cur, st = chState(id), app = $("#app"); app.textContent = ""; scrollTo(0, 0);
  const hd = el("div", "head"); hd.append(btn(null, "← 目錄", home), el("span", null, "第 " + c.n + " / " + CH.length + " 章")); app.append(hd);
  const ch = el("header", "chhead"); ch.append(el("div", "sc", "Chapter " + c.n)); const h1 = el("h1", null, c.title); h1.append(el("span", "en", c.en)); ch.append(h1); app.append(ch);
  app.append(html("p", "lead", c.lead));

  // opening check
  const box = el("section", "box"); box.append(el("h3", null, "先試試看"), el("p", "hint", "全對的話，這一章可以跳過。"));
  const res = {};
  c.check.forEach((q, i) => box.append(quiz(q, "check" + i, ok => { res[i] = ok; if (Object.keys(res).length === c.check.length) verdict(); })));
  const vd = el("div", "verdict"); vd.hidden = true; box.append(vd);
  function verdict() {
    const n = c.check.length, ok = c.check.filter((_, i) => st.q["check" + i]).length;
    st.check = { ok, n, at: Date.now() }; save();
    vd.hidden = false; vd.textContent = "";
    if (ok === n) {
      vd.append(el("p", null, "全對。這一章的核心你已經會了。"));
      const a = el("div", "acts"), nx = CH[c.n];
      a.append(btn(null, nx ? "跳過，去第 " + nx.n + " 章" : "跳過，回目錄", () => { st.skipped = Date.now(); save(); nx ? chapter(nx.id) : home(); }), btn(null, "還是讀一遍", () => secs.scrollIntoView({ behavior: "smooth" })));
      vd.append(a);
    } else vd.append(el("p", null, "錯了 " + (n - ok) + " 題。從下面開始讀，讀到對應的地方就會懂。"));
  }
  if (c.check.every((_, i) => st.q["check" + i] != null)) verdict();
  app.append(box);

  // sections
  const secs = el("div"); app.append(secs);
  c.sections.forEach((s, si) => {
    const sec = el("section", "sec"); sec.id = "s" + (si + 1);
    const h = el("h2"); h.append(el("span", "no", c.n + "." + (si + 1)), s.h); sec.append(h);
    for (const p of s.body) sec.append(html("p", null, p));
    if (s.ex?.length) {
      const ul = el("ul", "exs");
      for (const e of s.ex) { const li = el("li"); li.append(html("span", "e", e.en), html("span", "z", e.zh)); if (e.note) li.append(html("span", "nt", e.note)); ul.append(li); }
      sec.append(ul);
    }
    if (s.table) {
      const w = el("div", "tbl"), t = el("table"), hr = el("tr");
      for (const x of s.table.head) hr.append(html("th", null, x));
      const th = el("thead"); th.append(hr); t.append(th);
      const tb = el("tbody"); for (const r of s.table.rows) { const tr = el("tr"); for (const x of r) tr.append(html("td", null, x)); tb.append(tr); } t.append(tb);
      w.append(t); sec.append(w);
    }
    (s.quiz || []).forEach((q, qi) => sec.append(quiz(q, "s" + si + "q" + qi)));
    sec.append(html("p", "take", s.takeaway));
    secs.append(sec);
  });

  // mistakes
  if (c.mistakes?.length) {
    const sec = el("section", "sec"), h = el("h2"); h.append(el("span", "no", c.n + "." + (c.sections.length + 1)), "常見錯誤"); sec.append(h);
    const ul = el("ul", "mist");
    for (const m of c.mistakes) { const li = el("li"); li.append(html("span", "w", m.wrong), html("span", "r", m.right), html("span", "y", m.why)); ul.append(li); }
    sec.append(ul); secs.append(sec);
  }

  // end of chapter
  const end = el("nav", "endnav"), mr = btn("markread", st.read ? "已讀完" : "讀完了", () => {
    st.read = st.read ? null : Date.now(); save(); mr.textContent = st.read ? "已讀完" : "讀完了"; mr.setAttribute("aria-pressed", String(!!st.read)); if (st.read) toast("記下來了。");
  });
  mr.setAttribute("aria-pressed", String(!!st.read)); end.append(mr);
  if (c.workbook.length) {
    const p = el("p", "wb"); p.append("接著去 ");
    p.append(Object.assign(el("a", "go", "The Workbook"), { href: WORKBOOK, target: "_blank", rel: "noopener" }), " 練：" + c.workbook.map(u => BOOK.units[u] || u).join("、"));
    end.append(p);
  }
  const pn = el("div", "pn"), pv = CH[c.n - 2], nx = CH[c.n];
  pn.append(pv ? btn(null, "← 第 " + pv.n + " 章　" + pv.title, () => chapter(pv.id)) : el("span"), nx ? btn(null, "第 " + nx.n + " 章　" + nx.title + " →", () => chapter(nx.id)) : btn(null, "回目錄", home));
  end.append(pn); app.append(end);
}

(async () => {
  home();
  await Store.init();
  const g = await Store.load();
  if (g && g.ch) { G = g; home(); }
})();
</script>

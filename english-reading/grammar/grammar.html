t<\/em>），關係子句放在名詞後面（<em>a consultant who reduced our costs<\/em>）。", "所以 <em>who<\/em> 一個字同時做兩件事。第一，它像連接詞，把兩個子句接起來。第二，它代替第二句裡的 <em>the consultant<\/em>，在子句裡當主詞。這就是它叫關係<b>代名詞<\/b>的原因：它是一個代名詞，代替先行詞。", "拿掉它會怎樣？<em>We hired a consultant reduced our shipping costs.<\/em> 這句有兩個動詞 <em>hired<\/em> 和 <em>reduced<\/em>，中間沒有東西接起來，讀的人不知道第二個子句從哪裡開始，句子就壞了。反過來，接上 <em>who<\/em> 之後，第二句原本的名詞就要拿掉。不能寫成 <em>a consultant who he reduced our costs<\/em>：<em>who<\/em> 已經代替了他，再放 <em>he<\/em> 就重複了。", "接句子的步驟固定是四步。一、找出兩句共用的名詞。二、把第二句裡的那個名詞換成關係代名詞。三、把關係代名詞移到它那個子句的最前面。四、把整個子句放在第一句那個名詞的正後面。", "如果共用的名詞是第一句的主詞，關係子句就會夾在主詞和動詞中間：<em>The hotel which we booked for the conference has forty rooms.<\/em> 主詞是 <em>The hotel<\/em>，主要動詞是 <em>has<\/em>，中間整段都是關係子句。讀這種句子時，先把關係子句當成一個括號跳過，才找得到真正的動詞。"], "ex": [{"en": "We hired a <u>consultant<\/u> who reduced our shipping costs.", "zh": "我們請了一位幫我們降低運費的顧問。", "note": "先行詞是 <em>consultant<\/em>；<em>who<\/em> 代替它，在子句裡當主詞。"}, {"en": "The <u>hotel<\/u> which we booked for the conference has forty rooms.", "zh": "我們為研討會訂的那家飯店有四十間房。", "note": "第二句 <em>We booked the hotel<\/em> 的 <em>the hotel<\/em> 換成 <em>which<\/em>，從 <em>booked<\/em> 後面移到子句最前面，再接在第一個 <em>hotel<\/em> 後面。"}, {"en": "The <u>report<\/u> that Ms. Chen wrote is on your desk.", "zh": "Chen 女士寫的那份報告在你桌上。", "note": "主詞 <em>The report<\/em> 和動詞 <em>is<\/em> 中間夾著關係子句。"}], "table": {"head": ["原本的兩句", "共用的名詞", "接成一句"], "rows": [["<em>We hired a consultant.<\/em>／<em>The consultant reduced our costs.<\/em>", "<em>consultant<\/em>", "<em>We hired a consultant who reduced our costs.<\/em>"], ["<em>The hotel has forty rooms.<\/em>／<em>We booked the hotel.<\/em>", "<em>hotel<\/em>", "<em>The hotel which we booked has forty rooms.<\/em>"], ["<em>The report is on your desk.<\/em>／<em>Ms. Chen wrote the report.<\/em>", "<em>report<\/em>", "<em>The report that Ms. Chen wrote is on your desk.<\/em>"]]}, "quiz": [{"type": "choose", "q": "把這兩句接成一句：<em>The printer is on the third floor.<\/em> <em>Mr. Davis repaired the printer.<\/em> 哪一個是對的？", "options": ["The printer which Mr. Davis repaired is on the third floor.", "The printer which Mr. Davis repaired it is on the third floor.", "The printer which repaired Mr. Davis is on the third floor."], "answer": 0, "why": "<em>which<\/em> 代替第二句的 <em>the printer<\/em>，它在子句裡是 <em>repaired<\/em> 的受詞，所以移到子句最前面，原本的位置就空著，不能再放 <em>it<\/em>。第三句把順序弄反了，變成「修好 Davis 先生的那台印表機」。"}], "takeaway": "關係代名詞做兩件事：把兩句接成一句，同時代替兩句共用的那個名詞。"}, {"h": "第一個問題：先行詞是人還是事物", "body": ["選關係代名詞要問兩個問題。第一個最簡單：先行詞是人，還是事物？先行詞是人（員工、客戶、經理），用 <em>who<\/em>；是事物（報告、產品、會議），用 <em>which<\/em>。<em>that<\/em> 人和事物都可以用，但有一個限制，在講逗號的那一節會說明。", "看的是<b>先行詞<\/b>，也就是關係代名詞正前面被說明的那個名詞，不是整句裡有沒有人。<em>The training which the employees completed lasted three days.<\/em> 這句有人（<em>employees<\/em>），但 <em>which<\/em> 前面的名詞是 <em>training<\/em>，訓練是事物，所以用 <em>which<\/em>。子句裡面出現人，不代表要用 <em>who<\/em>。", "公司、部門、機構在書面英文裡一般當作事物，用 <em>which<\/em> 或 <em>that<\/em>：<em>a company which makes solar panels<\/em>。", "這個區別拿掉會怎樣？<em>who<\/em> 和 <em>which<\/em> 有點像中文書面的「他」和「它」：讀的人靠它確認你在講人還是東西。寫成 <em>the printer who<\/em>，就像把印表機寫成「他」，讀起來像在講一個人。"], "ex": [{"en": "The <u>employees<\/u> who completed the training received a certificate.", "zh": "完成訓練的員工拿到了證書。", "note": "先行詞 <em>employees<\/em> 是人：<em>who<\/em>。"}, {"en": "The <u>training<\/u> which the employees completed lasted three days.", "zh": "員工完成的那個訓練為期三天。", "note": "先行詞 <em>training<\/em> 是事物：<em>which<\/em>。子句裡有 <em>employees<\/em>，不影響。"}, {"en": "The <u>employees<\/u> that completed the training received a certificate.", "zh": "完成訓練的員工拿到了證書。", "note": "<em>that<\/em> 人和事物都能用。"}, {"en": "We work with a <u>company<\/u> which makes solar panels.", "zh": "我們跟一家生產太陽能板的公司合作。"}], "quiz": [{"type": "choose", "q": "<em>Please return the forms ___ the new employees signed.<\/em> 空格填哪一個？", "options": ["who", "which"], "answer": 1, "why": "空格正前面的名詞是 <em>forms<\/em>（表格），是事物，用 <em>which<\/em>。<em>employees<\/em> 是子句裡的主詞，不是先行詞。"}], "takeaway": "看關係代名詞正前面的名詞：人用 <em>who<\/em>，事物用 <em>which<\/em>，<em>that<\/em> 兩邊都行。"}, {"h": "第二個問題：它在自己的子句裡做什麼", "body": ["第二個問題才是門檻。關係子句是一個「挖了一個洞」的句子：原本的名詞被拿走，換成關係代名詞放在最前面。洞在哪裡，決定用哪個字。", "找洞的方法：把先行詞放回子句裡，看它放在哪裡才通順。<em>the engineer who designed the app<\/em> → <em>the engineer designed the app<\/em>：先行詞放在動詞前面，它是子句的<b>主詞<\/b>。<em>the engineer whom we hired<\/em> → <em>we hired the engineer<\/em>：先行詞放在動詞後面，它是子句的<b>受詞<\/b>。", "更快的看法是看關係代名詞後面緊接著什麼。後面直接是動詞（<em>who designed<\/em>），表示主詞那一格是空的，關係代名詞就是主詞。後面先出現自己的主詞和動詞（<em>whom we hired<\/em>），而那個動詞後面少了受詞，表示受詞那一格是空的，關係代名詞就是受詞。", "人的部分，主詞用 <em>who<\/em>，受詞用 <em>whom<\/em>。這跟 <em>he<\/em> 和 <em>him<\/em> 的差別一樣（第 11 章）：主詞位置用 <em>he<\/em>，受詞位置用 <em>him<\/em>。<em>whom<\/em> 結尾的 <em>m<\/em>，和 <em>him<\/em>、<em>them<\/em> 結尾的 <em>m<\/em> 是同一個記號，表示「受詞」。日常口語裡很多人受詞也用 <em>who<\/em>，但正式書面要分清楚；而 <em>whom<\/em> 放在主詞的位置（<em>the engineer whom designed<\/em>）在哪裡都是錯的。", "事物就簡單了：<em>which<\/em> 和 <em>that<\/em> 當主詞、當受詞都是同一個樣子。所以「缺主詞還是缺受詞」這個問題，在先行詞是人的時候最重要。 表格最右邊那一欄的 <em>whose<\/em>，兩節之後再講。", "關係代名詞當主詞時，後面的動詞要和先行詞的單複數一致（第 7 章）。<em>who<\/em>、<em>which<\/em>、<em>that<\/em> 自己沒有單複數，它代替誰，動詞就跟著誰：<em>an engineer who <b>designs<\/b> apps<\/em>（先行詞 <em>engineer<\/em> 是單數），<em>engineers who <b>design<\/b> apps<\/em>（先行詞 <em>engineers<\/em> 是複數）。"], "table": {"head": ["先行詞", "當主詞：後面直接接動詞", "當受詞：後面接主詞＋動詞", "所有格：後面接名詞"], "rows": [["人", "<em>who<\/em>／<em>that<\/em>", "<em>whom<\/em>／<em>that<\/em>", "<em>whose<\/em>"], ["事物", "<em>which<\/em>／<em>that<\/em>", "<em>which<\/em>／<em>that<\/em>", "<em>whose<\/em>"]]}, "ex": [{"en": "The engineer <u>who designed the app<\/u> will train the staff.", "zh": "設計這個 App 的工程師會訓練員工。", "note": "<em>who<\/em> 後面直接是動詞 <em>designed<\/em>：缺主詞。"}, {"en": "The engineer <u>whom we hired in May<\/u> will train the staff.", "zh": "我們五月聘的那位工程師會訓練員工。", "note": "<em>whom<\/em> 後面是 <em>we hired<\/em>，<em>hired<\/em> 後面少了受詞：缺受詞。"}, {"en": "The app <u>that crashed yesterday<\/u> has been fixed.", "zh": "昨天當機的那個 App 已經修好了。", "note": "事物當主詞：<em>that<\/em>（<em>which<\/em> 也可以）。"}, {"en": "The app <u>that we launched last week<\/u> already has 2,000 users.", "zh": "我們上週推出的 App 已經有兩千個使用者。", "note": "事物當受詞，還是 <em>that<\/em>（<em>which<\/em> 也可以）。"}, {"en": "The <u>engineers<\/u> who design the app work in our Harlow Bay office.", "zh": "設計這個 App 的工程師在我們的 Harlow Bay 辦公室上班。", "note": "先行詞 <em>engineers<\/em> 是複數：<em>who<\/em> 後面用 <em>design<\/em>，不是 <em>designs<\/em>。"}], "quiz": [{"type": "choose", "q": "<em>The intern ___ Ms. Park trained last summer now works in sales.<\/em> 空格後面的子句缺什麼？", "options": ["缺主詞", "缺受詞"], "answer": 1, "why": "空格後面先有主詞 <em>Ms. Park<\/em> 和動詞 <em>trained<\/em>，但 <em>trained<\/em> 後面沒有受詞。放回去是 <em>Ms. Park trained the intern<\/em>，所以缺受詞，正式書面用 <em>whom<\/em>。"}], "takeaway": "把先行詞放回子句：放在動詞前面就是主詞（<em>who<\/em>），放在動詞後面就是受詞（<em>whom<\/em>）；當主詞時，動詞跟著先行詞的單複數。"}, {"h": "中間插了 we believe：先劃掉再看", "body": ["有一種句子特別容易選錯：<em>The candidate ___ we believe is the most qualified will start in May.<\/em> 空格後面看到 <em>we believe<\/em>，很像上一節說的「後面有主詞和動詞，所以缺受詞」，於是選了 <em>whom<\/em>。這是錯的。", "原因是 <em>we believe<\/em> 是插進來的一小段，意思是「我們認為」。它自己也有主詞和動詞，但它只是夾在中間的插入語，不是關係子句的骨架；關係子句真正的主詞是 <em>who<\/em>，真正的動詞是 <em>is<\/em>。把它劃掉：<em>the candidate ___ is the most qualified<\/em>，空格後面直接是動詞 <em>is<\/em>，缺主詞，答案是 <em>who<\/em>。", "用放回去的方法也會得到一樣的答案：<em>We believe the candidate is the most qualified.<\/em> 這句裡 <em>the candidate<\/em> 是 <em>is<\/em> 的主詞，不是 <em>believe<\/em> 的受詞。<em>believe<\/em> 的受詞是後面整件事：「這位應徵者最合格」。所以關係代名詞是主詞，用 <em>who<\/em>。", "常插進來的有 <em>we think<\/em>、<em>we believe<\/em>、<em>I hope<\/em>、<em>they say<\/em>、<em>experts expect<\/em>、<em>the manager said<\/em>。判斷的步驟：空格後面是「主詞＋這類動詞」，而且緊接著又出現一個動詞（<em>is<\/em>、<em>will lead<\/em>），就先把那一段劃掉，再看缺什麼。", "對照真的缺受詞的句子：<em>The candidate whom we interviewed yesterday …<\/em> <em>interview<\/em>（面試）後面一定要接一個人，<em>we interviewed<\/em> 後面少了那個人，這時才用 <em>whom<\/em>。<em>believe<\/em>、<em>think<\/em>、<em>say<\/em> 這類動詞不一樣：後面可以接一整件事（「我們認為這位應徵者最合格」），所以 <em>we believe<\/em> 後面可以直接接 <em>is<\/em>。", "劃掉插入語之後，也可能發現缺的是受詞。如果插入語後面接的是<b>另一個主詞<\/b>，缺受詞的就是那個主詞的動詞，這時還是用 <em>whom<\/em>：<em>The candidate whom we believe the committee will choose …<\/em> 劃掉 <em>we believe<\/em>，剩 <em>whom the committee will choose<\/em>，<em>choose<\/em> 後面少了受詞。所以重點不是「看到 <em>we believe<\/em> 就選 <em>who<\/em>」，而是劃掉之後，照第二個問題的方法再看一次缺什麼。"], "ex": [{"en": "The candidate <u>who<\/u> we believe is the most qualified will start in May.", "zh": "我們認為最合格的那位應徵者五月到職。", "note": "劃掉 <em>we believe<\/em> → <em>who is the most qualified<\/em>：缺主詞。"}, {"en": "Ms. Ortiz is the manager <u>who<\/u> I think will lead the project.", "zh": "Ortiz 女士就是我認為會帶這個專案的經理。", "note": "劃掉 <em>I think<\/em> → <em>who will lead the project<\/em>：缺主詞。"}, {"en": "Ms. Ortiz is the manager <u>whom<\/u> I contacted about the project.", "zh": "Ortiz 女士就是我為了這個專案聯絡的經理。", "note": "沒有可以劃掉的插入語；<em>contacted<\/em> 後面少了受詞：<em>whom<\/em>。"}, {"en": "The candidate <u>whom<\/u> we believe the committee will choose starts in May.", "zh": "我們認為委員會會選上的那位應徵者，五月到職。", "note": "劃掉 <em>we believe<\/em> → <em>whom the committee will choose<\/em>：<em>choose<\/em> 後面少了受詞，用 <em>whom<\/em>。"}], "quiz": [{"type": "tap", "q": "點出可以先劃掉的插入語。", "sentence": "The engineer who the director said would lead the project has resigned.", "answer": [3, 4, 5], "why": "<em>the director said<\/em> 是插進來的「總監說」。劃掉之後是 <em>the engineer who would lead the project<\/em>：<em>who<\/em> 後面直接接動詞 <em>would lead<\/em>，缺主詞，所以用 <em>who<\/em> 是對的。整句的主要動詞是 <em>has resigned<\/em>。"}], "takeaway": "空格後面是 <em>we think<\/em>、<em>we believe<\/em> 這類短語時，先劃掉短語再看：接著是動詞就缺主詞（<em>who<\/em>），接著是另一個主詞就缺受詞（<em>whom<\/em>）。"}, {"h": "whose ＋名詞：誰的", "body": ["再看這兩句：<em>We called the client.<\/em> <em>The client's order was delayed.<\/em> 共用的是 <em>client<\/em>，但第二句用的是 <em>the client's<\/em>（客戶的）。要代替「誰的」，就用 <em>whose<\/em>：<em>We called the client whose order was delayed.<\/em>", "<em>whose<\/em> 是 <em>his<\/em>、<em>her<\/em>、<em>its<\/em>、<em>their<\/em> 的關係代名詞版本，所以後面一定接一個名詞（中間可以有形容詞，如 <em>whose new order<\/em>），而且這個名詞屬於先行詞：<em>whose order<\/em> 是那位客戶的訂單。名詞前面不加 <em>the<\/em> 或 <em>a<\/em>，就像不會說 <em>her the order<\/em>。", "<em>whose<\/em> 人和事物都能用：<em>the company whose software we use<\/em>（我們用的是這家公司的軟體）。不要因為先行詞是事物就換成 <em>which<\/em>，<em>which<\/em> 後面不能直接接一個屬於它的名詞。", "拿掉會怎樣？<em>the client who order was delayed<\/em> 裡，<em>who<\/em> 後面直接放名詞 <em>order<\/em>，<em>who<\/em> 沒辦法表示「他的」，句子就斷了。和前兩節合起來看，關係代名詞後面緊接著什麼，就知道要哪一個：接動詞，用 <em>who<\/em>／<em>which<\/em>；接主詞＋動詞，用 <em>whom<\/em>／<em>which<\/em>；接一個屬於先行詞的名詞，用 <em>whose<\/em>。", "另外，<em>who's<\/em> 是 <em>who is<\/em> 或 <em>who has<\/em> 的縮寫，唸起來和 <em>whose<\/em> 一樣，意思完全不同。"], "ex": [{"en": "We called the client <u>whose order<\/u> was delayed.", "zh": "我們打電話給訂單延誤的那位客戶。", "note": "<em>whose order<\/em> = <em>the client's order<\/em>。"}, {"en": "Employees <u>whose contracts<\/u> end in June should contact Human Resources.", "zh": "合約六月到期的員工請聯絡人資部。", "note": "<em>whose contracts<\/em> = <em>the employees' contracts<\/em>。"}, {"en": "The company <u>whose software<\/u> we use has opened an office in Harlow Bay.", "zh": "提供我們所用軟體的那家公司，在 Harlow Bay 開了辦事處。", "note": "先行詞是事物，一樣用 <em>whose<\/em>。<em>whose software<\/em> 在子句裡是 <em>use<\/em> 的受詞。"}], "quiz": [{"type": "choose", "q": "<em>The architect ___ design won the award will speak at the conference.<\/em> 空格填哪一個？", "options": ["who", "whom", "whose"], "answer": 2, "why": "空格後面直接是名詞 <em>design<\/em>，而且是這位建築師的設計。表示「他的」要用 <em>whose<\/em>。"}], "takeaway": "空格後面直接接一個屬於前面那個人或東西的名詞，就用 <em>whose<\/em>。"}, {"h": "介系詞後面：in which、to whom", "body": ["有些動詞要帶介系詞才能接受詞：<em><b>speak to<\/b> someone<\/em>、<em><b>work for<\/b> a company<\/em>。地點、時間的介系詞也一樣，後面的名詞是它的受詞：<em><b>in<\/b> a room<\/em>、<em><b>on<\/b> Friday<\/em>。這時關係代名詞是<b>介系詞的受詞<\/b>。例如：<em>This is the manager.<\/em> <em>We spoke to the manager.<\/em>", "接成一句有兩種放法。第一種，介系詞留在原位，在子句最後：<em>This is the manager whom we spoke to.<\/em> 這種放法，關係代名詞也可以用 <em>that<\/em>，或乾脆省略（後面講省略的那一節）：<em>the manager that we spoke to<\/em>、<em>the manager we spoke to<\/em>。第二種比較正式，介系詞跟著關係代名詞一起移到前面：<em>This is the manager to whom we spoke.<\/em>", "第二種放法有一條硬規則：<b>介系詞後面只能接 <em>which<\/em>（事物）或 <em>whom<\/em>（人）<\/b>。不能接 <em>that<\/em>，也不能接 <em>who<\/em>。不能接 <em>who<\/em>，是因為介系詞後面要用受詞的形式，就像要說 <em>to him<\/em>，不說 <em>to he<\/em>。<em>that<\/em> 則是規定上不放在介系詞後面。", "介系詞移到前面之後，後面的子句看起來是<b>完整<\/b>的：<em>the room in which the interview will take place<\/em>，<em>the interview will take place<\/em> 主詞、動詞都有，不缺東西。這不是例外：缺的那一格是 <em>in<\/em> 的受詞，已經跟著 <em>in<\/em> 一起搬到前面了。", "同樣的道理，逗號後面可以用「數量＋<em>of<\/em>＋<em>which<\/em>／<em>whom<\/em>」：<em>three of whom<\/em>（其中三位）、<em>most of which<\/em>（其中大部分）。<em>of<\/em> 是介系詞，所以後面一樣只能接 <em>which<\/em> 或 <em>whom<\/em>。"], "ex": [{"en": "This is the room <u>in which<\/u> the interview will take place.", "zh": "這就是面試會舉行的那個房間。", "note": "= <em>the interview will take place in the room<\/em>。"}, {"en": "Mr. Lowell is the buyer <u>to whom<\/u> we sent the samples.", "zh": "Lowell 先生就是我們寄樣品過去的那位採購。", "note": "= <em>we sent the samples to the buyer<\/em>。"}, {"en": "Mr. Lowell is the buyer <u>that<\/u> we sent the samples <u>to<\/u>.", "zh": "Lowell 先生就是我們寄樣品過去的那位採購。", "note": "介系詞留在句尾，語氣比較口語，這時可以用 <em>that<\/em>。移到前面的 <em>to whom<\/em> 才不能用 <em>that<\/em>。"}, {"en": "We interviewed twelve applicants, <u>three of whom<\/u> have accounting degrees.", "zh": "我們面試了十二位應徵者，其中三位有會計學位。"}], "quiz": [{"type": "choose", "q": "下面哪一個是對的？", "options": ["the company for which she works", "the company for that she works", "the company for who she works"], "answer": 0, "why": "介系詞 <em>for<\/em> 後面只能接 <em>which<\/em> 或 <em>whom<\/em>。先行詞 <em>company<\/em> 是事物，所以是 <em>for which<\/em>。也可以把介系詞留在句尾：<em>the company she works for<\/em>。"}], "takeaway": "介系詞後面的關係代名詞只有兩個選擇：事物用 <em>which<\/em>，人用 <em>whom<\/em>。"}, {"h": "有逗號和沒逗號：限定和補充", "body": ["比較這兩句：<em>The employees who work on weekends receive extra pay.<\/em> 和 <em>Our employees, who work on weekends, receive extra pay.<\/em> 只差兩個逗號，意思不同。", "第一句沒有逗號，關係子句的工作是<b>限定<\/b>：從所有員工裡挑出「週末上班的那些」，只有他們有加給。拿掉關係子句，變成 <em>The employees receive extra pay<\/em>，意思就變了，好像所有員工都有加給。所以限定的子句拿不掉。", "第二句有逗號，關係子句是<b>補充<\/b>：講的是我們全部的員工，順便補一句「他們週末都要上班」。拿掉它，<em>Our employees receive extra pay<\/em>，主要意思還在，只是少了一項資訊。逗號的作用像括號，告訴讀者：這段拿掉，你還是知道我在講誰。", "所以人名、獨一無二的東西（<em>our CEO<\/em>、<em>the company's headquarters<\/em>）後面的關係子句，幾乎都加逗號：<em>Ms. Rowan, who joined the firm in 2019, …<\/em> 名字已經說明是誰了，不需要再限定。", "規則是：<b>逗號後面不能用 <em>that<\/em><\/b>，只能用 <em>who<\/em>、<em>whom<\/em>、<em>which<\/em>、<em>whose<\/em>。<em>that<\/em> 只用在限定（沒有逗號）的子句。可以這樣理解：<em>that<\/em> 的工作是「挑出是哪一個」，而有逗號表示已經知道是哪一個，兩者衝突。沒有逗號時，事物用 <em>that<\/em> 或 <em>which<\/em> 都可以，美式書面比較常用 <em>that<\/em>。", "補充用法還有一個特別的地方：逗號後面的 <em>which<\/em> 可以指前面<b>一整件事<\/b>，不只一個名詞。<em>The shipment arrived two days late, which delayed production.<\/em> 造成生產延誤的是「貨晚到兩天」這件事。這時也只能用 <em>which<\/em>。"], "table": {"head": ["比較項目", "限定：沒有逗號", "補充：有逗號"], "rows": [["作用", "挑出是哪一個、哪一些", "對已經知道是誰的人事物補一句"], ["拿掉關係子句", "意思改變", "主要意思還在"], ["能不能用 <em>that<\/em>", "可以", "不可以"], ["當受詞的關係代名詞能不能省略（下一節）", "可以", "不可以"]]}, "ex": [{"en": "The employees <u>who work on weekends<\/u> receive extra pay.", "zh": "週末上班的員工有加給。", "note": "限定：只有週末上班的那些人有。"}, {"en": "Our employees, <u>who work on weekends<\/u>, receive extra pay.", "zh": "我們的員工有加給，他們週末都要上班。", "note": "補充：講的是全部員工。"}, {"en": "Ms. Rowan, <u>who<\/u> joined the firm in 2019, now leads the sales team.", "zh": "Rowan 女士 2019 年加入公司，現在帶業務團隊。"}, {"en": "The new scheduling tool, <u>which<\/u> we introduced in May, saves each team several hours a week.", "zh": "這個五月導入的新排程工具，讓每個團隊每週省下好幾個小時。"}, {"en": "The shipment arrived two days late, <u>which<\/u> delayed production.", "zh": "貨晚到兩天，這件事讓生產延誤了。", "note": "<em>which<\/em> 指前面整件事。"}], "quiz": [{"type": "choose", "q": "<em>Our CEO, ___ founded the company in 2005, will retire next year.<\/em> 空格填哪一個？", "options": ["that", "who", "which"], "answer": 1, "why": "逗號後面不能用 <em>that<\/em>。先行詞 <em>our CEO<\/em> 是人，而且空格後面直接接動詞 <em>founded<\/em>，缺主詞，所以用 <em>who<\/em>。"}, {"type": "choose", "q": "<em>The laptops, which were damaged, were sent back.<\/em> 這句的意思是哪一個？", "options": ["那批筆電全都壞了，全部退回", "只有壞掉的那幾台退回，其他的留下"], "answer": 0, "why": "有逗號是補充：講的是那一批全部的筆電，順便說它們都壞了。如果只有壞掉的那幾台退回，要寫成沒有逗號的 <em>The laptops which were damaged were sent back.<\/em>"}], "takeaway": "有逗號是補充，沒逗號是限定；逗號後面只能用 <em>who<\/em>、<em>which<\/em> 這類，不能用 <em>that<\/em>。"}, {"h": "可以省略的關係代名詞", "body": ["商業英文裡很常見這種句子：<em>The report you requested is attached.<\/em> 名詞 <em>report<\/em> 後面直接接 <em>you requested<\/em>，好像少了什麼。確實少了：原本是 <em>The report that you requested is attached.<\/em> 關係代名詞被省略了。", "能省略要同時符合兩個條件。一、關係代名詞在子句裡當<b>受詞<\/b>。二、子句是限定用法，前面沒有逗號。<em>that you requested<\/em> 中，<em>that<\/em> 是 <em>requested<\/em> 的受詞，又沒有逗號，所以可以拿掉。", "當主詞時不能省略。試試看：<em>The client who arrived this morning is waiting in the lobby.<\/em> 拿掉 <em>who<\/em>，變成 <em>The client arrived this morning is waiting in the lobby.<\/em> 一句話裡有兩個有時態的動詞（<em>arrived<\/em>、<em>is waiting<\/em>），中間沒有任何字把它們接起來，句子就壞了（第 3 章）。當主詞的關係代名詞，同時就是那個接句子的字，拿掉它就接不起來，所以不能省。", "有逗號時也不能省略：<em>Mr. Reyes, whom we met at the trade fair, …<\/em> 不能寫成 <em>Mr. Reyes, we met at the trade fair, …<\/em>。介系詞放在前面時也不能省（<em>in which<\/em> 不能只剩 <em>in<\/em>）；介系詞留在句尾時才可以省：<em>the manager we spoke to<\/em>。", "閱讀時的訊號：一個名詞後面緊接著另一組主詞和動詞（<em>the report you requested<\/em>、<em>the supplier we chose<\/em>），中間就藏了一個 <em>that<\/em> 或 <em>which<\/em>。看出這一點，就找得到真正的主要動詞。"], "ex": [{"en": "The <u>report you requested<\/u> is attached.", "zh": "您要的報告在附件裡。", "note": "= <em>The report that you requested<\/em>。主要動詞是 <em>is attached<\/em>。"}, {"en": "The <u>supplier we chose<\/u> delivers every Friday.", "zh": "我們選的那家供應商每週五送貨。"}, {"en": "The <u>manager we spoke to<\/u> will call you back this afternoon.", "zh": "跟我們談過的那位經理今天下午會回您電話。", "note": "介系詞 <em>to<\/em> 留在句尾，關係代名詞可以省略。"}, {"en": "The client <u>who arrived this morning<\/u> is waiting in the lobby.", "zh": "今天早上抵達的那位客戶正在大廳等候。", "note": "<em>who<\/em> 是主詞，不能省略。"}], "quiz": [{"type": "choose", "q": "下面哪一句的關係代名詞可以省略？", "options": ["The technician who fixed the printer has left for the day.", "The proposal that we discussed on Monday needs more detail.", "Mr. Reyes, whom we met at the trade fair, sent us an email."], "answer": 1, "why": "第二句的 <em>that<\/em> 是 <em>discussed<\/em> 的受詞，而且沒有逗號，可以省略成 <em>The proposal we discussed on Monday<\/em>。第一句的 <em>who<\/em> 是主詞；第三句有逗號；兩者都不能省。"}], "takeaway": "關係代名詞當受詞、前面沒有逗號，才可以省略；名詞後面直接接主詞＋動詞，就是省略過的。"}, {"h": "預告：what、where、when", "body": ["這三個字常跟 <em>who<\/em>、<em>which<\/em> 一起出現，這裡只講怎麼分辨。", "<em>what<\/em> 的前面<b>沒有<\/b>先行詞，因為它自己就包含了名詞：<em>what<\/em> = <em>the thing that<\/em>（……的東西、……的事）。<em>What the client wants is an earlier delivery date.<\/em> = <em>The thing that the client wants is …<\/em> 所以前面已經有名詞時不能用 <em>what<\/em>：<em>the date what we agreed on<\/em> 是錯的，要用 <em>that<\/em> 或 <em>which<\/em>。", "<em>where<\/em> 說明地點，<em>when<\/em> 說明時間，後面接的是<b>完整<\/b>的子句，什麼都不缺：<em>the factory where the parts are made<\/em>，<em>the parts are made<\/em> 主詞、動詞都有。這和介系詞那一節的 <em>in which<\/em> 是同一回事：<em>where<\/em> 大致等於 <em>in which<\/em> 或 <em>at which<\/em>。", "先行詞是地點，不代表一定用 <em>where<\/em>。<em>the factory which we visited in May<\/em>：<em>we visited<\/em> 後面缺受詞，要用 <em>which<\/em>。判斷方法還是看後面的子句：缺主詞或受詞，用 <em>which<\/em>／<em>that<\/em>；什麼都不缺，用 <em>where<\/em>。"], "ex": [{"en": "<u>What<\/u> the client wants is an earlier delivery date.", "zh": "客戶想要的是更早的交貨日期。", "note": "<em>what<\/em> 前面沒有名詞。"}, {"en": "The factory <u>where<\/u> the parts are made is near the port.", "zh": "生產這些零件的工廠在港口附近。", "note": "<em>the parts are made<\/em> 是完整的子句。"}, {"en": "The factory <u>which<\/u> we visited in May is near the port.", "zh": "我們五月參觀的工廠在港口附近。", "note": "<em>visited<\/em> 後面缺受詞：<em>which<\/em>。"}, {"en": "Friday is the day <u>when<\/u> the auditors arrive.", "zh": "星期五是稽核人員到的那天。"}], "quiz": [{"type": "choose", "q": "<em>The hotel ___ we held the conference has a new owner.<\/em> 空格填哪一個？", "options": ["which", "where"], "answer": 1, "why": "空格後面 <em>we held the conference<\/em> 主詞、動詞、受詞都有，是完整的子句。地點加完整子句用 <em>where<\/em>（= <em>at which<\/em>）。如果是 <em>the hotel ___ we booked<\/em>，<em>booked<\/em> 缺受詞，才用 <em>which<\/em>。"}], "takeaway": "<em>what<\/em> 前面沒有名詞；<em>where<\/em>、<em>when<\/em> 後面的子句是完整的。"}], "mistakes": [{"wrong": "The engineer whom designed the system will lead the training.", "right": "The engineer who designed the system will lead the training.", "why": "<em>whom<\/em> 後面直接接動詞 <em>designed<\/em>，表示它在當主詞。當主詞要用 <em>who<\/em>。"}, {"wrong": "The candidate whom we believe is the most qualified will start on Monday.", "right": "The candidate who we believe is the most qualified will start on Monday.", "why": "劃掉插入的 <em>we believe<\/em>，剩下 <em>who is the most qualified<\/em>，缺的是主詞。"}, {"wrong": "We called the client who order was delayed.", "right": "We called the client whose order was delayed.", "why": "後面直接接名詞 <em>order<\/em>，是那位客戶的訂單，要用 <em>whose<\/em>。"}, {"wrong": "Our new office, that opened in March, has a larger lobby.", "right": "Our new office, which opened in March, has a larger lobby.", "why": "逗號後面不能用 <em>that<\/em>。"}, {"wrong": "This is the warehouse in that the samples are stored.", "right": "This is the warehouse in which the samples are stored.", "why": "介系詞後面只能接 <em>which<\/em> 或 <em>whom<\/em>，不能接 <em>that<\/em>。"}], "workbook": ["relative"]}, {"id": "conditional", "n": 10, "title": "假設語氣與倒裝", "en": "Conditionals and Inversion", "lead": "<em>if<\/em> 的句子有兩種：一種講有可能發生的事，一種講假設、不是事實的事。英文用「把時態往過去退一格」來表示「這不是真的」。這一章從這個想法出發，把三種句型、<em>were<\/em>、<em>unless<\/em> 一一講清楚，最後講正式書信裡常見的倒裝：<em>Should you need …<\/em>、<em>Had we known …<\/em>、<em>Were the price …<\/em>，以及怎麼把它們還原成 <em>if<\/em> 句。時態（第 4 章）是這一章的基礎。", "check": [{"type": "choose", "q": "<em>If we had a bigger budget, we would hire two more designers.<\/em> 從這句可以知道什麼？", "options": ["預算夠大，我們打算多請兩位設計師", "預算不夠大，所以沒有多請", "我們以前曾經有比較大的預算"], "answer": 1, "why": "<em>if<\/em> 子句用過去式 <em>had<\/em>、主要子句用 <em>would<\/em>，是在講現在「不是真的」的情況：事實和句子相反，預算其實不夠大。這裡的 <em>had<\/em> 不是過去時間。"}, {"type": "choose", "q": "<em>If the shipment ___ tomorrow, we will process it right away.<\/em> 空格填哪一個？", "options": ["arrives", "will arrive", "arrived"], "answer": 0, "why": "主要子句是 <em>will<\/em>，表示這是可能發生的條件。<em>if<\/em> 子句講未來的事時用現在式，不用 <em>will<\/em>。"}, {"type": "choose", "q": "我其實不是負責人。<em>If I ___ in charge of the project, I would hire an extra designer.<\/em> 空格填哪一個？", "options": ["am", "were", "have been"], "answer": 1, "why": "講現在不是真的事，<em>if<\/em> 子句往過去退一格；<em>be<\/em> 動詞在這裡不分主詞都用 <em>were<\/em>。"}, {"type": "choose", "q": "<em>If we had known about the delay, we ___ the client.<\/em> 空格填哪一個？", "options": ["will call", "would have called", "would had called"], "answer": 1, "why": "<em>if<\/em> 子句是 <em>had<\/em> + p.p.，講過去沒有發生的事；主要子句配 <em>would have<\/em> + p.p.。<em>would<\/em> 後面要接原形 <em>have<\/em>，不能接 <em>had<\/em>。"}, {"type": "choose", "q": "<em>Had we known about the strike, we would have shipped the order earlier.<\/em> 這句等於哪一個 <em>if<\/em> 句？", "options": ["If we had known about the strike, …", "If we have known about the strike, …", "If we knew about the strike, …"], "answer": 0, "why": "句首的 <em>Had<\/em> + 主詞 + p.p.，是把 <em>if we had known<\/em> 的 <em>if<\/em> 拿掉、<em>had<\/em> 搬到主詞前面。還原時把 <em>had<\/em> 放回主詞後面，再加上 <em>if<\/em>。"}], "sections": [{"h": "有可能的條件和假想的條件", "body": ["<em>if<\/em> 帶頭、交代條件的子句叫條件子句（第 4 章第 8 節），是從屬子句（第 3 章），說的是「條件」；另一半是主要子句，說的是「結果」。<em>If the client signs today, we will start on Monday.<\/em> 條件是客戶今天簽約，結果是我們星期一開工。", "條件分兩種，先分清楚再談文法。第一種是<b>有可能的條件<\/b>：說的人覺得這件事有可能發生，只是還不確定。客戶今天可能簽，也可能不簽，兩邊都有可能。", "第二種是<b>假想的條件<\/b>：說的人知道這件事不是真的，或者幾乎不可能。<em>If we had a bigger warehouse, we would keep more stock.<\/em> 說這句話的人其實知道：倉庫不夠大。這種句子要「反過來讀」，才是事實。", "中文兩種都可以說「如果」，再靠「要是」「早知道」這類字眼和語氣表達。英文則一定要在<b>動詞<\/b>上表現出來：看 <em>if<\/em> 子句和主要子句的動詞形式（<em>will<\/em>、<em>would<\/em>、<em>would have<\/em>……），就知道說話的人覺得這件事有可能，還是知道它不是真的。這也是為什麼讀錯動詞，就會把意思整個讀反。"], "ex": [{"en": "If the client <u>signs<\/u> today, we <u>will start<\/u> on Monday.", "zh": "如果客戶今天簽約，我們星期一就開工。", "note": "有可能的條件：客戶可能簽。"}, {"en": "If we <u>had<\/u> a bigger warehouse, we <u>would keep<\/u> more stock.", "zh": "要是我們的倉庫大一點，就會多放些庫存。", "note": "假想的條件：倉庫其實不夠大。"}, {"en": "If the price <u>drops<\/u> next month, we <u>will order<\/u> 500 units.", "zh": "如果下個月降價，我們會訂 500 個。", "note": "有可能降價，還不知道。"}, {"en": "If the price <u>were<\/u> lower, we <u>would order<\/u> 500 units.", "zh": "要是價格低一點，我們就會訂 500 個。", "note": "價格其實不低，所以沒訂。"}], "table": {"head": ["句子", "說話的人覺得", "真正的情況"], "rows": [["<em>If the price drops next month, we will order 500 units.<\/em>", "有可能降價", "還不知道會不會降"], ["<em>If the price were lower, we would order 500 units.<\/em>", "這不是真的", "價格不低，所以不訂"]]}, "quiz": [{"type": "choose", "q": "<em>If Mr. Hale were here, he would know the password.<\/em> 從這句可以知道什麼？", "options": ["Hale 先生現在在這裡", "Hale 先生現在不在這裡", "Hale 先生等一下一定會來"], "answer": 1, "why": "<em>were<\/em> 和 <em>would<\/em> 表示假想的條件。句子說「要是他在這裡」，事實就是他不在。"}], "takeaway": "先問：說話的人覺得這件事有可能，還是知道它不是真的；答案決定動詞怎麼寫。"}, {"h": "退一格：英文怎麼表示「這不是真的」", "body": ["英文沒有一個專門表示「不是真的」的字。它的做法是：<b>把動詞的時態往過去退一格<\/b>。往過去退，就是把話推得離現實遠一點，讀的人一看就知道「這只是假設」。", "退一格的對照是固定的。現在式退一格變過去式；過去式退一格變過去完成式，也就是 <em>had<\/em> + p.p.（第 4 章）。主要子句也一樣：<em>will<\/em> 退一格變 <em>would<\/em>；<em>would<\/em> 再退一格變 <em>would have<\/em> + p.p.。", "這裡是最容易卡住的地方：<b>退一格之後的過去式，講的不是過去時間<\/b>。<em>If we had more staff<\/em> 的 <em>had<\/em> 講的是現在：我們現在人手不夠。要講過去假想的事，必須再退一格，用 <em>had<\/em> + p.p.：<em>If we had hired more staff last year<\/em>（去年要是多請了人）。", "所以三種句型其實只是一條規則：先想這件事的時間（未來、現在、過去），再問它是不是真的；不是真的，就把 <em>if<\/em> 子句和主要子句<b>一起<\/b>退一格。下面三節一型一型看。"], "table": {"head": ["情況", "<em>if<\/em> 子句", "主要子句", "例句"], "rows": [["可能發生：不退", "現在式", "<em>will<\/em> + 原形", "<em>If we hire more staff, we will open on Sundays.<\/em>"], ["現在不是真的：退一格", "過去式（<em>be<\/em> 用 <em>were<\/em>）", "<em>would<\/em> + 原形", "<em>If we had more staff, we would open on Sundays.<\/em>"], ["過去沒有發生：再退一格", "<em>had<\/em> + p.p.", "<em>would have<\/em> + p.p.", "<em>If we had hired more staff, we would have opened on Sundays.<\/em>"]]}, "ex": [{"en": "If we <u>hire<\/u> more staff, we <u>will open<\/u> on Sundays.", "zh": "如果我們多請一些人，星期天就會開門。", "note": "還沒決定，有可能。"}, {"en": "If we <u>had<\/u> more staff, we <u>would open<\/u> on Sundays.", "zh": "要是我們人手夠，星期天就會開門。", "note": "講現在：人手其實不夠。"}, {"en": "If we <u>had hired<\/u> more staff, we <u>would have opened<\/u> on Sundays.", "zh": "當初要是多請了人，星期天就會開門了。", "note": "講過去：當時沒請，所以沒開。"}], "quiz": [{"type": "choose", "q": "<em>If we had more time, we would test the app again.<\/em> 這句的 <em>had<\/em> 講的是什麼時候的事？", "options": ["過去：以前時間不夠", "現在：現在時間不夠"], "answer": 1, "why": "<em>if<\/em> 子句是過去式、主要子句是 <em>would<\/em> + 原形，這是「退一格」的現在假想。過去式在這裡表示「不是真的」，不表示過去時間。要講過去，會寫成 <em>If we had had more time, we would have tested …<\/em>。"}], "takeaway": "不是真的，就把兩半的動詞一起往過去退一格；退一格之後的過去式講的是現在。"}, {"h": "可能發生：if ＋現在式，主要子句用 will", "body": ["這一型不用退：說的人覺得事情可能發生。<em>if<\/em> 子句用現在式，主要子句用 <em>will<\/em>（或 <em>can<\/em>、<em>may<\/em>）加原形。", "規則和政策也常用 <em>if<\/em>：兩半都用現在式，說的是「只要……就會……」，每一次都這樣，不是某一次的事。<em>If an invoice is overdue, the system sends a reminder automatically.<\/em> 要說某一次、還沒發生的事，才用 <em>will<\/em>：<em>If the invoice is overdue next week, we will call the client.<\/em>", "門檻在 <em>if<\/em> 子句：就算講的是明天、下週，<em>if<\/em> 子句也用<b>現在式<\/b>，不用 <em>will<\/em>。寫 <em>If the shipment arrives tomorrow<\/em>，不寫 <em>If the shipment will arrive tomorrow<\/em>。未來的意思已經由主要子句的 <em>will<\/em> 和 <em>tomorrow<\/em> 表達了，<em>if<\/em> 子句不用再說一次。<em>when<\/em>、<em>before<\/em>、<em>as soon as<\/em> 帶頭的時間子句也一樣，未來用現在式。<em>if<\/em> 放在 <em>ask<\/em>、<em>know<\/em> 這類動詞後面、當「是不是」用時，不是條件子句，未來照用 <em>will<\/em>。兩點都見第 4 章第 8 節。", "主要子句也可以是請求或指示，商業書信常這樣寫：<em>If you have any questions, please contact Ms. Ward.<\/em>", "<em>if<\/em> 子句可以放前面，也可以放後面。放前面時，兩個子句中間加逗號；放後面時，通常不加：<em>We will start on Monday if the client signs today.<\/em>"], "ex": [{"en": "If the shipment <u>arrives<\/u> tomorrow, we <u>will process<\/u> it right away.", "zh": "如果貨明天到，我們會馬上處理。", "note": "講明天，<em>if<\/em> 子句還是用現在式 <em>arrives<\/em>。"}, {"en": "If you <u>have<\/u> any questions, please <u>contact<\/u> Ms. Ward.", "zh": "如果有任何問題，請聯絡 Ward 女士。"}, {"en": "We <u>can offer<\/u> a 10% discount if you <u>order<\/u> before May 1.", "zh": "如果您在五月一日前訂購，我們可以打九折。", "note": "<em>if<\/em> 子句在後面，中間不加逗號。"}, {"en": "If an invoice <u>is<\/u> overdue, the system <u>sends<\/u> a reminder automatically.", "zh": "只要帳款逾期，系統就會自動寄出催繳提醒。", "note": "規則：兩半都是現在式，不用 <em>will<\/em>。"}], "quiz": [{"type": "choose", "q": "下面哪一句是對的？", "options": ["If the client will approve the design tomorrow, we will start next week.", "If the client approves the design tomorrow, we will start next week.", "If the client approved the design tomorrow, we will start next week."], "answer": 1, "why": "<em>tomorrow<\/em> 是未來，主要子句用 <em>will<\/em>，表示這是有可能發生的條件。這時 <em>if<\/em> 子句用現在式 <em>approves<\/em>，不用 <em>will<\/em>（第一句）。過去式 <em>approved<\/em> 講的不是未來，不能配 <em>tomorrow<\/em> 和 <em>will<\/em>（第三句）。"}], "takeaway": "有可能發生的事，<em>if<\/em> 子句就算講未來也用現在式，<em>will<\/em> 只放在主要子句；講規則時兩半都用現在式。"}, {"h": "現在不是真的：if ＋過去式，would ＋原形", "body": ["講現在的事，但它不是真的：<em>if<\/em> 子句退一格用過去式，主要子句退一格用 <em>would<\/em> + 原形，也可以用 <em>could<\/em>（就能）、<em>might<\/em>（可能會）。", "<em>be<\/em> 動詞在這裡有一個特別的地方：<b>不管主詞是誰，一律用 <em>were<\/em><\/b>。<em>If I were<\/em>、<em>If she were<\/em>、<em>If the price were<\/em>。平常 <em>I<\/em> 和 <em>she<\/em> 的過去式是 <em>was<\/em>，但在假想的條件裡，<em>were<\/em> 是專門用來說「這不是真的」的形式。口語裡有人說 <em>If I was<\/em>，正式書面用 <em>were<\/em>。常聽到的 <em>If I were you<\/em>（如果我是你）就是這個用法。", "沒有一起退會怎樣？<em>If we have more staff, we would open on Sundays.<\/em> 前半的現在式說「有可能」，後半的 <em>would<\/em> 說「不是真的」，兩個訊號打架，讀的人不知道你到底有沒有人手。兩半要一起退。有一種常見的例外是客氣的口氣：<em>If you have any questions, I would be happy to help.<\/em> 這裡的 <em>would<\/em> 不是在假設，只是把話說得比 <em>will<\/em> 客氣。信裡的 <em>I would appreciate it if you could reply by Friday.<\/em> 也一樣：<em>if<\/em> 子句裡的 <em>could<\/em>（或 <em>would<\/em>）是在客氣地請求，不是在假設。", "這一型也用在<b>未來不太可能<\/b>的事：<em>If the vendor raised its prices, we would look for another supplier.<\/em> 供應商現在沒有漲價，說的人也不認為會漲，只是假設一下。對照有可能的條件：<em>If the vendor raises its prices, we will look for another supplier.<\/em> 這句表示漲價是有可能的。"], "ex": [{"en": "If we <u>had<\/u> a larger budget, we <u>would hire<\/u> two more designers.", "zh": "要是預算多一點，我們會再請兩位設計師。", "note": "<em>had<\/em> 講的是現在：預算現在不夠。"}, {"en": "If Ms. Kato <u>were<\/u> here, she <u>would know<\/u> the answer.", "zh": "要是 Kato 女士在這裡，她就會知道答案。", "note": "主詞是 <em>she<\/em>，還是用 <em>were<\/em>。"}, {"en": "If I <u>were<\/u> you, I <u>would ask<\/u> for a written quote.", "zh": "如果我是你，我會要求一份書面報價。"}, {"en": "If the vendor <u>raised<\/u> its prices, we <u>would look<\/u> for another supplier.", "zh": "萬一供應商漲價，我們會另找廠商。", "note": "說的人認為不太可能漲。"}], "quiz": [{"type": "choose", "q": "會議室其實很小。<em>If the meeting room ___ bigger, we would invite the whole team.<\/em> 空格填哪一個？", "options": ["is", "were", "will be"], "answer": 1, "why": "會議室其實很小，主要子句也是 <em>would<\/em>，所以是現在假想的條件。<em>if<\/em> 子句退一格用過去式，<em>be<\/em> 動詞一律用 <em>were<\/em>。"}], "takeaway": "現在不是真的：<em>if<\/em> + 過去式（<em>be<\/em> 用 <em>were<\/em>），主要子句 <em>would<\/em> + 原形。"}, {"h": "過去沒有發生：if ＋ had p.p.，would have p.p.", "body": ["事情已經過去，結果也知道了：<em>We did not know about the delay, so we did not change the schedule.<\/em> 現在回頭說「要是當時……就會……」，這是過去假想的條件。", "過去的事本來就用過去式，要表示假想就要再退一格：<em>if<\/em> 子句用 <em>had<\/em> + p.p.（過去完成式），主要子句用 <em>would have<\/em> + p.p.。<em>If we had known about the delay, we would have changed the schedule.<\/em> 主要子句也可以用 <em>could have<\/em>（本來就能）、<em>might have<\/em>（本來可能會）加 p.p.。", "讀的時候一樣要反過來：<em>had known<\/em> → 其實不知道；<em>would have changed<\/em> → 其實沒改。這種句子常帶著「可惜」或「還好」的語氣。", "兩個常見的錯。一是在過去假想的 <em>if<\/em> 子句裡也放 <em>would<\/em>（<em>If we would have known<\/em>）；<em>would<\/em> 只放在主要子句。二是 <em>would have<\/em> 後面忘了用 p.p.（<em>would have change<\/em>）；<em>would have<\/em> 後面一定是 p.p.：<em>changed<\/em>、<em>sent<\/em>、<em>written<\/em>。"], "ex": [{"en": "If we <u>had known<\/u> about the delay, we <u>would have changed<\/u> the schedule.", "zh": "要是早知道會延誤，我們就會改時程了。", "note": "事實：不知道，也沒改。"}, {"en": "If the courier <u>had left<\/u> earlier, the package <u>would have arrived<\/u> on time.", "zh": "要是快遞早一點出發，包裹就會準時到了。"}, {"en": "Mr. Silva <u>would have noticed<\/u> the error if he <u>had checked<\/u> the invoice.", "zh": "要是 Silva 先生有核對發票，他就會發現錯誤了。", "note": "<em>if<\/em> 子句在後面，中間不加逗號。"}], "quiz": [{"type": "choose", "q": "<em>If we had booked the hall in March, we would have saved $2,000.<\/em> 實際上發生了什麼？", "options": ["三月訂了場地，省了兩千元", "三月沒有訂場地，沒省到這兩千元", "還沒訂場地，打算三月再訂"], "answer": 1, "why": "<em>had booked<\/em> 和 <em>would have saved<\/em> 是過去假想的條件，事實和句子相反：三月沒訂，所以沒省到。"}], "takeaway": "過去沒發生的事：<em>if<\/em> + <em>had<\/em> + p.p.，主要子句 <em>would have<\/em> + p.p.；反過來讀就是事實。"}, {"h": "兩半時間不一樣的時候", "body": ["三種句型是最常見的組合，但兩半不一定講同一個時間。條件可能在過去，結果在現在：<em>If we had hired more staff last year, we would not be so busy now.<\/em> 去年沒多請人（過去假想：<em>had hired<\/em>），所以現在很忙（現在假想：<em>would<\/em> + 原形）。", "反過來也可以：條件是現在的狀態，結果在過去。<em>If we were better prepared, we would have won the contract.<\/em> 我們（一直以來）準備不足（現在假想：<em>were<\/em>），所以沒拿到合約（過去假想：<em>would have won<\/em>）。", "處理方法是<b>兩半各看各的時間<\/b>。講過去的那一半，用 <em>had<\/em> + p.p. 或 <em>would have<\/em> + p.p.；講現在的那一半，用過去式或 <em>would<\/em> + 原形。句子裡的 <em>now<\/em>、<em>today<\/em>、<em>last year<\/em> 是判斷的線索。", "這種句子不用另外背，前面「退一格」想通了，一半一半套進去就好。"], "ex": [{"en": "If we <u>had hired<\/u> more staff last year, we <u>would not be<\/u> so busy now.", "zh": "要是去年多請了人，我們現在就不會這麼忙。"}, {"en": "If Ms. Ruiz <u>had accepted<\/u> the offer, she <u>would be<\/u> our sales director today.", "zh": "要是 Ruiz 女士當初接受了這份工作，她今天就是我們的業務總監了。"}], "quiz": [{"type": "choose", "q": "<em>If the team had finished testing last week, the app ___ available in stores now.<\/em> 空格填哪一個？", "options": ["would be", "would have been", "will be"], "answer": 0, "why": "前半有 <em>last week<\/em>，是過去假想，用 <em>had finished<\/em>；後半有 <em>now<\/em>，是現在假想，用 <em>would<\/em> + 原形 <em>be<\/em>。"}], "takeaway": "兩半時間不同時各看各的：過去那半用 <em>had<\/em> p.p.／<em>would have<\/em> p.p.，現在那半用過去式／<em>would<\/em> + 原形。"}, {"h": "unless：大致等於 if … not", "body": ["<em>unless<\/em> 的意思是「除非」，大致等於 <em>if … not<\/em>。<em>Unless you register by Friday, you cannot attend.<\/em> = <em>If you do not register by Friday, you cannot attend.<\/em>", "因為 <em>unless<\/em> 裡面已經有 <em>not<\/em> 的意思，後面就<b>不要再放 <em>not<\/em><\/b>。<em>Unless you don't register<\/em> 等於「如果你沒有不報名」，意思反了。", "<em>unless<\/em> 是連接詞（第 8 章），後面接子句。它和有可能的條件用法一樣：講未來也用現在式，寫 <em>unless the client approves<\/em>，不寫 <em>will approve<\/em>。", "<em>unless<\/em> 說的是「照這樣進行，除非出現這個例外」。<em>We will ship the order on Monday unless the parts arrive late.<\/em> 零件沒晚到，就星期一出貨；零件晚到，就不一定是星期一。但 <em>unless<\/em> 不能完全取代 <em>if … not<\/em>：主要子句在說「這件事沒發生」會引起的反應（驚訝、失望）時，要用 <em>if … not<\/em>：<em>We will be surprised if the shipment does not arrive today.<\/em> 換成 <em>unless the shipment arrives today<\/em> 就不自然。"], "ex": [{"en": "<u>Unless<\/u> you register by Friday, you cannot attend the workshop.", "zh": "除非您在星期五前報名，否則不能參加工作坊。", "note": "= <em>If you do not register by Friday<\/em>"}, {"en": "We will ship the order on Monday <u>unless<\/u> the parts arrive late.", "zh": "除非零件晚到，否則我們星期一出貨。"}, {"en": "The contract is not valid <u>unless<\/u> both parties sign it.", "zh": "雙方都簽字，合約才有效。"}], "quiz": [{"type": "choose", "q": "<em>Unless the client approves the design, we cannot start.<\/em> 和哪一句意思一樣？", "options": ["If the client approves the design, we cannot start.", "If the client does not approve the design, we cannot start.", "If the client does not approve the design, we can start."], "answer": 1, "why": "<em>unless<\/em> = <em>if … not<\/em>。把 <em>unless<\/em> 換成 <em>if<\/em>，再在條件的動詞加上 <em>not<\/em>，主要子句不動。"}], "takeaway": "<em>unless<\/em> 大致等於 <em>if … not<\/em>，後面不要再加 <em>not<\/em>；講「沒發生會怎樣的反應」時用 <em>if … not<\/em>。"}, {"h": "倒裝：拿掉 if，把 Should、Had、Were 搬到主詞前面", "body": ["正式的書信和公告裡常看到這種句子：<em>Should you need assistance, please call the front desk.<\/em> 看起來像問句，但它不是：這一段結束在逗號，後面還接著一個主要子句。這是把 <em>if<\/em> 子句<b>倒裝<\/b>的結果。", "倒裝的做法是兩步：一、拿掉 <em>if<\/em>；二、把 <em>if<\/em> 子句裡的 <em>should<\/em>、<em>had<\/em> 或 <em>were<\/em> 搬到主詞前面。意思不變，只是語氣比較正式。能這樣做的只有這三個字。", "<b><em>Should<\/em><\/b>：來自 <em>If you should need help<\/em>（萬一你需要幫忙）。這裡的 <em>should<\/em> 是「萬一、如果碰巧」，說的人覺得有可能，但不一定。倒裝成 <em>Should you need help<\/em>，主詞後面接<b>原形<\/b>。另一半通常是請求（<em>please call<\/em>）或 <em>will<\/em>。這是有可能的條件，只是說法比較正式。", "<b><em>Had<\/em><\/b>：來自 <em>If we had known<\/em>。倒裝成 <em>Had we known<\/em>，主詞後面接 <b>p.p.<\/b>。另一半是 <em>would have<\/em> + p.p.。這是過去假想的條件。", "<b><em>Were<\/em><\/b>：來自 <em>If the price were lower<\/em>。倒裝成 <em>Were the price lower<\/em>。也常見 <em>were to<\/em> + 原形，表示不太可能的未來：<em>If the company were to move<\/em> → <em>Were the company to move<\/em>。另一半是 <em>would<\/em> + 原形。這是現在或未來假想的條件。", "倒裝之後不能再放 <em>if<\/em>：<em>If should you need help<\/em> 是錯的，<em>if<\/em> 和倒裝只能選一個。否定的時候，<em>not<\/em> 放在主詞後面：<em>Had we not received the payment, …<\/em>"], "table": {"head": ["原本的 <em>if<\/em> 子句", "倒裝", "主詞後面接", "另一半"], "rows": [["<em>If you should need help, …<\/em>", "<em>Should you need help, …<\/em>", "原形", "請求，或 <em>will<\/em> + 原形"], ["<em>If we had known, …<\/em>", "<em>Had we known, …<\/em>", "p.p.", "<em>would have<\/em> + p.p."], ["<em>If the price were lower, …<\/em>", "<em>Were the price lower, …<\/em>", "形容詞、名詞等", "<em>would<\/em> + 原形"], ["<em>If the firm were to expand, …<\/em>", "<em>Were the firm to expand, …<\/em>", "<em>to<\/em> + 原形", "<em>would<\/em> + 原形"]]}, "ex": [{"en": "<u>Should you need<\/u> assistance, please call the front desk.", "zh": "如需協助，請撥打櫃台電話。", "note": "= <em>If you should need assistance<\/em>"}, {"en": "<u>Had we known<\/u> about the strike, we would have shipped the order earlier.", "zh": "要是早知道會罷工，我們就會提早出貨了。", "note": "= <em>If we had known<\/em>"}, {"en": "<u>Were the price<\/u> lower, we would order 500 units.", "zh": "要是價格低一點，我們就會訂 500 個。", "note": "= <em>If the price were lower<\/em>"}, {"en": "<u>Were<\/u> the company <u>to move<\/u> its headquarters, many employees would need to relocate.", "zh": "假如公司搬遷總部，很多員工就得跟著搬家。", "note": "= <em>If the company were to move<\/em>"}, {"en": "<u>Had<\/u> the contractor <u>not finished<\/u> on time, the opening would have been delayed.", "zh": "要是承包商沒有準時完工，開幕就會延後了。", "note": "否定：<em>not<\/em> 放在主詞後面。"}], "quiz": [{"type": "choose", "q": "<em>___ you have any questions about the invoice, please contact Ms. Ward.<\/em> 空格填哪一個？", "options": ["Should", "Had", "Were"], "answer": 0, "why": "主詞後面是原形 <em>have<\/em>，另一半是請求 <em>please contact<\/em>，這是 <em>If you should have any questions<\/em> 的倒裝：<em>Should<\/em>。<em>Had<\/em> 後面要接 p.p.；<em>Were<\/em> 後面要接 <em>to<\/em> + 原形，或形容詞、名詞。"}], "takeaway": "倒裝就是拿掉 <em>if<\/em>，把 <em>should<\/em>、<em>had<\/em>、<em>were<\/em> 搬到主詞前面；意思不變，語氣更正式。"}, {"h": "看到倒裝，還原成 if 句", "body": ["句首是 <em>Should<\/em>、<em>Had<\/em>、<em>Were<\/em>，後面接主詞，而且這一段結束在逗號、後面還有一個主要子句，就是倒裝的條件。還原的方法是反過來做：前面加上 <em>if<\/em>，再把 <em>should<\/em>／<em>had<\/em>／<em>were<\/em> 放回主詞後面。", "還原之後，就回到前面學過的三型，看得出時間和真假。<em>Had the supplier lowered its prices<\/em> → <em>If the supplier had lowered its prices<\/em>：過去假想，事實是供應商沒有降價。", "要分清楚的是：句首的 <em>Had<\/em> 不是「有」的過去式，而是 <em>had<\/em> + p.p. 的那個 <em>had<\/em>，所以主詞後面一定跟著 p.p.。<em>Had we know<\/em> 是錯的，要寫 <em>Had we known<\/em>。同樣地，<em>Should<\/em> 後面一定是原形：<em>Should you needed<\/em> 是錯的。", "跟問句怎麼分？問句以問號結束，本身就是一整句：<em>Should we call the client?<\/em> 倒裝的條件只是半句，後面一定還有另一半：<em>Should we need more samples, we will call the client.<\/em>"], "ex": [{"en": "<u>Had<\/u> the supplier <u>lowered<\/u> its prices, we would have signed the contract.", "zh": "要是供應商降了價，我們就會簽約了。", "note": "→ <em>If the supplier had lowered its prices<\/em>：事實是沒降價。"}, {"en": "<u>Should<\/u> the shipment <u>be<\/u> delayed, we will notify you by email.", "zh": "萬一出貨延誤，我們會用電子郵件通知您。", "note": "→ <em>If the shipment should be delayed<\/em>：有可能，但不一定。"}, {"en": "<u>Were<\/u> Ms. Novak still with the company, she <u>would lead<\/u> this project.", "zh": "要是 Novak 女士還在公司，這個專案就會由她帶。", "note": "→ <em>If Ms. Novak were still with the company<\/em>：她已經離開了。"}], "quiz": [{"type": "choose", "q": "<em>Were the hotel closer to the airport, more guests would book it.<\/em> 還原成 <em>if<\/em> 句是哪一個？", "options": ["If the hotel is closer to the airport, …", "If the hotel were closer to the airport, …", "If the hotel had been closer to the airport, …"], "answer": 1, "why": "句首 <em>Were<\/em> + 主詞：把 <em>were<\/em> 放回主詞後面、加上 <em>if<\/em>，得到 <em>If the hotel were closer<\/em>。這是現在假想：飯店其實離機場不近。"}, {"type": "choose", "q": "<em>Had the team tested the software, the launch would have gone smoothly.<\/em> 實際上發生了什麼？", "options": ["團隊測試了軟體，上市很順利", "團隊沒有測試軟體，上市不順利", "團隊之後會測試軟體"], "answer": 1, "why": "<em>Had the team tested<\/em> = <em>If the team had tested<\/em>，是過去假想的條件。事實和句子相反：沒有測試，上市也不順利。"}], "takeaway": "句首 <em>Should<\/em>／<em>Had<\/em>／<em>Were<\/em> + 主詞、後面還有半句，就加回 <em>if<\/em>、把那個字放回主詞後面再讀。"}], "mistakes": [{"wrong": "If the client will approve the plan, we will start next week.", "right": "If the client approves the plan, we will start next week.", "why": "可能發生的條件，<em>if<\/em> 子句講未來也用現在式，<em>will<\/em> 只放在主要子句。"}, {"wrong": "If we would have known about the delay, we would have changed the schedule.", "right": "If we had known about the delay, we would have changed the schedule.", "why": "過去假想的 <em>if<\/em> 子句不放 <em>would<\/em>，<em>would<\/em> 只放在主要子句。這種 <em>if<\/em> 子句用 <em>had<\/em> + p.p.。"}, {"wrong": "Had we know about the strike, we would have shipped the order earlier.", "right": "Had we known about the strike, we would have shipped the order earlier.", "why": "句首的 <em>Had<\/em> 是 <em>had<\/em> + p.p. 的倒裝，主詞後面要接 p.p. <em>known<\/em>。"}, {"wrong": "Should you needed help, please call the front desk.", "right": "Should you need help, please call the front desk.", "why": "<em>Should<\/em> 後面的動詞用原形。"}, {"wrong": "Unless you don't register by Friday, you cannot attend.", "right": "Unless you register by Friday, you cannot attend.", "why": "<em>unless<\/em> 已經是 <em>if … not<\/em>，再加 <em>don't<\/em> 意思就反了。"}], "workbook": ["conditional"]}, {"id": "pronoun", "n": 11, "title": "代名詞", "en": "Pronouns", "lead": "代名詞代替前面已經出現過的名詞，讓句子不必一直重複。同一個代名詞會隨位置變形：<em>they<\/em>、<em>them<\/em>、<em>their<\/em>、<em>theirs<\/em>、<em>themselves<\/em>。這一章教你依照位置選對形式，確認它和代替的名詞單複數一致、讀的人找得到它指誰，最後講 <em>one<\/em>／<em>ones<\/em>、<em>those who<\/em> 和 <em>each other<\/em>。", "check": [{"type": "choose", "q": "<em>Please send the updated schedule to Mr. Okafor and ___.<\/em> 空格填哪一個？", "options": ["I", "me", "myself"], "answer": 1, "why": "先把 <em>Mr. Okafor and<\/em> 拿掉：<em>send the schedule to ___<\/em>。介系詞 <em>to<\/em> 後面要用受詞的形式（受格）<em>me<\/em>。<em>myself<\/em> 只在主詞也是「我」的時候用。"}, {"type": "choose", "q": "<em>The company will announce ___ new CEO on Monday.<\/em> 空格填哪一個？", "options": ["it's", "its", "it"], "answer": 1, "why": "空格後面接名詞 <em>new CEO<\/em>，要的是所有格「它的」：<em>its<\/em>。<em>it's<\/em> 是 <em>it is<\/em> 的縮寫。"}, {"type": "choose", "q": "<em>The interns organized the welcome party by ___.<\/em> 空格填哪一個？", "options": ["them", "their", "themselves"], "answer": 2, "why": "<em>by<\/em> + 反身代名詞表示「自己來、沒有別人幫忙」。主詞是 <em>the interns<\/em>，所以是 <em>themselves<\/em>。"}, {"type": "tap", "q": "點出 <em>it<\/em> 代替的那個名詞（一個字）。", "sentence": "The price of the new laptops has gone up, so we will wait until it drops.", "answer": [1], "why": "<em>it<\/em> 是單數，要找單數名詞；<em>laptops<\/em> 是複數，不會用 <em>it<\/em>。會「降下來」的是價格 <em>price<\/em>。"}, {"type": "choose", "q": "<em>Our old chairs were uncomfortable, so we bought new ___.<\/em> 空格填哪一個？", "options": ["one", "ones", "them"], "answer": 1, "why": "新買的不是舊的那些椅子本身，而是同一種東西的另外幾張。代替複數的可數名詞 <em>chairs<\/em>，前面又有形容詞 <em>new<\/em>，用 <em>ones<\/em>。"}], "sections": [{"h": "同一個代名詞，五種樣子", "body": ["代名詞（第 1 章）代替前面出現過的名詞。<em>Ms. Diaz called. She wants the new price list.<\/em> 第二句的 <em>She<\/em> 就是 <em>Ms. Diaz<\/em>。沒有代名詞，就得一直重複名字，又長又不自然。", "中文的「他」不管放在哪裡都是「他」：他打電話來、我打給他、他的報告。英文不一樣，同一個人會依照<b>在句子裡的位置<\/b>換樣子。以 <em>they<\/em> 為例：當主詞是 <em>they<\/em>；當受詞是 <em>them<\/em>；放在名詞前面表示「他們的」是 <em>their<\/em>；單獨使用、表示「他們的東西」是 <em>theirs<\/em>；主詞和受詞是同一批人時是 <em>themselves<\/em>。", "這一章把這五種分別叫做主格、受格、所有格、所有代名詞、反身代名詞。名稱不重要，重要的是每一種放在哪個位置，下一節講。"], "table": {"head": ["主格：當主詞", "受格：當受詞", "所有格：後面接名詞", "所有代名詞：單獨用", "反身代名詞"], "rows": [["<em>I<\/em>", "<em>me<\/em>", "<em>my<\/em>", "<em>mine<\/em>", "<em>myself<\/em>"], ["<em>you<\/em>", "<em>you<\/em>", "<em>your<\/em>", "<em>yours<\/em>", "<em>yourself<\/em>／<em>yourselves<\/em>"], ["<em>he<\/em>", "<em>him<\/em>", "<em>his<\/em>", "<em>his<\/em>", "<em>himself<\/em>"], ["<em>she<\/em>", "<em>her<\/em>", "<em>her<\/em>", "<em>hers<\/em>", "<em>herself<\/em>"], ["<em>it<\/em>", "<em>it<\/em>", "<em>its<\/em>", "（沒有這個形式）", "<em>itself<\/em>"], ["<em>we<\/em>", "<em>us<\/em>", "<em>our<\/em>", "<em>ours<\/em>", "<em>ourselves<\/em>"], ["<em>they<\/em>", "<em>them<\/em>", "<em>their<\/em>", "<em>theirs<\/em>", "<em>themselves<\/em>"]]}, "ex": [{"en": "<u>They<\/u> will present the new design on Friday.", "zh": "他們星期五會發表新設計。", "note": "主詞位置：<em>they<\/em>。"}, {"en": "The client wants to meet <u>them<\/u> before Friday.", "zh": "客戶想在星期五前跟他們見面。", "note": "動詞 <em>meet<\/em> 後面：<em>them<\/em>。"}, {"en": "<u>Their<\/u> design is simpler than <u>ours<\/u>.", "zh": "他們的設計比我們的簡單。", "note": "名詞前面：<em>their<\/em>；單獨用：<em>ours<\/em> = <em>our design<\/em>。"}], "takeaway": "英文的代名詞看位置變形：主詞、受詞、名詞前面、單獨用、指回自己，各有一個樣子。"}, {"h": "看位置選：主詞、受詞、名詞前面、單獨用", "body": ["選代名詞的方法是看它所在的位置。在動詞前面當主詞，用主格（<em>she<\/em>、<em>they<\/em>）。在動詞或介系詞後面當受詞，用受格（<em>her<\/em>、<em>them<\/em>）：<em>contact her<\/em>、<em>with them<\/em>。", "後面接一個名詞、表示「誰的」，用所有格：<em>their office<\/em>、<em>her report<\/em>，中間有形容詞也一樣（<em>her annual report<\/em>）。後面<b>沒有<\/b>名詞、自己就代表「誰的東西」，用所有代名詞：<em>The parking space by the door is hers.<\/em>（= <em>her parking space<\/em>）。所以 <em>their<\/em> 和 <em>theirs<\/em> 的差別，只看後面有沒有名詞。", "<em>her<\/em> 一個字有兩種身份，受格和所有格長得一樣，要看後面。<em>We met her yesterday<\/em>：後面沒有名詞，是受格。<em>We read her report<\/em>：後面有名詞 <em>report<\/em>，是所有格。", "兩個人用 <em>and<\/em> 連在一起時最容易錯：<em>Ms. Diaz and me will lead the workshop<\/em>，還是 <em>Ms. Diaz and I<\/em>？方法是<b>先拿掉另一個人<\/b>：<em>me will lead<\/em> 明顯不對，<em>I will lead<\/em> 才對，所以是 <em>Ms. Diaz and I<\/em>。反過來，<em>Please send it to Mr. Lee and I<\/em>：拿掉 <em>Mr. Lee and<\/em>，剩 <em>send it to I<\/em>，不對，要寫 <em>to Mr. Lee and me<\/em>。", "<em>than<\/em>、<em>as<\/em> 後面的代名詞，要把省略的動詞補回來再選格。<em>Ms. Diaz has worked here longer than I have.<\/em> 補上的 <em>have<\/em> 需要主詞，所以用主格 <em>I<\/em>。口語裡常聽到 <em>longer than me<\/em>；正式書面用 <em>than I<\/em>，最穩當的是把動詞寫出來：<em>than I have<\/em>。<em>The new hire is as experienced as she is.<\/em> 也是同樣的道理。"], "ex": [{"en": "Please contact <u>her<\/u> before the meeting.", "zh": "請在會議前聯絡她。", "note": "動詞 <em>contact<\/em> 後面：受格。"}, {"en": "We reviewed <u>her<\/u> report this morning.", "zh": "我們今天早上看了她的報告。", "note": "後面有名詞 <em>report<\/em>：所有格。"}, {"en": "The parking space by the door is <u>hers<\/u>.", "zh": "門口旁邊那個車位是她的。", "note": "後面沒有名詞：所有代名詞。"}, {"en": "Ms. Diaz and <u>I<\/u> will lead the workshop.", "zh": "Diaz 女士和我會主持工作坊。", "note": "拿掉 <em>Ms. Diaz and<\/em>：<em>I will lead<\/em>。"}, {"en": "Please send the agenda to Mr. Lee and <u>me<\/u>.", "zh": "請把議程寄給 Lee 先生和我。", "note": "拿掉 <em>Mr. Lee and<\/em>：<em>send the agenda to me<\/em>。"}], "quiz": [{"type": "choose", "q": "<em>The two consultants sent a proposal too. Ours was cheaper, but the client chose ___.<\/em> 空格填哪一個？", "options": ["their", "theirs", "they"], "answer": 1, "why": "空格在動詞 <em>chose<\/em> 後面，後面沒有名詞，意思是「那兩位顧問的（提案）」，用所有代名詞 <em>theirs<\/em>。<em>their<\/em> 後面一定要接名詞；<em>they<\/em> 是主格，不能放在動詞後面。"}, {"type": "choose", "q": "<em>Mr. Lee types faster than ___ do.<\/em> 空格填哪一個？", "options": ["I", "me", "myself"], "answer": 0, "why": "空格後面有動詞 <em>do<\/em>，<em>do<\/em> 需要一個主詞，所以用主格 <em>I<\/em>：<em>than I do<\/em>。<em>me<\/em> 是受格，不能當 <em>do<\/em> 的主詞；<em>myself<\/em> 不能當主詞。"}], "takeaway": "後面有名詞用 <em>their<\/em>，沒有名詞用 <em>theirs<\/em>；兩個人連在一起時先拿掉另一個人，<em>than<\/em>／<em>as<\/em> 後面先補回動詞，再判斷。"}, {"h": "its、theirs 不加撇號", "body": ["英文名詞表示「誰的」要加 <em>'s<\/em>：<em>the company's website<\/em>。但代名詞的所有格和所有代名詞<b>都不加撇號<\/b>：<em>its<\/em>、<em>yours<\/em>、<em>ours<\/em>、<em>theirs<\/em>、<em>hers<\/em>。", "最容易搞混的是 <em>its<\/em> 和 <em>it's<\/em>。<em>it's<\/em> 是 <em>it is<\/em> 或 <em>it has<\/em> 的縮寫：<em>It's late.<\/em>、<em>It's been a long week.<\/em> 判斷方法：把它換成 <em>it is<\/em> 或 <em>it has<\/em> 唸一次，有一個通順，就是 <em>it's<\/em>；兩個都不通，就是 <em>its<\/em>。<em>The hotel has renovated it is lobby<\/em> 不通，<em>it has lobby<\/em> 也不通，所以是 <em>its lobby<\/em>。", "同樣的配對還有 <em>their<\/em>／<em>they're<\/em>（= <em>they are<\/em>）、<em>your<\/em>／<em>you're<\/em>（= <em>you are<\/em>），以及第 9 章的 <em>whose<\/em>／<em>who's<\/em>。這幾組裡，帶撇號的都是縮寫，不是所有格；名詞的 <em>'s<\/em>（<em>the company's website<\/em>）才是所有格。"], "ex": [{"en": "The hotel has renovated <u>its<\/u> lobby.", "zh": "飯店重新裝修了大廳。", "note": "<em>its<\/em> = 它的。"}, {"en": "<u>It's<\/u> been a busy quarter for the sales team.", "zh": "這一季業務團隊很忙。", "note": "<em>It's<\/em> = <em>It has<\/em>。"}, {"en": "<u>They're<\/u> reviewing <u>their<\/u> budget this week.", "zh": "他們這週在檢討自己的預算。", "note": "<em>They're<\/em> = <em>They are<\/em>；<em>their<\/em> + 名詞。"}], "quiz": [{"type": "choose", "q": "下面哪一句是對的？", "options": ["The printer has lost it's connection to the network.", "The printer has lost its connection to the network."], "answer": 1, "why": "把 <em>it's<\/em> 換成 <em>it is<\/em> 或 <em>it has<\/em>：<em>lost it is connection<\/em>、<em>lost it has connection<\/em> 都不通。這裡要的是「它的連線」，所有格 <em>its<\/em>，不加撇號。"}], "takeaway": "代名詞的所有格和所有代名詞都不加撇號；有撇號的 <em>it's<\/em> 是 <em>it is<\/em> 或 <em>it has<\/em>。"}, {"h": "反身代名詞：主詞和受詞是同一個人", "body": ["<em>-self<\/em>／<em>-selves<\/em> 結尾的叫反身代名詞。第一個用法：主詞和受詞是<b>同一個人<\/b>時，受詞用反身代名詞。<em>Mr. Cho introduced himself to the team.<\/em> 做介紹的人和被介紹的人都是 Cho 先生。", "對照：<em>Mr. Cho introduced him to the team.<\/em> 這句的 <em>him<\/em> 是另一個男人，例如一位新同事。所以反身代名詞不是可有可無：用錯，意思就換了人。", "第二個用法是強調「本人親自」，放在句尾或名詞後面，拿掉之後句子仍然完整：<em>The CEO answered the questions herself.<\/em>（執行長親自回答）。第三個是 <em>by<\/em> + 反身代名詞，意思是「獨自、沒有別人幫忙」：<em>The interns organized the event by themselves.<\/em>", "反身代名詞<b>不能自己當主詞<\/b>，也不能在主詞是別人的時候拿來代替 <em>me<\/em>。<em>Please contact myself<\/em> 是錯的：這句的主詞是省略掉的 <em>you<\/em>，不是我，所以要用 <em>contact me<\/em>。兩個人連在一起時也一樣：<em>Please send the agenda to Mr. Lee and myself<\/em> 是錯的，主詞同樣是省略掉的 <em>you<\/em>，要寫 <em>to Mr. Lee and me<\/em>。<em>myself<\/em> 聽起來比較正式，但在這些位置是錯的，正式書面用 <em>me<\/em>。"], "ex": [{"en": "Mr. Cho introduced <u>himself<\/u> to the team.", "zh": "Cho 先生向團隊自我介紹。", "note": "主詞和受詞是同一人。"}, {"en": "Mr. Cho introduced <u>him<\/u> to the team.", "zh": "Cho 先生把他（另一個人）介紹給團隊。"}, {"en": "The CEO answered the questions <u>herself<\/u>.", "zh": "執行長親自回答了問題。"}, {"en": "The interns organized the welcome event <u>by themselves<\/u>.", "zh": "實習生們自己辦了迎新活動。"}, {"en": "If you have any questions, please contact <u>me<\/u>.", "zh": "如果有任何問題，請跟我聯絡。", "note": "不寫 <em>contact myself<\/em>。"}], "quiz": [{"type": "choose", "q": "<em>Before the interview, Ms. Banda prepared ___ by reading the company's annual report.<\/em> 空格填哪一個？", "options": ["her", "herself", "hers"], "answer": 1, "why": "做準備的人和被準備的人都是 Banda 女士，主詞和受詞同一人，用反身代名詞 <em>herself<\/em>。用 <em>her<\/em> 會變成她幫另一位女性做準備。"}], "takeaway": "當受詞時，主詞和受詞是同一個人才用 <em>-self<\/em>；不是同一個人，用一般的受格。<em>-self<\/em> 也可以放在句尾，強調「本人親自」。"}, {"h": "代名詞要跟它代替的名詞一致", "body": ["代名詞要和它代替的名詞在兩件事上一致：<b>單複數<\/b>，以及<b>人還是事物<\/b>。代替一個人，用 <em>he<\/em>／<em>she<\/em>；代替一件事物，用 <em>it<\/em>；代替兩個以上，不管是人是物，都用 <em>they<\/em>。", "代替 <em>each employee<\/em>、<em>everyone<\/em>、<em>someone<\/em> 這種不指定性別的單數時，書面英文有兩種寫法：<em>his or her<\/em>（比較保守），或 <em>their<\/em>（現代英文愈來愈常見，但比較保守的公文仍用 <em>his or her<\/em>）。最不會出問題的做法，是把句子改成複數：<em>All employees must submit their timesheets by Friday.<\/em>", "公司、飯店、部門是一個單位，美式英文用 <em>it<\/em> 和 <em>its<\/em>：<em>Brightline Foods has moved its headquarters.<\/em> 雖然公司裡有很多人，還是 <em>its<\/em>。英式英文有時用 <em>they<\/em>，但用 <em>it<\/em> 在兩邊都對。", "名詞後面跟著片語時，要找的是中心名詞（第 2 章），不是離代名詞最近的那個字。<em>The list of new clients is ready; please send it to Mr. Abe.<\/em> 要寄出去的是名單（<em>list<\/em>，單數），所以用 <em>it<\/em>；<em>clients<\/em> 只是名單的內容。這和找主詞的方法一樣（第 7 章）。", "不一致會怎樣？<em>We received the samples and sent it to the lab.<\/em> 讀的人會往前找一個單數的東西，找不到，只好猜。代名詞的單複數，就是讀者往回找的線索。"], "ex": [{"en": "Brightline Foods has moved <u>its<\/u> headquarters to the north side of the city.", "zh": "Brightline 食品把總部搬到了城北。", "note": "公司是一個單位：<em>its<\/em>。"}, {"en": "We received the samples and sent <u>them<\/u> to the lab.", "zh": "我們收到樣品，並把樣品送去實驗室。", "note": "<em>samples<\/em> 是複數：<em>them<\/em>。"}, {"en": "The list of new clients is ready; please send <u>it<\/u> to Mr. Abe.", "zh": "新客戶名單好了，請寄給 Abe 先生。", "note": "代替的是 <em>list<\/em>，不是 <em>clients<\/em>。"}, {"en": "<u>All employees<\/u> must submit <u>their<\/u> timesheets by Friday.", "zh": "所有員工都必須在星期五前交工時表。", "note": "原本是 <em>Each employee must submit his or her timesheet<\/em>；改成複數，用 <em>their<\/em> 就沒有爭議。"}], "quiz": [{"type": "choose", "q": "<em>Ms. Novak ordered three monitors, but only one of ___ works.<\/em> 空格填哪一個？", "options": ["it", "them", "they"], "answer": 1, "why": "代替的是 <em>three monitors<\/em>，複數；又在介系詞 <em>of<\/em> 後面，要用受格，所以是 <em>them<\/em>。"}], "takeaway": "代名詞跟著它代替的名詞走：一個用 <em>it<\/em>、<em>he<\/em>、<em>she<\/em>，兩個以上用 <em>they<\/em>，公司用 <em>it<\/em>。"}, {"h": "閱讀時：往前找 it 和 they 指誰", "body": ["閱讀時看到 <em>it<\/em>、<em>they<\/em>，要往前找它代替的名詞。找的時候有兩個條件：一、單複數對得上；二、意思放得進去。", "<em>The new printers arrived on Monday. They were installed on Tuesday.<\/em> <em>They<\/em> 是複數，往前找到的複數名詞是 <em>printers<\/em>，放進去也通：印表機被安裝。", "有時候前面有兩個以上的候選。<em>Our supplier sent a new contract, but it contains several errors.<\/em> <em>it<\/em> 是單數，<em>supplier<\/em> 和 <em>contract<\/em> 都是單數，但「內容有錯誤」的只能是合約，所以 <em>it<\/em> = <em>contract<\/em>。先用單複數篩，再用意思決定。", "寫的時候反過來想：如果兩個候選都說得通，讀者可能會猜錯，這時就直接把名詞寫出來，不要用代名詞。"], "ex": [{"en": "The new printers arrived on Monday. <u>They<\/u> were installed on Tuesday.", "zh": "新印表機星期一到，星期二安裝好了。", "note": "<em>They<\/em> = <em>the new printers<\/em>。"}, {"en": "Our supplier sent a new contract, but <u>it<\/u> contains several errors.", "zh": "供應商寄來新合約，但裡面有好幾個錯誤。", "note": "<em>it<\/em> = <em>the contract<\/em>；供應商不會「包含錯誤」。"}], "quiz": [{"type": "tap", "q": "點出 <em>they<\/em> 代替的那個名詞（一個字）。", "sentence": "The hotel sent us two quotes for the banquet, but they were both over budget.", "answer": [5], "why": "<em>they<\/em> 是複數。前面的名詞裡只有 <em>quotes<\/em> 是複數，放進去也通：兩份報價都超出預算。<em>hotel<\/em> 和 <em>banquet<\/em> 是單數。"}], "takeaway": "往前找代名詞指誰：先用單複數篩，再用意思確認。"}, {"h": "one 和 ones：同一種東西裡的一個", "body": ["<em>it<\/em> 代替的是<b>同一個<\/b>東西；<em>one<\/em> 代替的是同一種東西裡的<b>一個<\/b>，不是前面講的那一個本身。<em>I lost my badge, so I need a new one.<\/em> 新的那張不是弄丟的那張，而是同一種東西（識別證）的另一張，所以用 <em>one<\/em>。如果說 <em>I need it<\/em>，意思就變成需要弄丟的那一張本身。", "複數用 <em>ones<\/em>：<em>These folders are too small. Do you have bigger ones?<\/em> 前面常有形容詞或 <em>the<\/em>、<em>this<\/em>、<em>which<\/em>：<em>the red one<\/em>、<em>the newer ones<\/em>、<em>Which one do you prefer?<\/em>", "<em>one<\/em>／<em>ones<\/em> 只能代替<b>可數<\/b>名詞。<em>information<\/em>、<em>equipment<\/em>、<em>advice<\/em> 這類不可數名詞（第 13 章）不能用 <em>one<\/em>，要重複名詞或改用 <em>some<\/em>。"], "ex": [{"en": "I lost my badge, so I need a new <u>one<\/u>.", "zh": "我的識別證弄丟了，需要一張新的。", "note": "<em>one<\/em> = 另一張識別證。"}, {"en": "These folders are too small. Do you have bigger <u>ones<\/u>?", "zh": "這些資料夾太小了，有大一點的嗎？"}, {"en": "Of the two laptops, I prefer the lighter <u>one<\/u>.", "zh": "這兩台筆電中，我比較喜歡輕的那台。"}], "quiz": [{"type": "choose", "q": "<em>The projector in Room A is broken. Please use the ___ in Room B.<\/em> 空格填哪一個？", "options": ["it", "one", "ones"], "answer": 1, "why": "Room B 的投影機是另一台，同一種東西裡的一個，用 <em>one<\/em>。<em>it<\/em> 會是壞掉的那台本身，而且前面不能加 <em>the<\/em>；<em>ones<\/em> 是複數。"}], "takeaway": "<em>it<\/em> 是同一個，<em>one<\/em> 是同一種東西裡的一個；複數用 <em>ones<\/em>，只代替可數名詞。"}, {"h": "those who：……的那些人", "body": ["<em>those who<\/em> 的意思是「……的那些人」，泛指符合某個條件的人，不必先說出是哪個名詞：<em>Those who completed the survey will receive a meal voucher.<\/em> 填完問卷的人會拿到餐券。", "<em>who completed the survey<\/em> 是關係子句（第 9 章），說明 <em>those<\/em>。<em>those<\/em> 是複數，所以子句裡的動詞和主要動詞都要配複數：<em>Those who work night shifts get an extra day off.<\/em>，是 <em>work<\/em> 和 <em>get<\/em>，不是 <em>works<\/em> 和 <em>gets<\/em>。", "不能說 <em>them who<\/em> 或 <em>they who<\/em>。想用名詞開頭，可以說 <em>people who<\/em>、<em>employees who<\/em>（也是複數）；要說單數，用 <em>anyone who<\/em>，配單數動詞：<em>Anyone who needs a parking pass …<\/em>", "<em>those<\/em> 也可以代替前面出現過的複數名詞，常用在比較：<em>Our delivery times are shorter than those of most courier companies.<\/em>（<em>those<\/em> = <em>the delivery times<\/em>）。第 12 章會再用到。"], "ex": [{"en": "<u>Those who<\/u> completed the survey will receive a meal voucher.", "zh": "填完問卷的人會收到一張餐券。"}, {"en": "<u>Those who<\/u> work night shifts get an extra day off each month.", "zh": "上夜班的人每個月多休一天。", "note": "<em>those<\/em> 是複數：<em>work<\/em>、<em>get<\/em> 都用複數形。"}, {"en": "<u>Anyone who<\/u> needs a parking pass should contact the front desk.", "zh": "需要停車證的人請洽櫃台。", "note": "<em>anyone<\/em> 是單數：<em>needs<\/em>。"}, {"en": "Our delivery times are shorter than <u>those<\/u> of most courier companies.", "zh": "我們的送貨時間比大部分快遞公司短。", "note": "<em>those<\/em> = <em>the delivery times<\/em>。"}], "quiz": [{"type": "choose", "q": "<em>Those who ___ the training will get a certificate.<\/em> 空格填哪一個？", "options": ["completes", "complete"], "answer": 1, "why": "<em>who<\/em> 代替 <em>those<\/em>，是複數，子句裡的動詞要用複數形 <em>complete<\/em>。"}], "takeaway": "<em>those who<\/em> 是「……的那些人」，複數，子句裡的動詞也用複數。"}, {"h": "each other 和 themselves：互相，還是自己", "body": ["<em>each other<\/em>（也可以說 <em>one another<\/em>）表示<b>互相<\/b>：A 對 B 做，B 也對 A 做。<em>Ms. Ito and Mr. Sandoval have known each other for ten years.<\/em> Ito 女士認識 Sandoval 先生，Sandoval 先生也認識 Ito 女士。", "對照 <em>themselves<\/em>：<em>The two managers congratulated themselves.<\/em> 是各自恭喜自己；<em>The two managers congratulated each other.<\/em> 是彼此恭喜對方。一個指回自己，一個指向對方，意思不同。", "<em>each other<\/em> 只能當受詞，放在動詞或介系詞後面：<em>talk to each other<\/em>、<em>help each other<\/em>，不能當主詞。所有格是 <em>each other's<\/em>：<em>review each other's reports<\/em>。", "<em>each other<\/em> 和 <em>one another<\/em> 在現代英文裡意思一樣，兩個人或更多人都可以用。"], "ex": [{"en": "Ms. Ito and Mr. Sandoval have known <u>each other<\/u> for ten years.", "zh": "Ito 女士和 Sandoval 先生認識十年了。"}, {"en": "The two managers congratulated <u>each other<\/u> after the launch.", "zh": "產品上市後，兩位經理互相道賀。"}, {"en": "Team members review <u>each other's<\/u> reports before submitting them.", "zh": "團隊成員在提交前會互相檢查報告。"}], "quiz": [{"type": "choose", "q": "<em>The two sales teams compete with ___ for the same clients every quarter.<\/em> 空格填哪一個？", "options": ["themselves", "each other"], "answer": 1, "why": "競爭是兩隊之間的事：A 隊和 B 隊比，B 隊也和 A 隊比，是互相的，用 <em>each other<\/em>。<em>themselves<\/em> 會變成各隊跟自己比。"}], "takeaway": "<em>each other<\/em> 是互相，<em>-selves<\/em> 是指回自己。"}], "mistakes": [{"wrong": "Please contact myself if you have any questions.", "right": "Please contact me if you have any questions.", "why": "主詞是省略掉的 <em>you<\/em>，不是我，受詞用一般的受格 <em>me<\/em>。"}, {"wrong": "The hotel has renovated it's lobby.", "right": "The hotel has renovated its lobby.", "why": "所有格是 <em>its<\/em>，不加撇號；<em>it's<\/em> 是 <em>it is<\/em>。"}, {"wrong": "Ms. Diaz and me will lead the workshop.", "right": "Ms. Diaz and I will lead the workshop.", "why": "拿掉 <em>Ms. Diaz and<\/em>，剩下的字在主詞位置，要用主格 <em>I<\/em>。"}, {"wrong": "Those who wishes to attend should register by Friday.", "right": "Those who wish to attend should register by Friday.", "why": "<em>those<\/em> 是複數，子句裡的動詞用 <em>wish<\/em>。"}, {"wrong": "Ms. Ito and Mr. Sandoval have known themselves for ten years.", "right": "Ms. Ito and Mr. Sandoval have known each other for ten years.", "why": "認識是互相的，用 <em>each other<\/em>；<em>themselves<\/em> 是各自指回自己。"}], "workbook": ["pronoun"]}, {"id": "compare", "n": 12, "title": "比較", "en": "Comparisons", "lead": "比較的句子把兩樣以上的東西放在一起：一樣大、比較大、最大。英文用形容詞和副詞（第 1 章）的三種形式來表示，而且每一種都有固定的搭檔：<em>than<\/em>、<em>as … as<\/em>、<em>the …<\/em> 加範圍。這一章先教怎麼變形，再教每一種形式跟誰搭配，最後是加強比較級的字、「越……越……」和最高級。", "check": [{"type": "choose", "q": "<em>Our response times are shorter than ___ of most competitors.<\/em> 空格填哪一個？", "options": ["those", "that", "them"], "answer": 0, "why": "比的是「我們的回覆時間」和「大多數競爭對手的回覆時間」，兩邊要同一類。<em>times<\/em> 是複數，用 <em>those<\/em> 代替 <em>the response times<\/em>；單數才用 <em>that<\/em>。"}, {"type": "choose", "q": "<em>This hotel is ___ than the one we stayed at last year.<\/em> 空格填哪一個？", "options": ["more cheaper", "cheaper", "most cheap"], "answer": 1, "why": "<em>cheap<\/em> 是一個音節的短字，加 <em>-er<\/em>。<em>-er<\/em> 和 <em>more<\/em> 只能選一個，不能一起用。"}, {"type": "choose", "q": "<em>Our new office is as ___ as the old one.<\/em> 空格填哪一個？", "options": ["large", "larger", "largest"], "answer": 0, "why": "兩個 <em>as<\/em> 中間放原級，表示「一樣大」。"}, {"type": "choose", "q": "<em>This is ___ order we have ever received.<\/em> 空格填哪一個？", "options": ["the larger", "the largest", "larger than"], "answer": 1, "why": "從「我們收過的所有訂單」裡挑出最大的那一筆，是最高級 <em>the largest<\/em>。<em>we have ever received<\/em> 是最高級常見的範圍說法。"}, {"type": "choose", "q": "<em>The new model is ___ lighter than the old one.<\/em> 空格填哪一個？", "options": ["very", "much", "most"], "answer": 1, "why": "比較級前面要加強，用 <em>much<\/em>、<em>far<\/em>、<em>even<\/em>。<em>very<\/em> 修飾的是原級（<em>very light<\/em>），不放在比較級前面。"}], "sections": [{"h": "三個級別：原級、比較級、最高級", "body": ["形容詞和副詞有三種樣子。<em>fast<\/em> 是<b>原級<\/b>，就是字典裡的樣子；<em>faster<\/em> 是<b>比較級<\/b>，兩樣東西比，其中一個比較快；<em>fastest<\/em> 是<b>最高級<\/b>，三樣以上的一群裡面最快的那個。", "選哪一級，看比的對象有幾個、怎麼比。說兩樣東西一樣，用原級（<em>as fast as<\/em>）；兩樣東西比出高下，用比較級（<em>faster than<\/em>）；從一群裡挑出第一名，用最高級（<em>the fastest in the company<\/em>）。", "中文的「比較」「最」是另外加上去的字，形容詞本身不變；英文則是形容詞本身變形，而且每一級都有固定的搭檔。在句子裡，搭檔（<em>than<\/em>、<em>as<\/em>、<em>the<\/em>、<em>in<\/em>、<em>of<\/em>）往往比形容詞本身更容易看見，所以後面幾節會一個一個講搭檔。"], "table": {"head": ["原級", "比較級", "最高級"], "rows": [["<em>fast<\/em>", "<em>faster<\/em>", "<em>fastest<\/em>"], ["<em>cheap<\/em>", "<em>cheaper<\/em>", "<em>cheapest<\/em>"], ["<em>expensive<\/em>", "<em>more expensive<\/em>", "<em>most expensive<\/em>"], ["<em>good<\/em>", "<em>better<\/em>", "<em>best<\/em>"]]}, "ex": [{"en": "Express shipping is <u>fast<\/u>.", "zh": "快遞寄送很快。", "note": "原級：只講一樣東西。"}, {"en": "Express shipping is <u>faster<\/u> than standard shipping.", "zh": "快遞寄送比一般寄送快。", "note": "比較級：兩樣東西比。"}, {"en": "Overnight delivery is the <u>fastest<\/u> option we offer.", "zh": "隔夜送達是我們提供的選項裡最快的。", "note": "最高級：一群裡的第一名。"}], "quiz": [{"type": "choose", "q": "<em>Of all the branches in the region, the Eastgate branch has the ___ sales.<\/em> 空格填哪一個？", "options": ["high", "higher", "highest"], "answer": 2, "why": "<em>of all the branches<\/em> 表示從一群裡挑第一名，前面又有 <em>the<\/em>，用最高級 <em>highest<\/em>。"}], "takeaway": "一樣用原級，兩個比用比較級，一群裡的第一名用最高級。"}, {"h": "怎麼變：加 -er、-est，還是用 more、most", "body": ["原則是：短的字加字尾，長的字前面加字。一個音節的字（<em>fast<\/em>、<em>cheap<\/em>、<em>large<\/em>）加 <em>-er<\/em>、<em>-est<\/em>：<em>cheaper<\/em>、<em>cheapest<\/em>。三個音節以上的字（<em>expensive<\/em>、<em>reliable<\/em>、<em>efficient<\/em>）前面加 <em>more<\/em>、<em>most<\/em>：<em>more expensive<\/em>、<em>most reliable<\/em>。", "兩個音節的字：以 <em>-y<\/em> 結尾的形容詞，把 <em>y<\/em> 改成 <em>i<\/em> 再加 <em>-er<\/em>、<em>-est<\/em>：<em>easy<\/em> → <em>easier<\/em>、<em>busy<\/em> → <em>busiest<\/em>。其他兩個音節的字大多用 <em>more<\/em>、<em>most<\/em>：<em>more modern<\/em>、<em>more careful<\/em>。以 <em>-ly<\/em> 結尾的副詞也用 <em>more<\/em>：<em>more quickly<\/em>、<em>more carefully<\/em>。例外是 <em>early<\/em>（形容詞和副詞同一個字）：<em>earlier<\/em>、<em>earliest<\/em>，後面「越……越……」那一節的 <em>The earlier you register<\/em> 就是這個字。", "拼字的小變化：字尾已經是 <em>e<\/em> 的只加 <em>-r<\/em>，<em>large<\/em> → <em>larger<\/em>；短母音加一個子音結尾的，子音要重複，<em>big<\/em> → <em>bigger<\/em>、<em>hot<\/em> → <em>hotter<\/em>。", "<b><em>-er<\/em> 和 <em>more<\/em> 只能選一個<\/b>。<em>more cheaper<\/em>、<em>most easiest<\/em> 等於把「比較」說了兩次，是錯的。"], "ex": [{"en": "The new route is <u>shorter<\/u> and <u>cheaper<\/u>.", "zh": "新路線比較短，也比較便宜。"}, {"en": "The new software is <u>more reliable<\/u> than the old version.", "zh": "新軟體比舊版穩定。"}, {"en": "Friday is usually our <u>busiest<\/u> day.", "zh": "星期五通常是我們最忙的一天。", "note": "<em>busy<\/em> → <em>busiest<\/em>：<em>y<\/em> 改 <em>i<\/em>。"}, {"en": "Please drive <u>more carefully<\/u> in the loading area.", "zh": "在裝卸區開車請更小心。"}], "quiz": [{"type": "choose", "q": "下面哪一個比較級是對的？", "options": ["more easier", "easier", "easyer"], "answer": 1, "why": "<em>easy<\/em> 是兩個音節、<em>-y<\/em> 結尾，<em>y<\/em> 改成 <em>i<\/em> 再加 <em>-er<\/em>：<em>easier<\/em>。<em>more easier<\/em> 把比較說了兩次。"}], "takeaway": "短字加 <em>-er<\/em>／<em>-est<\/em>，長字用 <em>more<\/em>／<em>most<\/em>，兩個不能一起用。"}, {"h": "不規則的字", "body": ["有幾個很常用的字不照規則變，只能一個一個認：<em>good<\/em>／<em>well<\/em> → <em>better<\/em> → <em>best<\/em>；<em>bad<\/em>／<em>badly<\/em> → <em>worse<\/em> → <em>worst<\/em>；<em>many<\/em>／<em>much<\/em> → <em>more<\/em> → <em>most<\/em>；<em>little<\/em> → <em>less<\/em> → <em>least<\/em>；<em>far<\/em> → <em>farther<\/em>／<em>further<\/em> → <em>farthest<\/em>／<em>furthest<\/em>。", "<em>good<\/em>（形容詞）和 <em>well<\/em>（副詞）共用 <em>better<\/em>、<em>best<\/em>。所以 <em>better<\/em> 可以放在名詞前面（<em>a better offer<\/em>），也可以放在動詞後面（<em>sold better<\/em>）。", "<em>more<\/em> 有兩種身份：放在長形容詞前面，是比較級的記號（<em>more expensive<\/em>）；放在名詞前面，是「更多的」（<em>more staff<\/em>），也就是 <em>many<\/em>／<em>much<\/em> 的比較級。<em>less<\/em> 是 <em>more<\/em> 的反方向：<em>less expensive<\/em>（比較不貴）、<em>less time<\/em>（比較少的時間）。", "<em>further<\/em> 除了講距離，也常用來表示「進一步的」：<em>for further information<\/em>。", "<em>gooder<\/em>、<em>more better<\/em>、<em>worser<\/em> 都不存在。"], "table": {"head": ["原級", "比較級", "最高級"], "rows": [["<em>good<\/em>／<em>well<\/em>", "<em>better<\/em>", "<em>best<\/em>"], ["<em>bad<\/em>／<em>badly<\/em>", "<em>worse<\/em>", "<em>worst<\/em>"], ["<em>many<\/em>／<em>much<\/em>", "<em>more<\/em>", "<em>most<\/em>"], ["<em>little<\/em>", "<em>less<\/em>", "<em>least<\/em>"], ["<em>far<\/em>", "<em>farther<\/em>／<em>further<\/em>", "<em>farthest<\/em>／<em>furthest<\/em>"]]}, "ex": [{"en": "The second supplier made a <u>better<\/u> offer.", "zh": "第二家供應商開出更好的條件。"}, {"en": "Sales were <u>worse<\/u> in March than in February.", "zh": "三月的業績比二月差。"}, {"en": "The new process takes <u>less<\/u> time than the old one.", "zh": "新流程花的時間比舊的少。"}, {"en": "For <u>further<\/u> information, please visit our website.", "zh": "更多資訊請上我們的網站。"}], "quiz": [{"type": "choose", "q": "<em>The product sold ___ in the second quarter than in the first.<\/em> 空格填哪一個？", "options": ["more good", "better", "gooder"], "answer": 1, "why": "<em>sold<\/em> 後面要副詞 <em>well<\/em>，比較級是不規則的 <em>better<\/em>。<em>more good<\/em> 和 <em>gooder<\/em> 都不存在。"}], "takeaway": "<em>good<\/em>／<em>well<\/em>、<em>bad<\/em>、<em>many<\/em>／<em>much<\/em>、<em>little<\/em>、<em>far<\/em> 不照規則變，要個別認。"}, {"h": "比較級的搭檔：than", "body": ["比較級後面通常接 <em>than<\/em>，帶出比較的另一方：<em>faster than the old printer<\/em>。看到 <em>than<\/em>，前面就要是比較級；反過來，要說出跟誰比，就用 <em>than<\/em>。<em>than<\/em> 不是 <em>then<\/em>，<em>then<\/em> 是「然後、那時」，跟比較無關。", "<b>比的兩邊要是同一類<\/b>。<em>Our delivery fees are lower than other courier companies.<\/em> 字面上是拿「我們的運費」去比「其他快遞公司」，運費和公司不是同一類。要寫成 <em>lower than those of other courier companies<\/em>（<em>those<\/em> = <em>the delivery fees<\/em>，第 11 章），拿運費比運費。單數用 <em>that of<\/em>：<em>The battery life of this model is longer than that of the previous one.<\/em>", "如果前面已經說清楚在跟什麼比，<em>than<\/em> 和後面那一半可以省略：<em>We moved to a new office. It is bigger.<\/em>（比舊的大）。", "<em>than<\/em> 後面如果是代名詞，要把省略的動詞補回來再選格：<em>Ms. Diaz has worked here longer than I have.<\/em> 正式書面用主格 <em>I<\/em>，最穩當的是把動詞寫出來（第 11 章）。"], "ex": [{"en": "The new printer is <u>faster than<\/u> the old one.", "zh": "新印表機比舊的快。"}, {"en": "Our delivery fees are <u>lower than those of<\/u> other courier companies.", "zh": "我們的運費比其他快遞公司的低。", "note": "<em>those<\/em> = <em>the delivery fees<\/em>，拿運費比運費。"}, {"en": "The battery life of this model is <u>longer than that of<\/u> the previous one.", "zh": "這個型號的電池續航力比上一代長。", "note": "<em>that<\/em> = <em>the battery life<\/em>。"}], "quiz": [{"type": "choose", "q": "下面哪一句比的是同一類東西？", "options": ["The salaries at Norvel are higher than Tessel Logistics.", "The salaries at Norvel are higher than those at Tessel Logistics."], "answer": 1, "why": "要拿薪水比薪水。<em>those at Tessel Logistics<\/em> = <em>the salaries at Tessel Logistics<\/em>。第一句是拿薪水去比一家公司。"}], "takeaway": "比較級配 <em>than<\/em>；比的兩邊要同一類，必要時用 <em>that of<\/em>／<em>those of<\/em>。"}, {"h": "as … as：一樣", "body": ["說兩樣東西「一樣」，用 <em>as<\/em> + 原級 + <em>as<\/em>：<em>The new office is as large as the old one.<\/em> 兩個 <em>as<\/em> 中間<b>一定是原級<\/b>，因為這裡不是在說誰比較大，而是說一樣大。<em>as larger as<\/em> 是錯的。", "否定的 <em>not as … as<\/em> 是「沒有……那麼……」：<em>The new office is not as large as the old one.<\/em> 意思是新的比較小。", "倍數放在第一個 <em>as<\/em> 前面：<em>twice as large as<\/em>（兩倍大）、<em>three times as large as<\/em>（三倍大），中間還是原級。", "常用的 <em>as soon as possible<\/em>（盡快）也是同一個結構。"], "ex": [{"en": "The new office is <u>as large as<\/u> the old one.", "zh": "新辦公室和舊的一樣大。"}, {"en": "The train is <u>not as fast as<\/u> the plane, but it is cheaper.", "zh": "火車沒有飛機快，但比較便宜。"}, {"en": "This year's order is <u>twice as large as<\/u> last year's.", "zh": "今年的訂單是去年的兩倍大。"}, {"en": "Please reply <u>as soon as<\/u> possible.", "zh": "請盡快回覆。"}], "quiz": [{"type": "choose", "q": "<em>The second warehouse is three times as ___ as the first one.<\/em> 空格填哪一個？", "options": ["big", "bigger", "biggest"], "answer": 0, "why": "倍數 <em>three times<\/em> 放在第一個 <em>as<\/em> 前面，兩個 <em>as<\/em> 中間還是原級 <em>big<\/em>。"}], "takeaway": "<em>as … as<\/em> 中間只放原級；倍數放在第一個 <em>as<\/em> 前面。"}, {"h": "加強比較級：much、far、even，不用 very", "body": ["要說「……得多」，在比較級前面加 <em>much<\/em>、<em>far<\/em>、<em>a lot<\/em>、<em>significantly<\/em>：<em>much cheaper<\/em>、<em>far more reliable<\/em>。要說「更加、甚至更」，用 <em>even<\/em> 或 <em>still<\/em>：<em>even better<\/em>。只差一點，用 <em>slightly<\/em>、<em>a little<\/em>：<em>slightly higher<\/em>。", "<b><em>very<\/em> 不能放在比較級前面<\/b>。<em>very<\/em> 修飾的是原級：<em>very fast<\/em>（很快）。<em>very faster<\/em> 是錯的。可以這樣想：<em>very<\/em> 說的是「程度很高」，<em>much<\/em> 說的是「差距很大」；比較級在講兩者的差距，所以配 <em>much<\/em>。", "<em>even<\/em> 帶著「本來就已經……了」的意思：<em>Last quarter was good, but this quarter was even better.<\/em> 上一季已經不錯，這一季更好。"], "ex": [{"en": "Shipping by sea is <u>much cheaper<\/u> than shipping by air.", "zh": "海運比空運便宜很多。"}, {"en": "The updated app is <u>far more reliable<\/u> than the first version.", "zh": "更新後的 App 比第一版穩定得多。"}, {"en": "Last quarter was good, but this quarter was <u>even better<\/u>.", "zh": "上一季不錯，這一季更好。"}, {"en": "The hotel's rates are <u>slightly higher<\/u> in December.", "zh": "這家飯店十二月的房價稍微高一點。"}], "quiz": [{"type": "choose", "q": "下面哪一句是對的？", "options": ["The new model is very lighter than the old one.", "The new model is far lighter than the old one.", "The new model is far light than the old one."], "answer": 1, "why": "比較級 <em>lighter<\/em> 前面用 <em>far<\/em> 加強。<em>very<\/em> 不能修飾比較級；第三句 <em>light<\/em> 是原級，不能配 <em>than<\/em>。"}], "takeaway": "比較級前面用 <em>much<\/em>、<em>far<\/em>、<em>even<\/em> 加強，<em>very<\/em> 只配原級。"}, {"h": "the ＋比較級，the ＋比較級：越……越……", "body": ["「越早報名，付得越少」英文是：<em>The earlier you register, the less you pay.<\/em> 兩半各用「<em>the<\/em> + 比較級」開頭，中間用逗號隔開。前半是條件，後半是結果。", "每一半都是「<em>the<\/em> + 比較級」放在最前面，後面再接主詞和動詞：<em>the earlier<\/em> + <em>you register<\/em>。兩個 <em>the<\/em> 都不能少，兩邊也都要是比較級。少了一個 <em>the<\/em>，或寫成原級（<em>the early<\/em>），讀的人就認不出這個句型。", "比較級是 <em>more<\/em> + 名詞時，名詞跟著一起移到前面：<em>The more orders we receive, the more staff we need.<\/em>", "很短的固定說法：<em>The sooner, the better.<\/em>（越快越好）。"], "ex": [{"en": "<u>The earlier<\/u> you register, <u>the less<\/u> you pay.", "zh": "越早報名，付得越少。"}, {"en": "<u>The more orders<\/u> we receive, <u>the more staff<\/u> we need.", "zh": "接到的訂單越多，需要的人手就越多。"}, {"en": "<u>The longer<\/u> we wait, <u>the harder<\/u> it will be to find a venue.", "zh": "拖得越久，越難找到場地。"}], "quiz": [{"type": "choose", "q": "<em>The more you order, ___ the price per unit gets.<\/em> 空格填哪一個？", "options": ["the lower", "lower", "the lowest"], "answer": 0, "why": "前半是 <em>the more<\/em>，後半也要「<em>the<\/em> + 比較級」放在最前面：<em>the lower<\/em>，後面再接主詞和動詞（<em>the price per unit gets<\/em>）。少了 <em>the<\/em> 或用最高級都不成句型。"}], "takeaway": "越……越……：兩半都用「<em>the<\/em> + 比較級」開頭。"}, {"h": "最高級：the ＋ -est／most，加上範圍", "body": ["最高級是從一群裡挑出第一名，前面通常有 <em>the<\/em>，或所有格（<em>our<\/em>、<em>the company's<\/em>），因為第一名只有一個，是特定的那一個。", "最高級常帶一個說明「在哪一群裡」的範圍。範圍是地方或團體，用 <em>in<\/em>：<em>the largest hotel in the city<\/em>、<em>the best salesperson in the company<\/em>。範圍是一群同類的東西，用 <em>of<\/em>：<em>the cheapest of the four plans<\/em>、<em>the busiest of all our branches<\/em>。", "只有<b>兩個<\/b>東西在比的時候，正式書面不用最高級，用「<em>the<\/em> + 比較級 + <em>of the two<\/em>」：<em>Plan A is the cheaper of the two plans.<\/em>（兩個方案中比較便宜的那個）。三個以上才用最高級：<em>the cheapest of the four plans<\/em>。", "<em>one of the<\/em> + 最高級 + <b>複數名詞<\/b>：<em>one of the largest markets<\/em>（最大的市場之一）。意思是「最大的那幾個裡面的一個」，所以名詞要用複數。", "範圍也可以是時間。現在完成式（第 4 章）加 <em>ever<\/em>，表示「到目前為止」：<em>the largest order we have ever received<\/em>（我們收過最大的一筆訂單）。<em>yet<\/em> 放在名詞後面，也是「到目前為止」：<em>our best quarter yet<\/em>。"], "ex": [{"en": "This is <u>the largest<\/u> hotel <u>in<\/u> the city.", "zh": "這是市內最大的飯店。"}, {"en": "Plan B is <u>the cheapest of<\/u> the four plans.", "zh": "B 方案是四個方案中最便宜的。"}, {"en": "Ms. Tran is <u>one of the most experienced<\/u> engineers <u>in<\/u> the company.", "zh": "Tran 女士是公司裡最有經驗的工程師之一。", "note": "<em>one of the<\/em> + 最高級 + 複數名詞。"}, {"en": "This is <u>the largest<\/u> order we have <u>ever<\/u> received.", "zh": "這是我們收過最大的一筆訂單。", "note": "<em>we have ever received<\/em> 是省略了 <em>that<\/em> 的關係子句（第 9 章），說明 <em>order<\/em>。"}, {"en": "It was our <u>best<\/u> quarter <u>yet<\/u>.", "zh": "這是我們到目前為止最好的一季。"}], "quiz": [{"type": "choose", "q": "<em>Harbor Point is one of the busiest ___ in the region.<\/em> 空格填哪一個？", "options": ["port", "ports"], "answer": 1, "why": "<em>one of the<\/em> + 最高級後面接複數名詞：最忙的那幾個港口裡的一個。"}, {"type": "choose", "q": "<em>This is the most affordable ___ the three laptops we tested.<\/em> 空格填哪一個？", "options": ["in", "of", "than"], "answer": 1, "why": "範圍是一群同類的東西（我們測試的三台筆電），用 <em>of<\/em>。<em>in<\/em> 用在地方或團體；<em>than<\/em> 是比較級的搭檔。"}, {"type": "choose", "q": "<em>We compared two suppliers, and Norvel is the ___ of the two.<\/em> 空格填哪一個？", "options": ["more reliable", "most reliable"], "answer": 0, "why": "只有兩個東西比，正式書面用「<em>the<\/em> + 比較級」：<em>the more reliable<\/em>。<em>most<\/em> 要三個以上才用。"}], "takeaway": "最高級前面加 <em>the<\/em>，範圍用 <em>in<\/em>（地方、團體）或 <em>of<\/em>（一群同類），<em>one of the<\/em> 後面接複數；只有兩個時用 <em>the<\/em> + 比較級。"}], "mistakes": [{"wrong": "This hotel is more cheaper than the one near the station.", "right": "This hotel is cheaper than the one near the station.", "why": "<em>-er<\/em> 和 <em>more<\/em> 只能選一個。"}, {"wrong": "The new model is very lighter than the old one.", "right": "The new model is much lighter than the old one.", "why": "<em>very<\/em> 不能修飾比較級，用 <em>much<\/em>、<em>far<\/em>、<em>even<\/em>。"}, {"wrong": "The new office is as larger as the old one.", "right": "The new office is as large as the old one.", "why": "兩個 <em>as<\/em> 中間放原級。"}, {"wrong": "Ms. Tran is one of the most experienced engineer in the company.", "right": "Ms. Tran is one of the most experienced engineers in the company.", "why": "<em>one of the<\/em> + 最高級後面接複數名詞。"}, {"wrong": "The more you order, the cheap it gets.", "right": "The more you order, the cheaper it gets.", "why": "「越……越……」的兩半都要用 <em>the<\/em> + 比較級。"}], "workbook": ["compare"]}, {"id": "quantity", "n": 13, "title": "數量詞與可數名詞", "en": "Countable Nouns and Quantity Words", "lead": "英文的名詞（第 1 章）分成兩種：可以一個一個數的，和不能數的。這個分類決定了前面能不能加 <em>a<\/em>、後面能不能加 <em>-s<\/em>、要用 <em>many<\/em> 還是 <em>much<\/em>、動詞用單數還是複數。這一章先教你判斷一個名詞屬於哪一種，再把 <em>each<\/em>、<em>few<\/em>、<em>most of<\/em>、<em>another<\/em> 這些放在名詞前面說明「多少」的數量詞，照「後面接什麼名詞」一個一個整理清楚。", "check": [{"type": "choose", "q": "哪一句對？", "options": ["We ordered new equipments for the lab.", "We ordered a new equipment for the lab.", "We ordered new equipment for the lab."], "answer": 2, "why": "<em>equipment<\/em> 是不可數名詞：<em>two equipments<\/em> 說不通，所以不加 <em>-s<\/em>，前面也不加 <em>a<\/em>。要一件一件數，就說 <em>a piece of equipment<\/em>。"}, {"type": "choose", "q": "<em>We don't have ___ information about the new supplier yet.<\/em>", "options": ["many", "much"], "answer": 1, "why": "<em>information<\/em> 不可數，「很多」要用 <em>much<\/em>。<em>many<\/em> 只接可以一個一個數的複數名詞，例如 <em>many suppliers<\/em>。"}, {"type": "choose", "q": "<em>Each of the new interns ___ a laptop.<\/em>", "options": ["has", "have"], "answer": 0, "why": "主詞是 <em>Each<\/em>（每一個），一次只看一個人，所以動詞用單數 <em>has<\/em>。<em>of<\/em> 後面的 <em>interns<\/em> 雖然是複數，但它不是主詞。"}, {"type": "choose", "q": "<em>There were ___ errors in this month's report than in last month's.<\/em>", "options": ["less", "fewer"], "answer": 1, "why": "<em>errors<\/em> 可數（<em>an error<\/em>、<em>two errors<\/em>），「比較少」要用 <em>fewer<\/em>。<em>less<\/em> 接不可數名詞，例如 <em>less paper<\/em>。"}, {"type": "choose", "q": "<em>We have two meeting rooms. Room A is booked, so please use ___ one.<\/em>", "options": ["another", "the other", "other"], "answer": 1, "why": "只有兩間，一間被訂走，剩下的就是確定的那一間：<em>the other<\/em>。<em>another<\/em> 是「再一個，而且還有別的可選」；<em>other<\/em> 單獨用時後面接複數名詞。"}], "sections": [{"h": "可數還是不可數：先問能不能一個一個數", "body": ["名詞（第 1 章）在英文裡分成兩種。<b>可數名詞<\/b>是可以一個一個數的東西：<em>a chair<\/em>、<em>two chairs<\/em>、<em>three invoices<\/em>。<b>不可數名詞<\/b>是英文當成「一團」或「一整類」的東西，沒辦法說一個、兩個：<em>water<\/em>、<em>money<\/em>、<em>furniture<\/em>、<em>information<\/em>。", "這個分類看起來像細節，其實是門檻，後面每一節都靠它。可數名詞有單數和複數兩種樣子；不可數名詞只有一種樣子：永遠不加 <em>-s<\/em>、前面不加 <em>a<\/em>，當主詞（第 2 章）時動詞用單數。", "還有一個容易忽略的規則：<b>單數的可數名詞不能光溜溜地出現<\/b>，前面一定要有 <em>a<\/em>、<em>the<\/em>、<em>this<\/em>、<em>my<\/em>、<em>each<\/em> 這類字陪著。中文說「我們需要椅子」完全沒問題，英文寫 <em>We need chair.<\/em> 就壞了：讀者不知道你要一張（<em>a chair<\/em>）、說好的那一張（<em>the chair<\/em>），還是好幾張（<em>chairs<\/em>）。不可數名詞沒有這個問題，<em>We need furniture.<\/em> 是完整的句子。少數固定說法是例外，例如 <em>by car<\/em>、<em>at work<\/em>、<em>in person<\/em>，先當成整塊記。", "判斷的方法：試著在名詞前面加 <em>two<\/em>。<em>two invoices<\/em> 可以，所以 <em>invoice<\/em> 可數；<em>two furnitures<\/em> 不行，所以 <em>furniture<\/em> 不可數。拿不準就查字典，字典會標 <em>[C]<\/em>（<em>countable<\/em>，可數）或 <em>[U]<\/em>（<em>uncountable<\/em>，不可數）。", "有些名詞兩種都有，意思不一樣。<em>a room<\/em> 是一間房（可數），<em>room<\/em> 是空間（不可數）：<em>There is no room for another desk.<\/em> <em>a paper<\/em> 是一份報告或一份報紙，<em>paper<\/em> 是紙。所以「加 <em>two<\/em>」的測試，要問在這個句子的意思下能不能數。"], "table": {"head": ["比較項目", "可數（<em>chair<\/em>）", "不可數（<em>furniture<\/em>）"], "rows": [["前面加 <em>a<\/em>", "<em>a chair<\/em>", "不行，沒有 <em>a furniture<\/em>"], ["加 <em>-s<\/em> 變複數", "<em>chairs<\/em>", "不行，沒有 <em>furnitures<\/em>"], ["前面加數字", "<em>three chairs<\/em>", "要借別的字：<em>three pieces of furniture<\/em>"], ["單數單獨出現", "不行，要寫 <em>a chair<\/em>、<em>the chair<\/em>", "可以：<em>We need furniture.<\/em>"], ["當主詞時的動詞", "看單複數：<em>The chair is<\/em>、<em>The chairs are<\/em>", "永遠單數：<em>The furniture is<\/em>"]]}, "ex": [{"en": "The hotel added two <u>chairs<\/u> to each room.", "zh": "飯店在每間房多放了兩張椅子。", "note": "<em>chair<\/em> 可數，可以說 <em>two chairs<\/em>。"}, {"en": "The hotel replaced all the <u>furniture<\/u> in the lobby.", "zh": "飯店把大廳的家具全部換新了。", "note": "<em>furniture<\/em> 不可數，沒有 <em>-s<\/em>。"}, {"en": "We need <u>a<\/u> projector for Thursday's meeting.", "zh": "星期四的會議需要一台投影機。", "note": "<em>projector<\/em> 是單數可數名詞，前面一定要有 <em>a<\/em> 或 <em>the<\/em> 這類字。"}], "quiz": [{"type": "choose", "q": "哪一句對？", "options": ["Ms. Patel is looking for new assistant.", "Ms. Patel is looking for a new assistant.", "Ms. Patel is looking for a new assistants."], "answer": 1, "why": "<em>assistant<\/em> 可數。單數的可數名詞前面一定要有 <em>a<\/em>、<em>the<\/em> 這類字，所以第一句錯；<em>a<\/em> 後面只能接單數，所以第三句也錯。"}], "takeaway": "單數的可數名詞要有 <em>a<\/em>、<em>the<\/em> 這類字陪著；不可數名詞不加 <em>a<\/em>、不加 <em>-s<\/em>，動詞用單

tes<\/em> 是主動，意思變成倉庫在整修別的東西。"}], "sections": [{"h": "同一件事，兩種說法", "body": ["先看兩句意思一樣的話：<em>Ms. Chou approved the budget.<\/em> 和 <em>The budget was approved by Ms. Chou.<\/em> 兩句講的都是 Chou 女士核准了預算，差別只在從誰開始說。", "第一句從做動作的人說起：主詞 <em>Ms. Chou<\/em> 做了「核准」這個動作，<em>the budget<\/em> 是受詞（第 2 章），也就是動作的對象。這叫<b>主動<\/b>。", "第二句從承受動作的東西說起：原本的受詞 <em>the budget<\/em> 搬到句首當主詞，動詞改成 <em>was approved<\/em>，原本做動作的人退到 <em>by<\/em> 後面。這叫<b>被動<\/b>。", "這次搬家是整章的門檻：<b>被動句的主詞，就是主動句裡的受詞<\/b>。一個動詞要先有受詞，才有東西可以搬到前面，才會有被動。第 6 節講「沒有被動的動詞」，靠的就是這一點。", "做動作的人在被動句裡常常直接省略。<em>The budget was approved on Monday.<\/em> 沒說是誰核准的，因為讀的人只關心預算過了沒有。"], "ex": [{"en": "Ms. Chou <u>approved<\/u> the budget.", "zh": "Chou 女士核准了預算。", "note": "主動：主詞 <em>Ms. Chou<\/em> 做「核准」這個動作，<em>the budget<\/em> 是受詞。"}, {"en": "The budget <u>was approved<\/u> by Ms. Chou.", "zh": "預算由 Chou 女士核准了。", "note": "被動：原本的受詞 <em>the budget<\/em> 搬到主詞的位置，做動作的人退到 <em>by<\/em> 後面。"}, {"en": "The budget <u>was approved<\/u> on Monday.", "zh": "預算在星期一獲得核准。", "note": "誰核准的不重要，<em>by<\/em> 整段省略。"}], "table": {"head": ["看哪裡", "主動", "被動"], "rows": [["主詞是誰", "做動作的人（<em>Ms. Chou<\/em>）", "承受動作的東西（<em>the budget<\/em>）"], ["動詞", "<em>approved<\/em>", "<em>was approved<\/em>（<em>be<\/em> + p.p.）"], ["做動作的人在哪", "主詞的位置", "<em>by<\/em> 後面，或乾脆省略"], ["受詞", "在動詞後面（<em>the budget<\/em>）", "已經搬去當主詞，動詞後面通常沒有了（<em>give、offer<\/em> 這類有兩個受詞的動詞，見第 7 節）"]]}, "takeaway": "被動就是把受詞搬到前面當主詞，動詞改成 <em>be<\/em> + p.p.。"}, {"h": "被動的形狀：be + p.p.", "body": ["被動的動詞一定由兩個零件組成：<em>be<\/em> 和 p.p.（過去分詞）。<em>be<\/em> 可以是 <em>is、are、was、were、be、been、being<\/em> 任何一個樣子，時態靠它的形狀標出來（完成式、未來式前面還會多一個 <em>has<\/em>、<em>will<\/em> 這類助動詞，第 4 節會講）；p.p. 是 <em>approved、sent、written<\/em> 這種形式。", "兩個零件少一個，就不是被動。拿掉 <em>be<\/em>：<em>The samples sent to the client.<\/em> 讀起來像樣品自己把東西寄給客戶，或者只是「寄給客戶的樣品」這一串字，句子沒有說完。把 p.p. 換成 Ving：<em>The samples were sending to the client.<\/em> 變成過去進行式（第 4 章），意思是樣品當時正在寄東西給客戶，說不通。", "門檻在 <em>was sending<\/em> 和 <em>was sent<\/em> 這種只差一個字的地方。兩個都有 <em>was<\/em>，差別全在後面那個字：接 Ving，是主詞<b>正在做<\/b>；接 p.p.，是主詞<b>承受<\/b>。所以看到 <em>be<\/em> 動詞，一定要再往後看一個字，才知道是主動還是被動。", "規則動詞的 p.p. 和過去式一樣，加 <em>-ed<\/em>（<em>approved、delivered<\/em>）。不規則動詞的 p.p. 要另外認，下表是辦公室裡常見的幾個。"], "ex": [{"en": "The samples <u>were sent<\/u> to the client on Tuesday.", "zh": "樣品星期二寄給客戶了。"}, {"en": "The annual meeting <u>is held<\/u> in Harbor City every June.", "zh": "年會每年六月在海港市舉行。", "note": "<em>held<\/em> 是 <em>hold<\/em> 的 p.p.。"}, {"en": "All invoices <u>are paid<\/u> within 30 days.", "zh": "所有發票都會在 30 天內付清。"}], "table": {"head": ["原形", "過去式", "p.p."], "rows": [["<em>send<\/em>", "<em>sent<\/em>", "<em>sent<\/em>"], ["<em>hold<\/em>", "<em>held<\/em>", "<em>held<\/em>"], ["<em>pay<\/em>", "<em>paid<\/em>", "<em>paid<\/em>"], ["<em>write<\/em>", "<em>wrote<\/em>", "<em>written<\/em>"], ["<em>give<\/em>", "<em>gave<\/em>", "<em>given<\/em>"], ["<em>choose<\/em>", "<em>chose<\/em>", "<em>chosen<\/em>"], ["<em>take<\/em>", "<em>took<\/em>", "<em>taken<\/em>"]]}, "quiz": [{"type": "choose", "q": "<em>The monthly report ___ by the finance team.<\/em> 空格要填哪一個？", "options": ["prepares", "is prepared", "is preparing"], "answer": 1, "why": "報告不會自己準備，<em>by the finance team<\/em> 指出做事的人，所以是 <em>be<\/em> + p.p.。<em>is preparing<\/em> 是 <em>be<\/em> + Ving，意思變成報告正在準備別的東西；<em>prepares<\/em> 是主動，後面卻沒有受詞。"}], "takeaway": "被動一定是 <em>be<\/em> + p.p.；<em>be<\/em> 後面接 Ving 是正在做，接 p.p. 才是被做。"}, {"h": "主詞是做，還是被做", "body": ["判斷要用主動還是被動，問兩個問題。第一，找出主詞（第 2 章），問它<b>自己會不會做這個動作<\/b>。合約不會簽名，會議不會自己延期，貨不會自己寄出去；它們是被處理的一方。", "第二，看動詞後面有沒有受詞。像 <em>approve、send、review<\/em> 這種動詞，主動時後面一定要接一個對象：核准<b>什麼<\/b>、寄<b>什麼<\/b>。如果動詞後面直接接 <em>by<\/em>、時間、地點或句號，那個對象不見了，通常就是被動，因為對象已經搬到前面當主詞。", "門檻是一個直覺上的誤會：<b>主詞是東西，不代表要用被動<\/b>。<em>The new policy affects all part-time staff.<\/em> 主詞是政策，但政策是「影響」別人的一方，後面也有受詞，所以是主動。反過來，主詞是人也可能是被動：<em>Mr. Lin was promoted.<\/em> Lin 先生是被升職的。判斷靠的是動作的方向，不是主詞是人還是東西。", "還有一個容易看錯的線索：<em>by<\/em>。<em>by<\/em> 後面接做動作的人（<em>by the manager<\/em>），是被動的線索；<em>by<\/em> 後面接時間（<em>by Friday<\/em>），意思是「在星期五之前」，跟主動被動無關。"], "ex": [{"en": "The new policy <u>affects<\/u> all part-time staff.", "zh": "新政策影響所有兼職員工。", "note": "主詞是東西，但它在影響別人，後面有受詞 <em>all part-time staff<\/em>，所以是主動。"}, {"en": "Mr. Lin <u>was promoted<\/u> to sales director last month.", "zh": "Lin 先生上個月升為業務總監。", "note": "主詞是人，但他是被升職的一方，後面沒有受詞。"}, {"en": "The form <u>must be submitted<\/u> by Friday.", "zh": "表格必須在星期五前繳交。", "note": "<em>by Friday<\/em> 是期限，不是做動作的人。判斷被動靠的是：表格不會自己繳交。<em>must be submitted<\/em> 裡的 <em>must be<\/em>，第 4 節會講。"}], "quiz": [{"type": "choose", "q": "下面哪一句的主詞是承受動作的一方？", "options": ["The system sends a reminder every Monday.", "The reminders are sent every Monday.", "Mr. Kuo sent the reminders on Monday."], "answer": 1, "why": "<em>are sent<\/em> 是 <em>be<\/em> + p.p.，提醒是被寄出去的東西。另外兩句的主詞 <em>the system<\/em>、<em>Mr. Kuo<\/em> 都是寄的一方，後面也都有受詞。"}], "takeaway": "不要看主詞是人還是東西；問它自己會不會做這個動作，再看動詞後面有沒有受詞。"}, {"h": "被動配上各種時態", "body": ["被動可以配上任何時態（第 4 章）。規則只有一條：<b>時態全部由 <em>be<\/em> 表現，p.p. 永遠不變<\/b>。", "做法是：先想主動句是哪個時態，把那個時態套在 <em>be<\/em> 上，再接 p.p.。例如主動的 <em>They are repairing the elevator.<\/em> 是現在進行式；把 <em>be<\/em> 放進現在進行式，就是 <em>is being<\/em>，再接 <em>repaired<\/em>：<em>The elevator is being repaired.<\/em>", "門檻是 <em>being<\/em> 和 <em>been<\/em>。兩個字長得像，意思差很多：<em>is being repaired<\/em> 是此刻正在修；<em>has been repaired<\/em> 是已經修好了。<em>being<\/em> 跟著進行式走，<em>been<\/em> 跟著完成式走。少了 <em>being<\/em>，<em>The elevator is repaired.<\/em> 就只是在說電梯處於修好的狀態，「正在修」的意思不見了。", "<em>will、can、must、should<\/em> 和 to V 的 <em>to<\/em> 後面一律接原形，所以 <em>be<\/em> 保持原形：<em>will be checked<\/em>、<em>must be checked<\/em>、<em>needs to be checked<\/em>。"], "ex": [{"en": "The elevator <u>is being repaired<\/u>, so please use the stairs.", "zh": "電梯正在維修，請走樓梯。"}, {"en": "The elevator <u>has been repaired<\/u> and is working again.", "zh": "電梯已經修好，可以用了。"}, {"en": "The new menu <u>will be introduced<\/u> next month.", "zh": "新菜單下個月推出。"}, {"en": "Passwords <u>must be changed<\/u> every 90 days.", "zh": "密碼必須每 90 天更換一次。"}, {"en": "All expense reports <u>need to be signed<\/u> by a manager.", "zh": "所有費用報告都需要經理簽名。", "note": "<em>to<\/em> 後面接原形，所以被動是 <em>to be<\/em> + p.p.。"}], "table": {"head": ["時態", "主動", "被動"], "rows": [["現在式", "<em>The team checks the invoice.<\/em>", "<em>The invoice is checked.<\/em>"], ["過去式", "<em>The team checked the invoice.<\/em>", "<em>The invoice was checked.<\/em>"], ["未來式", "<em>The team will check the invoice.<\/em>", "<em>The invoice will be checked.<\/em>"], ["現在進行式", "<em>The team is checking the invoice.<\/em>", "<em>The invoice is being checked.<\/em>"], ["現在完成式", "<em>The team has checked the invoice.<\/em>", "<em>The invoice has been checked.<\/em>"], ["過去完成式", "<em>The team had checked the invoice.<\/em>", "<em>The invoice had been checked.<\/em>"], ["加 <em>must、can、should<\/em>", "<em>The team must check the invoice.<\/em>", "<em>The invoice must be checked.<\/em>"], ["加 <em>to<\/em>", "<em>The team needs to check the invoice.<\/em>", "<em>The invoice needs to be checked.<\/em>"]]}, "quiz": [{"type": "choose", "q": "<em>The conference room ___ right now, so please use Room B.<\/em> 空格要填哪一個？", "options": ["is cleaned", "is being cleaned", "has been cleaned"], "answer": 1, "why": "<em>right now<\/em> 是此刻正在進行，被動的進行式是 <em>is being<\/em> + p.p.。<em>has been cleaned<\/em> 是已經打掃好，那就不用改去 B 室；<em>is cleaned<\/em> 講的是平常的習慣或狀態，不是此刻。"}, {"type": "tap", "q": "點出這句的動詞（從助動詞一路點到 p.p.）。", "sentence": "The proposal has been reviewed by three managers.", "answer": [2, 3, 4], "why": "<em>has been reviewed<\/em> 是現在完成式的被動：<em>has<\/em> 是標時態的助動詞，<em>been<\/em> 是完成式的 <em>be<\/em>，<em>reviewed<\/em> 是 p.p.。<em>by three managers<\/em> 是做動作的人，不屬於動詞。"}], "takeaway": "時態全部放在 <em>be<\/em> 上，p.p. 不動；<em>being<\/em> 是正在被做，<em>been<\/em> 是已經被做。"}, {"h": "什麼時候用被動", "body": ["被動不是比較正式或比較高級的寫法，它只是換一個起點。用哪一個，看你想讓讀者先看到誰。", "用被動的情況有三種。第一，做動作的人不重要、不知道，或大家都知道是誰：辦公室每天晚上有人打掃，誰打掃沒人在意。第二，這段話的主題是那件東西：飯店的公告在講早餐，所以早餐當主詞。第三，暫時不想點名是誰做的：發票寄錯了，先說發票寄錯，不急著說是誰。", "拿掉被動會怎樣：硬改成主動，就得補一個做動作的人。<em>Someone cleans the offices every evening.<\/em> 多了一個沒有資訊的 <em>someone<\/em>，句子的主題也從辦公室跑到「某人」身上。", "反過來，做動作的人就是重點時，用主動。介紹新標誌時，大家想知道是誰設計的，就說 <em>Ms. Ho designed the new logo.<\/em>"], "ex": [{"en": "Breakfast <u>is served<\/u> from 6:30 to 10:00 in the lobby restaurant.", "zh": "早餐 6:30 到 10:00 在大廳餐廳供應。", "note": "誰端早餐不重要，住客要知道的是早餐。"}, {"en": "The offices <u>are cleaned<\/u> every evening after 7 p.m.", "zh": "辦公室每天晚上七點以後打掃。"}, {"en": "Ms. Ho <u>designed<\/u> the new logo.", "zh": "Ho 女士設計了新標誌。", "note": "重點是誰設計的，所以用主動。"}, {"en": "The wrong invoice <u>was sent<\/u> to Corvane Foods last week.", "zh": "上週有一張錯的發票寄給了 Corvane Foods。", "note": "先講發生了什麼，不點名是誰寄錯的。"}], "takeaway": "做的人不重要、或主題是那件東西時，用被動；重點是誰做的，用主動。"}, {"h": "沒有被動的動詞：occur、arrive、rise", "body": ["第 1 節說過，被動是把受詞搬到前面當主詞。那如果動詞後面<b>本來就不接受詞<\/b>呢？沒有東西可以搬，也就沒有被動。", "後面要接受詞的動詞，叫<b>及物動詞<\/b>：<em>approve<\/em> 一定是核准某個東西。後面不接受詞的，叫<b>不及物動詞<\/b>：<em>arrive<\/em> 就是「抵達」，不能 <em>arrive<\/em> 某個東西，要說抵達哪裡，得先加 <em>at<\/em> 或 <em>in<\/em>。", "不及物動詞講的多半是自己發生、自己變動的事：<em>occur、happen、take place<\/em>（發生、舉行）、<em>arrive<\/em>（抵達）、<em>rise、fall<\/em>（上升、下降）、<em>remain<\/em>（維持）、<em>exist<\/em>（存在）、<em>appear<\/em>（出現）。它們永遠用主動，<em>was occurred、was happened、were risen<\/em> 都是錯的。", "門檻在中文的語感。中文「會議在三樓舉行」聽起來有點像被動，英文的 <em>take place<\/em> 卻是主動：<em>The meeting took place on the third floor.<\/em> 判斷不靠中文聽起來像什麼，靠這個動詞後面能不能接受詞。", "要說「有人讓它變動」，就換一個及物動詞。<em>Prices rose.<\/em> 是價格自己漲；<em>The airline raised its fares.<\/em> 是航空公司把票價調高。<em>raise<\/em> 有受詞，所以也有被動：<em>Fares were raised.<\/em> 下表是成對的字。", "也有一些動詞兩種都可以，例如 <em>increase、open、close、change<\/em>：<em>Sales increased.<\/em>（銷售自己增加）和 <em>We increased our prices.<\/em>（我們調高價格）都對。不確定時查字典，看它標的是及物、不及物，還是兩者都有。反過來，後面有受詞也不保證有被動：表示擁有或狀態的 <em>have<\/em>（<em>The hotel has 120 rooms.<\/em>）、<em>cost<\/em>、<em>resemble<\/em> 通常不用被動。這類字不多，不確定時用主動。"], "ex": [{"en": "A power outage <u>occurred<\/u> during the night shift.", "zh": "夜班期間發生了停電。"}, {"en": "The shipment <u>arrived<\/u> two days late.", "zh": "貨晚了兩天才到。"}, {"en": "Fuel prices <u>rose<\/u> by 8 percent in the second quarter.", "zh": "第二季燃料價格上漲了 8%。", "note": "<em>by 8 percent<\/em> 是漲幅，不是受詞。"}, {"en": "The airline <u>raised<\/u> its fares in June.", "zh": "航空公司六月調漲了票價。", "note": "<em>raise<\/em> 是及物動詞，後面有受詞 <em>its fares<\/em>；改成被動 <em>Fares were raised in June.<\/em> 也對。"}], "table": {"head": ["自己發生、自己變動（不及物，沒有被動）", "讓別的東西變動（及物，有被動）"], "rows": [["<em>rise<\/em> 上升：<em>Fees rose.<\/em>", "<em>raise<\/em> 調高：<em>Fees were raised.<\/em>"], ["<em>fall<\/em> 下降：<em>Sales fell.<\/em>", "<em>lower、reduce、cut<\/em> 降低：<em>Prices were lowered.<\/em>"], ["<em>arrive<\/em> 抵達：<em>The parcel arrived.<\/em>", "<em>deliver<\/em> 送達：<em>The parcel was delivered.<\/em>"], ["<em>take place、happen、occur<\/em> 舉行、發生：<em>The meeting took place.<\/em>", "<em>hold<\/em> 舉辦：<em>The meeting was held.<\/em>"]]}, "quiz": [{"type": "choose", "q": "哪一句是對的？", "options": ["The meeting was taken place in Room 4.", "The meeting took place in Room 4.", "The meeting was took place in Room 4."], "answer": 1, "why": "<em>take place<\/em>（舉行）後面不接受詞，沒有被動。想用被動，要換成及物的 <em>hold<\/em>：<em>The meeting was held in Room 4.<\/em>"}, {"type": "choose", "q": "<em>Last year, our sales ___ by 12 percent.<\/em> 空格要填哪一個？", "options": ["rose", "were risen", "raised"], "answer": 0, "why": "銷售是自己上升，用不及物的 <em>rise<\/em>，過去式 <em>rose<\/em>。<em>rise<\/em> 沒有被動，<em>were risen<\/em> 錯；<em>raise<\/em> 是及物，後面要接受詞（<em>raised prices<\/em>），這裡的 <em>by 12 percent<\/em> 不是受詞，所以也不對。"}], "takeaway": "後面不接受詞的動詞就沒有被動；<em>occur、happen、arrive、rise<\/em> 永遠用主動。"}, {"h": "被動後面還有名詞：give、offer、award", "body": ["第 3 節說，動詞後面有受詞，通常是主動。這個「通常」有一個例外：<em>give、offer、send、award、grant、pay<\/em> 這類動詞可以有<b>兩個<\/b>受詞，一個是人，一個是東西。<em>The company offered Ms. Wu the position.<\/em> 公司給了 Wu 女士（人）這個職位（東西）。", "變成被動時，只有一個受詞搬去當主詞，另一個留在原地。把人搬到前面：<em>Ms. Wu was offered the position.<\/em> 所以這類動詞的被動後面還接著一個名詞，是正常的。", "這時判斷靠第 3 節的第一個問題：主詞是給出去的一方，還是收到的一方。Wu 女士是收到職位的人，用 <em>was offered<\/em>。要是寫成 <em>Ms. Wu offered the position.<\/em>，文法沒錯，意思卻變成她把職位給了別人。"], "ex": [{"en": "The company <u>offered<\/u> Ms. Wu the position of store manager.", "zh": "公司提供 Wu 女士店長的職位。", "note": "主動，兩個受詞：<em>Ms. Wu<\/em> 和 <em>the position<\/em>。"}, {"en": "Ms. Wu <u>was offered<\/u> the position of store manager.", "zh": "Wu 女士獲得了店長的職位。", "note": "被動，<em>Ms. Wu<\/em> 搬去當主詞，<em>the position<\/em> 留在動詞後面。"}, {"en": "All new employees <u>are given<\/u> a laptop on their first day.", "zh": "新進員工第一天都會拿到一台筆電。"}, {"en": "Mr. Caldwell <u>was awarded<\/u> a bonus for his excellent sales results.", "zh": "Caldwell 先生因為業績出色獲頒獎金。"}], "quiz": [{"type": "choose", "q": "<em>Ms. Tan ___ a free upgrade to business class by the airline.<\/em> 空格要填哪一個？", "options": ["gave", "was given", "has given"], "answer": 1, "why": "<em>by the airline<\/em> 說出給的一方是航空公司，Tan 女士是收到升等的人，所以用被動 <em>was given<\/em>。後面的 <em>a free upgrade<\/em> 是留在原地的那個受詞。"}], "takeaway": "<em>give、offer、award<\/em> 這類動詞變成被動後，後面還會留一個名詞；判斷時問主詞是給的一方還是收到的一方。"}], "mistakes": [{"wrong": "An error was occurred during the system update.", "right": "An error occurred during the system update.", "why": "<em>occur<\/em> 後面不接受詞，是不及物動詞，沒有被動。中文說「發生了錯誤」，英文也只用主動。"}, {"wrong": "The parcels were deliver yesterday afternoon.", "right": "The parcels were delivered yesterday afternoon.", "why": "被動是 <em>be<\/em> + p.p.，<em>were<\/em> 後面要用 p.p. <em>delivered<\/em>，不是原形。"}, {"wrong": "The elevator is repairing, so please use the stairs.", "right": "The elevator is being repaired, so please use the stairs.", "why": "電梯不會修東西，它是被修的一方。<em>is repairing<\/em> 是主動的進行式；此刻正在被修，要用 <em>is being<\/em> + p.p.。"}, {"wrong": "Fuel prices were risen last month.", "right": "Fuel prices rose last month.", "why": "<em>rise<\/em> 是不及物動詞，沒有被動，價格自己上漲就用 <em>rose<\/em>。要說是有人調漲的，改用及物的 <em>raise<\/em>：<em>Fuel prices were raised.<\/em>"}], "workbook": ["voice"]}, {"id": "verbforms", "n": 6, "title": "動詞後面接什麼：to V、Ving、原形；分詞", "en": "To V, Ving, Base Form and Participles", "lead": "一個子句由一個有時態的動詞撐起來（第 2 章）。可是我們常常一口氣要講兩個動作：決定聘人、考慮開店、期待見面。第二個動作想進句子，就得換成 to V、Ving 或原形，換成哪一種由前面的字決定。這一章整理這些規則，最後兩節講 Ving 和 p.p. 當形容詞用時怎麼選，以及放在句首的分詞片語。", "check": [{"type": "choose", "q": "<em>We are considering ___ a second warehouse in Eastfield.<\/em> 空格要填哪一個？", "options": ["open", "to open", "opening"], "answer": 2, "why": "<em>consider<\/em> 後面接 Ving。這是 <em>consider<\/em> 這個動詞自己的規定，從中文「考慮」看不出來，要一個一個認。"}, {"type": "choose", "q": "<em>I look forward to ___ you at the trade fair.<\/em> 空格要填哪一個？", "options": ["meet", "meeting", "met"], "answer": 1, "why": "<em>look forward to<\/em> 的 <em>to<\/em> 是介系詞：後面放得進名詞（<em>look forward to the fair<\/em>），所以接動作時用 Ving。"}, {"type": "choose", "q": "<em>The manager let the interns ___ early on Friday.<\/em> 空格要填哪一個？", "options": ["leave", "to leave", "leaving"], "answer": 0, "why": "<em>let<\/em> + 人 + 原形，中間沒有 <em>to<\/em>。換成意思相近的 <em>allow<\/em> 才要 to V：<em>allowed the interns to leave<\/em>。"}, {"type": "choose", "q": "<em>Many guests were ___ by the slow check-in process.<\/em> 空格要填哪一個？", "options": ["frustrating", "frustrated"], "answer": 1, "why": "<em>frustrate<\/em> 是「讓人沮喪」。住客是被弄得沮喪的人，用 <em>-ed<\/em>；造成沮喪的流程才用 <em>-ing<\/em>（<em>a frustrating process<\/em>）。"}, {"type": "choose", "q": "<em>___ near the main station, the hotel is popular with business travelers.<\/em> 空格要填哪一個？", "options": ["Locating", "Located"], "answer": 1, "why": "句首的片語借用逗號後面的主詞 <em>the hotel<\/em>。還原成一句：<em>The hotel is located near the main station.<\/em> 飯店「位於」那裡，英文把它看成被安置在那裡的一方，所以用 p.p.。"}], "sections": [{"h": "為什麼第二個動詞要變形", "body": ["一個子句（第 3 章）由一個有時態的動詞撐起來（第 2 章）。<em>We decided.<\/em> 的 <em>decided<\/em> 帶著過去式，整句的時間由它決定。", "現在想說「我們決定聘兩位設計師」，句子裡有兩個動作：決定、聘請。第二個動作不能也帶著時態直接排上去：<em>We decided hired two designers.<\/em> 兩個過去式擠在一起，讀的人不知道哪一個才是核心，句子就壞了。", "所以第二個動詞要<b>降一級<\/b>：拿掉時態，換成 to V、Ving 或原形。<em>We decided to hire two designers.<\/em> 時間只看 <em>decided<\/em>；<em>to hire<\/em> 不管過去、現在、未來，永遠長這樣。寫成 <em>to hired<\/em> 是錯的，因為時態已經在 <em>decided<\/em> 身上，to V 的 <em>to<\/em> 後面只能接原形。", "換成哪一種，不是看意思隨便挑，是前面的字說了算：動詞本身有規定（<em>decide<\/em> 接 to V，<em>consider<\/em> 接 Ving）；前面是介系詞，接 Ving；前面是 <em>make、let、have<\/em>，接原形。接下來四節，一節講一種。"], "ex": [{"en": "We <u>decided<\/u> to hire two more designers.", "zh": "我們決定再聘兩位設計師。", "note": "有時態的只有 <em>decided<\/em>；<em>to hire<\/em> 沒有時態。"}, {"en": "Ms. Kao <u>finished<\/u> reviewing the contract at noon.", "zh": "Kao 女士中午看完了合約。", "note": "有時態的只有 <em>finished<\/em>；<em>reviewing<\/em> 照 <em>finish<\/em> 的規定用 Ving。"}, {"en": "The site supervisor <u>made<\/u> everyone wear a helmet.", "zh": "工地主任要求每個人都戴安全帽。", "note": "有時態的只有 <em>made<\/em>；<em>wear<\/em> 照 <em>make<\/em> 的規定用原形。"}], "quiz": [{"type": "tap", "q": "點出這句裡有時態的那個動詞。", "sentence": "The team hopes to finish the report before Friday.", "answer": [2], "why": "<em>hopes<\/em> 是現在式，整句的時間由它決定。<em>to finish<\/em> 是降了一級的第二個動作，沒有時態。"}], "takeaway": "一個子句只有一個有時態的動詞；第二個動作如果沒有用 <em>and<\/em> 或連接詞接進來，就要換成 to V、Ving 或原形。"}, {"h": "接 to V 的動詞，接 Ving 的動詞", "body": ["大多數動詞後面只接一種：有的接 to V，有的接 Ving。這是每個動詞自己的習慣，不能從中文意思推出來，要一組一組認。", "有一個幫助記憶的傾向，只是傾向，有例外：to V 常指向<b>還沒發生、打算要做<\/b>的事，像 <em>plan、decide、hope、expect、agree、offer、refuse<\/em>，都在講接下來要不要做。Ving 常把動作當成<b>一件事本身<\/b>來談，像 <em>consider<\/em>（考慮這件事）、<em>finish<\/em>（做完這件事），還有 <em>avoid、suggest、recommend、postpone、enjoy、keep<\/em>。", "還有一種是先接人，再接 to V：<em>ask、allow、require、encourage、remind、invite<\/em>。<em>The manager asked Ms. Su to check the figures.<\/em> 意思是要誰去做什麼。變成被動（第 5 章）時，人搬到前面，<em>to<\/em> 留著：<em>Ms. Su was asked to check the figures.<\/em>、<em>All staff are required to attend.<\/em>", "上面是代表，不是全部。接 to V 的還有 <em>want、need、intend、manage、afford、fail、promise、prepare、arrange<\/em>；接 Ving 的還有 <em>admit、deny、mind、delay、risk、imagine、involve、quit<\/em>。", "<em>suggest<\/em> 中文是「建議」，很多人會順手寫成 <em>suggest to hire<\/em>。但 <em>suggest<\/em> 後面不接 to V，要接 Ving（或名詞、<em>that<\/em> 子句，第 16 章）。這種錯不會讓人看不懂，但在正式的商業文件裡是明顯的文法錯誤。"], "ex": [{"en": "The client <u>agreed to extend<\/u> the deadline by one week.", "zh": "客戶同意把期限延長一週。"}, {"en": "We should <u>avoid scheduling<\/u> meetings on Friday afternoons.", "zh": "我們應該避免把會議排在星期五下午。"}, {"en": "The new system <u>allows customers to track<\/u> their orders online.", "zh": "新系統讓顧客能在線上追蹤訂單。"}, {"en": "All staff <u>are required to attend<\/u> the safety briefing.", "zh": "所有員工都必須參加安全說明會。", "note": "被動也保留 <em>to<\/em>：<em>require someone to<\/em> → <em>be required to<\/em>。"}], "table": {"head": ["接 to V", "接 Ving", "接人 + to V"], "rows": [["<em>plan to expand<\/em>", "<em>consider expanding<\/em>", "<em>ask Ms. Su to call<\/em>"], ["<em>decide to hire<\/em>", "<em>avoid hiring<\/em>", "<em>allow staff to leave<\/em>"], ["<em>hope to finish<\/em>", "<em>finish checking<\/em>", "<em>require visitors to sign in<\/em>"], ["<em>agree to pay<\/em>", "<em>suggest changing<\/em>", "<em>remind clients to pay<\/em>"], ["<em>refuse to sign<\/em>", "<em>postpone signing<\/em>", "<em>encourage staff to apply<\/em>"], ["<em>expect to receive<\/em>", "<em>recommend using<\/em>", "<em>invite guests to stay<\/em>"]]}, "quiz": [{"type": "choose", "q": "<em>The consultant suggested ___ the launch until March.<\/em> 空格要填哪一個？", "options": ["to postpone", "postponing", "postpone"], "answer": 1, "why": "<em>suggest<\/em> 後面接 Ving（或 <em>that<\/em> 子句），不接 to V。<em>postpone<\/em> 原形放在 <em>suggested<\/em> 後面，等於兩個動詞直接排在一起，也不行。"}], "takeaway": "<em>decide、plan、hope<\/em> 接 to V，<em>consider、avoid、finish、suggest<\/em> 接 Ving；這是動詞自己的規定，要一個一個認。"}, {"h": "兩種都能接，意思不同：stop、remember、try", "body": ["有幾個動詞兩種都能接，但意思不一樣，選錯了意思就變了。", "分辨的方法接著上一節的傾向：Ving 是<b>那件事本身<\/b>，通常已經在做或做過；to V 是<b>接下來要去做<\/b>的事。", "<em>stop<\/em>：<em>stop using<\/em> 是停掉「使用」這件事，以後不用了；<em>stop to check<\/em> 是停下手上的事，<b>為了去<\/b>確認。司機開到一半停下來確認地址，是 <em>stopped to check<\/em>。", "<em>remember<\/em>：<em>remember sending<\/em> 是記得自己寄過，事情已經發生；<em>remember to send<\/em> 是記得要去寄，事情還沒做。<em>forget to lock<\/em> 也是同一個方向：忘了去鎖。", "<em>try<\/em>：<em>try restarting<\/em> 是換個方法試試看，做了看有沒有效；<em>try to reach<\/em> 是努力想做到，不一定做得到。<em>We tried to reach Mr. Bose all morning.<\/em> 是一整個早上都想聯絡上他，言下之意是沒聯絡到。", "相對地，<em>begin、start、continue<\/em> 也兩種都能接，意思卻差不多：<em>start working<\/em> 和 <em>start to work<\/em> 都可以。所以不是每個兩種都能接的動詞都有陷阱，要注意的主要是上面這幾個。"], "ex": [{"en": "The driver <u>stopped to check<\/u> the delivery address.", "zh": "司機停下來確認送貨地址。"}, {"en": "Our team <u>stopped using<\/u> paper invoices last year.", "zh": "我們團隊去年起不再用紙本發票。"}, {"en": "Please <u>remember to lock<\/u> the storage room before you leave.", "zh": "離開前請記得鎖儲藏室。"}, {"en": "I <u>remember sending<\/u> the file, but the client says it never arrived.", "zh": "我記得寄過檔案，但客戶說沒收到。"}, {"en": "If the printer jams again, <u>try restarting<\/u> it.", "zh": "印表機如果又卡紙，試試重新開機。"}], "table": {"head": ["動詞", "+ Ving（那件事本身）", "+ to V（接下來要去做）"], "rows": [["<em>stop<\/em>", "不再做（<em>stop using paper<\/em>）", "停下來去做（<em>stop to check<\/em>）"], ["<em>remember<\/em>", "記得做過（<em>remember sending<\/em>）", "記得要去做（<em>remember to send<\/em>）"], ["<em>try<\/em>", "試試這個方法（<em>try restarting<\/em>）", "努力想做到（<em>try to reach<\/em>）"]]}, "quiz": [{"type": "choose", "q": "<em>Mr. Yoon remembers ___ the invoice last week, but it is not in the system.<\/em> 空格要填哪一個？", "options": ["sending", "to send"], "answer": 0, "why": "<em>last week<\/em> 表示寄發票這件事已經發生，是「記得做過」，用 Ving。<em>remember to send<\/em> 是記得要去寄，事情還沒做，跟 <em>last week<\/em> 對不上。"}], "takeaway": "Ving 是那件事本身，to V 是接下來要去做；<em>stop、remember、try<\/em> 選錯，意思就變了。"}, {"h": "這個 to 是介系詞：look forward to + Ving", "body": ["<em>to<\/em> 有兩個身分。一個是 to V 的 <em>to<\/em>，後面接原形（<em>decide to hire<\/em>）。另一個是介系詞 <em>to<\/em>，跟 <em>go to the office<\/em> 的 <em>to<\/em> 一樣。介系詞（第 1 章）後面接名詞或 Ving，<b>不接原形<\/b>。", "門檻在這裡：有些片語的最後一個字剛好是介系詞 <em>to<\/em>，後面又常接一個動作，看起來就像 to V。<em>look forward to<\/em> 就是這樣，所以很多人會寫出 <em>look forward to meet you<\/em>，這是錯的。", "測試方法：在 <em>to<\/em> 後面放一個名詞試試。<em>look forward to the trip<\/em> 說得通，<em>to<\/em> 就是介系詞，接動作時用 Ving：<em>look forward to meeting you<\/em>。<em>plan to the trip<\/em> 說不通，<em>to<\/em> 就是 to V 的 <em>to<\/em>，接原形：<em>plan to visit<\/em>。", "這樣的片語有：<em>look forward to、be committed to、be dedicated to、be used to<\/em>（習慣於）<em>、be accustomed to、contribute to、object to、in addition to<\/em>。", "要特別分清楚的一組：<em>used to<\/em> + 原形，是「以前曾經」，現在不再這樣；<em>be used to<\/em> + Ving，是「習慣於」。只差一個 <em>be<\/em>，<em>to<\/em> 的身分就不同。另外還有一種 <em>be used to<\/em> 後面接原形，意思是「被用來做」：<em>This tool is used to measure humidity.<\/em> 這裡的 <em>used<\/em> 是 <em>use<\/em> 的 p.p.（第 5 章的被動），<em>to measure<\/em> 是「用來做什麼」的 to V。分辨方法：主詞是人，通常是「習慣於」，後面接 Ving；主詞是工具、系統、方法，通常是「被用來」，後面接原形。"], "ex": [{"en": "We <u>look forward to working<\/u> with your team.", "zh": "我們期待和貴團隊合作。"}, {"en": "Halden Foods <u>is committed to reducing<\/u> plastic packaging.", "zh": "Halden Foods 致力於減少塑膠包裝。"}, {"en": "Ms. Ruiz <u>is used to handling<\/u> difficult customers.", "zh": "Ruiz 女士已經習慣應付難搞的客戶。"}, {"en": "Mr. Holt <u>used to work<\/u> at our Dalton branch.", "zh": "Holt 先生以前在我們的 Dalton 分公司工作。", "note": "沒有 <em>be<\/em> 的 <em>used to<\/em> 是「以前曾經」，後面接原形。"}, {"en": "This software <u>is used to track<\/u> shipments.", "zh": "這套軟體是用來追蹤貨物的。", "note": "主詞是軟體，不是人。這個 <em>is used to<\/em> 是「被用來做」，後面接原形；和 <em>is used to handling<\/em>（習慣於）不同。"}], "table": {"head": ["片語", "放名詞試試", "接動作時"], "rows": [["<em>look forward to<\/em>", "<em>look forward to the trip<\/em>，說得通", "<em>look forward to seeing you<\/em>"], ["<em>be committed to<\/em>", "<em>be committed to quality<\/em>，說得通", "<em>be committed to improving<\/em>"], ["<em>in addition to<\/em>", "<em>in addition to the fee<\/em>，說得通", "<em>in addition to paying the fee<\/em>"], ["<em>plan to<\/em>", "<em>plan to the trip<\/em>，說不通", "<em>plan to visit<\/em>（to V，接原形）"]]}, "quiz": [{"type": "choose", "q": "<em>The company is dedicated to ___ high-quality service.<\/em> 空格要填哪一個？", "options": ["provide", "providing"], "answer": 1, "why": "放名詞試試：<em>dedicated to its customers<\/em> 說得通，所以這個 <em>to<\/em> 是介系詞，接動作時用 Ving。"}], "takeaway": "<em>to<\/em> 後面放得進名詞，它就是介系詞，接動作時要用 Ving。"}, {"h": "make、let、have 後面接原形", "body": ["有一組動詞是「讓別人去做某件事」，句型是 動詞 + 人 + 原形，中間不加 <em>to<\/em>：<em>make<\/em>（要求、使得，對方不一定願意）、<em>let<\/em>（允許）、<em>have<\/em>（交代、安排別人去做，工作上很常用）。", "意思相近的 <em>allow、ask、get<\/em> 卻要 to V。<em>let us leave<\/em> 和 <em>allowed us to leave<\/em> 意思一樣，形狀不同。<em>to<\/em> 該不該出現，看的是前面是哪個動詞，不是意思。", "拿掉或加錯會怎樣：<em>The manager let us to leave early.<\/em> 多了 <em>to<\/em>，是錯的；<em>The manager allowed us leave early.<\/em> 少了 <em>to<\/em>，也是錯的。", "<em>help<\/em> 比較寬：<em>help<\/em> + 人 + 原形或 to V 都可以（<em>help you set up<\/em>、<em>help you to set up<\/em>）。", "<em>make<\/em> 變成被動時，<em>to<\/em> 會跑出來：<em>The director made us redo the sales forecast.<\/em> 的被動是 <em>We were made to redo the sales forecast.<\/em>，和 <em>ask → be asked to<\/em> 同一個道理（第 2 節）。<em>let<\/em> 和 <em>have<\/em>（人 + 原形）沒有這樣的被動；要說「被允許」，用 <em>be allowed to<\/em>。", "<em>have<\/em> 還有一個相關的句型：<em>have<\/em> + 東西 + p.p.，意思是找人把東西處理好。<em>We had the meeting room painted.<\/em> 會議室是被漆的（第 5 章），所以用 p.p.。判斷方法：<em>have<\/em> 後面的受詞自己去做，用原形；受詞是被處理的東西，用 p.p.。"], "ex": [{"en": "The director <u>made us redo<\/u> the sales forecast.", "zh": "總監要我們重做銷售預測。"}, {"en": "Our manager <u>lets us work<\/u> from home on Fridays.", "zh": "我們經理准許大家星期五在家工作。"}, {"en": "Mr. Abe <u>had his assistant book<\/u> a table for six.", "zh": "Abe 先生交代助理訂了一張六人桌。"}, {"en": "Mr. Abe <u>asked his assistant to book<\/u> a table for six.", "zh": "Abe 先生請助理訂一張六人桌。", "note": "意思和上一句差不多，但 <em>ask<\/em> 要 to V，<em>have<\/em> 要原形。"}, {"en": "We <u>had the meeting room painted<\/u> last weekend.", "zh": "我們上週末找人把會議室漆過了。", "note": "受詞 <em>the meeting room<\/em> 是被漆的東西，所以用 p.p.。"}], "table": {"head": ["動詞", "後面接", "例子"], "rows": [["<em>make<\/em>", "人 + 原形", "<em>made us redo the slides<\/em>"], ["<em>let<\/em>", "人 + 原形", "<em>let staff work from home<\/em>"], ["<em>have<\/em>", "人 + 原形", "<em>had his assistant book a table<\/em>"], ["<em>allow<\/em>", "人 + to V", "<em>allowed staff to work from home<\/em>"], ["<em>ask<\/em>", "人 + to V", "<em>asked his assistant to book a table<\/em>"], ["<em>get<\/em>", "人 + to V", "<em>got the technician to fix the printer<\/em>"], ["<em>make<\/em>（被動）", "<em>be made<\/em> + to V", "<em>We were made to redo the slides.<\/em>"]]}, "quiz": [{"type": "choose", "q": "哪一句是對的？", "options": ["The hotel let guests to check out at 2 p.m.", "The hotel let guests check out at 2 p.m.", "The hotel let guests checking out at 2 p.m."], "answer": 1, "why": "<em>let<\/em> + 人 + 原形：<em>let guests check out<\/em>。加了 <em>to<\/em> 或換成 Ving 都不合 <em>let<\/em> 的句型。"}], "takeaway": "<em>make、let、have<\/em> + 人 + 原形；意思相近的 <em>allow、ask、get<\/em> 要 to V。"}, {"h": "分詞當形容詞：-ing 還是 -ed", "body": ["Ving 和 p.p. 也可以放在名詞前面或 <em>be<\/em> 後面，當形容詞用。這時它們叫<b>分詞<\/b>：Ving 是現在分詞，p.p. 是過去分詞。", "<em>be<\/em> 後面接 Ving，有時是進行式（第 4 章），有時是形容詞。<em>The results were surprising.<\/em> 的 <em>surprising<\/em> 是形容詞：前面放得進 <em>very<\/em>（<em>very surprising<\/em>），意思是「令人意外的」，不是「正在使人意外」。", "選哪一個，問一個問題：被描述的名詞是<b>做<\/b>這個動作，還是<b>被做<\/b>。做，用 <em>-ing<\/em>；被做，用 <em>-ed<\/em>（p.p.）。這跟第 5 章的主動被動是同一個判斷。<em>the remaining tickets<\/em>：票自己剩下來，用 <em>-ing<\/em>。<em>the attached file<\/em>：檔案是被附上的，用 <em>-ed<\/em>。", "分詞不像有時態的動詞那樣標出過去、現在、未來。<em>the attached file<\/em> 不會因為「明天才附」就換個樣子，它只表示檔案和「附上」之間是被動的關係。所以選 <em>-ing<\/em> 還是 <em>-ed<\/em>，先問主動還是被動，不問時間。只有一類要多想一步：不及物動詞（第 5 章）沒有被動，它們的 <em>-ed<\/em> 放在名詞前面，意思是「已經……了」，是名詞自己做完了這個動作：<em>an expired contract<\/em>（已經到期的合約）、<em>a retired manager<\/em>（已經退休的經理）。這類動詞的 <em>-ing<\/em> 則是「正在……、快要……」：<em>an expiring contract<\/em>（快要到期的合約）、<em>rising prices<\/em>（正在上漲的價格）。這類字不多，遇到時 <em>-ing<\/em> 和 <em>-ed<\/em> 都可能是對的，意思不同。", "分詞也可以放在名詞後面，帶著自己後面的字一起說明這個名詞：<em>the contract signed by both parties<\/em>（被雙方簽署的合約）、<em>the staff attending the briefing<\/em>（出席說明會的員工）。選 <em>-ing<\/em> 還是 <em>-ed<\/em>，問題還是一樣：這個名詞是做，還是被做。這種寫法的作用和 <em>who<\/em>、<em>which<\/em> 帶頭的關係子句（第 9 章）一樣，只是沒有那個連接的字，也沒有有時態的動詞，所以是片語。", "門檻在表達感覺的字：<em>interest、bore、surprise、disappoint、confuse、frustrate<\/em>。這些英文動詞的意思是<b>讓人<\/b>產生感覺：<em>interest<\/em> 是「讓人感興趣」，<em>bore<\/em> 是「讓人無聊」。所以造成感覺的事物，用 <em>-ing<\/em>（<em>an interesting proposal<\/em>，提案讓人感興趣）；有這種感覺的人是被影響的一方，用 <em>-ed<\/em>（<em>interested investors<\/em>，投資人被引起興趣）。", "拿中文直翻就會出事：「我很無聊」寫成 <em>I was boring<\/em>，意思變成「我是個無聊的人」。要說自己覺得無聊，是 <em>I was bored<\/em>。"], "ex": [{"en": "The <u>remaining<\/u> tickets will be sold at the door.", "zh": "剩下的票會在門口販售。", "note": "票自己剩下來，是主動，用 <em>-ing<\/em>。"}, {"en": "Please read the <u>attached<\/u> file before the meeting.", "zh": "開會前請先讀附件。", "note": "檔案是被附上的，用 <em>-ed<\/em>。"}, {"en": "The results of the survey were <u>surprising<\/u>.", "zh": "調查結果很出人意料。"}, {"en": "Several investors were <u>interested<\/u> in the proposal.", "zh": "有幾位投資人對這個提案有興趣。"}, {"en": "The instructions were <u>confusing<\/u>, so many customers were <u>confused<\/u>.", "zh": "說明寫得讓人看不懂，所以很多顧客搞不清楚。", "note": "說明造成困惑，用 <em>-ing<\/em>；顧客感到困惑，用 <em>-ed<\/em>。"}], "table": {"head": ["動詞的意思", "<em>-ing<\/em>：造成感覺的事物", "<em>-ed<\/em>：有這種感覺的人"], "rows": [["<em>interest<\/em> 讓人感興趣", "<em>an interesting proposal<\/em>", "<em>interested investors<\/em>"], ["<em>disappoint<\/em> 讓人失望", "<em>disappointing sales<\/em>", "<em>disappointed shareholders<\/em>"], ["<em>confuse<\/em> 讓人困惑", "<em>confusing instructions<\/em>", "<em>confused customers<\/em>"], ["<em>surprise<\/em> 讓人意外", "<em>surprising results<\/em>", "<em>surprised managers<\/em>"]]}, "quiz": [{"type": "choose", "q": "<em>The new training program was very ___, and most employees enjoyed it.<\/em> 空格要填哪一個？", "options": ["interesting", "interested"], "answer": 0, "why": "主詞是訓練課程，它是讓人感興趣的事物，用 <em>-ing<\/em>。<em>interested<\/em> 要用在有興趣的人身上。"}, {"type": "choose", "q": "<em>Please sign the ___ form and return it to Human Resources.<\/em> 空格要填哪一個？", "options": ["enclosing", "enclosed"], "answer": 1, "why": "表格是被附在信裡的東西，是被做的一方，用 <em>-ed<\/em>。<em>enclosing<\/em> 的意思是表格自己在附上別的東西。"}], "takeaway": "名詞自己正在做，用 <em>-ing<\/em>；被做，用 <em>-ed<\/em>；感覺的字，讓人有感覺的事物用 <em>-ing<\/em>，有感覺的人用 <em>-ed<\/em>。"}, {"h": "分詞片語放句首：Located near the station, …", "body": ["分詞帶著自己後面的字，就成了一個分詞片語，例如 <em>located near the station<\/em>。它是片語（第 3 章）：沒有自己的主詞，也找不到有時態的動詞。", "分詞片語常放在句首，後面加逗號，再接主要子句（第 3 章）：<em>Located near the station, the hotel is popular with business travelers.<\/em> 它的作用是把兩句話併成一句：<em>The hotel is located near the station. It is popular with business travelers.<\/em>", "門檻是：<b>片語沒有主詞，所以它借用逗號後面的主詞<\/b>。讀者會自動把逗號後面那個主詞，當成做（或承受）片語裡那個動作的人或東西。所以判斷 Ving 還是 p.p.，步驟是：找到逗號後面的主詞；用這個主詞開頭，把片語還原成一句話；還原後是主動，用 Ving；是被動，用 p.p.。", "<em>Located near the station<\/em>：還原是 <em>The hotel is located near the station.<\/em>，被動，用 p.p.。<em>Looking for a larger office<\/em>：還原是 <em>The company was looking for a larger office.<\/em>，主動，用 Ving。", "主詞放錯會怎樣：<em>Located near the station, many travelers choose the hotel.<\/em> 逗號後面的主詞變成 <em>many travelers<\/em>，意思就成了「旅客位於車站附近」。句子看起來完整，意思卻歪了。分詞片語後面的主詞，一定要是片語在講的那個人或東西。", "分詞片語前面有時會加 <em>when、once、after<\/em> 這類字，例如 <em>Once approved, the request will be sent to Finance.<\/em>，判斷方法一樣：申請是被核准的，用 p.p.。這些字是什麼身分，第 8 章會講。"], "ex": [{"en": "<u>Located<\/u> near the main station, the Larkfield Hotel is popular with business travelers.", "zh": "Larkfield 飯店就在主要車站附近，很受商務旅客歡迎。", "note": "還原：<em>The Larkfield Hotel is located near the main station.<\/em> 被動，用 p.p.。"}, {"en": "<u>Founded<\/u> in 2004, Kestrel Logistics now has offices in nine countries.", "zh": "Kestrel 物流成立於 2004 年，現在在九個國家設有辦公室。", "note": "還原：<em>Kestrel Logistics was founded in 2004.<\/em> 公司是被創立的。"}, {"en": "<u>Looking<\/u> for a larger office, the company contacted three real estate agents.", "zh": "公司在找更大的辦公室，聯絡了三家房仲。", "note": "還原：<em>The company was looking for a larger office.<\/em> 公司自己在找，主動，用 Ving。"}], "quiz": [{"type": "choose", "q": "<em>___ by the strong sales figures, the manager decided to expand the program.<\/em> 空格要填哪一個？", "options": ["Encouraging", "Encouraged"], "answer": 1, "why": "逗號後面的主詞是 <em>the manager<\/em>。還原：<em>The manager was encouraged by the strong sales figures.<\/em> 經理是被鼓舞的一方，用 p.p.；<em>by<\/em> 後面也帶出了造成鼓舞的東西。"}, {"type": "tap", "q": "點出分詞片語 <em>Designed for small offices<\/em> 在描述的那個名詞，連同前面的 <em>the<\/em> 和形容詞一起點。", "sentence": "Designed for small offices, the new printer is compact and quiet.", "answer": [4, 5, 6], "why": "分詞片語借用逗號後面的主詞，也就是 <em>the new printer<\/em>。還原：<em>The new printer is designed for small offices.<\/em> <em>offices<\/em> 雖然離 <em>Designed<\/em> 比較近，但它在片語裡面，不是被描述的對象。"}], "takeaway": "句首的分詞片語借用逗號後面的主詞；還原成一句話，主詞在做就用 Ving，被做就用 p.p.。"}], "mistakes": [{"wrong": "I look forward to hear from you.", "right": "I look forward to hearing from you.", "why": "<em>look forward to<\/em> 的 <em>to<\/em> 是介系詞（<em>look forward to your reply<\/em> 說得通），接動作時用 Ving。"}, {"wrong": "The consultant suggested to hire a second designer.", "right": "The consultant suggested hiring a second designer.", "why": "<em>suggest<\/em> 後面接 Ving 或 <em>that<\/em> 子句，不接 to V。"}, {"wrong": "The manager let us to leave early on Friday.", "right": "The manager let us leave early on Friday.", "why": "<em>let<\/em> + 人 + 原形，中間不加 <em>to<\/em>。要用 to V，就換成 <em>allowed us to leave<\/em>。"}, {"wrong": "I was very boring during the three-hour meeting.", "right": "I was very bored during the three-hour meeting.", "why": "<em>bore<\/em> 是「讓人無聊」。<em>boring<\/em> 是讓別人無聊的人或事，<em>I was boring<\/em> 變成「我這個人很無聊」。自己覺得無聊，是被影響的一方，用 <em>bored<\/em>。"}, {"wrong": "Locating near the airport, the hotel is convenient for travelers.", "right": "Located near the airport, the hotel is convenient for travelers.", "why": "片語借用逗號後面的主詞 <em>the hotel<\/em>。還原：<em>The hotel is located near the airport.<\/em> 飯店是被安置在那裡（也就是位於那裡），用 p.p.。"}], "workbook": ["toing", "participle"]}, {"id": "agree", "n": 7, "title": "主詞和動詞一致", "en": "Subject-Verb Agreement", "lead": "英文的動詞要跟主詞配合：主詞是一個，用 <em>is、has、requires<\/em>；主詞是好幾個，用 <em>are、have、require<\/em>。中文的動詞不會跟著變，所以這件事很容易漏看。規則本身不難，難的是找到真正的主詞（第 2 章），因為它常常被一長串字擋在動詞前面。", "check": [{"type": "choose", "q": "<em>The list of approved suppliers ___ updated every month.<\/em> 空格要填哪一個？", "options": ["is", "are"], "answer": 0, "why": "劃掉 <em>of approved suppliers<\/em>，主詞是 <em>the list<\/em>，一份清單，用 <em>is<\/em>。離空格最近的 <em>suppliers<\/em> 不是主詞。"}, {"type": "choose", "q": "<em>Each of the meeting rooms ___ a projector.<\/em> 空格要填哪一個？", "options": ["has", "have"], "answer": 0, "why": "主詞是 <em>each<\/em>，「每一間」是一間一間看，用單數 <em>has<\/em>。<em>of the meeting rooms<\/em> 只是說明是哪些房間裡的每一間。"}, {"type": "choose", "q": "<em>There ___ several problems with the new schedule.<\/em> 空格要填哪一個？", "options": ["is", "are"], "answer": 1, "why": "<em>there<\/em> 不是主詞，真正的主詞在 <em>be<\/em> 後面：<em>several problems<\/em>，複數，用 <em>are<\/em>。"}, {"type": "choose", "q": "<em>A number of customers ___ asked about the new service.<\/em> 空格要填哪一個？", "options": ["has", "have"], "answer": 1, "why": "<em>a number of<\/em> 是「好幾個、不少」，講的是好幾位顧客，用 <em>have<\/em>。要是 <em>the number of<\/em>（……的數量），主詞是那個數字，才用 <em>has<\/em>。"}, {"type": "tap", "q": "點出決定動詞 <em>is<\/em> 的那個名詞（只點一個字）。", "sentence": "The cost of the repairs to the elevators is higher than expected.", "answer": [1], "why": "劃掉 <em>of the repairs to the elevators<\/em>，骨架是 <em>The cost is higher<\/em>。<em>repairs<\/em> 和 <em>elevators<\/em> 都是複數，但都在介系詞片語裡，不是主詞。"}], "sections": [{"h": "動詞跟著主詞變：在哪裡看得到", "body": ["主詞和動詞一致，意思是動詞的形式要配合主詞是一個還是好幾個。這一章說的<b>單數<\/b>，指的是一個人或一個東西，可以用 <em>he、she、it<\/em> 代替的那種；<b>複數<\/b>是好幾個，可以用 <em>they<\/em> 代替。<em>I<\/em> 和 <em>you<\/em> 有自己的形式（<em>I am、you are<\/em>），這裡不談。", "一致只在幾個地方看得到：現在式的一般動詞（<em>requires / require<\/em>，包括 <em>does / do<\/em>）、<em>be<\/em> 動詞（<em>is / are<\/em>、<em>was / were<\/em>），以及 <em>has / have<\/em>。過去式的一般動詞不分單複數（都是 <em>required<\/em>），<em>will、can、must<\/em> 後面的原形也不變。所以檢查一致時，先看動詞是不是這幾種；不是，就不用擔心。", "門檻是那個 <em>-s<\/em>。名詞加 <em>-s<\/em> 是複數（<em>clients<\/em>），現在式動詞加 <em>-s<\/em> 卻是<b>單數<\/b>（<em>requires<\/em>），方向剛好相反。所以 <em>The client requires<\/em> 和 <em>The clients require<\/em> 都對，<em>-s<\/em> 通常只出現在一邊。寫成 <em>The clients requires<\/em>，名詞已經是複數，動詞又加了代表單數的 <em>-s<\/em>，就錯了。（<em>news<\/em> 這類本身是單數的字，見第 7 節。）", "一致不只是形式，它也帶著資訊。<em>The manager of the two stores is<\/em> 告訴讀者主詞是一位經理；<em>The managers of the store are<\/em> 是好幾位經理。動詞選錯，讀者對「在講誰」的判斷就跟著錯。"], "ex": [{"en": "The client <u>requires<\/u> a signed copy of the agreement.", "zh": "客戶需要一份簽好的合約。", "note": "主詞 <em>the client<\/em> 是一位，現在式動詞加 <em>-s<\/em>。"}, {"en": "Our clients <u>require<\/u> a signed copy of the agreement.", "zh": "我們的客戶需要一份簽好的合約。", "note": "主詞 <em>our clients<\/em> 是好幾位，動詞不加 <em>-s<\/em>。"}, {"en": "The shipment <u>was<\/u> late, but the invoices <u>were<\/u> correct.", "zh": "貨晚到了，但發票是正確的。"}], "table": {"head": ["動詞的種類", "單數主詞", "複數主詞"], "rows": [["現在式一般動詞", "<em>The client requires<\/em>", "<em>The clients require<\/em>"], ["<em>be<\/em>（現在）", "<em>is<\/em>", "<em>are<\/em>"], ["<em>be<\/em>（過去）", "<em>was<\/em>", "<em>were<\/em>"], ["<em>have<\/em>（現在）", "<em>has<\/em>", "<em>have<\/em>"], ["過去式一般動詞", "<em>required<\/em>", "<em>required<\/em>（不變）"], ["<em>will、can、must<\/em> + 原形", "<em>will require<\/em>", "<em>will require<\/em>（不變）"]]}, "quiz": [{"type": "choose", "q": "下面哪一句，把主詞換成複數（<em>the managers<\/em>）以後，動詞不用改？", "options": ["The manager approves every expense.", "The manager approved every expense.", "The manager is in Eastfield this week."], "answer": 1, "why": "<em>approved<\/em> 是過去式的一般動詞，單複數都一樣。<em>approves<\/em> 是現在式，要改成 <em>approve<\/em>；<em>is<\/em> 要改成 <em>are<\/em>。"}], "takeaway": "一致只在現在式、<em>be<\/em> 和 <em>have<\/em> 上看得到；動詞的 <em>-s<\/em> 代表單數，和名詞剛好相反。"}, {"h": "找真正的主詞：劃掉中間的字", "body": ["決定動詞的是真正的主詞，也就是主詞那一串字裡的中心名詞（第 2 章）。麻煩的是，中心名詞後面常常跟著一串補充說明，把動詞推得很遠，離動詞最近的名詞反而不是主詞。", "<em>The list of approved vendors is posted online.<\/em> 離 <em>is<\/em> 最近的是 <em>vendors<\/em>（複數），但主詞是 <em>list<\/em>，一份清單。<em>of approved vendors<\/em> 只是在說明是什麼清單。", "方法和第 2 章找中心名詞一樣：把主詞後面的介系詞片語（第 3 章；<em>of、in、for、with、on<\/em> 開頭的那一串）和插進來的子句用括號劃掉，剩下的就是骨架。<em>The list (of approved vendors) is posted online.<\/em> 骨架是 <em>The list is posted<\/em>，動詞跟 <em>list<\/em>。", "為什麼可以劃掉：拿掉這些字，句子的骨架還在，只是少了細節。能拿掉而句子不壞的部分，就不會是主詞。", "<em>along with、as well as、together with<\/em> 也是同一類。它們看起來像 <em>and<\/em>，文法上卻是插在中間的片語，通常前後用逗號隔開，一樣劃掉。<em>Ms. Chen, along with her two assistants, is attending the fair.<\/em> 動詞跟 <em>Ms. Chen<\/em>。", "「劃掉 <em>of<\/em> 片語」有一個例外：前面是數量的時候，像 <em>most of、some of、all of、half of<\/em>，動詞要看 <em>of<\/em> 後面的名詞。<em>Most of the budget has been spent.<\/em>（預算，一筆，用單數）；<em>Most of the rooms have been booked.<\/em>（房間，好幾間，用複數）。這類數量詞在第 13 章細講。"], "ex": [{"en": "The <u>list<\/u> of approved vendors <u>is<\/u> posted on the intranet.", "zh": "核准廠商的名單公告在內部網站上。", "note": "劃掉 <em>of approved vendors<\/em>，剩下 <em>The list is posted<\/em>。"}, {"en": "The <u>quality<\/u> of our products <u>has<\/u> improved this year.", "zh": "我們產品的品質今年提升了。"}, {"en": "The <u>report<\/u> that the consultants prepared <u>is<\/u> very detailed.", "zh": "顧問們準備的報告非常詳細。", "note": "<em>that the consultants prepared<\/em> 是插進來的子句，主詞還是 <em>the report<\/em>。"}, {"en": "<u>Ms. Chen<\/u>, along with her two assistants, <u>is<\/u> attending the trade fair.", "zh": "Chen 女士連同她的兩位助理，正在參加商展。", "note": "<em>along with<\/em> 那一段夾在逗號中間，劃掉後動詞跟 <em>Ms. Chen<\/em>。"}], "quiz": [{"type": "tap", "q": "點出決定動詞 <em>need<\/em> 的那個名詞（只點一個字）。", "sentence": "The boxes in the storage room need to be moved by Friday.", "answer": [1], "why": "劃掉 <em>in the storage room<\/em>，骨架是 <em>The boxes need to be moved<\/em>。<em>room<\/em> 離動詞最近，但它在介系詞片語裡。"}, {"type": "choose", "q": "<em>The results of the customer survey ___ been sent to all managers.<\/em> 空格要填哪一個？", "options": ["has", "have"], "answer": 1, "why": "劃掉 <em>of the customer survey<\/em>，主詞是 <em>the results<\/em>，複數，用 <em>have<\/em>。<em>survey<\/em> 是單數，又緊挨著空格，但它不是主詞。"}], "takeaway": "劃掉主詞後面的介系詞片語和插進來的子句，剩下的中心名詞才決定動詞。"}, {"h": "each、every、one of、either of：都是「一個」", "body": ["<em>each<\/em> 和 <em>every<\/em> 雖然在講一整群，看的方式卻是一個一個看：每一位員工、每一間客房。所以 <em>each<\/em>、<em>every<\/em> 後面接單數名詞，動詞也用單數：<em>Every employee receives a handbook.<\/em>", "<em>each of the<\/em> + 複數名詞，主詞是 <em>each<\/em>（每一個），動詞還是單數：<em>Each of the rooms has a coffee maker.<\/em> 照上一節把 <em>of the rooms<\/em> 劃掉，剩下 <em>Each has<\/em>。", "門檻在 <em>one of the<\/em> + 複數名詞。這個寫法裡有兩個方向相反的規定：名詞要<b>複數<\/b>，因為是「好幾家裡面的一家」；動詞要<b>單數<\/b>，因為主詞是 <em>one<\/em>。<em>One of our suppliers has raised its prices.<\/em> 常見的錯有兩種：名詞寫成單數（<em>one of our supplier<\/em>），或動詞跟著 <em>suppliers<\/em> 變成 <em>have<\/em>。", "<em>either of<\/em>、<em>neither of<\/em> 和 <em>each of<\/em> 一樣，主詞是 <em>either<\/em>、<em>neither<\/em>，動詞用單數：<em>Either of the two dates is fine with me.<\/em> 字尾是 <em>-one<\/em>、<em>-body<\/em> 的字也是「一個一個看」：<em>everyone、everybody、someone、anyone、no one<\/em>，動詞用單數：<em>Everyone has received the new schedule.<\/em>"], "ex": [{"en": "Every <u>employee receives<\/u> a copy of the handbook.", "zh": "每位員工都會收到一本手冊。"}, {"en": "<u>Each<\/u> of the hotel rooms <u>has<\/u> a coffee maker.", "zh": "每間客房都有咖啡機。"}, {"en": "<u>One<\/u> of our suppliers <u>has<\/u> raised its prices.", "zh": "我們有一家供應商漲價了。", "note": "<em>suppliers<\/em> 是複數（好幾家裡的一家），但主詞是 <em>one<\/em>，所以用 <em>has<\/em>。"}, {"en": "<u>Either<\/u> of the two dates <u>is<\/u> fine with me.", "zh": "這兩個日期我都可以。", "note": "主詞是 <em>either<\/em>（兩個裡面任何一個），劃掉 <em>of the two dates<\/em>，動詞用單數。"}], "table": {"head": ["寫法", "後面的名詞", "動詞"], "rows": [["<em>every<\/em>", "單數（<em>every employee<\/em>）", "單數"], ["<em>each<\/em>", "單數（<em>each room<\/em>）", "單數"], ["<em>each of the<\/em>", "複數（<em>each of the rooms<\/em>）", "單數"], ["<em>one of the<\/em>", "複數（<em>one of the suppliers<\/em>）", "單數"], ["<em>either of / neither of the<\/em>", "複數（<em>either of the dates<\/em>）", "單數"]]}, "quiz": [{"type": "choose", "q": "<em>One of the new printers ___ not working.<\/em> 空格要填哪一個？", "options": ["is", "are"], "answer": 0, "why": "主詞是 <em>one<\/em>，一台，用 <em>is<\/em>。<em>printers<\/em> 是複數，因為是好幾台裡的一台，但它不決定動詞。"}], "takeaway": "<em>each、every、one of、either of、neither of<\/em> 講的都是「一個」，動詞用單數；<em>one of<\/em> 後面的名詞卻要用複數。"}, {"h": "the number of 和 a number of", "body": ["這兩個只差 <em>the<\/em> 和 <em>a<\/em>，動詞卻相反。", "<em>the number of<\/em> + 複數名詞，意思是「……的<b>數量<\/b>」。主詞是 <em>number<\/em>，一個數字，用單數：<em>The number of applicants has doubled.<\/em>（應徵人數增加了一倍）。", "<em>a number of<\/em> + 複數名詞，意思是「<b>好幾個、不少<\/b>」，整串等於 <em>several<\/em> 或 <em>many<\/em>，真正在講的是後面那些人，用複數：<em>A number of applicants have asked about remote work.<\/em>", "測試方法：把 <em>a number of<\/em> 換成 <em>many<\/em>，句子還說得通，就用複數。<em>The number of applicants has doubled<\/em> 換成 <em>many<\/em>，變成「很多應徵者翻倍了」，說不通，因為這句講的是人數這個數字。"], "ex": [{"en": "The number of applicants <u>has<\/u> doubled this year.", "zh": "今年應徵的人數增加了一倍。"}, {"en": "A number of applicants <u>have<\/u> asked about remote work.", "zh": "有不少應徵者問到遠距工作。"}], "quiz": [{"type": "choose", "q": "<em>The number of complaints ___ dropped since we hired more staff.<\/em> 空格要填哪一個？", "options": ["has", "have"], "answer": 0, "why": "<em>the number of<\/em> 是「……的數量」，主詞是 <em>number<\/em> 這一個數字，用 <em>has<\/em>。"}], "takeaway": "<em>the number of<\/em> 是「一個數字」，用單數；<em>a number of<\/em> 是「好幾個」，用複數。"}, {"h": "there is 和 there are：主詞在後面", "body": ["<em>There is / There are<\/em> 是英文說「有」的句型。這裡的 <em>there<\/em> 不是主詞，只是先佔住句首的位置，真正的主詞在 <em>be<\/em> 動詞<b>後面<\/b>。", "所以這個句型要反過來讀：先往後看「有」的是什麼，再回頭決定 <em>is<\/em> 還是 <em>are<\/em>。一個，用 <em>is<\/em>；好幾個，用 <em>are<\/em>。換成別的時態也一樣：<em>there was / there were<\/em>、<em>there has been / there have been<\/em>。", "門檻在中文。中文的「有」不會變，所以很容易一律寫 <em>there is<\/em>。<em>There is several reasons<\/em> 唸起來很順，卻是錯的：主詞 <em>several reasons<\/em> 是複數。", "後面的主詞如果帶著介系詞片語，第 2 節的方法照用：<em>There is a list of local restaurants in your room.<\/em> 主詞是 <em>a list<\/em>，不是 <em>restaurants<\/em>。"], "ex": [{"en": "There <u>is<\/u> a spare key at the front desk.", "zh": "櫃台有一把備用鑰匙。"}, {"en": "There <u>are<\/u> three candidates for the position.", "zh": "這個職位有三位候選人。"}, {"en": "There <u>have been<\/u> several complaints about the noise.", "zh": "已經有好幾件關於噪音的投訴。"}, {"en": "There <u>is<\/u> a list of local restaurants in your room.", "zh": "您的房間裡有一份附近餐廳的清單。", "note": "主詞是 <em>a list<\/em>，<em>of local restaurants<\/em> 劃掉。"}], "quiz": [{"type": "tap", "q": "點出決定 <em>are<\/em> 的那個名詞（只點一個字）。", "sentence": "There are two new projects on the agenda this week.", "answer": [4], "why": "<em>there<\/em> 只是佔位置，<em>be<\/em> 後面的 <em>two new projects<\/em> 才是主詞，中心名詞是 <em>projects<\/em>，複數，所以用 <em>are<\/em>。<em>agenda<\/em> 在介系詞片語 <em>on the agenda<\/em> 裡。"}], "takeaway": "<em>there<\/em> 只是佔位置；真正的主詞在 <em>be<\/em> 後面，先往後看再決定 <em>is<\/em> 還是 <em>are<\/em>。"}, {"h": "兩個主詞：and、or、neither … nor", "body": ["主詞有時是兩個名詞連在一起。連接的字不同，動詞跟的對象就不同。", "<em>A and B<\/em>：兩個加在一起，用複數。<em>The sales manager and her assistant are visiting clients.<\/em>", "<em>A or B<\/em>、<em>either A or B<\/em>、<em>neither A nor B<\/em>：不是加在一起，而是二選一（或兩個都不），動詞跟<b>離動詞比較近的那一個<\/b>，也就是 B。<em>Neither the contract nor the invoices were signed.<\/em> 動詞跟 <em>invoices<\/em>；把兩個對調，<em>Neither the invoices nor the contract was signed.<\/em> 動詞就跟 <em>contract<\/em>。", "對照第 2 節：<em>A as well as B<\/em>、<em>A along with B<\/em> 意思和 <em>and<\/em> 很像，文法上卻是插在中間的片語，動詞只跟 A。<em>The CEO and two board members are attending.<\/em> 用 <em>are<\/em>；<em>The CEO, as well as two board members, is attending.<\/em> 用 <em>is<\/em>。意思差不多，動詞卻不同，差別全在連接的那個字。"], "ex": [{"en": "The sales manager and her assistant <u>are<\/u> visiting clients in Westbrook.", "zh": "業務經理和她的助理正在 Westbrook 拜訪客戶。"}, {"en": "Neither the contract nor the invoices <u>were<\/u> signed.", "zh": "合約和發票都還沒簽。", "note": "離動詞近的是 <em>the invoices<\/em>，複數。"}, {"en": "Neither the invoices nor the contract <u>was<\/u> signed.", "zh": "發票和合約都還沒簽。", "note": "對調以後，離動詞近的是 <em>the contract<\/em>，單數。"}, {"en": "The CEO, as well as two board members, <u>is<\/u> attending the opening.", "zh": "執行長連同兩位董事，將出席開幕式。", "note": "<em>as well as<\/em> 那一段夾在逗號中間，動詞跟 <em>the CEO<\/em>。"}], "table": {"head": ["寫法", "動詞跟誰", "例子"], "rows": [["<em>A and B<\/em>", "兩個加起來，複數", "<em>The CEO and the CFO are…<\/em>"], ["<em>A or B<\/em>", "靠近動詞的 B", "<em>Mr. Lee or his assistants are…<\/em>"], ["<em>either A or B<\/em>", "靠近動詞的 B", "<em>Either the assistants or Mr. Lee is…<\/em>"], ["<em>neither A nor B<\/em>", "靠近動詞的 B", "<em>Neither the contract nor the invoices were…<\/em>"], ["<em>A, as well as B,<\/em>", "只跟 A（第 2 節）", "<em>The CEO, as well as the CFO, is…<\/em>"]]}, "quiz": [{"type": "choose", "q": "<em>Neither the printer nor the scanners ___ working this morning.<\/em> 空格要填哪一個？", "options": ["was", "were"], "answer": 1, "why": "<em>neither A nor B<\/em>，動詞跟離它比較近的 B。B 是 <em>the scanners<\/em>，複數，用 <em>were<\/em>。"}], "takeaway": "<em>and<\/em> 把兩個加起來，用複數；<em>or、nor<\/em> 跟離動詞近的那個；<em>as well as<\/em> 不算，動詞跟前面的。"}, {"h": "團體、news、information：形狀和單複數不一定對得上", "body": ["前面都是先找主詞，再數它是一個還是好幾個。有幾類名詞，形狀會騙人。", "<b>集合名詞<\/b>是一個單數的字，指一群人：<em>team、committee、department、company、board<\/em>。把這群人當成一個團體來講時，動詞用單數：<em>The committee has approved the plan.<\/em> 英式英文有時把重點放在一個個成員身上，改用複數（<em>The committee have …<\/em>）；正式書面和商業文件用單數，英式、美式都能接受，本書的題目也以單數為準。", "<b>字尾有 <em>-s<\/em> 的單數名詞<\/b>：<em>news<\/em> 看起來像複數，其實是單數名詞，動詞用 <em>is<\/em>：<em>The news is encouraging.<\/em>", "<b>不可數名詞<\/b>（第 13 章）：<em>information、equipment、advice、furniture<\/em> 沒有複數形，當主詞時用單數：<em>The information on the website is out of date.<\/em> 中文的「資訊」「設備」常常指好幾樣東西，所以特別容易順手寫成 <em>are<\/em>。", "反過來，<em>people<\/em> 和 <em>police<\/em> 沒有 <em>-s<\/em>，講的卻是好幾個人，用複數：<em>The police are investigating the theft.<\/em>"], "ex": [{"en": "The marketing <u>department<\/u> <u>has<\/u> moved to the fourth floor.", "zh": "行銷部已經搬到四樓了。", "note": "<em>department<\/em> 是一個單位，當成一個團體，用單數。"}, {"en": "The <u>news<\/u> from our Eastfield office <u>is<\/u> encouraging.", "zh": "我們 Eastfield 辦公室傳來的消息令人振奮。", "note": "<em>news<\/em> 是單數名詞；<em>from our Eastfield office<\/em> 劃掉。"}, {"en": "The <u>information<\/u> on the website <u>is<\/u> updated every Monday.", "zh": "網站上的資訊每週一更新。", "note": "<em>information<\/em> 不可數，沒有複數形，用單數。"}], "quiz": [{"type": "choose", "q": "<em>The equipment in the meeting rooms ___ checked every month.<\/em> 空格要填哪一個？", "options": ["is", "are"], "answer": 0, "why": "<em>equipment<\/em> 是不可數名詞，沒有複數形，當主詞用單數 <em>is<\/em>。<em>in the meeting rooms<\/em> 是介系詞片語，劃掉；<em>rooms<\/em> 是複數，但它不是主詞。中文的「設備」可以指很多樣東西，英文卻只看這個字的類別。"}, {"type": "choose", "q": "<em>The committee ___ announced its decision.<\/em> 空格要填哪一個？", "options": ["has", "have"], "answer": 0, "why": "<em>committee<\/em> 是集合名詞，這裡當成一個團體；後面的 <em>its<\/em> 也是單數，所以用 <em>has<\/em>。"}], "takeaway": "名詞的形狀不一定等於單複數：一個團體、<em>news<\/em>、不可數名詞用單數；<em>people<\/em>、<em>police<\/em> 用複數。"}, {"h": "Ving 當主詞：一件事，用單數", "body": ["主詞不一定是名詞，也可以是一個 Ving 帶頭的片語：<em>Reducing costs is our top priority.<\/em> 主詞是「降低成本」這<b>一件事<\/b>，所以用單數 <em>is<\/em>。", "門檻是片語裡的複數名詞。<em>costs<\/em> 是複數，又剛好緊挨著動詞，很容易寫成 <em>are<\/em>。但 <em>costs<\/em> 只是 <em>reducing<\/em> 的受詞，主詞是整件事。不管 Ving 後面接什麼，一件事就是一件事。", "金額、時間、距離當成一個整體時也一樣：<em>Two weeks is enough time.<\/em> 講的是「兩週這段時間」，不是一週、一週分開算。"], "ex": [{"en": "Reducing costs <u>is<\/u> our top priority this year.", "zh": "降低成本是我們今年的首要目標。"}, {"en": "Meeting all three deadlines <u>was<\/u> not easy.", "zh": "要趕上三個期限並不容易。", "note": "<em>deadlines<\/em> 是複數，但主詞是「趕上期限」這件事。"}, {"en": "Two weeks <u>is<\/u> enough time to finish the report.", "zh": "兩週的時間夠把報告寫完。"}], "quiz": [{"type": "choose", "q": "<em>Answering customer emails ___ most of my morning.<\/em> 空格要填哪一個？", "options": ["takes", "take"], "answer": 0, "why": "主詞是 <em>Answering customer emails<\/em> 這一件事，用單數 <em>takes<\/em>。<em>emails<\/em> 是 <em>answering<\/em> 的受詞，不決定動詞。"}], "takeaway": "Ving 帶頭的主詞是一件事，用單數；不要被片語裡的複數名詞拉走。"}], "mistakes": [{"wrong": "The results of the survey shows a clear trend.", "right": "The results of the survey show a clear trend.", "why": "劃掉 <em>of the survey<\/em>，主詞是 <em>the results<\/em>，複數，動詞不加 <em>-s<\/em>。"}, {"wrong": "Each of the managers have a parking space.", "right": "Each of the managers has a parking space.", "why": "主詞是 <em>each<\/em>，一個一個看，用單數 <em>has<\/em>。"}, {"wrong": "There is several reasons for the delay.", "right": "There are several reasons for the delay.", "why": "<em>there<\/em> 不是主詞，<em>be<\/em> 後面的 <em>several reasons<\/em> 才是，複數，用 <em>are<\/em>。"}, {"wrong": "One of our suppliers have closed its factory.", "right": "One of our suppliers has closed its factory.", "why": "主詞是 <em>one<\/em>，一家，用 <em>has<\/em>。<em>suppliers<\/em> 保持複數，因為是好幾家裡的一家。"}, {"wrong": "The number of visitors have increased this month.", "right": "The number of visitors has increased this month.", "why": "<em>the number of<\/em> 的主詞是 <em>number<\/em>，一個數字，用單數 <em>has<\/em>。"}], "workbook": ["agree"]}, {"id": "connect", "n": 8, "title": "連接詞、介系詞、連接副詞", "en": "Conjunctions, Prepositions and Linking Adverbs", "lead": "<em>although、despite、however<\/em> 翻成中文都是「雖然、儘管、不過」，文法上卻是三種不同的字：連接詞、介系詞、連接副詞。選哪一個，不看中文意思，先看它後面接什麼：接子句（第 3 章）用連接詞，接名詞或 Ving 用介系詞，在句號或分號後面開一個新句子用連接副詞。這一章先把這個判斷練熟，再一組一組比較意思相近的字：原因、讓步、時間、條件、目的、一……就，最後講形狀對了以後怎麼用意思選。", "check": [{"type": "choose", "q": "<em>___ the heavy traffic, the driver delivered the order on time.<\/em> 空格要填哪一個？", "options": ["Although", "Despite", "However"], "answer": 1, "why": "空格後面到逗號是 <em>the heavy traffic<\/em>，找不到有時態的動詞，是名詞片語，要用介系詞 <em>Despite<\/em>。<em>Although<\/em> 是連接詞，後面要子句；<em>However<\/em> 是連接副詞，要開一個新句子。"}, {"type": "choose", "q": "<em>___ the truck broke down, the delivery was late.<\/em> 空格要填哪一個？", "options": ["Because", "Because of", "Therefore"], "answer": 0, "why": "空格後面是 <em>the truck broke down<\/em>，主詞 <em>the truck<\/em>，有時態的動詞 <em>broke<\/em>，是子句，要用連接詞 <em>Because<\/em>。<em>Because of<\/em> 是介系詞，只接名詞。<em>Therefore<\/em> 要放在句號或分號後面，而且後面接的是結果，不是原因。"}, {"type": "choose", "q": "哪一句的標點是對的？", "options": ["The flight was delayed, therefore we missed the meeting.", "The flight was delayed; therefore, we missed the meeting.", "The flight was delayed therefore, we missed the meeting."], "answer": 1, "why": "<em>therefore<\/em> 是連接副詞，不能把兩個子句接成一句，前面要有句號或分號，後面通常加逗號。只用逗號，或什麼都不用，兩個句子就黏在一起了。"}, {"type": "choose", "q": "<em>Please do not use your phone ___ the presentation.<\/em> 空格要填哪一個？", "options": ["while", "during", "meanwhile"], "answer": 1, "why": "空格後面是名詞 <em>the presentation<\/em>，要用介系詞 <em>during<\/em>。<em>while<\/em> 是連接詞，要接子句（<em>while the presentation is in progress<\/em>）；<em>meanwhile<\/em> 是連接副詞，要開新句子。"}, {"type": "choose", "q": "<em>You cannot enter the lab ___ a security badge.<\/em> 空格要填哪一個？", "options": ["unless", "without", "otherwise"], "answer": 1, "why": "空格後面是名詞片語 <em>a security badge<\/em>，要用介系詞 <em>without<\/em>。<em>unless<\/em> 是連接詞，要接子句（<em>unless you have a security badge<\/em>）；<em>otherwise<\/em> 是連接副詞，要開新句子。"}], "sections": [{"h": "三種字，差在後面接什麼", "body": ["<em>although、despite、however<\/em> 意思接近，都在說「前面那件事沒有擋住後面那件事」。中文都可以翻成「雖然、儘管、不過」，所以光看中文分不出來。它們的差別在文法：後面能接什麼。下面前三個例句說的是同一件事，請看每個字後面接的東西。", "<b>連接詞<\/b>後面接<b>子句<\/b>。<em>Although the budget was small<\/em>：<em>although<\/em> 後面是 <em>the budget was small<\/em>，主詞 <em>the budget<\/em>，有時態的動詞 <em>was<\/em>，是一個子句。<em>although<\/em> 這類連接詞把這個子句掛到主要子句上，讓它變成從屬子句（第 3 章）。<em>and、but、so<\/em> 比較特別：它們把兩個子句並排接起來，兩邊都還能單獨成句，而且只能站在兩個子句中間；<em>although<\/em>、<em>because<\/em> 帶頭的子句則可以搬到句首。", "<b>介系詞<\/b>後面接<b>名詞<\/b>、<b>名詞片語<\/b>（以名詞為中心的一串字，例如 <em>the small budget<\/em>），或 <b>Ving<\/b>。<em>Despite the small budget<\/em>：<em>the small budget<\/em> 裡沒有動詞，只是一個名詞片語。", "<b>連接副詞<\/b>不接在別人後面，它站在一個<b>新句子<\/b>的開頭。前一句已經用句號或分號結束了，<em>However<\/em> 後面加逗號，再接一個完整的句子。它負責說明兩句之間的關係，但沒有把兩句接成一句的文法能力。", "門檻是：怎麼確定後面是不是子句。方法只有一個：找<b>有時態的動詞<\/b>（第 2 章）。<em>the budget was small<\/em> 有 <em>was<\/em>，是子句；<em>the small budget<\/em> 沒有動詞，是名詞片語；<em>having a small budget<\/em> 雖然有動詞的樣子，但 Ving 不是有時態的動詞（第 3 章），所以也不是子句，介系詞可以接。", "所以遇到這類字，順序是：先看它後面到逗號為止的那一段，有沒有主詞＋有時態的動詞。有，用連接詞；只有名詞或 Ving，用介系詞；這個字前面已經是句號或分號，用連接副詞。<b>形狀決定是哪一類，意思決定是哪一個字。<\/b>"], "ex": [{"en": "<u>Although<\/u> the budget was small, we finished the project on time.", "zh": "雖然預算很少，我們還是準時完成了專案。", "note": "<em>although<\/em> + 子句（<em>the budget was small<\/em>）。"}, {"en": "<u>Despite<\/u> the small budget, we finished the project on time.", "zh": "儘管預算很少，我們還是準時完成了專案。", "note": "<em>despite<\/em> + 名詞片語（<em>the small budget<\/em>）。"}, {"en": "The budget was small. <u>However,<\/u> we finished the project on time.", "zh": "預算很少。不過，我們還是準時完成了專案。", "note": "前一句用句號結束，<em>However<\/em> 開一個新句子。"}, {"en": "<u>Despite<\/u> having a small budget, we finished the project on time.", "zh": "儘管預算很少，我們還是準時完成了專案。", "note": "<em>despite<\/em> + Ving：Ving 不是有時態的動詞，所以不是子句。"}], "table": {"head": ["種類", "後面接", "例子"], "rows": [["連接詞", "子句（主詞＋有時態的動詞）", "<em>although、because、while、unless、once、so that<\/em>"], ["介系詞", "名詞、名詞片語或 Ving", "<em>despite、because of、during、without、upon<\/em>"], ["連接副詞", "前面是句號或分號；後面通常加逗號，再接一個完整的句子", "<em>however、therefore、meanwhile、otherwise、moreover<\/em>"]]}, "quiz": [{"type": "tap", "q": "<em>Although<\/em> 是連接詞，後面接子句。點出這個子句裡那個有時態的動詞。", "sentence": "Although the client called twice, nobody answered the phone.", "answer": [3], "why": "<em>Although<\/em> 後面的子句是 <em>the client called twice<\/em>：主詞 <em>the client<\/em>，有時態的動詞 <em>called<\/em>（過去式）。<em>answered<\/em> 屬於逗號後面的主要子句。"}], "takeaway": "先看後面：子句用連接詞，名詞或 Ving 用介系詞，句號或分號之後的新句子用連接副詞。"}, {"h": "連接副詞的標點：句號、分號、逗號", "body": ["連接副詞的難處在標點。<em>however<\/em> 的中文是「但是、然而」，跟 <em>but<\/em> 一樣，所以很自然就把它當 <em>but<\/em> 用，寫成 <em>Sales fell, however profits rose.<\/em>", "<em>but<\/em> 是連接詞，有把兩個子句接成一句的能力，中間一個逗號就夠：<em>Sales fell, but profits rose.<\/em> <em>however<\/em> 是副詞，沒有這個能力。把它和一個逗號放在兩個子句中間，等於兩個完整的句子只靠一個逗號黏在一起，文法上是錯的，英文叫 <em>comma splice<\/em>（用逗號硬接兩句）。第 3 章說過：逗號只是停頓，不能把兩個子句接成一句。", "所以連接副詞前面要有真正能把句子隔開的標點：<b>句號<\/b>（後面大寫，開新句子），或<b>分號<\/b>（兩句並排，後面小寫）。連接副詞後面通常再加一個逗號。對的寫法有三種：句號 + <em>However,<\/em>；分號 + <em>however,<\/em>；或者乾脆換成連接詞 <em>but<\/em>，用逗號。", "分辨連接詞和連接副詞，還有一個方法：<b>能不能搬動<\/b>。連接副詞可以移到第二句的中間：<em>Profits, however, rose.<\/em> 連接詞只能站在它那個子句的最前面，<em>Profits, but, rose<\/em> 是不可能的。能搬動的就是副詞，前面就不能只靠逗號。", "這一節的規則適用於所有連接副詞：<em>however、therefore、as a result、meanwhile、otherwise、moreover、in addition<\/em>。後面每一節出現連接副詞，標點都照這裡。"], "ex": [{"en": "The venue was expensive. <u>However,<\/u> it was the only one available on that date.", "zh": "場地很貴。不過，那是那天唯一有空的場地。"}, {"en": "The venue was expensive; <u>however,<\/u> it was the only one available on that date.", "zh": "場地很貴；不過，那是那天唯一有空的場地。", "note": "分號後面小寫，兩句的關係看起來比用句號更緊。"}, {"en": "The venue was expensive, <u>but<\/u> it was the only one available on that date.", "zh": "場地很貴，但那是那天唯一有空的場地。", "note": "<em>but<\/em> 是連接詞，所以逗號就夠。"}, {"en": "The client, <u>however,<\/u> did not reply to our offer.", "zh": "不過，客戶沒有回覆我們的報價。", "note": "連接副詞可以搬到句子中間，前後用逗號隔開；連接詞做不到。"}], "table": {"head": ["寫法", "對還是錯", "為什麼"], "rows": [["<em>Sales fell. However, profits rose.<\/em>", "對", "句號結束前一句，<em>However<\/em> 開新句子"], ["<em>Sales fell; however, profits rose.<\/em>", "對", "分號把兩句並排"], ["<em>Sales fell, but profits rose.<\/em>", "對", "<em>but<\/em> 是連接詞，逗號就夠"], ["<em>Sales fell, however, profits rose.<\/em>", "錯", "只有逗號，兩個句子黏在一起"], ["<em>Sales fell, however profits rose.<\/em>", "錯", "同上，<em>however<\/em> 不是連接詞"]]}, "quiz": [{"type": "choose", "q": "哪一句的標點是對的？", "options": ["Our office will be closed on Monday, therefore, orders will ship on Tuesday.", "Our office will be closed on Monday. Therefore, orders will ship on Tuesday.", "Our office will be closed on Monday, therefore orders will ship on Tuesday."], "answer": 1, "why": "<em>therefore<\/em> 是連接副詞，前面要句號或分號。另外兩句只用逗號把兩個完整的句子接在一起，是錯的。"}], "takeaway": "連接副詞前面要句號或分號，後面通常加逗號；只用逗號接兩個句子是錯的。"}, {"h": "原因與結果：because、because of、therefore", "body": ["因果關係的字最多，也最能看出三種字的分工。", "後面是<b>原因<\/b>的：連接詞 <em>because、since、as<\/em> 接子句；介系詞 <em>because of、due to、owing to<\/em> 接名詞。<em>because<\/em> 和 <em>because of<\/em> 只差一個 <em>of<\/em>，身分就從連接詞變成介系詞。", "後面是<b>結果<\/b>的：連接副詞 <em>therefore、as a result、consequently<\/em> 開新句子；連接詞 <em>so<\/em> 用逗號接子句。<em>so<\/em> 和 <em>therefore<\/em> 意思一樣，標點不同，跟上一節的 <em>but<\/em> 和 <em>however<\/em> 是同一回事。", "門檻在<b>方向<\/b>。<em>because<\/em> 後面是原因，<em>therefore<\/em> 後面是結果，兩個剛好相反。<em>The road was closed. Therefore, the truck took another route.<\/em>：路封了（原因），卡車改道（結果）。如果把 <em>therefore<\/em> 換成 <em>because<\/em>：<em>The road was closed because the truck took another route.<\/em> 形狀沒問題，意思卻變成「路之所以封，是因為卡車改道」，因果整個倒過來。所以挑字之前先問：這個字後面是原因，還是結果。", "<em>due to<\/em> 後面也不接子句，只接名詞（或 Ving）。想接子句，要用 <em>because<\/em>，或寫成 <em>due to the fact that<\/em> + 子句（比較正式，也比較長）。", "<em>as a result<\/em> 和 <em>as a result of<\/em> 只差一個 <em>of<\/em>，方向卻相反。<em>as a result<\/em> 是連接副詞，後面是結果：<em>The road was closed. As a result, the truck took another route.<\/em> <em>as a result of<\/em> 是介系詞，後面是原因：<em>The truck took another route as a result of the road closure.<\/em>", "<em>since<\/em> 也可以表示原因，但它另外有「自從」的意思。後面是時間點（<em>since 2019<\/em>、<em>since we moved<\/em>），通常是「自從」；後面是理由，才是「因為」。"], "ex": [{"en": "The flight was canceled <u>because<\/u> a storm was approaching.", "zh": "航班取消了，因為暴風雨正在接近。", "note": "<em>because<\/em> + 子句，後面是原因。"}, {"en": "The flight was canceled <u>because of<\/u> the approaching storm.", "zh": "航班因為逼近的暴風雨而取消。", "note": "<em>because of<\/em> + 名詞片語。"}, {"en": "A storm was approaching. <u>Therefore,<\/u> the flight was canceled.", "zh": "暴風雨正在接近，因此航班取消了。", "note": "<em>Therefore<\/em> 開新句子，後面是結果。"}, {"en": "A storm was approaching, <u>so<\/u> the flight was canceled.", "zh": "暴風雨正在接近，所以航班取消了。", "note": "<em>so<\/em> 是連接詞，逗號就夠。"}, {"en": "<u>Due to<\/u> rising costs, we will raise our prices in May.", "zh": "由於成本上漲，我們五月會調漲價格。", "note": "<em>due to<\/em> + 名詞片語（<em>rising costs<\/em>）。"}], "table": {"head": ["方向", "連接詞（+ 子句）", "介系詞（+ 名詞／Ving）", "連接副詞（新句子）"], "rows": [["後面是原因", "<em>because、since、as<\/em>", "<em>because of、due to、owing to、as a result of<\/em>", "（沒有）"], ["後面是結果", "<em>so<\/em>（前面加逗號）", "（沒有）", "<em>therefore、as a result、consequently<\/em>"]]}, "quiz": [{"type": "choose", "q": "<em>Our main supplier closed its factory. ___, we had to find a new one.<\/em> 空格要填哪一個？", "options": ["Because", "Because of", "As a result"], "answer": 2, "why": "空格在句號後面的新句子開頭，後面還有逗號，要連接副詞。而且後面「我們得找新的供應商」是結果，不是原因。<em>Because<\/em> 是連接詞，<em>Because of<\/em> 是介系詞，都不能這樣單獨放在句首再加逗號。"}], "takeaway": "<em>because<\/em> 接子句、<em>because of<\/em> 接名詞，後面都是原因；<em>therefore<\/em> 開新句子，後面是結果。"}, {"h": "讓步：although、despite、however", "body": ["讓步的意思是：前面那件事照理會擋住後面那件事，結果沒有擋住。飯店很小，照理服務會普通，結果服務很好。", "三種字：連接詞 <em>although、even though、though<\/em> 接子句；介系詞 <em>despite、in spite of<\/em> 接名詞或 Ving；連接副詞 <em>however、nevertheless<\/em> 開新句子。連接詞 <em>but<\/em> 也表示對比，用逗號接子句。", "門檻是 <em>despite<\/em>。它和 <em>although<\/em> 意思一樣，很自然會接子句：<em>Despite the hotel was small<\/em>，這是錯的。<em>despite<\/em> 是介系詞，後面要名詞（<em>despite its small size<\/em>）或 Ving（<em>despite being small<\/em>）。真的要接子句，就換成 <em>although<\/em>，或寫成 <em>despite the fact that<\/em> + 子句。", "兩個小地方：<em>in spite of<\/em> 有 <em>of<\/em>，<em>despite<\/em> 沒有，<em>despite of<\/em> 是錯的。<em>even<\/em> 單獨不是「儘管」的連接詞：<em>Even the store was busy, …<\/em> 會被讀成「連商店都很忙」，不是「儘管商店很忙」。要表示讓步，要說 <em>Even though the store was busy, …<\/em>。", "還有一個中文帶來的錯：<em>although<\/em> 和 <em>but<\/em> 不能用在同一句。中文說「雖然……，但是……」很自然，英文的 <em>although<\/em> 和 <em>but<\/em> 卻都是連接詞，兩個搶同一個連接的位置，只能留一個：<em>Although the hotel was small, the service was excellent.<\/em> 或 <em>The hotel was small, but the service was excellent.<\/em>"], "ex": [{"en": "<u>Although<\/u> the hotel was small, the service was excellent.", "zh": "雖然飯店很小，服務卻很好。"}, {"en": "<u>Despite<\/u> its small size, the hotel offered excellent service.", "zh": "儘管規模小，這家飯店的服務很好。", "note": "<em>despite<\/em> + 名詞片語。"}, {"en": "The hotel was small. <u>However,<\/u> the service was excellent.", "zh": "飯店很小。不過，服務很好。"}, {"en": "<u>Despite<\/u> having little experience, Ms. Ng handled the negotiation well.", "zh": "儘管經驗不多，Ng 女士把談判處理得很好。", "note": "<em>despite<\/em> + Ving：Ving 不是有時態的動詞，所以不是子句。"}, {"en": "The hotel was small, <u>but<\/u> the service was excellent.", "zh": "飯店很小，但服務很好。", "note": "<em>but<\/em> 是連接詞，用逗號；前面就不能再加 <em>although<\/em>。"}], "table": {"head": ["看哪裡", "連接詞（+ 子句）", "介系詞（+ 名詞／Ving）", "連接副詞（新句子）"], "rows": [["字", "<em>although、even though、though<\/em>", "<em>despite、in spite of<\/em>", "<em>however、nevertheless<\/em>"], ["例子", "<em>although the hotel was small<\/em>", "<em>despite its small size<\/em>", "<em>The hotel was small. However, …<\/em>"]]}, "quiz": [{"type": "choose", "q": "<em>___ the printer is new, it breaks down every week.<\/em> 空格要填哪一個？", "options": ["Although", "Despite", "However"], "answer": 0, "why": "空格後面是 <em>the printer is new<\/em>，主詞 <em>the printer<\/em>，有時態的動詞 <em>is<\/em>，是子句，要用連接詞 <em>Although<\/em>。<em>Despite<\/em> 只接名詞或 Ving；<em>However<\/em> 要放在句號或分號後面。"}], "takeaway": "意思都是「雖然」：<em>although<\/em> 接子句，<em>despite<\/em> 接名詞或 Ving，<em>however<\/em> 開新句子；<em>although<\/em> 和 <em>but<\/em> 只能留一個。"}, {"h": "時間：while、during、meanwhile", "body": ["講「在……的時候、在……期間」，三種字又各有一個：連接詞 <em>while<\/em> 接子句；介系詞 <em>during<\/em> 接名詞；連接副詞 <em>meanwhile<\/em>、<em>in the meantime<\/em> 開新句子，意思是「在這同時、在這段期間」。", "門檻是 <em>during<\/em>。中文「在我待在海港市的期間」很自然，於是寫出 <em>during I was in Harbor City<\/em>。<em>during<\/em> 是介系詞，後面只能是名詞：<em>during my stay in Harbor City<\/em>、<em>during the meeting<\/em>。要接子句，就用 <em>while<\/em>：<em>while I was in Harbor City<\/em>。", "<em>meanwhile<\/em> 常用在「那件事還沒好，這段時間先這樣做」：<em>The new kitchen will be installed next week. Meanwhile, lunch will be served in the lobby.<\/em> 它跟所有連接副詞一樣，前面要句號或分號。", "<em>while<\/em> 另外有對比的意思：<em>While sales rose in Asia, they fell in Europe.<\/em>（亞洲銷售上升，歐洲卻下降）。不管是哪個意思，它都是連接詞，後面接子句；是時間還是對比，靠上下文判斷。", "再看 <em>before、after、until、since<\/em>：它們<b>兩種身分都有<\/b>。<em>after the meeting<\/em> 是介系詞 + 名詞；<em>after the meeting ended<\/em> 是連接詞 + 子句（<em>ended<\/em> 是有時態的動詞）。這幾個字正好說明本章的原則：判斷時看後面接什麼，不是看這個字本身。", "有一個寫法看起來像例外：<em>Please do not use your phone while driving.<\/em> <em>while<\/em> 後面直接接 Ving，好像變成了介系詞。其實這是子句的縮短：從屬子句的主詞和主要子句的主詞是同一個時，可以把主詞和 <em>be<\/em> 一起拿掉。<em>while you are driving<\/em> 縮成 <em>while driving<\/em>，<em>while<\/em> 還是連接詞，只是後面的子句變短了。這是「找有時態的動詞」這個測試會失靈的地方：縮短以後，裡面找不到有時態的動詞，看起來像片語。分辨的方法看帶頭的字：<em>after、before<\/em> 本來就有介系詞的身分，接 Ving 照上一段處理（<em>after signing<\/em>）；<em>while、when、once<\/em> 沒有介系詞的身分，後面接 Ving 或 p.p.，就是縮短的子句。", "<em>when、once<\/em> 也常這樣縮：<em>When filling out the form, …<\/em>、<em>Once approved, …<\/em>。第 6 章最後一節的分詞片語，前面加上這些字，就是這種寫法；選 Ving 還是 p.p.，一樣把它還原成完整的子句，看主詞是做還是被做。兩個主詞不同就不能縮：<em>While driving, the phone rang.<\/em> 變成「電話在開車」。少數固定說法是例外，被省略的主詞是沒有實際意思的 <em>it<\/em>，已經當成慣用語：<em>if necessary、when possible、unless otherwise stated<\/em>。"], "ex": [{"en": "Please keep your phone on silent <u>while<\/u> the workshop is in progress.", "zh": "工作坊進行時，請把手機轉成靜音。", "note": "<em>while<\/em> + 子句（<em>the workshop is in progress<\/em>）。"}, {"en": "Please keep your phone on silent <u>during<\/u> the workshop.", "zh": "工作坊期間，請把手機轉成靜音。", "note": "<em>during<\/em> + 名詞（<em>the workshop<\/em>）。"}, {"en": "The new kitchen will be installed next week. <u>Meanwhile,<\/u> lunch will be served in the lobby.", "zh": "新廚房下週安裝。這段期間，午餐改在大廳供應。"}, {"en": "<u>While<\/u> sales rose in Asia, they fell in Europe.", "zh": "亞洲的銷售上升，歐洲卻下降。", "note": "這個 <em>while<\/em> 是對比，不是時間，但一樣接子句。"}, {"en": "Please do not use your phone <u>while<\/u> driving a company vehicle.", "zh": "駕駛公司車輛時，請不要使用手機。", "note": "完整的是 <em>while you are driving<\/em>：主詞和主要子句相同，<em>you are<\/em> 一起省略。"}], "table": {"head": ["字", "身分", "後面接", "例子"], "rows": [["<em>while<\/em>", "連接詞", "子句", "<em>while the workshop is in progress<\/em>"], ["<em>during<\/em>", "介系詞", "名詞", "<em>during the workshop<\/em>"], ["<em>meanwhile、in the meantime<\/em>", "連接副詞", "新句子", "<em>… next week. Meanwhile, …<\/em>"], ["<em>before、after、until、since<\/em>", "連接詞或介系詞", "子句或名詞，看實際接什麼", "<em>after the meeting<\/em>／<em>after the meeting ended<\/em>"]]}, "quiz": [{"type": "choose", "q": "<em>After the contract was signed, the team celebrated over dinner.<\/em> 這裡的 <em>After<\/em> 是什麼？", "options": ["連接詞，因為後面接子句 <em>the contract was signed<\/em>", "介系詞，因為後面接名詞 <em>the contract<\/em>"], "answer": 0, "why": "<em>After<\/em> 後面到逗號為止是 <em>the contract was signed<\/em>：主詞 <em>the contract<\/em>，有時態的動詞 <em>was signed<\/em>（被動，第 5 章），是子句，所以這個 <em>After<\/em> 是連接詞。只看到 <em>the contract<\/em> 就停下來，會漏掉後面的動詞。"}, {"type": "choose", "q": "<em>Please wear a helmet ___ on the construction site.<\/em> 空格要填哪一個？", "options": ["while worked", "while working", "meanwhile working"], "answer": 1, "why": "戴安全帽的是 <em>you<\/em>，<em>you<\/em> 也是做 <em>work<\/em> 這個動作的人，所以還原成 <em>while you are working<\/em>，主動，用 Ving；<em>while<\/em> 是連接詞，後面的子句縮短了。<em>worked<\/em> 是 p.p.，表示被做，不合。<em>meanwhile<\/em> 是連接副詞，要開新句子，不能接在句中。"}], "takeaway": "<em>while<\/em> 接子句，<em>during<\/em> 接名詞，<em>meanwhile<\/em> 開新句子；<em>before、after、until、since<\/em> 兩種都行，看後面。"}, {"h": "條件：unless、without、otherwise", "body": ["講「如果不……，就……」，三種字是：連接詞 <em>unless<\/em> 接子句；介系詞 <em>without<\/em> 接名詞或 Ving；連接副詞 <em>otherwise<\/em> 開新句子。", "<em>unless<\/em> 的意思是「除非」，大致等於 <em>if … not<\/em>。<em>We cannot ship the order unless we receive payment.<\/em> 等於 <em>if we do not receive payment<\/em>。門檻是：<em>unless<\/em> 本身已經帶著「不」，後面的子句通常寫成肯定句。再加一個 <em>not<\/em>，就等於否定兩次，意思會反過來：<em>unless we do not receive payment<\/em> 變成「如果收到款項，就不能出貨」。", "說「大致」，是因為兩者不能完全互換。<em>unless<\/em> 說的是「照這樣進行，除非出現這個例外」。主要子句在說「這件事沒發生」會引起的反應（驚訝、失望）時，要用 <em>if … not<\/em>：<em>We will be surprised if the shipment does not arrive today.<\/em> 換成 <em>unless the shipment arrives today<\/em> 就不自然。第 10 章會再講。", "<em>without<\/em> 是介系詞，後面不能接子句：<em>without we receive payment<\/em> 是錯的，要寫 <em>without payment<\/em> 或 <em>without receiving payment<\/em>。", "<em>otherwise<\/em> 的意思是「不然的話」，它把前一句當成條件：<em>Please send payment by Friday. Otherwise, the order will be canceled.<\/em> 就是「如果你沒在星期五前付款，訂單就會取消」。它是連接副詞，前面要句號或分號。", "其他表示條件的字也照這個分法：連接詞 <em>if、as long as、provided that<\/em> 接子句；介系詞 <em>in the event of、in case of<\/em> 接名詞（<em>in the event of a fire<\/em>）。", "<em>unless<\/em>、<em>if<\/em> 帶頭的是條件子句（第 4 章第 8 節）。講未來的事時，條件子句用現在式，不用 <em>will<\/em>：<em>unless you register by Friday<\/em>，不寫 <em>unless you will register<\/em>。"], "ex": [{"en": "We cannot ship the order <u>unless<\/u> we receive payment.", "zh": "除非收到款項，否則我們無法出貨。", "note": "<em>unless<\/em> + 子句，子句本身是肯定的。"}, {"en": "We cannot ship the order <u>without<\/u> payment.", "zh": "沒有款項，我們無法出貨。", "note": "<em>without<\/em> + 名詞。"}, {"en": "Visitors cannot enter the lab <u>without<\/u> showing a photo ID.", "zh": "訪客沒出示附照片的證件，就不能進實驗室。", "note": "<em>without<\/em> + Ving。"}, {"en": "Please send payment by Friday. <u>Otherwise,<\/u> the order will be canceled.", "zh": "請在星期五前付款，不然訂單會被取消。"}, {"en": "<u>In the event of<\/u> a fire, use the stairs, not the elevator.", "zh": "萬一發生火災，請走樓梯，不要搭電梯。", "note": "<em>in the event of<\/em> + 名詞。"}], "table": {"head": ["意思", "連接詞（+ 子句）", "介系詞（+ 名詞／Ving）", "連接副詞（新句子）"], "rows": [["如果不……", "<em>unless<\/em>", "<em>without<\/em>", "<em>otherwise<\/em>"], ["如果、只要、萬一", "<em>if、as long as、provided that<\/em>", "<em>in the event of、in case of<\/em>", "（沒有）"]]}, "quiz": [{"type": "choose", "q": "<em>___ you sign up by June 1, you will not receive the early-bird price.<\/em> 空格要填哪一個？", "options": ["Unless", "Without", "Otherwise"], "answer": 0, "why": "空格後面是 <em>you sign up by June 1<\/em>，主詞 <em>you<\/em>，有時態的動詞 <em>sign up<\/em>，是子句，要用連接詞 <em>Unless<\/em>。<em>Without<\/em> 是介系詞，不接子句；<em>Otherwise<\/em> 要開新句子。"}], "takeaway": "<em>unless<\/em> 接子句、<em>without<\/em> 接名詞或 Ving、<em>otherwise<\/em> 開新句子，意思都是「不這樣的話」。"}, {"h": "目的：so that、in order to", "body": ["講「為了……」，有兩種形狀：連接詞 <em>so that<\/em> 接子句；<em>in order to<\/em> 接原形。", "<em>in order to<\/em> 的 <em>to<\/em> 是 to V 的 <em>to<\/em>（第 6 章），不是介系詞，所以接原形：<em>in order to reduce costs<\/em>。它也可以只寫 <em>to<\/em>：<em>to reduce costs<\/em>。", "<em>so that<\/em> 後面是完整的子句，通常帶 <em>can、could、will、would<\/em>：<em>so that more staff could apply<\/em>。", "門檻是<b>誰去做那個目的<\/b>。<em>in order to<\/em> 沒有自己的主詞，做這個動作的就是主要子句的主詞。<em>so that<\/em> 帶著子句，可以換一個主詞。<em>Please arrive early so that the tour can start on time.<\/em> 早到的是你，準時開始的是參觀行程，兩個主詞不同，要用 <em>so that<\/em>（比較正式的 <em>in order for the tour to start on time<\/em> 也可以，這本書不細講）。寫成 <em>in order to the tour can start<\/em>，<em>to<\/em> 後面接了一個子句，句子就壞了。", "還要分清楚 <em>so that<\/em> 和 <em>so<\/em>。<em>so that<\/em> 是目的（為了），<em>so<\/em> 是結果（所以，第 3 節）。<em>We left early so that we could catch the train.<\/em> 是為了趕上火車才早走，有沒有趕上不知道；<em>We left early, so we caught the train.<\/em> 是早走了，結果趕上了。口語和一般書信裡，目的的 <em>so that<\/em> 常把 <em>that<\/em> 省掉：<em>We left early so we could catch the train.<\/em> 這時看兩個線索：結果的 <em>so<\/em> 前面有逗號，後面是已經發生的事；目的的 <em>so<\/em> 前面通常沒有逗號，後面的子句帶 <em>can、could、will、would<\/em>。"], "ex": [{"en": "We extended the deadline <u>so that<\/u> more staff could apply.", "zh": "我們延長了截止日，讓更多員工可以申請。"}, {"en": "We extended the deadline <u>in order to<\/u> give staff more time.", "zh": "我們延長截止日，是為了給員工更多時間。", "note": "<em>in order to<\/em> + 原形；給時間的是主詞 <em>we<\/em>。"}, {"en": "Please arrive by 8:30 <u>so that<\/u> the tour can start on time.", "zh": "請在 8:30 前到，好讓參觀行程準時開始。", "note": "子句的主詞換成了 <em>the tour<\/em>，所以用 <em>so that<\/em>，不能用 <em>in order to<\/em>。"}, {"en": "The train was delayed, <u>so<\/u> we took a taxi.", "zh": "火車誤點，所以我們搭了計程車。", "note": "<em>so<\/em> 前面有逗號，後面是已經發生的事（搭了計程車），是結果，不是目的。"}], "quiz": [{"type": "choose", "q": "<em>The company hired two more technicians ___ reduce waiting times.<\/em> 空格要填哪一個？", "options": ["so that", "in order to", "because"], "answer": 1, "why": "空格後面是原形 <em>reduce<\/em>，沒有自己的主詞，要用 <em>in order to<\/em>。<em>so that<\/em> 和 <em>because<\/em> 都是連接詞，後面要接完整的子句（例如 <em>so that waiting times would drop<\/em>）。"}], "takeaway": "目的：<em>so that<\/em> 接子句，可以換主詞；<em>in order to<\/em> 接原形；前面有逗號、後面是已經發生的事的 <em>so<\/em> 才是「所以」。"}, {"h": "一……就：once、as soon as、upon", "body": ["講「一……就……」：連接詞 <em>once、as soon as<\/em> 接子句；介系詞 <em>upon<\/em>（或 <em>on<\/em>）接名詞或 Ving。", "門檻是 <em>once<\/em> 這個字。很多人先想到的是「一次」：<em>We met once.<\/em> 那是副詞。在這裡它是「一旦、一……就」，是連接詞。判斷方法還是看後面：<em>once<\/em> 後面接子句，就是連接詞。<em>Once the payment is received, your order will be shipped.<\/em>", "<em>once<\/em>、<em>as soon as<\/em> 帶頭的是時間子句（第 4 章第 8 節）。這類句子講的常常是未來，主要子句用 <em>will<\/em>，時間子句卻用現在式：<em>once the payment is received<\/em>，不寫 <em>once the payment will be received<\/em>。", "<em>upon<\/em> 比較正式，常出現在公告和信件裡：<em>upon arrival<\/em>（一抵達）、<em>upon completion<\/em>（一完成）、<em>upon receiving your application<\/em>（一收到您的申請）。它是介系詞，所以 <em>upon you arrive<\/em> 是錯的。"], "ex": [{"en": "<u>Once<\/u> the payment is received, your order will be shipped.", "zh": "款項一收到，您的訂單就會出貨。", "note": "講的是未來，但 <em>once<\/em> 子句用現在式 <em>is received<\/em>。"}, {"en": "<u>As soon as<\/u> the meeting ends, please send me the notes.", "zh": "會議一結束，請把紀錄寄給我。"}, {"en": "<u>Upon<\/u> arrival, guests will receive a welcome packet.", "zh": "住客一抵達，就會拿到一份歡迎資料。", "note": "<em>upon<\/em> + 名詞。"}, {"en": "<u>Upon<\/u> receiving your application, we will contact you by email.", "zh": "一收到您的申請，我們就會以電子郵件與您聯絡。", "note": "<em>upon<\/em> + Ving。"}], "quiz": [{"type": "choose", "q": "<em>___ completion of the course, participants will receive a certificate.<\/em> 空格要填哪一個？", "options": ["Once", "As soon as", "Upon"], "answer": 2, "why": "空格後面是名詞片語 <em>completion of the course<\/em>，找不到有時態的動詞，要用介系詞 <em>Upon<\/em>。<em>Once<\/em> 和 <em>As soon as<\/em> 是連接詞，要接子句，例如 <em>Once the course is completed<\/em>。"}], "takeaway": "<em>once、as soon as<\/em> 接子句，<em>upon<\/em> 接名詞或 Ving；意思都是「一……就」。"}, {"h": "形狀對了，再用意思選", "body": ["前面每一節都是同一個意思配三種形狀。實際讀句子時，往往是反過來：形狀先幫你刪掉不合的類別，剩下同一類的幾個字，再用<b>意思<\/b>選。", "用意思選的方法：讀前後兩部分，問它們是什麼關係。方向相反、出乎意料，是<b>讓步、對比<\/b>；前面造成後面，是<b>原因、結果<\/b>；前面是後面的前提，是<b>條件<\/b>；兩件事的先後或同時，是<b>時間<\/b>；後面是前面的用意，是<b>目的<\/b>；往同一個方向再加一點，是<b>追加<\/b>。", "追加是前面還沒講的一組：連接詞 <em>and<\/em>；介系詞 <em>in addition to、besides<\/em> 接名詞或 Ving（<em>in addition to<\/em> 的 <em>to<\/em> 是介系詞，第 6 章）；連接副詞 <em>in addition、moreover、furthermore<\/em>。<em>in addition<\/em> 和 <em>in addition to<\/em> 只差一個 <em>to<\/em>，身分就從連接副詞變成介系詞。", "實際走一次：<em>The new software is expensive. ___, it will save us many hours each week.<\/em> 空格在句號後面，後面有逗號，要連接副詞，可能是 <em>However、Therefore、In addition<\/em>。「很貴」是缺點，「很省時間」是優點，方向相反，所以是 <em>However<\/em>。換成 <em>The new software is fast. ___, it is easy to learn.<\/em>，兩個都是優點，往同一個方向加，所以是 <em>In addition<\/em> 或 <em>Moreover<\/em>。", "下表把整章收在一起。橫的看是同一個意思的三種形狀，直的看是同一種形狀的各種意思。"], "ex": [{"en": "The new software is expensive. <u>However,<\/u> it will save us many hours each week.", "zh": "新軟體很貴。不過，它每週能幫我們省下很多時間。", "note": "缺點對優點，方向相反：對比。"}, {"en": "The new software is fast. <u>In addition,<\/u> it is easy to learn.", "zh": "新軟體很快。此外，它也很好學。", "note": "兩個優點，同一個方向：追加。"}, {"en": "<u>In addition to<\/u> handling payroll, Ms. Sato trains new staff.", "zh": "除了處理薪資，Sato 女士也負責訓練新進員工。", "note": "<em>in addition to<\/em> 是介系詞，接 Ving。"}, {"en": "The old printer kept breaking down. <u>As a result,<\/u> we replaced it.", "zh": "舊印表機一直故障，因此我們把它換掉了。", "note": "前面造成後面：結果。"}], "table": {"head": ["關係", "連接詞（+ 子句）", "介系詞（+ 名詞／Ving）", "連接副詞（新句子）"], "rows": [["讓步、對比", "<em>although、even though、while、but<\/em>", "<em>despite、in spite of<\/em>", "<em>however、nevertheless<\/em>"], ["原因", "<em>because、since、as<\/em>", "<em>because of、due to、owing to、as a result of<\/em>", "（沒有）"], ["結果", "<em>so<\/em>", "（沒有）", "<em>therefore、as a result、consequently<\/em>"], ["條件", "<em>if、unless、as long as<\/em>", "<em>without、in the event of<\/em>", "<em>otherwise<\/em>"], ["時間", "<em>while、when、once、as soon as<\/em>，以及 <em>before、after、until、since<\/em>", "<em>during、upon<\/em>，以及 <em>before、after、until、since<\/em>", "<em>meanwhile、in the meantime<\/em>"], ["目的", "<em>so that<\/em>", "（沒有；<em>in order to<\/em> + 原形是 to V，不是介系詞）", "（沒有）"], ["追加", "<em>and<\/em>", "<em>in addition to、besides<\/em>", "<em>in addition、moreover、furthermore<\/em>"]]}, "quiz": [{"type": "choose", "q": "<em>Our sales team met its target. ___, it brought in six new clients.<\/em> 空格要填哪一個？", "options": ["However", "Moreover", "Otherwise"], "answer": 1, "why": "三個都是連接副詞，形狀都對，只能用意思選。達成目標和多拉到六個新客戶都是好消息，往同一個方向加，是追加：<em>Moreover<\/em>。<em>However<\/em> 用在方向相反；<em>Otherwise<\/em> 是「不然的話」，前一句要能當成條件。"}], "takeaway": "先用後面的形狀決定是哪一類，再用前後的關係（對比、原因、結果、條件、時間、目的、追加）決定是哪個字。"}], "mistakes": [{"wrong": "Despite the train was late, Ms. Huang arrived on time.", "right": "Although the train was late, Ms. Huang arrived on time.", "why": "<em>despite<\/em> 是介系詞，後面不能接子句；<em>the train was late<\/em> 裡有 <em>was<\/em> 這個有時態的動詞，是子句。接子句要用連接詞 <em>although<\/em>。想保留 <em>despite<\/em>，就改成名詞：<em>Despite the train's late arrival<\/em>。"}, {"wrong": "Although the hotel was small, but the service was excellent.", "right": "Although the hotel was small, the service was excellent.", "why": "中文說「雖然……，但是……」，英文的 <em>although<\/em> 和 <em>but<\/em> 都是連接詞，只能留一個。也可以寫成 <em>The hotel was small, but the service was excellent.<\/em>"}, {"wrong": "The office was closed, however, the staff kept working from home.", "right": "The office was closed. However, the staff kept working from home.", "why": "<em>however<\/em> 是連接副詞，不能用逗號把兩個句子接起來。前面要句號或分號；或者改用連接詞：<em>The office was closed, but the staff kept working from home.<\/em>"}, {"wrong": "During I was in Harbor City, I visited two clients.", "right": "While I was in Harbor City, I visited two clients.", "why": "<em>during<\/em> 是介系詞，只接名詞（<em>during my stay in Harbor City<\/em>）。後面是子句 <em>I was in Harbor City<\/em>，要用連接詞 <em>while<\/em>。"}, {"wrong": "The event was canceled because of the speaker was sick.", "right": "The event was canceled because the speaker was sick.", "why": "<em>because of<\/em> 是介系詞，後面接名詞（<em>because of the speaker's illness<\/em>）。<em>the speaker was sick<\/em> 是子句，要用連接詞 <em>because<\/em>。"}], "workbook": ["connect"]}, {"id": "relative", "n": 9, "title": "關係代名詞", "en": "Relative Pronouns", "lead": "關係代名詞（<em>who、which、that、whose、whom<\/em>）把兩個句子接成一句：用一整個子句（叫做關係子句）去說明前面的名詞。這一章從「兩句共用一個名詞」開始，一步一步教你怎麼選：先看前面的名詞是人還是事物，再看這個字在自己的子句裡做什麼工作。接著處理插入語、<em>whose<\/em>、介系詞、逗號和省略這幾個容易卡住的地方。讀這章之前，要先會分辨子句和從屬子句（第 3 章）。", "check": [{"type": "choose", "q": "<em>The engineer ___ designed the new billing system will train the staff.<\/em> 空格填哪一個？", "options": ["who", "whom", "whose"], "answer": 0, "why": "空格後面直接是動詞 <em>designed<\/em>，表示這個子句缺的是主詞。前面的名詞 <em>engineer<\/em> 是人、又當主詞，用 <em>who<\/em>。<em>whom<\/em> 只能當受詞，<em>whose<\/em> 後面要接名詞。"}, {"type": "choose", "q": "<em>The supplier ___ prices were the lowest won the contract.<\/em> 空格填哪一個？", "options": ["who", "which", "whose"], "answer": 2, "why": "空格後面直接接名詞 <em>prices<\/em>，而且是「這家供應商的價格」。表示「誰的」要用 <em>whose<\/em>，後面接名詞。"}, {"type": "choose", "q": "<em>The candidate ___ we believe is the most qualified will start in May.<\/em> 空格填哪一個？", "options": ["who", "whom"], "answer": 0, "why": "先把插進來的 <em>we believe<\/em> 劃掉，剩下 <em>the candidate ___ is the most qualified<\/em>：空格後面直接接動詞 <em>is<\/em>，缺主詞，所以是 <em>who<\/em>。"}, {"type": "choose", "q": "下面哪一句是對的？", "options": ["Our new office, that opened in March, has a larger meeting room.", "Our new office, which opened in March, has a larger meeting room."], "answer": 1, "why": "逗號後面的關係子句是補充說明，不能用 <em>that<\/em>。先行詞 <em>office<\/em> 是事物，用 <em>which<\/em>。"}, {"type": "tap", "q": "點出關係子句說明的那個名詞（一個字）。", "sentence": "We finally received the laptops that the IT team ordered in May.", "answer": [4], "why": "<em>that<\/em> 緊接在 <em>laptops<\/em> 後面，子句 <em>that the IT team ordered in May<\/em> 說明的是哪些筆電。把名詞放回子句裡試試：<em>the IT team ordered the laptops<\/em>，說得通。<em>team<\/em> 是子句裡的主詞，不是被說明的名詞。"}], "sections": [{"h": "兩個句子共用一個名詞", "body": ["先看兩個簡單的句子：<em>We hired a consultant.<\/em> 和 <em>The consultant reduced our shipping costs.<\/em> 兩句講的是同一個人：<em>consultant<\/em>。中文會說「我們請了一位幫我們降低運費的顧問」。英文的做法是：把第二句的 <em>the consultant<\/em> 換成 <em>who<\/em>，再把整個第二句接在第一個 <em>consultant<\/em> 後面：<em>We hired a consultant who reduced our shipping costs.<\/em>", "接上去的 <em>who reduced our shipping costs<\/em> 有自己的主詞（<em>who<\/em>）和動詞（<em>reduced<\/em>），所以是子句；它不能單獨成句，所以是從屬子句（第 3 章）。這種用來說明名詞的從屬子句叫做<b>關係子句<\/b>，被它說明的那個名詞叫做<b>先行詞<\/b>。關係子句的作用像一個很長的形容詞，只是位置相反：形容詞放在名詞前面（<em>an experienced consultan

<title>The Workbook</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Noto+Serif+TC:wght@400;500&display=swap">
<style>
/* Layout: a printed workbook. Reading pages are one 34rem column; a question is a two-page spread on wide
   screens (question left, notes right) and one column on phones. Interface text is English; Chinese waits behind 中. */
:root{
  --paper:#F4F5F1; --ink:#1E2320; --soft:#5C635E; --faint:#8E958F; --rule:#D5D8D0; --accent:#2B5A4A; --pencil:#B4442E; --wash:#E6EBE3;
  --en:"Newsreader","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --zh:"Noto Serif TC","Songti TC","PMingLiU",serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--paper:#151816; --ink:#E4E7E1; --soft:#9AA29B; --faint:#6E766F; --rule:#2D322F; --accent:#8CC4AE; --pencil:#E88C73; --wash:#1F2621; color-scheme:dark}
}
:root[data-theme="dark"]{--paper:#151816; --ink:#E4E7E1; --soft:#9AA29B; --faint:#6E766F; --rule:#2D322F; --accent:#8CC4AE; --pencil:#E88C73; --wash:#1F2621; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font:400 17px/1.75 var(--en),var(--zh);-webkit-font-smoothing:antialiased;padding-inline:20px;padding-block:0 72px;font-variant-numeric:oldstyle-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px}
.zh{font-family:var(--zh)}
.sc{font-variant-caps:all-small-caps;letter-spacing:.09em}
.link{color:var(--accent);text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.link:hover{text-decoration-thickness:2px}
.quiet{color:var(--soft)} .faint{color:var(--faint)}
.page{max-width:34rem;margin:0 auto}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:6px 14px;border-radius:4px;font-size:15px;z-index:30}

/* running head, shared by every view */
.head{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding-block:24px 4px;font-size:.86em;color:var(--faint)}
.head button,.head a{color:var(--faint);text-decoration:none}
.head button:hover,.head a:hover{color:var(--ink)}
.head .tools{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap;justify-content:flex-end}
.head .pg{font-variant-numeric:lining-nums tabular-nums}
.sz button{padding:0 3px}.sz .s1{font-size:.85em}.sz .s2{font-size:1.1em}
.sz button:disabled{opacity:.35;cursor:default}

/* contents */
.mast{padding-block:56px 4px}
.mast .sc{color:var(--soft);font-size:15px}
h1{font:500 clamp(36px,7vw,48px)/1.1 var(--en);margin:.1em 0 0;letter-spacing:-.005em}
h1.small{font-size:clamp(26px,5vw,32px);margin-top:.6em}
.note{margin:22px 0 0}
.note + .note{margin-top:6px}
.part{margin-top:40px}
.part h2{font:500 15px/1.4 var(--en);color:var(--soft);margin:0 0 8px}
.part h2 .sc{letter-spacing:.12em}
.part ol{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.part li{border-bottom:1px solid var(--rule)}
.row{display:grid;grid-template-columns:2.2em minmax(0,1fr) auto;align-items:baseline;gap:0 .6em;width:100%;padding:10px 0;text-align:left}
.row .n{color:var(--faint);font-size:15px}
.row .t{min-width:0}
.row .sub{display:block;font-size:14px;color:var(--faint)}
.row .c{color:var(--faint);font-size:15px;font-variant-numeric:lining-nums tabular-nums}
button.row:hover .t{color:var(--accent)}
.colophon{margin-top:48px;display:flex;flex-wrap:wrap;gap:6px 22px;font-size:15px}
.colophon button{color:var(--soft)}
.colophon button:hover{color:var(--ink)}

/* the spread */
#session{font-size:var(--fs,14.5px);max-width:34rem;margin:0 auto}
@media (min-width:900px){
  #session:not([hidden]){max-width:64rem;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:3.2rem;align-items:start}
  #session .head{grid-column:1/-1}
  .rightp{border-left:1px solid var(--rule);padding-left:3.2rem;min-height:60vh}
  .rightp .ann:first-child{margin-top:1.6em;border-top:0;padding-top:0}
}
.leftp,.rightp{min-width:0}
.mark{margin:1.4em 0 0;font-size:.86em;color:var(--faint)}
.stem{font:400 1.28em/1.7 var(--en);margin:1.3em 0 1em;text-wrap:pretty}
.blank{display:inline-block;min-width:4.6em;border-bottom:1.5px solid var(--ink);text-align:center;line-height:1.2;color:var(--accent);font-style:italic}
.gl{text-decoration:underline dotted var(--faint);text-underline-offset:5px;text-decoration-thickness:1px;cursor:help}
.pace{height:1px;background:var(--rule);margin:-.4em 0 1em}
.pace i{display:block;height:100%;background:var(--accent);width:100%}
.pace.over i{background:var(--pencil)}
.opts{list-style:none;margin:0;padding:0;display:grid}
.opt{display:grid;grid-template-columns:2.4em minmax(0,1fr);align-items:baseline;width:100%;text-align:left;padding:.28em 0;font:400 1.14em/1.5 var(--en)}
.opt .l{position:relative;display:inline-grid;place-items:center;width:1.7em;height:1.7em;font-size:.85em;color:var(--soft)}
.opt .l svg{position:absolute;left:-7px;top:-6px;width:calc(100% + 14px);height:calc(100% + 12px);overflow:visible;pointer-events:none}
.opt .l path{fill:none;stroke:var(--accent);stroke-width:1.7;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:0}
.opt:not(:disabled):hover .w{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
.opt:disabled{cursor:default}
.opt.now .l{color:var(--accent)}
.opt.right .l,.opt.right .w{color:var(--accent)}
.opt.picked-wrong .w{text-decoration:line-through;text-decoration-color:var(--pencil);text-decoration-thickness:1.6px;color:var(--soft)}
.opt.picked-wrong .l{color:var(--pencil)}
.opt.dim .w,.opt.dim .l{color:var(--faint)}
.qr .opts{grid-template-columns:repeat(3,auto);justify-content:start;column-gap:2.4em}
.qr .opt{grid-template-columns:auto;font-size:1.3em}
.qr .opt .l{font-size:.8em}
.unsure{margin-top:.5em;padding-left:2.4em}
.qr .unsure{padding-left:0}
.unsure button{font-style:italic;font-size:.92em;color:var(--faint)}
.unsure button:hover{color:var(--soft)}
.lq{margin:1.6em 0 .5em;font:500 1.06em/1.55 var(--en)}
.lq .n{color:var(--faint);margin-right:.5em;font-weight:400}

/* listening */
.player{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px;margin:1.4em 0 .4em}
.play{font:italic 500 1.2em var(--en);color:var(--accent)}
.play:disabled{color:var(--faint);cursor:default}
.player .state{color:var(--faint);font-size:.9em;flex:1;min-width:8em}
.speed{display:flex;gap:10px;font-size:.86em}
.speed button{color:var(--faint)} .speed button[aria-pressed="true"]{color:var(--ink);text-decoration:underline;text-underline-offset:4px}
.cue{margin:1em 0 0;font-size:.86em;color:var(--faint)}
.graphic{margin:1em 0 .4em;overflow-x:auto}
.graphic table{border-collapse:collapse;width:100%;font-size:.95em;font-variant-numeric:lining-nums tabular-nums}
.graphic caption{text-align:left;font-weight:500;padding-bottom:.3em}
.graphic th{font-weight:400;color:var(--soft);text-align:left;border-bottom:1px solid var(--ink);padding:.2em .6em .2em 0}
.graphic td{border-bottom:1px solid var(--rule);padding:.25em .6em .25em 0}

/* notes */
.ann{margin-top:1.6em;border-top:1px solid var(--rule);padding-top:1.1em;display:grid;gap:.75em;line-height:1.65}
.ann + .ann{margin-top:1.4em}
.ann p{margin:0}
.ann .qn{font-size:.84em;color:var(--faint);margin-bottom:-.3em}
.para{cursor:pointer}
.para .zh{display:block;font-size:.9em;line-height:1.7;color:var(--soft);margin-top:.15em}
.point{font:500 1.08em/1.55 var(--en)}
.para em{font-style:italic}
.wr{display:grid;grid-template-columns:6.4em minmax(0,1fr);gap:.8em;align-items:baseline;font-size:.94em;color:var(--soft)}
.wr .w{font-style:italic;color:var(--faint);overflow-wrap:anywhere}
.wr.mine .w{color:var(--pencil)} .wr.mine{color:var(--ink)}
.wr .para{min-width:0}
.trans{font-size:.9em;line-height:1.7;color:var(--soft)}
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px 20px;margin-top:.2em;font-size:.84em;color:var(--faint)}
.foot .fl{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline}
.foot a,.foot button{color:var(--faint);text-decoration:none}
.foot a:hover,.foot button:hover{color:var(--soft)}
.foot button[aria-pressed="true"]{color:var(--accent)}
.zhb{font-family:var(--zh);font-size:.95em;border:1px solid var(--rule)!important;border-radius:3px;padding:0 5px!important;line-height:1.6}
.zhb[aria-pressed="true"]{color:var(--soft)!important;border-color:var(--faint)!important}
.ask,.report{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.4em .8em;align-items:baseline}
.ask input,.report input,.search,.notes textarea{font:italic 1em var(--en);color:var(--ink);background:transparent;border:0;border-bottom:1px solid var(--rule);padding:.2em 0;min-width:0;border-radius:0}
.ask input:focus,.report input:focus,.search:focus,.notes textarea:focus{outline:none;border-bottom-color:var(--accent)}
.ask button,.report button{font:italic 500 .95em var(--en);color:var(--accent)}
.ask button:disabled{color:var(--faint)}
.askOut{grid-column:1/-1;font-size:.94em;color:var(--soft);white-space:pre-wrap;margin:0}
.script{list-style:none;margin:0;padding:0;display:grid;gap:.2em}
.script li{display:grid;grid-template-columns:2.2em minmax(0,1fr) 1.4em;gap:.5em;align-items:baseline;padding:.2em .3em;border-radius:3px}
.script li.ev{background:var(--wash)}
.script .who{font-size:.84em;color:var(--faint)}
.script .t{min-width:0}
.script .t .zh{display:block;font-size:.88em;color:var(--soft)}
.script .rp{color:var(--faint);font-size:.8em}
.script .rp:hover{color:var(--accent)}
.next{display:flex;justify-content:flex-end;margin-top:1.4em}
.next button{font:italic 500 1.08em var(--en);color:var(--accent)}
.next button:hover{text-decoration:underline;text-underline-offset:4px}
.tip{position:absolute;z-index:20;background:var(--paper);color:var(--ink);border:1px solid var(--rule);box-shadow:0 6px 18px rgba(20,28,24,.12);padding:10px 14px 11px;border-radius:4px;width:min(19rem,calc(100vw - 32px));font:14.5px/1.55 var(--en)}
.tip .hw{font:italic 500 17px var(--en)}
.tip .pos{font-style:italic;color:var(--soft);margin-left:.5em}
.tip .ipa{color:var(--soft);margin-left:.5em;font-family:"Charis SIL","Doulos SIL","Lucida Sans Unicode","Segoe UI",var(--en);font-size:.95em}
.tip .mean{font-family:var(--zh);margin-top:2px}
.tip .ex{margin-top:6px;padding-top:6px;border-top:1px solid var(--rule);color:var(--soft);font-style:italic}

/* summary, review shelf, statistics, settings */
.score{font:400 clamp(40px,8vw,56px)/1 var(--en);margin:.5em 0 .1em;font-variant-numeric:lining-nums}
.score small{font-size:.4em;color:var(--soft);margin-left:.3em}
h3{font:500 15px/1.4 var(--en);color:var(--soft);margin:2em 0 .4em}
h3 .sc{letter-spacing:.12em}
.list{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.list > li{border-bottom:1px solid var(--rule)}
.list .hd{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 1em;align-items:baseline;width:100%;text-align:left;padding:.6em 0}
.list .hd .s{min-width:0;font-size:16px}
.list .hd .m{font-size:13.5px;color:var(--faint);white-space:nowrap}
.list .hd:hover .s{color:var(--accent)}
.list .body{padding:0 0 1em;font-size:15px}
.list .body .ann{margin-top:.4em}
.notes textarea{width:100%;min-height:2.2em;resize:vertical;font-size:15px;margin-top:.8em}
.tabs{display:flex;flex-wrap:wrap;gap:4px 18px;margin:1.2em 0 .6em;font-size:15px}
.tabs button{color:var(--faint)} .tabs button[aria-pressed="true"]{color:var(--ink);text-decoration:underline;text-underline-offset:5px}
.search{width:100%;margin-bottom:.6em;font-size:16px}
.grp{font-size:14px;color:var(--soft);margin:1.6em 0 .3em}
.stat{border-collapse:collapse;width:100%;font-size:15px;font-variant-numeric:lining-nums tabular-nums}
.stat th{font-weight:400;color:var(--faint);text-align:right;border-bottom:1px solid var(--ink);padding:.2em 0 .2em .8em;white-space:nowrap}
.stat th:first-child,.stat td:first-child{text-align:left;padding-left:0}
.stat td{text-align:right;border-bottom:1px solid var(--rule);padding:.3em 0 .3em .8em}
.tblwrap{overflow-x:auto}
.set{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.2em 1em;align-items:baseline;padding:.9em 0;border-bottom:1px solid var(--rule)}
.set label{font-weight:500}
.set p{grid-column:1/-1;margin:0;font-size:15px;color:var(--soft)}
.set select{background:transparent;border:0;border-bottom:1px solid var(--rule);font-size:16px;color:var(--ink)}
.set input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px}
.small{font-size:15px}
.empty{color:var(--faint);margin:1.4em 0}
@media (prefers-reduced-motion: no-preference){
  .opt.right .l path{animation:draw .5s ease-out both}
  @keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
  .ann{animation:rise .4s .15s ease-out both}
  @keyframes rise{from{opacity:.001;transform:translateY(5px)}to{opacity:1;transform:none}}
}
</style>

<main id="app" class="page"></main>
<section id="session" hidden></section>
<div class="tip" id="tip" hidden></div>
<div class="toast" id="toast" hidden role="status"></div>

<script type="application/json" id="bank">{{BANK}}</script>
<script>
"use strict";
// ================================================================ data
const DATA = JSON.parse(document.getElementById("bank").textContent);
const UNITS = DATA.units;                     // id -> {zh, group, en}
const GRAMMAR_URL = "https://claude.ai/artifact/1KZ2F1miJtZxSMpeZLknDQ";
const INTERVALS = [1, 3, 7, 14];              // review spacing in days per level (our own setting, not a research number)
const WEAK = 0.7;                             // chapters under this accuracy come up more often (our setting)
const SIZES = [13.5, 14.5, 15.5, 16.5, 18];
const L = "ABCD";
const PARTS = [["grammar", "Part One", "Grammar"], ["vocab", "Part Two", "Vocabulary"], ["listen", "Part Three", "Listening"]];
const CIRCLE = '<svg viewBox="0 0 48 40" aria-hidden="true"><path pathLength="1" d="M31 5C17 3 5 10 5 21c0 10 12 15 23 14 11-1 16-8 15-16C42 10 34 5 23 6"/></svg>';

let ITEMS = DATA.items.slice();               // hand-written items, plus Claude-added ones merged at load
let BY = {};
function index() { BY = Object.fromEntries(ITEMS.map(x => [x.id, x])); }
index();

// ================================================================ helpers
const $ = s => document.querySelector(s);
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function btn(cls, text, fn) { const b = el("button", cls, text); b.type = "button"; if (fn) b.onclick = fn; return b; }
function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
function wait(ms) { return new Promise(r => setTimeout(r, ms)); }
function day(d = new Date()) { const z = n => String(n).padStart(2, "0"); return d.getFullYear() + "-" + z(d.getMonth() + 1) + "-" + z(d.getDate()); }
function addDays(n) { const d = new Date(); d.setDate(d.getDate() + n); return day(d); }
function shortDay(s) { const d = new Date(s + "T00:00"); return d.toLocaleDateString("en-GB", { day: "numeric", month: "short" }); }
function fmtS(ms) { return ms == null ? "–" : Math.round(ms / 1000) + " s"; }
function pct(a, b) { return b ? Math.round(a / b * 100) + "%" : "–"; }
function toast(t) { const e = $("#toast"); e.textContent = t; e.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => e.hidden = true, 1800); }
function hash(s) { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function seeded(seed) { let a = seed; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function shuffle(a, rnd = Math.random) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function unitName(u) { return (UNITS[u] && (UNITS[u].en || UNITS[u].zh)) || u; }
function isGap(item) { return item.format === "gap"; }
function qKeys(item) { return isGap(item) || item.format === "qr" ? [item.id] : item.questions.map((_, i) => item.id + ":" + i); }
function qOf(key) { const [id, q] = key.split(":"); const item = BY[id]; if (!item) return null; return { item, qi: q == null ? 0 : Number(q) }; }
function unitOfKey(key) { const x = qOf(key); return x ? x.item.unit : ""; }
function qCount(x) { return x.format === "gap" || x.format === "qr" ? 1 : x.questions.length; }

// ================================================================ storage: db when this is the owner in claude.ai, else localStorage
const Store = {
  mode: "local", db: null, queue: {},
  lsGet(coll) { try { return JSON.parse(localStorage.getItem("toeic:" + coll) || "{}"); } catch { return {}; } },
  lsPut(coll, map) { try { localStorage.setItem("toeic:" + coll, JSON.stringify(map)); } catch {} },
  async init() {
    if (!window.claude?.use) return;
    try {
      const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
      if (db && user && await user.isOwner()) { this.db = db; this.mode = "db"; }
    } catch {}
  },
  async list(coll) {
    if (this.mode === "local") return this.lsGet(coll);
    const snap = await this.db.collection(coll).get();
    return Object.fromEntries(snap.docs.map(d => [d.id, d.data()]));
  },
  async getProfile() {
    if (this.mode === "local") return this.lsGet("profile").main || null;
    const s = await this.db.doc("toeic/profile").get();
    return s.exists ? s.data() : null;
  },
  put(coll, id, data) {           // one write at a time per document
    const key = coll + "/" + id;
    if (this.mode === "local") { const m = this.lsGet(coll); m[id] = data; this.lsPut(coll, m); return Promise.resolve(); }
    const prev = this.queue[key] || Promise.resolve();
    const path = coll === "profile" ? "toeic/profile" : coll + "/" + id;
    const p = prev.then(() => this.db.doc(path).set(JSON.parse(JSON.stringify(data)))).catch(e => {
      if (e && e.code === "quota_exceeded") toast("Your account storage is full; this wasn't saved.");
      else if (e && e.code === "unavailable") return wait(800 + Math.random() * 800).then(() => this.db.doc(path).set(data)).catch(() => toast("Couldn't save. Check your connection."));
      else toast("Couldn't save. Check your connection.");
    });
    this.queue[key] = p; return p;
  },
};
// collections (db paths are owner-only, see capabilities): toeic/profile, toeic_bank/<key>, toeic_attempts/<session>, toeic_marks/<itemId>, toeic_added/<itemId>

let P = null;    // profile
let B = {};      // review shelf, key -> entry
let M = {};      // marks, itemId -> {starred, note, flagged, flagNote, at}
function freshProfile() { return { settings: { pace: 0, listenSpeed: 1, strictListen: false, theme: "system", size: 1, sound: true }, totals: { n: 0, ok: 0, unsure: 0 }, units: {}, streak: { days: 0, lastDay: "" }, seen: {} }; }
function saveProfile() { return Store.put("profile", "main", P); }
function saveBank(key) { return Store.put("toeic_bank", key, B[key]); }
function saveMark(id) { M[id].at = Date.now(); return Store.put("toeic_marks", id, M[id]); }

async function load() {
  await Store.init();
  try {
    P = await Store.getProfile();
    B = await Store.list("toeic_bank");
    M = await Store.list("toeic_marks");
    const added = await Store.list("toeic_added");
    for (const [id, x] of Object.entries(added)) {
      if (x.retired || BY[id] || !x.type || !x.explain && !x.questions) continue;
      ITEMS.push({ ...x, id, source: x.source || "claude", reviewed: false });
    }
    index();
  } catch (e) {
    Store.mode = "local"; P = Store.lsGet("profile").main || null; B = Store.lsGet("toeic_bank"); M = Store.lsGet("toeic_marks");
  }
  P = Object.assign(freshProfile(), P || {});
  P.settings = Object.assign(freshProfile().settings, P.settings || {});
  P.totals.unsure = P.totals.unsure ?? P.totals.guess ?? 0;
  applyTheme();

// ================================================================ building a session

// never seen first, then seen longest ago; weak chapters come up earlier; items on the review shelf wait for review
function pick(filter, n, countQs) {
  const pool = ITEMS.filter(x => filter(x) && !qKeys(x).every(activeBank));
  const scored = pool.map(x => {
    const seen = Math.max(0, ...qKeys(x).map(k => P.seen[k] || 0));
    const s = unitStat(x.unit), weak = s.n >= 3 && s.ok / s.n < WEAK;
    return { x, score: (seen ? 1 : 0) * 1e13 + seen - (weak ? 7 * 864e5 : 0) + Math.random() * 36e5 };
  }).sort((a, b) => a.score - b.score);

  return out;
}
function cardFor(x, qs) { return { id: x.id, qs: qs || (x.format === "gap" || x.format === "qr" ? [0] : x.questions.map((_, i) => i)) }; }
function startSet({ type, unit, n, label }) {
  const f = x => (type ? x.type === type : true) && (unit ? x.unit === unit : true);
  const items = pick(f, n, type === "listen" || (unit && UNITS[unit]?.group === "listen"));
  if (!items.length) { toast("Everything here is on your review shelf."); return; }
  newSession(shuffle(items).map(x => cardFor(x)), label);
}
function startMixed() {
  const g = pick(x => x.type === "grammar", 10), v = pick(x => x.type === "vocab", 6), l = pick(x => x.type === "listen", 4, true);
  const gv = shuffle(g.concat(v));

}

  newSession(shuffle(Object.entries(byItem).map(([id, qs]) => cardFor(BY[id], qs.sort()))), "Review", { review: true });
}

// Ask Claude: the strongest tier the viewer's plan allows; shown only when the page may use Claude
let sample = null;
function askForm(item, ctx) {
  const f = el("div", "ask"), inp = el("input"), go = btn(null, "Ask"), out = el("p", "askOut"); out.hidden = true;
  inp.id = "ask-" + item.id + "-" + (ctx.qi || 0); inp.placeholder = isGap(item) ? "Why not B?" : "What did she say about the delivery?"; inp.autocomplete = "off";
  const run = async () => {

    go.disabled = true; out.hidden = false; out.textContent = "Thinking…";
    const strip = s => String(s || "").replace(/<[^>]+>/g, "");
    const data = isGap(item)
      ? { stem: item.stem, options: item.options, key: item.options[item.answer], rule: strip(enOf(item).point[0]), explanation: strip(enOf(item).why[0]) }

    const prompt = [

// ================================================================ one card
let paceTimer = null;
function sizeControl() {

function optionOrder(item, qi, sid) { const n = isGap(item) ? item.options.length : item.questions[qi].options.length; const idx = [...Array(n).keys()]; return sid ? shuffle(idx, seeded(hash(item.id + ":" + qi + ":" + sid))) : idx; }

function gapCard(left, right, item) {

  paint(false);
  const pace = P.settings.pace; let bar_ = null;
  if (pace) { bar_ = el("div", "pace"); bar_.append(el("i")); left.append(bar_); }
  const order = optionOrder(item, 0, S.id), ol = el("ol", "opts"), buttons = [];
  order.forEach((oi, pos) => {
    const li = el("li"), bt = btn("opt"); bt.innerHTML = `<span class="l">${L[pos]}</span><span class="w">${esc(item.options[oi])}</span>`;
    bt.dataset.oi = oi; bt.onclick = () => answer(oi); li.append(bt); ol.append(li); buttons.push(bt);
  });
  const un = el("div", "unsure"), ub = btn(null, "I'm not sure", () => answer(-1)); un.append(ub);
  left.append(ol, un);

  if (pace) paceTimer = setInterval(() => { const l = 1 - (performance.now() - t0) / (pace * 1000); bar_.firstChild.style.width = Math.max(0, l * 100) + "%"; if (l <= 0) { bar_.classList.add("over"); clearInterval(paceTimer); } }, 200);

  const player = el("div", "player"), play = btn("play", "▸ Play"), state = el("span", "state"), speed = el("span", "speed");
  for (const v of [0.85, 1, 1.15]) { const b = btn(null, v + "×"); b.setAttribute("aria-pressed", String(P.settings.listenSpeed === v)); b.onclick = () => { P.settings.listenSpeed = v; au.playbackRate = v; saveProfile(); speed.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x === b))); }; speed.append(b); }

    if (strict && played && !answeredAll) return;
    playing = true; play.textContent = "■ Stop";
    const ok = await playLines(item, all, item.audio.gapMs || 600, i => {
      if (qr) qrButtons.forEach((b, k) => b.classList.toggle("now", i === k + 1));
      state.textContent = i < 0 ? "" : qr ? (i === 0 ? "Question" : "Response " + L[i - 1]) : "Line " + (i + 1) + " of " + all.length;
    });
    playing = false; play.textContent = "▸ Play again";
    if (ok === false) state.textContent = "Some audio didn't load. Try again.";
    else if (ok) state.textContent = "";
    if (ok !== null || !strict) { played = true; qrButtons.forEach(b => { if (!b.dataset.done) b.disabled = false; }); }
    if (strict && !answeredAll && ok !== false) play.disabled = true;
  }
  play.onclick = run;
  keys.replay = () => !play.disabled && run();
  const zhScope = right;
  for (const qi of qs) {
    const q = item.questions[qi], blk = el("div", qr ? "qr" : "");
    if (!qr) { const p = el("p", "lq"); p.append(el("span", "n", qs.length > 1 ? (qs.indexOf(qi) + 1) + "." : ""), q.q); blk.append(p); }
    const order = qr ? [0, 1, 2] : optionOrder(item, qi, S.id), ol = el("ol", "opts"), buttons = [];
    order.forEach((oi, pos) => {
      const li = el("li"), bt = btn("opt"); bt.innerHTML = `<span class="l">${L[pos]}</span>` + (qr ? "" : `<span class="w">${esc(q.options[oi])}</span>`);
      bt.dataset.oi = oi; bt.onclick = () => answerQ(oi); if (qr) bt.disabled = true; li.append(bt); ol.append(li); buttons.push(bt);
    });
    if (qr) qrButtons = buttons;
    const un = el("div", "unsure"), ub = btn(null, "I'm not sure", () => answerQ(-1)); un.append(ub);
    blk.append(ol, un); left.append(blk);
    blocks.push({ qi, buttons, ub });
    function answerQ(oi) {
      if (done[qi] != null) return;
      done[qi] = oi;
      const ok = oi === q.answer, unsure = oi < 0;
      markOptions(buttons, q.answer, oi); buttons.forEach(b => b.dataset.done = "1"); un.hidden = true;
      if (!unsure) tone(ok);
      record(item, qi, oi, ok, unsure, null, false);
      const box = notesFor(item, q, oi, order);
      if (qs.length > 1) box.prepend(el("p", "qn sc", "Question " + (qs.indexOf(qi) + 1)));
      const optText = i => qr ? item.audio.lines[i + 1].text : q.options[i];
      box.append(footFor(item, box, { qi, chosenText: unsure ? null : optText(oi), zhScope }));
      right.append(box);
      if (Object.keys(done).length === qs.length) finishListen();
    }
  }
  keys.answer = pos => { const nb = blocks.find(b => done[b.qi] == null); nb && nb.buttons[pos] && !nb.buttons[pos].disabled && nb.buttons[pos].click(); };
  keys.unsure = () => { const nb = blocks.find(b => done[b.qi] == null); nb && nb.ub.click(); };
  function finishListen() {
    answeredAll = true; play.disabled = false;
    const ev = new Set(qs.flatMap(qi => item.questions[qi].explain?.evidence || []));
    const wrap = el("div", "ann"); wrap.append(el("p", "qn sc", "Transcript"));
    const ul = el("ol", "script"), used = new Set();
    item.audio.lines.forEach((ln, i) => {
      const li = el("li", ev.has(i) ? "ev" : "");
      const t = el("span", "t"); t.innerHTML = glossify(ln.text, item.gloss, used);
      const z = el("span", "zh", (item.transcriptZh || [])[i] || ""); z.hidden = true; t.append(z);
      const rp = btn("rp", "▸"); rp.setAttribute("aria-label", "Play this line"); rp.onclick = () => playLines(item, [i], 0);
      li.append(el("span", "who sc", qr ? (i === 0 ? "Q" : L[i - 1]) : ln.who), t, rp); ul.append(li);
    });
    wrap.append(ul); right.append(wrap);
    nextLink(right);
  }
}
function graphicTable(g) {
  const box = el("div", "graphic"), t = el("table");
  if (g.caption) t.append(el("caption", null, g.caption));
  const hr = el("tr"); for (const h of g.head || []) hr.append(el("th", null, h)); const th = el("thead"); th.append(hr); t.append(th);
  const tb = el("tbody"); for (const r of g.rows || []) { const tr = el("tr"); for (const c of r) tr.append(el("td", null, c)); tb.append(tr); } t.append(tb);
  box.append(t); return box;
}

// ================================================================ recording an answer (chosen -1 = "I'm not sure")
function record(item, qi, chosen, ok, unsure, ms, timedOut) {
  const key = qKeys(item)[isGap(item) || item.format === "qr" ? 0 : qi];
  const res = { key, id: item.id, qi, unit: item.unit, type: item.type, chosen, ok, unsure, ms, timedOut, v: item.v || 1, source: item.source };
  S.results.push(res);
  P.seen[key] = Date.now();
  const u = P.units[item.unit] = unitStat(item.unit); P.units[item.unit] = u;
  u.n++; if (ok) u.ok++; if (unsure) u.unsure++; if (ms != null) { u.msSum += ms; u.msN++; }
  P.totals.n++; if (ok) P.totals.ok++; if (unsure) P.totals.unsure++;
  const now = Date.now(), e = B[key];
  const hist = { at: now, ok, chosen, unsure };
  if (e && !e.graduatedAt && !e.removedAt) {
    if (ok) { if (e.level >= 3) { e.graduatedAt = now; res.graduated = true; } else { e.level++; e.due = addDays(INTERVALS[e.level]); } }
    else { e.level = 0; e.due = addDays(INTERVALS[0]); if (!unsure) e.wrongCount = (e.wrongCount || 0) + 1; res.banked = true; }
    e.lastAt = now; e.v = res.v; e.history = (e.history || []).concat(hist).slice(-10);
    res.review = true; saveBank(key);
  } else if (!ok) {
    B[key] = { reason: unsure ? "unsure" : "wrong", level: 0, due: addDays(INTERVALS[0]), wrongCount: unsure ? 0 : 1, enteredAt: now, lastAt: now, v: res.v, history: [hist] };
    res.banked = true; saveBank(key);
  }
  saveSession();
  if (S.results.length % 5 === 0) saveAttempt(false);
  return res;
}
function saveAttempt(final) {
  const r = S.results;
  return Store.put("toeic_attempts", S.id, { startedAt: S.startedAt, endedAt: final ? Date.now() : null, mode: S.label, items: r.map(x => ({ id: x.key, ok: x.ok, chosen: x.chosen, unsure: !!x.unsure, ms: x.ms == null ? null : Math.round(x.ms), timedOut: x.timedOut, v: x.v })), summary: { n: r.length, ok: r.filter(x => x.ok).length } });
}
function nextLink(host) {
  const nb = el("div", "next"), b = btn(null, S.i + 1 < S.cards.length ? "Next →" : "Finish →", () => { S.i++; saveSession(); runCard(); });
  nb.append(b); host.append(nb);
  keys.next = () => b.click();
}

// ================================================================ end of a set
function summary() {
  const app = show("summary");
  clearSession();
  const r = S.results, t = day();
  if (P.streak.lastDay !== t) { P.streak.days = P.streak.lastDay === addDays(-1) ? P.streak.days + 1 : 1; P.streak.lastDay = t; }
  saveProfile(); saveAttempt(true);
  head(app, backTo("Contents", home));
  app.append(el("h1", "small", S.label));
  const ok = r.filter(x => x.ok).length, sc = el("p", "score"); sc.append(ok + " of " + r.length, el("small", null, Math.max(1, Math.round((Date.now() - S.startedAt) / 60000)) + " min"));
  app.append(sc);
  const wrong = r.filter(x => !x.ok && !x.unsure), unsure = r.filter(x => x.unsure);
  if (wrong.length) { app.append(sectionH("Wrong")); app.append(resultList(wrong)); }
  if (unsure.length) { app.append(sectionH("Not sure")); app.append(resultList(unsure)); }
  const again = wrong.concat(unsure), p = el("p", "note");
  if (again.length) p.append(btn("link", "Practise these again", () => { const cards = {}; for (const x of again) (cards[x.id] = cards[x.id] || []).push(x.qi); newSession(Object.entries(cards).map(([id, qs]) => cardFor(BY[id], qs)), "Again"); }), "  ·  ");
  p.append(btn("link", "Contents", home)); app.append(p);
}
function sectionH(t) { const h = el("h3"); h.append(el("span", "sc", t)); return h; }
function resultList(rs) { const ul = el("ul", "list"); for (const x of rs) { const item = BY[x.id]; if (item) ul.append(itemRow(item, x.qi, { chosen: x.chosen, meta: unitName(item.unit) })); } return ul; }
function stemText(item, qi) {
  if (isGap(item)) return item.stem.replace("______", item.options[item.answer]);
  if (item.format === "qr") return item.audio.lines[0].text;
  return item.questions[qi].q;
}
function itemRow(item, qi, { chosen, meta, bankKey }) {
  const li = el("li"), hd = btn("hd"), body = el("div", "body"); body.hidden = true;
  hd.append(el("span", "s", stemText(item, qi)), el("span", "m", meta || ""));
  hd.onclick = () => { body.hidden = !body.hidden; if (!body.hidden && !body.childNodes.length) fillRow(body, item, qi, chosen, bankKey); };
  li.append(hd, body); return li;
}
function fillRow(body, item, qi, chosen, bankKey) {
  tipItem = item;
  const q = isGap(item) ? null : item.questions[qi];
  if (!isGap(item)) {
    const ans = item.format === "qr" ? item.audio.lines[q.answer + 1].text : q.options[q.answer];
    const p = el("p", "quiet"); p.innerHTML = `<em>${esc(ans)}</em>`; body.append(p);
  }
  const box = notesFor(item, q, chosen ?? -1, isGap(item) ? optionOrder(item, 0) : [0, 1, 2, 3]);
  box.append(footFor(item, box, { qi, chosenText: null }));
  body.append(box);
  const n = el("div", "notes"), ta = el("textarea"); ta.id = "note-" + item.id + "-" + qi; ta.placeholder = "Your notes"; ta.value = (M[item.id] || {}).note || "";
  let t = null; ta.oninput = () => { clearTimeout(t); t = setTimeout(() => { M[item.id] = Object.assign(M[item.id] || {}, { note: ta.value }); saveMark(item.id); }, 1000); };
  n.append(ta); body.append(n);
  if (bankKey && activeBank(bankKey)) body.append(btn("link small", "Take off the shelf", ev => { B[bankKey].removedAt = Date.now(); saveBank(bankKey); ev.target.replaceWith(el("span", "small faint", "Taken off. It's still under All.")); }));
}

// ================================================================ review shelf
let bankFilter = "due", bankGroup = "unit", bankQuery = "";
function bankView() {
  const app = show("bank");
  head(app, backTo("Contents", home));
  app.append(el("h1", "small", "Review shelf"));
  const tabs = el("div", "tabs sc");
  for (const [k, t] of [["due", "Due"], ["all", "All"], ["unsure", "Not sure"], ["grad", "Learned"]]) { const c = btn(null, t, () => { bankFilter = k; bankView(); }); c.setAttribute("aria-pressed", String(bankFilter === k)); tabs.append(c); }
  const by = el("span", "faint"); by.style.marginLeft = "auto"; by.append("by ");
  for (const [k, t] of [["unit", "chapter"], ["date", "date"]]) { const c = btn(null, t, () => { bankGroup = k; bankView(); }); c.setAttribute("aria-pressed", String(bankGroup === k)); by.append(c, " "); }
  tabs.append(by); app.append(tabs);
  const s = el("input", "search"); s.type = "search"; s.id = "bank-search"; s.placeholder = "Search questions, notes, chapters"; s.value = bankQuery;
  const host = el("div"); app.append(s, host);
  const render = () => {
    host.textContent = "";
    const t = day(), q = bankQuery.toLowerCase();
    let ks = Object.keys(B).filter(k => qOf(k)).filter(k => { const e = B[k];
      if (bankFilter === "due") return !e.graduatedAt && !e.removedAt && e.due <= t;
      if (bankFilter === "unsure") return !e.graduatedAt && !e.removedAt && (e.reason === "unsure" || e.reason === "guess");
      if (bankFilter === "grad") return !!e.graduatedAt;
      return true; });
    if (q) ks = ks.filter(k => { const { item, qi } = qOf(k); return (stemText(item, qi) + " " + ((M[item.id] || {}).note || "") + " " + unitName(item.unit)).toLowerCase().includes(q); });
    if (!ks.length) { host.append(el("p", "empty", bankFilter === "due" ? "Nothing due today." : "Nothing here.")); return; }
    if (bankFilter === "due") { const p = el("p", "note"); p.append(btn("link", "Review these " + ks.length, () => startReview(ks))); host.append(p); }
    const rowFor = k => { const { item, qi } = qOf(k), e = B[k];
      const meta = e.graduatedAt ? "learned" : e.removedAt ? "off the shelf" : "next " + shortDay(e.due);
      return itemRow(item, qi, { meta: bankGroup === "date" ? unitName(item.unit) + " · " + meta : meta, bankKey: k, chosen: -1 }); };
    if (bankGroup === "date") { const ul = el("ul", "list"); ks.sort((a, b) => B[b].enteredAt - B[a].enteredAt).forEach(k => ul.append(rowFor(k))); host.append(ul); }
    else {
      const groups = {}; for (const k of ks) (groups[unitOfKey(k)] = groups[unitOfKey(k)] || []).push(k);
      for (const [u, g] of Object.entries(groups).sort((a, b) => b[1].length - a[1].length)) {
        host.append(el("p", "grp", unitName(u) + " · " + g.length));
        const ul = el("ul", "list"); g.forEach(k => ul.append(rowFor(k))); host.append(ul);
      }
    }
  };
  s.oninput = () => { bankQuery = s.value; render(); };
  render();
}

// ================================================================ statistics
function statsView() {
  const app = show("stats");
  head(app, backTo("Contents", home));
  app.append(el("h1", "small", "Statistics"));
  const t = P.totals, sc = el("p", "score"); sc.append(pct(t.ok, t.n), el("small", null, "right of " + t.n + " answered"));
  app.append(sc);
  const line = [];
  if (t.unsure) line.push(t.unsure + " marked not sure");
  if (P.streak.days) line.push(P.streak.days + (P.streak.days > 1 ? " days" : " day") + " in a row");
  if (line.length) app.append(el("p", "quiet small", line.join(" · ")));
  for (const [g, part, title] of PARTS) {
    const us = unitsIn(g); if (!us.length) continue;
    app.append(sectionH(title));
    const w = el("div", "tblwrap"), table = el("table", "stat");
    table.innerHTML = "<thead><tr><th>Chapter</th><th>Answered</th><th>Right</th><th>Not sure</th><th>Avg</th></tr></thead>";
    const body = el("tbody");
    for (const u of us) { const s = unitStat(u), tr = el("tr"); tr.append(el("td", null, unitName(u)), el("td", null, String(s.n)), el("td", null, pct(s.ok, s.n)), el("td", null, String(s.unsure)), el("td", null, s.msN ? fmtS(s.msSum / s.msN) : "–")); body.append(tr); }
    table.append(body); w.append(table); app.append(w);
  }
}

// ================================================================ settings
function settingsView() {
  const app = show("settings");
  head(app, backTo("Contents", home));
  app.append(el("h1", "small", "Settings"));
  const box = el("div"); box.style.marginTop = "1.2em";
  const set = (label, desc, control) => { const d = el("div", "set"), l = el("label", null, label); if (control.id) l.htmlFor = control.id; d.append(l, control); if (desc) d.append(el("p", null, desc)); box.append(d); };
  const pace = el("select"); pace.id = "set-pace";
  for (const [v, t] of [[0, "Off"], [20, "20 s"], [30, "30 s"], [45, "45 s"]]) { const o = el("option", null, t); o.value = v; if (P.settings.pace === v) o.selected = true; pace.append(o); }
  pace.onchange = () => { P.settings.pace = Number(pace.value); saveProfile(); };
  set("Pace line", "A thin line under grammar and vocabulary questions that runs out after this many seconds. Nothing happens when it does.", pace);
  const strict = el("input"); strict.type = "checkbox"; strict.id = "set-strict"; strict.checked = P.settings.strictListen;
  strict.onchange = () => { P.settings.strictListen = strict.checked; saveProfile(); };
  set("One play only", "Listening audio plays once, as in the test. You can replay it after answering.", strict);
  const snd = el("input"); snd.type = "checkbox"; snd.id = "set-sound"; snd.checked = P.settings.sound;
  snd.onchange = () => { P.settings.sound = snd.checked; saveProfile(); };
  set("Answer sound", null, snd);
  const theme = el("select"); theme.id = "set-theme";
  for (const [v, t] of [["system", "System"], ["light", "Light"], ["dark", "Dark"]]) { const o = el("option", null, t); o.value = v; if (P.settings.theme === v) o.selected = true; theme.append(o); }
  theme.onchange = () => { P.settings.theme = theme.value; applyTheme(); saveProfile(); };
  set("Appearance", null, theme);
  app.append(box);
  const info = el("div", "small quiet"); info.style.marginTop = "2em";
  info.append(el("p", null, "Saved " + (Store.mode === "db" ? "to your claude.ai account, so your phone and computer share it." : "in this browser only.")),
    el("p", null, "Every question is original, not from a past test: " + DATA.items.length + " in all. The listening voices are synthetic American and British speakers; the real test also uses Australian and Canadian accents."),
    el("p", null, "Keys on a computer: 1–4 or A–D to answer, N for not sure, Enter for next, R to replay, S to star."));
  app.append(info);

// ================================================================ keyboard (desktop)
const keys = {};
document.addEventListener("keydown", e => {
  if (view !== "session" || e.target.closest("textarea,input,select") || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  const pos = "1234".indexOf(k) >= 0 ? "1234".indexOf(k) : "abcd".indexOf(k);
  if (pos >= 0 && keys.answer) { keys.answer(pos); e.preventDefault(); }
  else if (k === "enter" && keys.next) { keys.next(); e.preventDefault(); }
  else if (k === "n" && keys.unsure) keys.unsure();
  else if (k === "r" && keys.replay) keys.replay();
  else if (k === "s" && keys.star) keys.star();
});

// ================================================================ start
(async () => {
  $("#app").append(el("p", "empty", "Loading…"));
  await load();
  home();
  if (window.claude?.use) claude.use("sample").then(s => { sample = s || null; }).catch(() => {});
})();
</script>

<title>The Workbook</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Noto+Serif+TC:wght@400;500&display=swap">
<style>
/* Layout: a printed workbook. Reading pages are one 34rem column; a question is a two-page spread on wide
   screens (question left, notes right) and one column on phones. Interface text is English; Chinese waits behind 中. */
:root{
  --paper:#F4F5F1; --ink:#1E2320; --soft:#5C635E; --faint:#8E958F; --rule:#D5D8D0; --accent:#2B5A4A; --pencil:#B4442E; --wash:#E6EBE3; --claude:#D97757;
  --en:"Newsreader","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --zh:"Noto Serif TC","Songti TC","PMingLiU",serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--paper:#151816; --ink:#E4E7E1; --soft:#9AA29B; --faint:#6E766F; --rule:#2D322F; --accent:#8CC4AE; --pencil:#E88C73; --wash:#1F2621; --claude:#E3916F; color-scheme:dark}
}
:root[data-theme="dark"]{--paper:#151816; --ink:#E4E7E1; --soft:#9AA29B; --faint:#6E766F; --rule:#2D322F; --accent:#8CC4AE; --pencil:#E88C73; --wash:#1F2621; --claude:#E3916F; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font:400 17px/1.75 var(--en),var(--zh);-webkit-font-smoothing:antialiased;padding-inline:20px;padding-block:0 72px;font-variant-numeric:oldstyle-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px}
.zh{font-family:var(--zh)}
.sc{font-variant-caps:all-small-caps;letter-spacing:.09em}
.link{color:var(--accent);text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.link:hover{text-decoration-thickness:2px}
.quiet{color:var(--soft)} .faint{color:var(--faint)}
.page{max-width:34rem;margin:0 auto}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:6px 14px;border-radius:4px;font-size:15px;z-index:30}

/* running head, shared by every view */
.head{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding-block:24px 4px;font-size:.86em;color:var(--faint)}
.head button,.head a{color:var(--faint);text-decoration:none}
.head button:hover,.head a:hover{color:var(--ink)}
.head .tools{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap;justify-content:flex-end}
.head .pg{font-variant-numeric:lining-nums tabular-nums}
.sz button{padding:0 3px}.sz .s1{font-size:.85em}.sz .s2{font-size:1.1em}
.sz button:disabled{opacity:.35;cursor:default}

/* contents */
.mast{padding-block:56px 4px}
.mast .sc{color:var(--soft);font-size:15px}
h1{font:500 clamp(36px,7vw,48px)/1.1 var(--en);margin:.1em 0 0;letter-spacing:-.005em}
h1.small{font-size:clamp(26px,5vw,32px);margin-top:.6em}
.note{margin:22px 0 0}
.note + .note{margin-top:6px}
.part{margin-top:40px}
.part h2{font:500 15px/1.4 var(--en);color:var(--soft);margin:0 0 8px}
.part h2 .sc{letter-spacing:.12em}
.part ol{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.part li{border-bottom:1px solid var(--rule)}
.row{display:grid;grid-template-columns:2.2em minmax(0,1fr) auto;align-items:baseline;gap:0 .6em;width:100%;padding:10px 0;text-align:left}
.row .n{color:var(--faint);font-size:15px}
.row .t{min-width:0}
.row .sub{display:block;font-size:14px;color:var(--faint)}
.row .c{color:var(--faint);font-size:15px;font-variant-numeric:lining-nums tabular-nums}
button.row:hover .t{color:var(--accent)}
.colophon{margin-top:48px;display:flex;flex-wrap:wrap;gap:6px 22px;font-size:15px}
.colophon button{color:var(--soft)}
.colophon button:hover{color:var(--ink)}

/* the spread */
#session{font-size:var(--fs,14.5px);max-width:34rem;margin:0 auto;padding-bottom:5.5rem}
/* the dock: tools for the answered question, pinned to the bottom edge */
#dock{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--paper);border-top:1px solid var(--rule);padding:0 20px calc(10px + env(safe-area-inset-bottom,0px))}
.dk-bar,.dk-panel{max-width:34rem;margin:0 auto}
@media (min-width:900px){.dk-bar,.dk-panel{max-width:64rem}}
.dk-panel:empty{display:none}
.dk-panel{padding-top:12px;font-size:15px}
.dk-bar{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;padding-top:10px;min-height:44px}
.dk-tools{display:flex;flex-wrap:wrap;align-items:center;gap:6px 20px}
.tool{display:inline-flex;align-items:center;gap:6px;font-size:14.5px;color:var(--soft);text-decoration:none;padding:4px 0}
.tool:hover{color:var(--ink)}
.tool svg{width:16px;height:16px;flex:none}
.tool .ic{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
.tool[aria-pressed="true"]{color:var(--accent)}
.tool[aria-pressed="true"] .ic.fillable{fill:currentColor}
.tool.claude{color:var(--ink)}
.tool.claude .spark{stroke:var(--claude);stroke-width:2.4;stroke-linecap:round}
.tool.zht{font-family:var(--zh);font-size:13px;border:1px solid var(--rule);border-radius:3px;padding:0 6px;line-height:1.7}
.tool.zht[aria-pressed="true"]{border-color:var(--faint);color:var(--ink)}
.dk-next button{font:italic 500 18px var(--en);color:var(--accent);white-space:nowrap;padding:4px 0}
.dk-next button:hover{text-decoration:underline;text-underline-offset:4px}
@media (max-width:520px){.tool:not(.claude):not(.zht) .lbl{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}.dk-tools{gap:6px 18px}}
.foot .claude-ic{width:13px;height:13px;vertical-align:-1px;margin-right:4px}
.foot .claude-ic .spark{stroke:var(--claude);stroke-width:2.4;stroke-linecap:round}
@media (min-width:900px){
  #session:not([hidden]){max-width:64rem;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:3.2rem;align-items:start}
  #session .head{grid-column:1/-1}
  .rightp{border-left:1px solid var(--rule);padding-left:3.2rem;min-height:60vh}
  .rightp .ann:first-child{margin-top:1.6em;border-top:0;padding-top:0}
}
.leftp,.rightp{min-width:0}
.mark{margin:1.4em 0 0;font-size:.86em;color:var(--faint)}
.stem{font:400 1.28em/1.7 var(--en);margin:1.3em 0 1em;text-wrap:pretty}
.blank{display:inline-block;min-width:4.6em;border-bottom:1.5px solid var(--ink);text-align:center;line-height:1.2;color:var(--accent);font-style:italic}
.gl{text-decoration:underline dotted var(--faint);text-underline-offset:5px;text-decoration-thickness:1px;cursor:help}
.pace{height:1px;background:var(--rule);margin:-.4em 0 1em}
.pace i{display:block;height:100%;background:var(--accent);width:100%}
.pace.over i{background:var(--pencil)}
.opts{list-style:none;margin:0;padding:0;display:grid}
.opt{display:grid;grid-template-columns:2.4em minmax(0,1fr);align-items:baseline;width:100%;text-align:left;padding:.28em 0;font:400 1.14em/1.5 var(--en)}
.opt .l{position:relative;display:inline-grid;place-items:center;width:1.7em;height:1.7em;font-size:.85em;color:var(--soft)}
.opt .l svg{position:absolute;left:-7px;top:-6px;width:calc(100% + 14px);height:calc(100% + 12px);overflow:visible;pointer-events:none}
.opt .l path{fill:none;stroke:var(--accent);stroke-width:1.7;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:0}
.opt:not(:disabled):hover .w{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
.opt:disabled{cursor:default}
.opt.now .l{color:var(--accent)}
.opt.right .l,.opt.right .w{color:var(--accent)}
.opt.picked-wrong .w{text-decoration:line-through;text-decoration-color:var(--pencil);text-decoration-thickness:1.6px;color:var(--soft)}
.opt.picked-wrong .l{color:var(--pencil)}
.opt.dim .w,.opt.dim .l{color:var(--faint)}
.qr .opts{grid-template-columns:repeat(3,auto);justify-content:start;column-gap:2.4em}
.qr .opt{grid-template-columns:auto;font-size:1.3em}
.qr .opt .l{font-size:.8em}
.unsure{margin-top:.5em;padding-left:2.4em}
.qr .unsure{padding-left:0}
.unsure button{font-style:italic;font-size:.92em;color:var(--faint)}
.unsure button:hover{color:var(--soft)}
.lq{margin:1.6em 0 .5em;font:500 1.06em/1.55 var(--en)}
.lq .n{color:var(--faint);margin-right:.5em;font-weight:400}

/* listening */
.player{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px;margin:1.4em 0 .4em}
.play{font:italic 500 1.2em var(--en);color:var(--accent)}
.play:disabled{color:var(--faint);cursor:default}
.player .state{color:var(--faint);font-size:.9em;flex:1;min-width:8em}
.speed{display:flex;gap:10px;font-size:.86em}
.speed button{color:var(--faint)} .speed button[aria-pressed="true"]{color:var(--ink);text-decoration:underline;text-underline-offset:4px}
.cue{margin:1em 0 0;font-size:.86em;color:var(--faint)}
.graphic{margin:1em 0 .4em;overflow-x:auto}
.graphic table{border-collapse:collapse;width:100%;font-size:.95em;font-variant-numeric:lining-nums tabular-nums}
.graphic caption{text-align:left;font-weight:500;padding-bottom:.3em}
.graphic th{font-weight:400;color:var(--soft);text-align:left;border-bottom:1px solid var(--ink);padding:.2em .6em .2em 0}
.graphic td{border-bottom:1px solid var(--rule);padding:.25em .6em .25em 0}

/* notes */
.ann{margin-top:1.6em;border-top:1px solid var(--rule);padding-top:1.1em;display:grid;gap:.75em;line-height:1.65}
.ann + .ann{margin-top:1.4em}
.ann p{margin:0}
.ann .qn{font-size:.84em;color:var(--faint);margin-bottom:-.3em}
.para{cursor:pointer}
.para .zh{display:block;font-size:.9em;line-height:1.7;color:var(--soft);margin-top:.15em}
.point{font:500 1.08em/1.55 var(--en)}
.para em{font-style:italic}
.para .exs{display:block;margin-top:.2em}
.wr{display:grid;grid-template-columns:6.4em minmax(0,1fr);gap:.8em;align-items:baseline;font-size:.94em;color:var(--soft)}
.wr .w{font-style:italic;color:var(--faint);overflow-wrap:anywhere}
.wr.mine .w{color:var(--pencil)} .wr.mine{color:var(--ink)}
.wr .para{min-width:0}
.trans{font-size:.9em;line-height:1.7;color:var(--soft)}
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px 20px;margin-top:.2em;font-size:.84em;color:var(--faint)}
.foot .fl{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline}
.foot a,.foot button{color:var(--faint);text-decoration:none}
.foot a:hover,.foot button:hover{color:var(--soft)}
.foot button[aria-pressed="true"]{color:var(--accent)}
.zhb{font-family:var(--zh);font-size:.95em;border:1px solid var(--rule)!important;border-radius:3px;padding:0 5px!important;line-height:1.6}
.zhb[aria-pressed="true"]{color:var(--soft)!important;border-color:var(--faint)!important}
.ask,.report{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.4em .8em;align-items:baseline}
.ask input,.report input,.search,.notes textarea{font:italic 1em var(--en);color:var(--ink);background:transparent;border:0;border-bottom:1px solid var(--rule);padding:.2em 0;min-width:0;border-radius:0}
.ask input:focus,.report input:focus,.search:focus,.notes textarea:focus{outline:none;border-bottom-color:var(--accent)}
.ask button,.report button{font:italic 500 .95em var(--en);color:var(--accent)}
.ask button:disabled{color:var(--faint)}
.askOut{grid-column:1/-1;font-size:.94em;color:var(--soft);white-space:pre-wrap;margin:0}
.script{list-style:none;margin:0;padding:0;display:grid;gap:.2em}
.script li{display:grid;grid-template-columns:2.2em minmax(0,1fr) 1.4em;gap:.5em;align-items:baseline;padding:.2em .3em;border-radius:3px}
.script li.ev{background:var(--wash)}
.script .who{font-size:.84em;color:var(--faint)}
.script .t{min-width:0}
.script .t .zh{display:block;font-size:.88em;color:var(--soft)}
.script .rp{color:var(--faint);font-size:.8em}
.script .rp:hover{color:var(--accent)}
.next{display:flex;justify-content:flex-end;margin-top:1.4em}
.next button{font:italic 500 1.08em var(--en);color:var(--accent)}
.next button:hover{text-decoration:underline;text-underline-offset:4px}
.tip{position:absolute;z-index:20;background:var(--paper);color:var(--ink);border:1px solid var(--rule);box-shadow:0 6px 18px rgba(20,28,24,.12);padding:10px 14px 11px;border-radius:4px;width:min(19rem,calc(100vw - 32px));font:14.5px/1.55 var(--en)}
.tip .hw{font:italic 500 17px var(--en)}
.tip .pos{font-style:italic;color:var(--soft);margin-left:.5em}
.tip .ipa{color:var(--soft);margin-left:.5em;font-family:"Charis SIL","Doulos SIL","Lucida Sans Unicode","Segoe UI",var(--en);font-size:.95em}
.tip .mean{font-family:var(--zh);margin-top:2px}
.tip .ex{margin-top:6px;padding-top:6px;border-top:1px solid var(--rule);color:var(--soft);font-style:italic}

/* summary, review shelf, statistics, settings */
.score{font:400 clamp(40px,8vw,56px)/1 var(--en);margin:.5em 0 .1em;font-variant-numeric:lining-nums}
.score small{font-size:.4em;color:var(--soft);margin-left:.3em}
h3{font:500 15px/1.4 var(--en);color:var(--soft);margin:2em 0 .4em}
h3 .sc{letter-spacing:.12em}
.list{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.list > li{border-bottom:1px solid var(--rule)}
.list .hd{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 1em;align-items:baseline;width:100%;text-align:left;padding:.6em 0}
.list .hd .s{min-width:0;font-size:16px}
.list .hd .m{font-size:13.5px;color:var(--faint);white-space:nowrap}
.list .hd:hover .s{color:var(--accent)}
.list .body{padding:0 0 1em;font-size:15px}
.list .body .ann{margin-top:.4em}
.notes textarea{width:100%;min-height:2.2em;resize:vertical;font-size:15px;margin-top:.8em}
.tabs{display:flex;flex-wrap:wrap;gap:4px 18px;margin:1.2em 0 .6em;font-size:15px}
.tabs button{color:var(--faint)} .tabs button[aria-pressed="true"]{color:var(--ink);text-decoration:underline;text-underline-offset:5px}
.search{width:100%;margin-bottom:.6em;font-size:16px}
.grp{font-size:14px;color:var(--soft);margin:1.6em 0 .3em}
.stat{border-collapse:collapse;width:100%;font-size:15px;font-variant-numeric:lining-nums tabular-nums}
.stat th{font-weight:400;color:var(--faint);text-align:right;border-bottom:1px solid var(--ink);padding:.2em 0 .2em .8em;white-space:nowrap}
.stat th:first-child,.stat td:first-child{text-align:left;padding-left:0}
.stat td{text-align:right;border-bottom:1px solid var(--rule);padding:.3em 0 .3em .8em}
.tblwrap{overflow-x:auto}
.set{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.2em 1em;align-items:baseline;padding:.9em 0;border-bottom:1px solid var(--rule)}
.set label{font-weight:500}
.set p{grid-column:1/-1;margin:0;font-size:15px;color:var(--soft)}
.set select{background:transparent;border:0;border-bottom:1px solid var(--rule);font-size:16px;color:var(--ink)}
.set input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px}
.small{font-size:15px}
.empty{color:var(--faint);margin:1.4em 0}
@media (prefers-reduced-motion: no-preference){
  .opt.right .l path{animation:draw .5s ease-out both}
  @keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
  .ann{animation:rise .4s .15s ease-out both}
  @keyframes rise{from{opacity:.001;transform:translateY(5px)}to{opacity:1;transform:none}}
}
</style>

<main id="app" class="page"></main>
<section id="session" hidden></section>
<nav id="dock" hidden aria-label="This question"><div class="dk-panel" id="dkPanel"></div><div class="dk-bar"><span class="dk-tools" id="dkTools"></span><span class="dk-next" id="dkNext"></span></div></nav>
<div class="tip" id="tip" hidden></div>

對話：細節", "group": "listen", "en": "Conversations: Details"}, "conv-intent": {"zh": "對話：意圖與推論", "group": "listen", "en": "Conversations: Intent and Inference"}, "conv-next": {"zh": "對話：下一步", "group": "listen", "en": "Conversations: What Happens Next"}, "talk-topic": {"zh": "短講：主旨", "group": "listen", "en": "Talks: Topic"}, "talk-detail": {"zh": "短講：細節", "group": "listen", "en": "Talks: Details"}, "talk-next": {"zh": "短講：下一步", "group": "listen", "en": "Talks: What Happens Next"}}, "items": [{"id": "g-pos-01", "type": "grammar", "format": "gap", "unit": "pos", "level": 1, "source": "hand", "reviewed": true, "v": 1, "stem": "All shipping charges on the March invoice were ______ calculated by the new billing software.", "options": ["automatic", "automation", "automatically", "automate"], "answer": 2, "explain": {"point": "be 動詞和過去分詞之間放副詞", "why": "空格在 were 和過去分詞 calculated 之間，修飾「計算」這個動作，要用副詞 automatically。", "wrong": ["形容詞，不能插在 were 和 calculated 之間修飾動詞", "名詞「自動化」，放在 were 和 calculated 之間不成句", null, "原形動詞，were 後面不能再接原形"], "zh": "三月那張發票上的所有運費，都是由新的帳務軟體自動計算的。", "vocab": [["shipping charge", "運費"], ["invoice", "發票、請款單"], ["billing software", "帳務軟體"]]}, "gloss": [{"w": "shipping charges", "hw": "shipping charge", "pos": "n.", "zh": "運費", "ex": "The shipping charge is added at checkout.", "ipa": "/ˈʃɪpɪŋ tʃɑːrdʒ/"}, {"w": "invoice", "hw": "invoice", "pos": "n.", "zh": "發票、請款單", "ex": "Please send the invoice by Friday.", "ipa": "/ˈɪnvɔɪs/"}, {"w": "billing software", "hw": "billing software", "pos": "n.", "zh": "帳務軟體", "ex": "Our billing software sends reminders automatically.", "ipa": "/ˈbɪlɪŋ ˈsɔːfˌtwer/"}], "en": {"point": ["Put an adverb between <em>be<\/em> and the past participle.", "be 動詞和過去分詞之間放副詞。"], "why": ["The blank sits between <em>were<\/em> and <em>calculated<\/em>. It describes how the charges were calculated, so it needs an adverb: <em>automatically<\/em>.", "空格在 were 和 calculated 之間，說明運費是「怎麼」被計算的，要用副詞 automatically。"]}}, {"id": "g-pos-02", "type": "grammar", "format": "gap", "unit": "pos", "level": 1, "source": "hand", "reviewed": true, "v": 1, "stem": "The terms of the new rental agreement seem ______ to both parties, so the contract will be signed on Friday.", "options": ["acceptable", "acceptance", "accept", "acceptably"], "answer": 0, "explain": {"point": "連綴動詞 seem 後面接形容詞", "why": "seem 是連綴動詞，後面要接形容詞，描述主詞 the terms 的狀態，所以選 acceptable（可接受的）。", "wrong": [null, "名詞「接受」，不能用來描述條款的狀態", "原形動詞，seem 後面不能直接接", "副詞不能放在連綴動詞後面描述主詞"], "zh": "新租約的條款雙方似乎都能接受，所以合約會在星期五簽訂。", "vocab": [["terms", "（合約）條款"], ["rental agreement", "租約"], ["party", "（合約的）一方"]]}, "gloss": [{"w": "terms", "hw": "terms", "pos": "n.", "zh": "（合約）條款", "ex": "Please read the terms before you sign.", "ipa": "/tɜrmz/"}, {"w": "rental agreement", "hw": "rental agreement", "pos": "n.", "zh": "租約", "ex": "The rental agreement lasts one year.", "ipa": "/ˈrentəl əˈɡriːmənt/"}, {"w": "parties", "hw": "party", "pos": "n.", "zh": "（合約的）一方", "ex": "Both parties agreed to the price.", "ipa": "/ˈpɑːrti/"}], "en": {"point": ["<em>seem<\/em> + adjective.", "seem + 形容詞。"], "why": ["<em>Seem<\/em> links the subject to a description. The subject is <em>The terms of the new rental agreement<\/em>, and the blank says what they seem like. It needs an adjective: <em>acceptable<\/em>.", "seem 把主詞和描述連起來。主詞是 The terms of the new rental agreement，空格說明條款看起來如何，要用形容詞 acceptable。"]}}, {"id": "g-pos-03", "type": "grammar", "format": "gap", "unit": "pos", "level": 1, "source": "hand", "reviewed": true, "v": 1, "stem": "The ______ of the Tamsin Road factory will create about 200 new jobs in the region next year.", "options": ["expand", "expansive", "expanded", "expansion"], "answer": 3, "explain": {"point": "冠詞 the 後、of 前的位置用名詞", "why": "空格前面是冠詞 the、後面接 of，整個片語又是 will create 的主詞，所以要用名詞 expansion。", "wrong": ["動詞，不能放在 the 後面當主詞", "形容詞，the 後面缺了它要修飾的名詞", "過去分詞，後面沒有名詞可以修飾", null], "zh": "Tamsin 路工廠的擴建工程，明年將在當地創造約 200 個新的工作機會。", "vocab": [["expansion", "擴建、擴張"], ["region", "地區"]]}, "gloss": [{"w": "region", "hw": "region", "pos": "n.", "zh": "地區", "ex": "Sales grew fast in the northern region.", "ipa": "/ˈriːdʒən/"}, {"w": "create", "hw": "create", "pos": "v.", "zh": "創造（職缺）", "ex": "The new store will create fifty jobs.", "ipa": "/kriˈeɪt/"}], "en": {"point": ["After <em>the<\/em> and before <em>of<\/em>: a noun.", "the 之後、of 之前：用名詞。"], "why": ["The blank comes after <em>The<\/em> and before <em>of the Tamsin Road factory<\/em>. Together they are the subject of <em>will create<\/em>, so the blank must be a noun: <em>expansion<\/em>.", "空格在 The 之後、of the Tamsin Road factory 之前，整組是 will create 的主詞，所以要用名詞 expansion。"]}}, {"id": "g-pos-04", "type": "grammar", "format": "gap", "unit": "pos", "level": 2, "source": "hand", "reviewed": true, "v": 1, "stem": "The safety ______ who visited the plant on Monday recommended replacing two of the older machines.", "options": ["inspection", "inspector", "inspect", "inspected"], "answer": 1, "explain": {"point": "人和事的名詞：inspector 是人，inspection 是事", "why": "空格要放名詞；後面的 who 只能指人，來廠裡、提出建議的也是人，所以用指人的 inspector。", "wrong": ["「檢查」這件事，不能用 who，也不會來訪", null, "動詞，不能放在 The safety 後面當主詞", "過去分詞，後面沒有名詞，也不能當主詞"], "zh": "星期一來廠裡的安全檢查員，建議汰換其中兩台較舊的機器。", "vocab": [["plant", "工廠"], ["inspector", "檢查員、稽查員"], ["recommend", "建議"]]}, "gloss": [{"w": "plant", "hw": "plant", "pos": "n.", "zh": "工廠", "ex": "The plant employs about 300 workers.", "ipa": "/plænt/"}, {"w": "recommended", "hw": "recommend", "pos": "v.", "zh": "建議", "ex": "The doctor recommended more rest.", "ipa": "/ˌrekəˈmend/"}, {"w": "replacing", "hw": "replace", "pos": "v.", "zh": "更換、取代", "ex": "We are replacing the old printers.", "ipa": "/ˌriːˈpleɪs/"}], "en": {"point": ["<em>who<\/em> refers to a person: use a person noun.", "who 指人：用表示人的名詞。"], "why": ["The blank is a noun, and <em>who visited the plant<\/em> and <em>recommended<\/em> describe a person. A person who checks safety is an <em>inspector<\/em>.", "空格要放名詞，who visited the plant 和 recommended 描述的是人。檢查安全的人是 inspector。"]}}, {"id": "g-pos-05", "type": "grammar", "format": "gap", "unit": "pos", "level": 2, "source": "hand", "reviewed": true, "v": 1, "stem": "The factory avoided a very ______ shutdown last month by replacing worn parts before they failed.", "options": ["costly", "cost", "costing", "costs"], "answer": 0, "explain": {"point": "very 後、名詞前用形容詞；costly 是形容詞", "why": "空格在 very 後面、名詞 shutdown 前面，要用形容詞。costly 雖然是 -ly 結尾，其實是形容詞，意思是「代價高的」。", "wrong": [null, "名詞或動詞，不能被 very 修飾", "-ing 形在這裡不當形容詞，a very costing 不成立", "複數名詞或動詞，不能放在 a very 後面"], "zh": "這家工廠上個月趕在磨損的零件故障前先換掉，避免了一次代價非常高昂的停工。", "vocab": [["shutdown", "停工、停機"], ["worn", "磨損的"], ["costly", "代價高的、昂貴的"]]}, "gloss": [{"w": "shutdown", "hw": "shutdown", "pos": "n.", "zh": "停工、停機", "ex": "The shutdown lasted two days.", "ipa": "/ˈʃʌtˌdaʊn/"}, {"w": "worn parts", "hw": "worn part", "pos": "n.", "zh": "磨損的零件", "ex": "Worn parts can cause machine failures.", "ipa": "/wɔːrn pɑːrt/"}, {"w": "failed", "hw": "fail", "pos": "v.", "zh": "故障、失效", "ex": "The old pump failed last week.", "ipa": "/feɪl/"}], "en": {"point": ["<em>very<\/em> + adjective + noun.", "very + 形容詞 + 名詞。"], "why": ["The blank is between <em>very<\/em> and the noun <em>shutdown<\/em>, so it must be an adjective. <em>Costly<\/em> ends in -ly, but it is an adjective meaning \"expensive\".", "空格在 very 和名詞 shutdown 之間，要用形容詞。costly 雖然以 -ly 結尾，但是形容詞，意思是「代價高的」。"]}}, {"id": "g-pos-06", "type": "grammar", "format": "gap", "unit": "pos", "level": 1, "source": "hand", "reviewed": true, "v": 2, "stem": "The new booking system has made it ______ easier for staff to reserve meeting rooms on short notice, so the receptionists no longer handle most requests by phone.", "options": ["dramatic", "drama", "dramatically", "dramatize"], "answer": 2, "explain": {"point": "副詞修飾比較級形容詞：dramatically easier", "why": "made it 的補語已經是 easier，空格是在修飾 easier 這個形容詞；修飾形容詞要用副詞 dramatically。", "wrong": ["形容詞不能修飾另一個形容詞 easier", "名詞，放在 it 和 easier 之間不成句", null, "原形動詞，made it dramatize easier 不成句"], "wrongMore": ["made it dramatic 單看是通的（make + 受詞 + 形容詞），但後面還有 easier；it 的補語已經是 easier，空格只能修飾 easier，要用副詞。", null, null, null], "zh": "新的預約系統讓員工臨時訂會議室變得容易許多，所以接待人員現在大多不必再用電話處理預約。", "vocab": [["booking system", "預約系統"], ["reserve", "預訂"], ["on short notice", "臨時、事前通知很短"]]}, "gloss": [{"w": "booking system", "hw": "booking system", "pos": "n.", "zh": "預約系統", "ex": "The booking system shows free rooms.", "ipa": "/ˈbʊkɪŋ ˈsɪstəm/"}, {"w": "reserve", "hw": "reserve", "pos": "v.", "zh": "預訂", "ex": "Please reserve a table for six.", "ipa": "/rɪˈzɜrv/"}, {"w": "on short notice", "hw": "on short notice", "pos": "phr.", "zh": "臨時、事前通知很短", "ex": "We can travel on short notice.", "ipa": "/ɑːn ʃɔːrt ˈnoʊtəs/"}], "en": {"point": ["An adverb modifies an adjective.", "副詞修飾形容詞。"], "why": ["The blank is right before the adjective <em>easier<\/em>. It tells how much easier things are, so it needs an adverb: <em>dramatically<\/em>.", "空格就在形容詞 easier 前面，說明「容易多少」，所以要用副詞 dramatically。"]}}, {"id": "g-tense-01", "type": "grammar", "format": "gap", "unit": "tense", "level": 3, "source": "hand", "reviewed": true, "v": 1, "stem": "Shortly before the building was sold, all of the security cameras in its parking garage ______, so they are still under warranty.", "options": ["have been replaced", "replaced", "have replaced", "were replaced"], "answer": 3, "explain": {"point": "明確的過去時間用過去式；主詞承受動作又沒受詞用被動", "why": "句首 Shortly before the building was sold 是明確的過去時間，用過去式；攝影機是被換的，後面也沒有受詞，所以用 were replaced。", "wrong": ["被動對了，但句首有明確的過去時間，不能用現在完成式", "主動，攝影機不會自己換；replace 後面也缺受詞", "主動又是現在完成式，語態和時態都不對", null], "zh": "就在大樓出售前不久，大樓停車場裡所有的監視攝影機都換新了，所以現在還在保固期內。", "vocab": [["security camera", "監視攝影機"], ["parking garage", "（室內或多層的）停車場"], ["under warranty", "在保固期內"]]}, "gloss": [{"w": "security cameras", "hw": "security camera", "pos": "n.", "zh": "監視攝影機", "ex": "The security camera covers the front door.", "ipa": "/sɪˈkjʊrəti ˈkæmərə/"}, {"w": "parking garage", "hw": "parking garage", "pos": "n.", "zh": "（多層）停車場", "ex": "The parking garage closes at midnight.", "ipa": "/ˈpɑːrkɪŋ ɡərˈɑːʒ/"}, {"w": "under warranty", "hw": "under warranty", "pos": "phr.", "zh": "在保固期內", "ex": "The laptop is still under warranty.", "ipa": "/ˈʌndər ˈwɔːrənti/"}], "en": {"point": ["A past time: past tense. No object: passive.", "過去的時間用過去式；沒有受詞用被動。"], "why": ["<em>Shortly before the building was sold<\/em> is a fixed time in the past, so the verb is past tense. The cameras did not replace anything; they <em>were replaced<\/em>.", "Shortly before the building was sold 是明確的過去時間，動詞用過去式。攝影機是被換的，所以用 were replaced。"]}}, {"id": "g-tense-02", "type": "grammar", "format": "gap", "unit": "tense", "level": 1, "source": "hand", "reviewed": true, "v": 2, "stem": "Currently, our technicians ______ the cause of this morning's network outage, so e-mail and shared files may load slowly until early afternoon.", "options": ["investigate", "are investigating", "investigated", "have investigated"], "answer": 1, "explain": {"point": "currently 配一次性、正在做的動作 → 現在進行式", "why": "Currently 講的是現在；查今天早上那次斷線是正在做、還沒做完的一次性動作，所以用現在進行式 are investigating。", "wrong": ["currently 配簡單式只用於常態，這是一次性的查修", null, "過去式，和句首的 Currently 對不上", "現在完成式表示已經查過，不配 Currently「此刻」"], "wrongMore": ["Currently, we employ 40 people. 這種常態事實可以用簡單式；查今天早上那次斷線是暫時、正在進行的動作，要用進行式。", null, null, null], "zh": "我們的技術人員目前正在查今天早上網路中斷的原因，所以到下午稍早之前，電子郵件和共用檔案可能會開得比較慢。", "vocab": [["technician", "技術人員"], ["network outage", "網路中斷、斷線"], ["investigate", "調查、查明"]]}, "gloss": [{"w": "technicians", "hw": "technician", "pos": "n.", "zh": "技術人員", "ex": "A technician will visit the office today.", "ipa": "/tekˈnɪʃən/"}, {"w": "network outage", "hw": "network outage", "pos": "n.", "zh": "網路中斷", "ex": "The network outage lasted an hour.", "ipa": "/ˈneˌtwɜrk ˈaʊtədʒ/"}], "en": {"point": ["<em>Currently<\/em> + an action in progress: present continuous.", "currently + 正在進行的動作：現在進行式。"], "why": ["<em>Currently<\/em> means now. The technicians have not finished finding <em>the cause of this morning's network outage<\/em>, so the action is in progress: <em>are investigating<\/em>.", "Currently 指現在。技術人員還沒查出 the cause of this morning's network outage，動作正在進行，所以用 are investigating。"]}}, {"id": "g-tense-03", "type": "grammar", "format": "gap", "unit": "tense", "level": 2, "source": "hand", "reviewed": true, "v": 1, "stem": "Once the legal team ______ its review, Mr. Haddad will send the revised contract to the client.", "options": ["completes", "will complete", "completed", "was completing"], "answer": 0, "explain": {"point": "時間子句用現在式表示未來，主句用 will", "why": "Once 引導時間子句；主句 will send 講的是未來，但時間子句裡要用現在式 completes，不用 will。", "wrong": [null, "時間子句裡就算講未來，也不用 will", "過去式，和主句 will send 的未來時間對不上", "過去進行式，時間是過去，和主句對不上"], "zh": "法務團隊一審完，Haddad 先生就會把修改後的合約寄給客戶。", "vocab": [["legal team", "法務團隊"], ["review", "審閱"], ["revised", "修改過的"]]}, "gloss": [{"w": "legal team", "hw": "legal team", "pos": "n.", "zh": "法務團隊", "ex": "The legal team checks every contract.", "ipa": "/ˈliːɡəl tiːm/"}, {"w": "review", "hw": "review", "pos": "n.", "zh": "審閱", "ex": "The review took about two weeks.", "ipa": "/ˌriːˈvjuː/"}, {"w": "revised contract", "hw": "revised contract", "pos": "n.", "zh": "修訂後的合約", "ex": "Please sign the revised contract today.", "ipa": "/rɪˈvaɪzd ˈkɑːnˌtrækt/"}], "en": {"point": ["After <em>once<\/em>: present tense for the future.", "once 子句：用現在式表示未來。"], "why": ["<em>Once<\/em> starts a time clause, and the main clause says <em>will send<\/em>, which is future. A time clause uses present tense for a future action: <em>completes<\/em>.", "Once 引導時間子句，主句 will send 是未來。時間子句用現在式表示未來的動作：completes。"]}}, {"id": "g-tense-04", "type": "grammar", "format": "gap", "unit": "tense", "level": 2, "source": "hand", "reviewed": true, "v": 1, "stem": "Brenmoor Foods ______ its delivery network to more than forty cities since the spring of 2021.", "options": ["expands", "will expand", "has expanded", "expanded"], "answer": 2, "explain": {"point": "since 加時間點，主句用現在完成式", "why": "since the spring of 2021 表示從過去某個時間點延續到現在，所以主句用現在完成式 has expanded。", "wrong": ["現在簡單式，不能配 since 加時間點", "未來式，since 講的是從過去到現在", null, "過去式只講過去，不能配 since 延續到現在"], "zh": "自 2021 年春天以來，Brenmoor Foods 已經把配送網擴展到四十多個城市。", "vocab": [["delivery network", "配送網"], ["expand", "擴展、擴大"]]}, "gloss": [{"w": "delivery network", "hw": "delivery network", "pos": "n.", "zh": "配送網", "ex": "Our delivery network covers the whole island.", "ipa": "/dɪˈlɪvəri ˈneˌtwɜrk/"}, {"w": "since the spring of 2021", "hw": "since", "pos": "phr.", "zh": "自從 2021 年春天", "ex": "We have worked here since the spring.", "ipa": "/sɪns/"}], "en": {"point": ["<em>since<\/em> + a point in time: present perfect.", "since + 時間點：現在完成式。"], "why": ["<em>Since the spring of 2021<\/em> starts in the past and runs up to now. The verb must be present perfect: <em>has expanded<\/em>.", "since the spring of 2021 從過去開始、延續到現在，動詞要用現在完成式 has expanded。"]}}, {"id": "g-tense-05", "type": "grammar", "format": "gap", "unit": "tense", "level": 3, "source": "hand", "reviewed": true, "v": 1, "stem": "By the time the renovation of the Brisholm Hotel lobby was completed in May, the owners ______ nearly two million dollars on the project.", "options": ["have spent", "will have spent", "are spending", "had spent"], "answer": 3, "explain": {"point": "by the time + 過去式 → 主句用過去完成式 had p.p.", "why": "by the time 子句是過去式 was completed，主句講「到那時已經花掉」，要用過去完成式 had spent。", "wrong": ["現在完成式，對不上五月這個過去的時間點", "未來完成式要配 by the time + 現在式", "現在進行式，時間是現在，也沒有「已經」", null], "zh": "到 Brisholm 飯店大廳在五月整修完成時，業主已經在這項工程上花了將近兩百萬美元。", "vocab": [["renovation", "整修、翻新"], ["lobby", "大廳"], ["owner", "業主"]]}, "gloss": [{"w": "renovation", "hw": "renovation", "pos": "n.", "zh": "整修、翻新", "ex": "The renovation will take three months.", "ipa": "/ˌrenəˈveɪʃən/"}, {"w": "lobby", "hw": "lobby", "pos": "n.", "zh": "大廳", "ex": "Guests wait in the lobby.", "ipa": "/ˈlɑːbi/"}, {"w": "owners", "hw": "owner", "pos": "n.", "zh": "業主", "ex": "The owner of the shop lives nearby.", "ipa": "/ˈoʊnər/"}], "en": {"point": ["<em>By the time<\/em> + past: past perfect.", "by the time + 過去式：過去完成式。"], "why": ["<em>By the time the renovation … was completed in May<\/em> is a past point. The spending was done before then, so the main clause uses past perfect: <em>had spent<\/em>.", "By the time … was completed in May 是過去的某個時間點。花錢發生在那之前，主句用過去完成式 had spent。"]}}, {"id": "g-connect-01", "type": "grammar", "format": "gap", "unit": "connect", "level": 2, "source": "hand", "reviewed": true, "v": 1, "stem": "The monthly staff meeting was moved to the larger conference room ______ the growing number of attendees.", "options": ["because", "because of", "despite", "although"], "answer": 1, "explain": {"point": "接名詞用介系詞，再看句意是原因還是讓步", "why": "空格後 the growing number of attendees 是名詞片語，要用介系詞；人數變多才改到較大的會議室，是因果，所以用 because of。", "wrong": ["連接詞，後面要接子句，這裡接的是名詞片語", null, "介系詞沒錯，但表讓步；人數變多正是換大會議室的原因", "連接詞要接子句，而且表讓步，意思也不對"], "zh": "由於出席人數越來越多，每月的員工會議改到較大的會議室舉行。", "vocab": [["attendee", "出席者"], ["conference room", "會議室"], ["growing", "越來越多的、成長中的"]]}, "gloss": [{"w": "attendees", "hw": "attendee", "pos": "n.", "zh": "出席者", "ex": "Each attendee gets a name badge.", "ipa": "/əˈtenˈdiː/"}, {"w": "conference room", "hw": "conference room", "pos": "n.", "zh": "會議室", "ex": "The conference room seats twenty people.", "ipa": "/ˈkɑːnfərəns ruːm/"}, {"w": "growing", "hw": "growing", "pos": "adj.", "zh": "越來越多的", "ex": "A growing team needs more space.", "ipa": "/ˈɡroʊɪŋ/"}], "en": {"point": ["A noun phrase needs a preposition.", "名詞片語前要用介系詞。"], "why": ["<em>the growing number of attendees<\/em> is a noun phrase, with no subject and verb. It gives the reason for the move, so use <em>because of<\/em>.", "the growing number of attendees 是名詞片語，沒有主詞和動詞。它是搬會議室的原因，所以用 because of。"]}}, {"id": "g-connect-02", "type": "grammar", "format": "gap", "unit": "connect", "level": 1, "source": "hand", "reviewed": true, "v": 1, "stem": "Visitors must wear a hard hat at all times ______ they are on the construction site.", "options": ["during", "meanwhile", "throughout", "while"], "answer": 3, "explain": {"point": "接子句用連接詞 while", "why": "空格後面 they are on the construction site 有主詞和動詞，是完整的子句，所以用連接詞 while。", "wrong": ["介系詞，後面只能接名詞", "連接副詞，不能直接連接兩個子句", "介系詞，後面要接名詞，不接子句", null], "zh": "訪客在工地時必須全程戴著安全帽。", "vocab": [["hard hat", "安全帽"], ["construction site", "工地"], ["at all times", "隨時、全程"]]}, "gloss": [{"w": "hard hat", "hw": "hard hat", "pos": "n.", "zh": "安全帽", "ex": "Workers must wear a hard hat here.", "ipa": "/hɑːrd hæt/"}, {"w": "at all times", "hw": "at all times", "pos": "phr.", "zh": "隨時、全程", "ex": "Keep your badge with you at all times.", "ipa": "/æt ɔːl taɪmz/"}, {"w": "construction site", "hw": "construction site", "pos": "n.", "zh": "工地", "ex": "The construction site is closed on Sundays.", "ipa": "/kənˈstrʌkʃən saɪt/"}], "en": {"point": ["A full clause needs a conjunction.", "完整子句前要用連接詞。"], "why": ["<em>they are on the construction site<\/em> has a subject and a verb, so it is a clause. A conjunction must join it to the main sentence: <em>while<\/em>.", "they are on the construction site 有主詞和動詞，是子句，要用連接詞連到主句：while。"]}}, {"id": "g-connect-03", "type": "grammar", "format": "gap", "unit": "connect", "level": 1, "source": "hand", "reviewed": true, "v": 2, "stem": "Our main supplier charges more than most of its competitors. ______, we have decided to keep ordering from it because its parts rarely fail.", "options": ["However", "Therefore", "Whereas", "In spite of"], "answer": 0, "explain": {"point": "句首連接副詞 + 逗號：先看前後是轉折還是因果", "why": "空格在句首、後面接逗號，要用連接副詞；前句收費較高，後句卻決定繼續向它訂貨，是轉折，所以用 However。", "wrong": [null, "連接副詞，但表因果；收費高不是繼續訂貨的理由", "連接詞，要連兩個子句，不能單獨放句首接逗號", "介系詞，後面要接名詞，不能單獨接逗號"], "wrongMore": [null, "Therefore 放在這裡文法完全通，又容易被後面的 because 帶著想成因果；但「收費比較高」和「決定繼續訂」方向相反，要用表轉折的 However。", null, null], "zh": "我們的主要供應商收費比大多數同業高，不過因為它的零件很少故障，我們還是決定繼續向它訂貨。", "vocab": [["supplier", "供應商"], ["competitor", "競爭對手"], ["order from", "向……訂貨"], ["fail", "（零件、機器）故障"]]}, "gloss": [{"w": "supplier", "hw": "supplier", "pos": "n.", "zh": "供應商", "ex": "Our supplier ships every Tuesday.", "ipa": "/səˈplaɪər/"}, {"w": "competitors", "hw": "competitor", "pos": "n.", "zh": "競爭對手", "ex": "Our competitors lowered their prices.", "ipa": "/kəmˈpetətər/"}, {"w": "parts", "hw": "part", "pos": "n.", "zh": "零件", "ex": "We keep spare parts in the store room.", "ipa": "/pɑːrt/"}], "en": {"point": ["A contrast between two sentences: <em>However<\/em>.", "前後兩句轉折：用 However。"], "why": ["The first sentence says the supplier <em>charges more<\/em>. The second says <em>we have decided to keep ordering<\/em>. The two ideas go against each other, so use <em>However<\/em>.", "第一句說供應商收費較高，第二句說我們決定繼續訂貨。兩句意思相反，所以用 However。"]}}, {"id": "g-connect-04", "type": "grammar", "format": "gap", "unit": "connect", "level": 2, "source": "hand", "reviewed": true, "v": 1, "stem": "Orders placed after 3 p.m. will not be shipped until the next business day ______ customers pay extra for same-day shipping.", "options": ["if", "because", "unless", "whether"], "answer": 2, "explain": {"point": "unless 引出例外條件：除非……，否則……", "why": "前半句是規則：三點後的訂單隔天才出貨；加價選當日出貨正是這條規則的例外，所以用 unless。", "wrong": ["條件方向相反：付了當日出貨的錢反而等到隔天", "因果不通：付當日出貨的錢不會造成延後", null, "whether 表「不論」時要配 or not；補上了句意也不通"], "zh": "下午三點以後下的訂單，除非顧客加價選擇當日出貨，否則要到下一個工作天才會出貨。", "vocab": [["business day", "工作天"], ["same-day shipping", "當日出貨"], ["pay extra", "加付費用"]]}, "gloss": [{"w": "business day", "hw": "business day", "pos": "n.", "zh": "工作天", "ex": "Refunds take five business days.", "ipa": "/ˈbɪznəs deɪ/"}, {"w": "same-day shipping", "hw": "same-day shipping", "pos": "n.", "zh": "當日出貨", "ex": "Same-day shipping costs ten dollars more.", "ipa": "/seɪm deɪ ˈʃɪpɪŋ/"}, {"w": "pay extra", "hw": "pay extra", "pos": "phr.", "zh": "加付費用", "ex": "You must pay extra for large bags.", "ipa": "/peɪ ˈekstrə/"}], "en": {"point": ["<em>unless<\/em> = except if.", "unless = 除非。"], "why": ["The rule is that orders after 3 p.m. ship the next day. Paying extra for <em>same-day shipping<\/em> is an exception to it, so use <em>unless<\/em>.", "規則是下午三點後的訂單隔天出貨。加價選 same-day shipping 是這條規則的例外，所以用 unless。"]}}, {"id": "g-connect-05", "type": "grammar", "format": "gap", "unit": "connect", "level": 3, "source": "hand", "reviewed": true, "v": 1, "stem": "______ the company spent far less on advertising in June, sales of its new desk lamp still rose by 20 percent.", "options": ["Because", "Even though", "Despite", "Nevertheless"], "answer": 1, "explain": {"point": "讓步又接子句，用連接詞 even though", "why": "空格後面是子句，要用連接詞；廣告費少很多、銷量卻仍成長，是讓步關係，still 也是線索，所以用 Even though。", "wrong": ["連接詞，但表因果，和 still 的讓步意思矛盾", null, "意思對，但它是介系詞，不能接子句", "連接副詞，不能連接兩個子句；也該放在後一句開頭"], "zh": "儘管公司六月的廣告支出少了很多，新款桌燈的銷量仍然成長了百分之二十。", "vocab": [["advertising", "廣告"], ["desk lamp", "桌燈"], ["rise by", "上升（多少幅度）"]]}, "gloss": [{"w": "advertising", "hw": "advertising", "pos": "n.", "zh": "廣告", "ex": "Advertising costs rose last year.", "ipa": "/ˈædvərˌtaɪzɪŋ/"}, {"w": "desk lamp", "hw": "desk lamp", "pos": "n.", "zh": "桌燈", "ex": "This desk lamp has a built-in charger.", "ipa": "/desk læmp/"}, {"w": "rose by", "hw": "rise by", "pos": "phr.", "zh": "上升（幅度）", "ex": "Prices may rise by five percent.", "ipa": "/raɪz baɪ/"}], "en": {"point": ["<em>even though<\/em> + clause: a contrast.", "even though + 子句：表示讓步。"], "why": ["A clause follows the blank. Spending <em>far less on advertising<\/em> would lead you to expect weak sales, but sales <em>still rose<\/em>. Use <em>Even though<\/em>.", "空格後面是子句。廣告費少很多，照理銷量會差，但銷量 still rose，所以用 Even though。"]}}, {"id": "g-prep-01", "type": "grammar", "format": "gap", "unit": "prep", "level": 1, "source": "hand", "reviewed": true, "v": 1, "stem": "The online system for first-quarter expense claims opens on March 20, and every claim must be submitted ______ April 5.", "options": ["by", "until", "since", "within"], "answer": 0, "explain": {"point": "by 是期限：一次性的動作最晚在這之前完成", "why": "must be submitted 是一次性的動作，April 5 是最晚期限，所以用 by。March 20 開放只是背景，不代表送出要持續到 April 5。", "wrong": [null, "until 表示狀態持續到那時，不配一次性的送出", "since 標的是「從那時起」的起點，不能表示截止期限", "within 後面接一段期間，不接日期"], "zh": "第一季費用申請的線上系統在三月二十日開放，每一筆申請都必須在四月五日前送出。", "vocab": [["expense claim", "費用申請、報帳"], ["first-quarter", "第一季的"], ["submit", "提交、送出"]]}, "gloss": [{"w": "expense claims", "hw": "expense claim", "pos": "n.", "zh": "費用申請、報帳", "ex": "Each expense claim needs a receipt.", "ipa": "/ɪkˈspens kleɪm/"}, {"w": "first-quarter", "hw": "first-quarter", "pos": "adj.", "zh": "第一季的", "ex": "The first-quarter results look strong.", "ipa": "/fɜrst ˈkwɔːrtər/"}, {"w": "submitted", "hw": "submit", "pos": "v.", "zh": "提交", "ex": "Please submit the form online.", "ipa": "/səbˈmɪt/"}], "en": {"point": ["<em>by<\/em> = no later than.", "by = 最晚在……之前。"], "why": ["<em>April 5<\/em> is the last day, and <em>must be submitted<\/em> is a one-time action. It has to be done no later than that date: <em>by<\/em>.", "April 5 是最後一天，must be submitted 是一次性的動作，最晚要在這天之前完成：by。"]}}, {"id": "g-prep-02", "type": "grammar", "format": "gap", "unit": "prep", "level": 1, "source": "hand", "reviewed": true, "v": 1, "stem": "The main entrance of the building will be closed ______ three days while new floor tiles are installed.", "options": ["during", "since", "by", "for"], "answer": 3, "explain": {"point": "for 加時間長度，during 加事件或期間名稱", "why": "three days 是時間長度，說明正門要關多久，所以用 for。", "wrong": ["during 後面接事件或期間的名稱，不接長度", "since 接時間點，搭配現在完成式", "by 是期限，後面接時間點", null], "zh": "大樓鋪設新地磚期間，正門將關閉三天。", "vocab": [["main entrance", "正門"], ["floor tile", "地磚"], ["install", "安裝、鋪設"]]}, "gloss": [{"w": "main entrance", "hw": "main entrance", "pos": "n.", "zh": "正門", "ex": "Use the main entrance after 8 a.m.", "ipa": "/meɪn ˈentrəns/"}, {"w": "floor tiles", "hw": "floor tile", "pos": "n.", "zh": "地磚", "ex": "The floor tiles are made of stone.", "ipa": "/flɔːr taɪl/"}, {"w": "installed", "hw": "install", "pos": "v.", "zh": "安裝", "ex": "The team installed new lights today.", "ipa": "/ˌɪnˈstɔːl/"}], "en": {"point": ["<em>for<\/em> + a length of time.", "for + 一段時間的長度。"], "why": ["<em>three days<\/em> is a length of time. It says how long the entrance will stay closed, so use <em>for<\/em>.", "three days 是一段時間的長度，說明正門要關多久，所以用 for。"]}}, {"id": "g-prep-03", "type": "grammar", "format": "gap", "unit": "prep", "level": 2, "source": "hand", "reviewed": true, "v": 1, "stem": "______ completion of the training course, each participant will receive a certificate signed by the director.", "options": ["Until", "Since", "Upon", "Within"], "answer": 2, "explain": {"point": "upon 加名詞，表示「一……就」", "why": "收到證書是課程一完成就發生的一次性動作，upon completion 正好表示「一完成就」。", "wrong": ["until 表示持續到那時，不配一次性的收到", "since 搭配現在完成式，不配 will receive", null, "within 後面接一段期間，completion 不是期間"], "zh": "一完成訓練課程，每位學員都會收到一張由主任簽名的證書。", "vocab": [["completion", "完成"], ["participant", "參加者、學員"], ["certificate", "證書"]]}, "gloss": [{"w": "completion", "hw": "completion", "pos": "n.", "zh": "完成", "ex": "Completion of the project is due in May.", "ipa": "/kəmˈpliːʃən/"}, {"w": "participant", "hw": "participant", "pos": "n.", "zh": "參加者", "ex": "Each participant gets a free lunch.", "ipa": "/pɑrˈtɪsəpənt/"}, {"w": "certificate", "hw": "certificate", "pos": "n.", "zh": "證書", "ex": "The certificate is signed by the director.", "ipa": "/sərˈtɪfɪkət/"}], "en": {"point": ["<em>upon<\/em> + noun = as soon as.", "upon + 名詞 = 一……就。"], "why": ["The certificate is given the moment the course ends. <em>Upon completion of the training course<\/em> means \"as soon as it is completed\".", "證書在課程結束的當下發給學員。Upon completion of the training course 的意思是「一完成就」。"]}}, {"id": "g-prep-04", "type": "grammar", "format": "gap", "unit": "prep", "level": 3, "source": "hand", "reviewed": true, "v": 1, "stem": "______ the merger with Kessling Freight last year, Orvane Shipping has doubled the size of its fleet.", "options": ["During", "Since", "Until", "Within"], "answer": 1, "explain": {"point": "since 接過去的時間點，搭配現在完成式", "why": "主句是現在完成式 has doubled，講的是從去年合併到現在的變化，起點要用 since。", "wrong": ["during 只講去年那段期間，不配現在完成式", null, "until 講到合併那時為止，但 has doubled 延續到現在", "within 後面接一段期間，the merger 不是期間"], "zh": "自從去年和 Kessling 貨運合併以來，Orvane 航運的船隊規模已經擴大了一倍。", "vocab": [["merger", "合併"], ["fleet", "船隊"], ["double", "變成兩倍"]]}, "gloss": [{"w": "merger", "hw": "merger", "pos": "n.", "zh": "合併", "ex": "The merger created a much larger firm.", "ipa": "/ˈmɜrdʒər/"}, {"w": "fleet", "hw": "fleet", "pos": "n.", "zh": "船隊、車隊", "ex": "The company owns a fleet of ten trucks.", "ipa": "/fliːt/"}, {"w": "doubled", "hw": "double", "pos": "v.", "zh": "變成兩倍", "ex": "Sales doubled in two years.", "ipa": "/ˈdʌbəl/"}], "en": {"point": ["<em>since<\/em> + a past point, with present perfect.", "since + 過去時間點，搭配現在完成式。"], "why": ["The main verb is <em>has doubled<\/em>, present perfect. It covers the time from <em>the merger with Kessling Freight last year<\/em> until now, so the starting point needs <em>Since<\/em>.", "主要動詞是現在完成式 has doubled，涵蓋從 the merger with Kessling Freight last year 到現在，起點要用 Since。"]}}, {"id": "g-participle-01", "type": "grammar", "format": "gap", "unit": "participle", "level": 1, "source": "hand", "reviewed": true, "v": 1, "stem": "Customers can download the ______ price list from our website starting next Monday.", "options": ["updated", "update", "updating", "updates"], "answer": 0, "explain": {"point": "名詞前的分詞：被動用 -ed", "why": "價目表是「被更新」的，放在名詞 price list 前面表示被動，要用 -ed 的 updated。", "wrong": [null, "原形動詞不能修飾名詞；當名詞也沒有 update price list 的說法", "-ing 表主動，價目表不會自己去更新", "動詞不能修飾名詞；updates price list 也不是複合名詞"], "zh": "顧客從下週一起可以在我們的網站下載更新後的價目表。", "vocab": [["price list", "價目表"], ["download", "下載"]]}, "gloss": [{"w": "price list", "hw": "price list", "pos": "n.", "zh": "價目表", "ex": "The price list changes every spring.", "ipa": "/praɪs lɪst/"}, {"w": "download", "hw": "download", "pos": "v.", "zh": "下載", "ex": "You can download the manual here.", "ipa": "/ˈdaʊnˌloʊd/"}], "en": {"point": ["Before a noun, a passive participle takes -ed.", "名詞前的被動分詞用 -ed。"], "why": ["The price list is something that gets updated. Before the noun <em>price list<\/em>, a passive meaning takes -ed: <em>updated<\/em>.", "價目表是被更新的東西。在名詞 price list 前面表示被動，用 -ed：updated。"]}}, {"id": "g-participle-02", "type": "grammar", "format": "gap", "unit": "participle", "level": 2, "source": "hand", "reviewed": true, "v": 1, "stem": "Companies ______ in the Westbrook trade fair will be listed in the official catalog.", "options": ["participated", "participate", "participation", "participating"], "answer": 3, "explain": {"point": "名詞後的分詞片語：主動用 -ing", "why": "句子的動詞是 will be listed，空格只能是修飾 Companies 的分詞；公司是主動參加，所以用 participating。", "wrong": ["-ed 表被動，但公司是主動參加的", "原形動詞，句子已經有動詞 will be listed", "名詞，不能接在 Companies 後面修飾它", null], "zh": "參加 Westbrook 商展的公司會被列在官方型錄裡。", "vocab": [["trade fair", "商展"], ["catalog", "型錄、目錄"], ["participate in", "參加"]]}, "gloss": [{"w": "trade fair", "hw": "trade fair", "pos": "n.", "zh": "商展", "ex": "We will have a stand at the trade fair.", "ipa": "/treɪd fer/"}, {"w": "catalog", "hw": "catalog", "pos": "n.", "zh": "型錄", "ex": "The catalog lists all our products.", "ipa": "/ˈkætəlɔɡ/"}, {"w": "listed", "hw": "list", "pos": "v.", "zh": "列出", "ex": "Your name will be listed on the website.", "ipa": "/lɪst/"}], "en": {"point": ["After a noun, an active participle takes -ing.", "名詞後的主動分詞用 -ing。"], "why": ["The verb of the sentence is <em>will be listed<\/em>, so the blank only describes <em>Companies<\/em>. The companies take part themselves, so the meaning is active: <em>participating<\/em>.", "句子的動詞是 will be listed，空格只是修飾 Companies。公司是自己參加，意思是主動，用 participating。"]}}, {"id": "g-participle-03", "type": "grammar", "format": "gap", "unit": "participle", "level": 2, "source": "hand", "reviewed": true, "v": 1, "stem": "______ in only six months, the new distribution center in Haverford can process 20,000 orders a day.", "options": ["Building", "Build", "Built", "Builder"], "answer": 2, "explain": {"point": "分詞構句：主詞被動承受用 -ed", "why": "句首分詞片語的主詞就是主句的 the new distribution center；物流中心是「被蓋」的，所以用 Built。", "wrong": ["-ing 表主動，物流中心不會自己蓋", "原形動詞放句首是祈使句，和主句接不起來", null, "名詞「建造者」，不能帶出分詞片語"], "zh": "位於 Haverford 的新物流中心只花六個月就蓋好，每天可以處理兩萬張訂單。", "vocab": [["distribution center", "物流中心"], ["process", "處理"], ["order", "訂單"]]}, "gloss": [{"w": "distribution center", "hw": "distribution center", "pos": "n.", "zh": "物流中心", "ex": "The distribution center ships to every state.", "ipa": "/ˌdɪstrəˈbjuːʃən ˈsentər/"}, {"w": "process", "hw": "process", "pos": "v.", "zh": "處理", "ex": "We can process refunds within two days.", "ipa": "/ˈprɑːˌses/"}, {"w": "orders", "hw": "order", "pos": "n.", "zh": "訂單", "ex": "We received fifty orders this morning.", "ipa": "/ˈɔːrdər/"}], "en": {"point": ["The subject receives the action: use <em>-ed<\/em>.", "主詞承受動作：用 -ed。"], "why": ["The opening phrase describes <em>the new distribution center<\/em>. The center did not build anything; it was built <em>in only six months<\/em>. So use <em>Built<\/em>.", "句首片語描述的是 the new distribution center。物流中心不是自己蓋，而是 in only six months 被蓋好，所以用 Built。"]}}, {"id": "g-participle-04", "type": "grammar", "format": "gap", "unit": "participle", "level": 3, "source": "hand", "reviewed": true, "v": 1, "stem": "Although the sales figures for the company's new line of kitchen appliances were ______, the board decided to keep the products on the market.", "options": ["disappointed", "disappointing", "disappoint", "disappointment"], "answer": 1, "explain": {"point": "情緒動詞：事物讓人有感覺用 -ing", "why": "主詞是 the sales figures（銷售數字），是「讓人失望」的事物，不是感到失望的人，所以用 disappointing。", "wrong": ["-ed 是人「感到」失望，數字不會有感覺", null, "原形動詞，不能放在 were 後面", "名詞要說 a disappointment，少了冠詞不成立"], "zh": "雖然公司新系列廚房家電的銷售數字令人失望，董事會還是決定讓這些產品繼續在市面上販售。", "vocab": [["sales figures", "銷售數字"], ["kitchen appliance", "廚房家電"], ["board", "董事會"]]}, "gloss": [{"w": "sales figures", "hw": "sales figure", "pos": "n.", "zh": "銷售數字", "ex": "The sales figures will be released on Monday.", "ipa": "/seɪlz ˈfɪɡjər/"}, {"w": "kitchen appliances", "hw": "kitchen appliance", "pos": "n.", "zh": "廚房家電", "ex": "Kitchen appliances are on sale this week.", "ipa": "/ˈkɪtʃən əˈplaɪəns/"}, {"w": "board", "hw": "board", "pos": "n.", "zh": "董事會", "ex": "The board meets every quarter.", "ipa": "/bɔːrd/"}], "en": {"point": ["A thing that causes the feeling takes <em>-ing<\/em>.", "造成感受的事物用 -ing。"], "why": ["The subject is <em>the sales figures<\/em>. The figures cause disappointment in people; they do not feel it. So use <em>disappointing<\/em>.", "主詞是 the sales figures。數字是讓人失望的事物，自己不會感到失望，所以用 disappointing。"]}}, {"id": "g-pos-07", "type": "grammar", "format": "gap", "unit": "pos", "level": 1, "source": "hand", "reviewed": true, "v": 1, "stem": "Thanks to the new signs posted along Merrow Road, most first-time visitors can now find the Pembry Conference Center ______ without calling ahead for directions.", "options": ["easy", "ease", "easiness", "easily"], "answer": 3, "explain": {"point": "完整子句後修飾動詞用副詞；find 在這裡是「找到」", "why": "find 在這裡是「找到」地方，空格說明找到的方式，修飾動詞用副詞 easily；後面的 without calling ahead for directions 也說明在講找路。", "wrong": ["find + 受詞 + 形容詞是「覺得……」，這裡 find 是找到", "名詞，要說 with ease 才能修飾動詞", "名詞，放在受詞後面不成句", null], "wrongMore": ["find the center easy 會變成「覺得會議中心很簡單」，句意不通；後面 without calling ahead for directions 說明是在講「找不找得到路」，所以要用副詞修飾 find。", null, null, null], "zh": "多虧 Merrow 路沿途新設的指標，大多數第一次來的訪客現在不必先打電話問路，就能輕鬆找到 Pembry 會議中心。", "vocab": [["sign", "指標、標示牌"], ["call ahead", "事先打電話"], ["directions", "路線指引"]]}, "gloss": [{"w": "signs", "hw": "sign", "pos": "n.", "zh": "指標、標示牌", "ex": "The signs point to the exit.", "ipa": "/saɪn/"}, {"w": "calling ahead", "hw": "call ahead", "pos": "phr.", "zh": "事先打電話", "ex": "Calling ahead saves time at the door.", "ipa": "/kɔːl əˈhed/"}, {"w": "directions", "hw": "directions", "pos": "n.", "zh": "路線指引", "ex": "Can you give me directions to the station?", "ipa": "/dərˈekʃənz/"}], "en": {"point": ["An adverb modifies a verb.", "副詞修飾動詞。"], "why": ["<em>find the Pembry Conference Center<\/em> is already a full clause. The blank says how visitors find it, so it modifies the verb and needs an adverb: <em>easily<\/em>.", "find the Pembry Conference Center 已經是完整的子句。空格說明訪客怎麼找到，修飾動詞，要用副詞 easily。"]}}, {"id": "g-pos-08", "type": "grammar", "format": "gap", "unit": "pos", "level": 1, "source": "hand", "reviewed": true, "v": 1, "stem": "The results of last month's customer survey ______ that most shoppers would pay slightly more for faster delivery, especially those living outside major cities.", "options": ["indication", "indicate", "indicative", "indicating"], "answer": 1, "explain": {"point": "句子缺主要動詞，空格就要填動詞", "why": "主詞 The results 缺主要動詞（would pay 屬於 that 子句），空格要當主要動詞；results 是複數，所以用 indicate。", "wrong": ["名詞，放在主詞後面不能當動詞", null, "形容詞，前面缺 are；要說 are indicative of", "分詞可修飾 results，但全句就沒有動詞了"], "wrongMore": [null, null, null, "The results indicating that ... 前半看起來很通順，但一路讀到句尾都沒有主要動詞，整句只剩一個很長的名詞片語，不成句。"], "zh": "上個月顧客調查的結果顯示，大多數消費者願意為更快的送貨多付一點錢，住在大城市以外的人尤其如此。", "vocab": [["customer survey", "顧客調查"], ["indicate", "顯示、表明"], ["delivery", "送貨"]]}, "gloss": [{"w": "customer survey", "hw": "customer survey", "pos": "n.", "zh": "顧客調查", "ex": "The customer survey takes five minutes.", "ipa": "/ˈkʌstəmər sərˈveɪ/"}, {"w": "slightly", "hw": "slightly", "pos": "adv.", "zh": "稍微", "ex": "Costs rose slightly in May.", "ipa": "/ˈslaɪtli/"}, {"w": "delivery", "hw": "delivery", "pos": "n.", "zh": "送貨", "ex": "Delivery usually takes two days.", "ipa": "/dɪˈlɪvəri/"}], "en": {"point": ["A sentence needs a main verb.", "句子需要一個主要動詞。"], "why": ["The subject is <em>The results<\/em>, and it has no main verb yet. The blank must be that verb. <em>Results<\/em> is plural, so use <em>indicate<\/em>.", "主詞是 The results，還沒有主要動詞，空格就要填這個動詞。results 是複數，所以用 indicate。"]}}, {"id": "g-tense-06", "type": "grammar", "format": "gap", "unit": "tense", "level": 2, "source": "hand", "reviewed": true, "v": 1, "stem": "Ms. Delgado, who joined Halloway Engineering as a junior engineer straight out of college, ______ with the firm for thirty-two years when she retires at the end of next month.", "options": ["has been", "had been", "will have been", "was"], "answer": 2, "explain": {"point": "到未來某個時間點為止的累積 → will have p.p.", "why": "句尾 when she retires at the end of next month 是未來的時間點；到那時「已經待滿」三十二年，要用未來完成式 will have been。", "wrong": ["現在完成式只算到現在，不配句尾「下個月退休」", "過去完成式要有過去的時間點，這裡是未來", null, "過去式，和 when she retires next month 對不上"], "wrongMore": ["前面的 who joined ... 和 for thirty-two years 很像現在完成式的線索，但要讀到句尾 when she retires at the end of next month 才知道時間點在未來，要用 will have been。", null, null, null], "zh": "Delgado 女士大學一畢業就以初級工程師的身分進入 Halloway 工程公司，到下個月底退休時，她就在公司待滿三十二年了。", "vocab": [["junior engineer", "初級工程師"], ["firm", "公司"], ["retire", "退休"]]}, "gloss": [{"w": "junior engineer", "hw": "junior engineer", "pos": "n.", "zh": "初級工程師", "ex": "A junior engineer works under a senior lead.", "ipa": "/ˈdʒuːnjər ˈendʒəˈnɪr/"}, {"w": "firm", "hw": "firm", "pos": "n.", "zh": "公司", "ex": "She works for a law firm.", "ipa": "/fɜrm/"}, {"w": "retires", "hw": "retire", "pos": "v.", "zh": "退休", "ex": "He retires next June.", "ipa": "/rɪˈtaɪr/"}], "en": {"point": ["A future point, counting up to it: <em>will have been<\/em>.", "累積到未來某個時間點：will have been。"], "why": ["<em>when she retires at the end of next month<\/em> is a point in the future. By then she will have completed <em>thirty-two years<\/em>, so use <em>will have been<\/em>.", "when she retires at the end of next month 是未來的時間點。到那時她會已經待滿 thirty-two years，所以用 will have been。"]}}, {"id": "g-connect-06", "type": "grammar", "format": "gap", "unit": "connect", "level": 2, "source": "hand", "reviewed": true, "v": 1, "stem": "Because the loading dock is staffed only until 5 p.m., the warehouse will accept deliveries after that time ______ the driver has arranged access with the night supervisor in advance.", "options": ["unless", "provided that", "so that", "even if"], "answer": 1, "explain": {"point": "provided that「只要、前提是」引出條件", "why": "碼頭五點後沒人值班，五點後收貨得先安排；「事先和夜班主管約好」是收貨的前提，所以用 provided that。", "wrong": ["意思相反：變成約好了反而不收", null, "表目的，但司機約好不是收貨的目的", "表讓步，「約好了也照收」和句首的原因不合"], "wrongMore": ["unless 放在這裡文法通，句型也常見；但它是「除非約好，否則都收」，等於約好就不收。句首 Because 說碼頭五點後沒人，所以事先安排是收貨的條件，不是例外。", null, null, null], "zh": "由於卸貨碼頭只有到下午五點有人值班，五點以後送來的貨，只要司機事先和夜班主管約好進場，倉庫就會收。", "vocab": [["loading dock", "卸貨碼頭"], ["night supervisor", "夜班主管"], ["in advance", "事先"]]}, "gloss": [{"w": "loading dock", "hw": "loading dock", "pos": "n.", "zh": "卸貨碼頭", "ex": "Trucks park at the loading dock.", "ipa": "/ˈloʊdɪŋ dɑːk/"}, {"w": "night supervisor", "hw": "night supervisor", "pos": "n.", "zh": "夜班主管", "ex": "The night supervisor locks the gate.", "ipa": "/naɪt ˈsuːpərˌvaɪzər/"}, {"w": "in advance", "hw": "in advance", "pos": "phr.", "zh": "事先", "ex": "Please book your seat in advance.", "ipa": "/ɪn ədˈvæns/"}], "en": {"point": ["<em>provided that<\/em> = only if.", "provided that = 只要、前提是。"], "why": ["The dock has no staff after 5 p.m. The warehouse takes deliveries then only if <em>the driver has arranged access … in advance<\/em>. That is a condition, so use <em>provided that<\/em>.", "碼頭五點後沒人值班。只有司機 has arranged access … in advance 才收貨，這是條件，所以用 provided that。"]}}, {"id": "g-participle-05", "type": "grammar", "format": "gap", "unit": "participle", "level": 2, "source": "hand", "reviewed": true, "v": 1, "stem": "The consultants ______ last spring to review the company's operations have recommended closing two of its five regional offices by the end of the year.", "options": ["hiring", "were hired", "hire", "hired"], "answer": 3, "explain": {"point": "句子已有動詞，名詞後用分詞修飾；被動用 -ed", "why": "句子的動詞是後面的 have recommended，空格只能是修飾 consultants 的分詞；顧問是「被聘請」的，所以用 hired。", "wrong": ["-ing 表主動，但顧問是被聘，不是去聘人", "被動沒錯，但加了 were 會和 have recommended 撞成兩個動詞", "原形動詞，會和後面的 have recommended 撞成兩個動詞", null], "wrongMore": [null, "The consultants were hired last spring to review the company's operations 單獨看是完整的句子，但後面還有 have recommended；一句話不能有兩個主要動詞，所以只能用分詞 hired 修飾 consultants。", null, null], "zh": "去年春天受聘來檢視公司營運的顧問，已經建議在年底前關閉公司五個區域辦事處中的兩個。", "vocab": [["consultant", "顧問"], ["operations", "營運"], ["regional office", "區域辦事處"]]}, "gloss": [{"w": "consultants", "hw": "consultant", "pos": "n.", "zh": "顧問", "ex": "The consultant reviewed our budget.", "ipa": "/kənˈsʌltənt/"}, {"w": "operations", "hw": "operations", "pos": "n.", "zh": "營運", "ex": "Operations are managed from the head office.", "ipa": "/ˌɑːpərˈeɪʃənz/"}, {"w": "regional offices", "hw": "regional office", "pos": "n.", "zh": "區域辦事處", "ex": "We have a regional office in Taipei.", "ipa": "/ˈriːdʒənəl ˈɔːfɪs/"}], "en": {"point": ["After a noun, a passive participle takes <em>-ed<\/em>.", "名詞後的被動分詞用 -ed。"], "why": ["The verb of the sentence is <em>have recommended<\/em>, so the blank only describes <em>The consultants<\/em>. They were brought in by the company, so the meaning is passive: <em>hired<\/em>.", "句子的動詞是 have recommended，空格只是修飾 The consultants。顧問是被公司請來的，意思是被動，用 hired。"]}}, {"id": "g-prep-05", "type": "grammar", "format": "gap", "unit": "prep", "level": 1, "source": "hand", "reviewed": true, "v": 1, "stem": "All chemicals used in the Rennick Street laboratory must be labeled and stored ______ the guidelines set out in section 4 of the safety manual that every new employee receives.", "options": ["in response to", "in addition to", "in accordance with", "in exchange for"], "answer": 2, "explain": {"point": "in accordance with「依照（規定、指示）」", "why": "化學品要「依照」手冊第 4 節的規定來標示和存放，表示遵照規定用 in accordance with。", "wrong": ["「回應、因應」某事，不表示照規定去做", "「除了……之外」，意思接不上", null, "「換取」某物，規定不是拿來交換的東西"], "wrongMore": ["in response to the guidelines 單看很順，但它是「回應、因應」，例如 in response to your letter；要說照著規定做，要用 in accordance with。", null, null, null], "zh": "Rennick 街實驗室使用的所有化學品，都必須依照每位新進員工都會拿到的安全手冊第 4 節的規定標示和存放。", "vocab": [["chemical", "化學品"], ["label", "標示、貼標籤"], ["set out", "（在文件中）列出、訂定"]]}, "gloss": [{"w": "chemicals", "hw": "chemical", "pos": "n.", "zh": "化學品", "ex": "Some chemicals must be kept cold.", "ipa": "/ˈkeməkəl/"}, {"w": "labeled", "hw": "label", "pos": "v.", "zh": "貼標籤、標示", "ex": "Please label each box clearly.", "ipa": "/ˈleɪbəl/"}, {"w": "set out", "hw": "set out", "pos": "phr.", "zh": "（文件中）列出", "ex": "The rules are set out in the contract.", "ipa": "/set aʊt/"}], "en": {"point": ["<em>in accordance with<\/em> = following a rule.", "in accordance with = 依照（規定）。"], "why": ["The chemicals must be labeled and stored as <em>the guidelines set out in section 4<\/em> say. Following a rule is <em>in accordance with<\/em>.", "化學品要照 the guidelines set out in section 4 的規定來標示和存放。遵照規定就是 in accordance with。"]}}, {"id": "g-prep-06", "type": "grammar", "format": "gap", "unit": "prep", "level": 2, "source": "hand", "reviewed": true, "v": 1, "stem": "In her quarterly report, the logistics manager attributes most of the drop in second-quarter shipments ______ delays at the Port of Castrell, which was closed for nine days in May.", "options": ["to", "from", "for", "with"], "answer": 0, "explain": {"point": "動詞 + 介系詞：attribute A to B（把 A 歸因於 B）", "why": "attribute 固定用 attribute A to B（把 A 歸因於 B）；A 是中間那一長串 most of the drop ...，B 是港口延誤。", "wrong": [null, "shipments from 看似通順，但 attribute 要配 to", "attribute 不接 for；account for 才接 for", "attribute 不接 with；credit A with B 才接 with"], "wrongMore": [null, "空格前後讀成 shipments from delays（延誤造成的減少）好像說得通，但介系詞是由前面的動詞 attributes 決定的：attribute A to B，A 就是 most of the drop in second-quarter shipments。", null, null], "zh": "物流經理在季報中，把第二季出貨量的下滑大多歸因於 Castrell 港的延誤；該港五月曾關閉九天。", "vocab": [["attribute A to B", "把 A 歸因於 B"], ["shipment", "出貨、出貨量"], ["logistics", "物流"]]}, "gloss": [{"w": "attributes", "hw": "attribute", "pos": "v.", "zh": "把……歸因於", "ex": "She attributes the growth to better training.", "ipa": "/ˈætrəˌbjuːt/"}, {"w": "shipments", "hw": "shipment", "pos": "n.", "zh": "出貨量、貨物", "ex": "Shipments fell by ten percent in March.", "ipa": "/ˈʃɪpmənt/"}, {"w": "logistics manager", "hw": "logistics manager", "pos": "n.", "zh": "物流經理", "ex": "The logistics manager plans all deliveries.", "ipa": "/ləˈdʒɪstɪks ˈmænədʒər/"}], "en": {"point": ["<em>attribute<\/em> A <em>to<\/em> B.", "attribute A to B（把 A 歸因於 B）。"], "why": ["The verb is <em>attributes<\/em>. Its pattern is <em>attribute<\/em> A <em>to<\/em> B. Here A is <em>most of the drop in second-quarter shipments<\/em>, and B is <em>delays at the Port of Castrell<\/em>.", "動詞是 attributes，句型是 attribute A to B。A 是 most of the drop in second-quarter shipments，B 是 delays at the Port of Castrell。"]}}, {"id": "g-prep-07", "type": "grammar", "format": "gap", "unit": "prep", "level": 1, "source": "hand", "reviewed": true, "v": 1, "stem": "I am writing ______ the Norrell Valley Business Association to invite you to speak at our annual awards dinner on October 14.", "options": ["on behalf of", "in favor of", "in charge of", "in case of"], "answer": 0, "explain": {"point": "on behalf of「代表（某人或團體）」", "why": "寫信的人代表協會發出邀請；後面說 our annual awards dinner，也說明他是協會的人，所以用 on behalf of。", "wrong": [null, "「支持、贊成」，寫信不是為了表態支持協會", "「負責、主管」，I am writing in charge of 不成句", "「萬一發生」，後面接事件，不接團體"], "wrongMore": [null, "writing in favor of ... 單看是通的（寫信表態支持某事），但後面說要邀請你到「我們的」晚宴演講，寫信人是協會的一員，是在代表協會邀請。", null, null], "zh": "我謹代表 Norrell Valley 商業協會寫信，邀請您於 10 月 14 日在本會的年度頒獎晚宴上致詞。", "vocab": [["on behalf of", "代表"], ["association", "協會"], ["awards dinner", "頒獎晚宴"]]}, "gloss": [{"w": "invite", "hw": "invite", "pos": "v.", "zh": "邀請", "ex": "We invite you to our open house.", "ipa": "/ˌɪnˈvaɪt/"}, {"w": "Association", "hw": "association", "pos": "n.", "zh": "協會", "ex": "The Association holds a meeting each May.", "ipa": "/əˌsoʊsiˈeɪʃən/"}, {"w": "awards dinner", "hw": "awards dinner", "pos": "n.", "zh": "頒獎晚宴", "ex": "The awards dinner starts at seven.", "ipa": "/əˈwɔːrdz ˈdɪnər/"}], "en": {"point": ["<em>on behalf of<\/em> = representing.", "on behalf of = 代表。"], "why": ["The writer is inviting you to <em>our annual awards dinner<\/em>, so the writer speaks for the association. Speaking for a group is <em>on behalf of<\/em>.", "寫信的人邀請你參加 our annual awards dinner，寫信的人是替協會發言。代表團體說話就是 on behalf of。"]}}, {"id": "g-voice-01", "type": "grammar", "format": "gap", "unit": "voice", "level": 1, "source": "hand", "reviewed": true, "v": 1, "stem": "The new security badges ______ to all employees by the end of next week.", "options": ["will distribute", "are distributing", "will be distributed", "distributed"], "answer": 2, "explain": {"point": "主詞承受動作、後面沒有受詞 → 被動 be + p.p.", "why": "識別證是被發放的一方，後面沒有受詞，要用被動；by the end of next week 是未來，所以用 will be distributed。", "wrong": ["主動要接受詞，而且識別證不會自己發放", "主動進行式，識別證不會自己發放，後面也缺受詞", null, "少了 be 就不是被動；當過去式又缺受詞、對不上 next week"], "zh": "新的識別證將在下週結束前發給所有員工。", "vocab": [["security badge", "識別證、門禁卡"], ["distribute", "分發、發放"]]}, "gloss": [{"w": "security badges", "hw": "security badge", "pos": "n.", "zh": "識別證、門禁卡", "ex": "Every visitor must wear a security badge.", "ipa": "/sɪˈkjʊrəti bædʒ/"}, {"w": "by the end of", "hw": "by the end of", "pos": "phr.", "zh": "在……結束之前", "ex": "Please send the report by the end of Friday.", "ipa": "/baɪ ðə end ʌv/"}], "en": {"point": ["The subject receives the action: be + past participle.", "主詞承受動作：be + p.p."], "why": ["The badges do not hand anything out; they are handed out, and no object follows the blank. <em>By the end of next week<\/em> is future. So the answer is <em>will be distributed<\/em>.", "識別證是被發放的一方，空格後沒有受詞；by the end of next week 是未來，所以用 will be distributed。"]}}, {"id": "g-voice-02", "type": "grammar", "format": "gap", "unit": "voice", "level": 2, "source": "hand", "reviewed": true, "v": 2, "stem": "Shipping costs for our overseas orders ______ by nearly eight percent since the start of the year.", "options": ["have raised", "have risen", "are rising", "have been raising"], "answer": 1, "explain": {"point": "rise 不及物；raise 及物要接受詞；since 配完成式", "why": "空格後的 by nearly eight percent 不是受詞，運費是自己「上漲」，用不及物的 rise；since 要配完成式：have risen。", "wrong": ["raise 是及物動詞，後面要有受詞", null, "rise 用對了，但 since 要配完成式，不配進行式", "raise 的完成進行式是主動，後面缺受詞"], "zh": "自年初以來，我們海外訂單的運費上漲了將近百分之八。", "vocab": [["shipping cost", "運費"], ["overseas", "海外的"]]}, "gloss": [{"w": "Shipping costs", "hw": "shipping cost", "pos": "n.", "zh": "運費", "ex": "Shipping costs are shown at checkout.", "ipa": "/ˈʃɪpɪŋ kɑːst/"}, {"w": "overseas", "hw": "overseas", "pos": "adj.", "zh": "海外的", "ex": "Our overseas customers pay in local currency.", "ipa": "/ˈoʊvərˈsiːz/"}], "en": {"point": ["<em>rise<\/em> takes no object; <em>raise<\/em> does.", "rise 不接受詞；raise 要接受詞。"], "why": ["Nothing follows the blank except <em>by nearly eight percent<\/em>, so the verb has no object: costs <em>rise<\/em> on their own. <em>Since the start of the year<\/em> needs the present perfect: <em>have risen<\/em>.", "空格後只有 by nearly eight percent，沒有受詞，運費自己上漲，用 rise；since the start of the year 配完成式：have risen。"]}}, {"id": "g-voice-03", "type": "grammar", "format": "gap", "unit": "voice", "level": 3, "source": "hand", "reviewed": true, "v": 1, "stem": "Ms. Okafor ______ a two-week paid sabbatical by the board of directors in recognition of her ten years of service.", "options": ["granted", "has granted", "was granting", "was granted"], "answer": 3, "explain": {"point": "授與動詞的被動，後面仍可接受詞：be granted + 名詞", "why": "by the board of directors 表示給假的是董事會，Okafor 女士是得到的人，用被動；grant 是授與動詞，被動後仍接 a sabbatical。", "wrong": ["主動表示「她給出」假期，和 by the board 衝突", "主動表示她給出假期，但給假的是董事會", "主動進行式，主客顛倒，也配不上 by the board", null], "zh": "Okafor 女士獲董事會給予兩週的帶薪長假，以表揚她十年來的服務。", "vocab": [["sabbatical", "（帶薪）長假"], ["board of directors", "董事會"], ["in recognition of", "為了表揚"]]}, "gloss": [{"w": "sabbatical", "hw": "sabbatical", "pos": "n.", "zh": "（帶薪）長假", "ex": "She took a sabbatical to write a book.", "ipa": "/səˈbætɪkəl/"}, {"w": "board of directors", "hw": "board of directors", "pos": "phr.", "zh": "董事會", "ex": "The board of directors meets every quarter.", "ipa": "/bɔːrd ʌv dərˈektərz/"}, {"w": "in recognition of", "hw": "in recognition of", "pos": "phr.", "zh": "為了表揚", "ex": "He got a bonus in recognition of his work.", "ipa": "/ɪn ˌrekəɡˈnɪʃən ʌv/"}], "en": {"point": ["<em>be granted<\/em> + noun: the receiver is the subject.", "be granted + 名詞：得到的人當主詞。"], "why": ["<em>By the board of directors<\/em> shows who gives the leave. Ms. Okafor receives it, so the verb is passive. A noun can still follow <em>granted<\/em>: <em>a two-week paid sabbatical<\/em>. The answer is <em>was granted<\/em>.", "by the board of directors 表示給假的是董事會，Okafor 女士是接受者，用被動；granted 後面仍可接 a two-week paid sabbatical。答案是 was granted。"]}}, {"id": "g-agree-01", "type": "grammar", "format": "gap", "unit": "agree", "level": 2, "source": "hand", "reviewed": true, "v": 1, "stem": "The projectors in every conference room on the fourth floor ______ been replaced with newer models.", "options": ["have", "has", "having", "to have"], "answer": 0, "explain": {"point": "動詞跟真正的主詞一致，不跟介系詞片語裡的名詞", "why": "主詞是複數的 The projectors；in every conference room on the fourth floor 是修飾它的介系詞片語，所以用 have。", "wrong": [null, "被 every conference room 帶偏；主詞 projectors 是複數", "分詞不能當主要動詞，句子會缺動詞", "不定詞不能當句子的主要動詞"], "zh": "四樓每間會議室的投影機都已經換成較新的機型了。", "vocab": [["projector", "投影機"], ["conference room", "會議室"], ["replace A with B", "把 A 換成 B"]]}, "gloss": [{"w": "projectors", "hw": "projector", "pos": "n.", "zh": "投影機", "ex": "The projector in room two is broken.", "ipa": "/prəˈdʒektər/"}, {"w": "conference room", "hw": "conference room", "pos": "n.", "zh": "會議室", "ex": "Please book the conference room early.", "ipa": "/ˈkɑːnfərəns ruːm/"}, {"w": "replaced with", "hw": "replace with", "pos": "phr.", "zh": "換成", "ex": "We replaced the old printer with a new one.", "ipa": "/ˌriːˈpleɪs wɪð/"}], "en": {"point": ["The verb agrees with the subject, not the nearby noun.", "動詞跟真正的主詞一致，不跟旁邊的名詞。"], "why": ["The subject is the plural <em>projectors<\/em>. <em>In every conference room on the fourth floor<\/em> only adds detail, so it does not change the verb. The answer is <em>have<\/em>.", "主詞是複數的 projectors；in every conference room on the fourth floor 只是補充說明，不影響動詞。答案是 have。"]}}, {"id": "g-agree-02", "type": "grammar", "format": "gap", "unit": "agree", "level": 2, "source": "hand", "reviewed": true, "v": 1, "stem": "Approving refund requests from overseas customers usually ______ longer than approving domestic ones.", "options": ["take", "taking", "have taken", "takes"], "answer": 3, "explain": {"point": "動名詞當主詞，動詞用單數", "why": "真正的主詞是動名詞 Approving，不是 requests 或 customers，所以用單數 takes。", "wrong": ["複數形，把 customers 誤當成主詞", "taking 不是完整動詞，句子會缺主要動詞", "have 要配複數主詞，這裡的主詞是單數的動名詞片語", null], "zh": "核准海外顧客的退款申請，通常比核准國內的花更多時間。", "vocab": [["refund", "退款"], ["approve", "核准"], ["domestic", "國內的"]]}, "gloss": [{"w": "refund", "hw": "refund", "pos": "n.", "zh": "退款", "ex": "You can ask for a refund within a week.", "ipa": "/rɪˈfʌnd/"}, {"w": "domestic", "hw": "domestic", "pos": "adj.", "zh": "國內的", "ex": "Domestic flights are cheaper than overseas ones.", "ipa": "/dəˈmestɪk/"}], "en": {"point": ["A gerund subject takes a singular verb.", "動名詞當主詞，動詞用單數。"], "why": ["The subject is the gerund <em>Approving<\/em>, not <em>requests<\/em> or <em>customers<\/em>. The act of approving is one thing, so the verb is singular: <em>takes<\/em>.", "主詞是動名詞 Approving，不是 requests 或 customers。「核准這件事」是單數，所以用 takes。"]}}, {"id": "g-agree-03", "type": "grammar", "format": "gap", "unit": "agree", "level": 3, "source": "hand", "reviewed": true, "v": 1, "stem": "Neither the lease agreement nor the two service contracts ______ renewal until next spring.", "options": ["requires", "require", "requiring", "to require"], "answer": 1, "explain": {"point": "neither A nor B：動詞跟比較靠近的 B", "why": "neither A nor B 的動詞跟比較靠近的 B 一致；B 是複數的 the two service contracts，所以用 require。", "wrong": ["單數形，跟到 A（lease agreement）了", null, "分詞不能當句子的主要動詞", "不定詞不能當句子的主要動詞"], "zh": "租約和那兩份服務合約都要到明年春天才需要續約。", "vocab": [["lease agreement", "租約"], ["service contract", "服務合約"], ["renewal", "續約"]]}, "gloss": [{"w": "lease agreement", "hw": "lease agreement", "pos": "n.", "zh": "租約", "ex": "Please sign the lease agreement today.", "ipa": "/liːs əˈɡriːmənt/"}, {"w": "service contracts", "hw": "service contract", "pos": "n.", "zh": "服務合約", "ex": "The service contract covers repairs for two years.", "ipa": "/ˈsɜrvəs ˈkɑːnˌtrækt/"}, {"w": "renewal", "hw": "renewal", "pos": "n.", "zh": "續約", "ex": "The renewal date is June 1.", "ipa": "/rɪˈnuːəl/"}], "en": {"point": ["<em>neither A nor B<\/em>: the verb agrees with B.", "neither A nor B：動詞跟 B 一致。"], "why": ["The noun closest to the blank is <em>the two service contracts<\/em>, which is plural. So the verb is plural: <em>require<\/em>.", "離空格最近的名詞是 the two service contracts，是複數，所以動詞用複數：require。"]}}, {"id": "g-relative-01", "type": "grammar", "format": "gap", "unit": "relative", "level": 1, "source": "hand", "reviewed": true, "v": 1, "stem": "Customers ______ subscriptions expire this month will receive a renewal reminder by email.", "options": ["who", "whom", "whose", "which"], "answer": 2, "explain": {"point": "名詞屬於先行詞、後面子句完整 → 所有格 whose", "why": "subscriptions expire this month 已是完整子句，subscriptions 是顧客的訂閱，所以用所有格 whose。", "wrong": ["who 要補子句缺的主詞或受詞，但後面子句已完整", "whom 當受詞，但後面的子句並不缺受詞", null, "先行詞 Customers 是人，不能用 which"], "zh": "訂閱在本月到期的顧客，會收到一封續訂提醒電子郵件。", "vocab": [["subscription", "訂閱"], ["expire", "到期"], ["renewal", "續訂、續約"]]}, "gloss": [{"w": "subscriptions", "hw": "subscription", "pos": "n.", "zh": "訂閱", "ex": "My subscription ends in March.", "ipa": "/səbˈskrɪpʃən/"}, {"w": "expire", "hw": "expire", "pos": "v.", "zh": "到期", "ex": "The coupon will expire on Friday.", "ipa": "/ɪkˈspaɪr/"}, {"w": "renewal reminder", "hw": "renewal reminder", "pos": "n.", "zh": "續訂提醒", "ex": "We sent a renewal reminder last week.", "ipa": "/rɪˈnuːəl riˈmaɪndər/"}], "en": {"point": ["<em>whose<\/em> + noun: the noun belongs to the person before.", "whose + 名詞：名詞屬於前面的人。"], "why": ["<em>Subscriptions expire this month<\/em> is already a full clause. The subscriptions belong to the <em>customers<\/em>, so the blank means 'their': <em>whose<\/em>.", "subscriptions expire this month 已是完整子句；訂閱屬於 customers，空格相當於「他們的」，所以用 whose。"]}}, {"id": "g-relative-02", "type": "grammar", "format": "gap", "unit": "relative", "level": 2, "source": "hand", "reviewed": true, "v": 1, "stem": "Mr. Varga reviewed the five bids for the office renovation, two of ______ came in under budget.", "options": ["which", "whom", "what", "whose"], "answer": 0, "explain": {"point": "介系詞 + 關係代名詞：事物用 which，人用 whom", "why": "逗號後補充說明前面的 bids，two of 的 of 是介系詞，後面指事物要用 which：two of which。", "wrong": [null, "whom 指人，bids 是事物", "what 前面不能有先行詞，這裡有 bids", "whose 後面要接名詞，這裡直接接動詞 came"], "zh": "Varga 先生審閱了五份辦公室整修工程的報價，其中兩份低於預算。", "vocab": [["bid", "投標、報價"], ["renovation", "整修"], ["under budget", "低於預算"]]}, "gloss": [{"w": "bids", "hw": "bid", "pos": "n.", "zh": "投標、報價", "ex": "We received three bids for the contract.", "ipa": "/bɪd/"}, {"w": "renovation", "hw": "renovation", "pos": "n.", "zh": "整修", "ex": "The renovation will take two months.", "ipa": "/ˌrenəˈveɪʃən/"}, {"w": "under budget", "hw": "under budget", "pos": "phr.", "zh": "低於預算", "ex": "The project finished under budget.", "ipa": "/ˈʌndər ˈbʌdʒɪt/"}], "en": {"point": ["Preposition + relative pronoun: things take <em>which<\/em>.", "介系詞 + 關係代名詞：事物用 which。"], "why": ["<em>Two of<\/em> points back to <em>the five bids<\/em>, which are things, not people. After the preposition <em>of<\/em>, things take <em>which<\/em>: <em>two of which<\/em>.", "two of 指回前面的 the five bids，是事物不是人；介系詞 of 後面指事物用 which：two of which。"]}}, {"id": "g-relative-03", "type": "grammar", "format": "gap", "unit": "relative", "level": 3, "source": "hand", "reviewed": true, "v": 1, "stem": "The Dunmore plant, ______ Brenvale Foods acquired in 2019, now produces all of the company's packaging.", "options": ["where", "when", "what", "which"], "answer": 3, "explain": {"point": "子句缺受詞用 which；where 後面接完整子句", "why": "acquired 是及物動詞，後面沒有受詞，缺的正是 plant；逗號後補充說明事物，用 which。", "wrong": ["where 後面要接完整子句，但 acquired 缺受詞", "when 指時間，先行詞 plant 不是時間", "what 前面不能有先行詞，這裡有 plant", null], "zh": "Brenvale 食品在 2019 年收購的 Dunmore 工廠，現在生產公司全部的包裝材料。", "vocab": [["plant", "工廠"], ["acquire", "收購"], ["packaging", "包裝材料"]]}, "gloss": [{"w": "plant", "hw": "plant", "pos": "n.", "zh": "工廠", "ex": "The plant employs about two hundred people.", "ipa": "/plænt/"}, {"w": "acquired", "hw": "acquire", "pos": "v.", "zh": "收購", "ex": "The firm acquired a smaller rival.", "ipa": "/əˈkwaɪər/"}, {"w": "packaging", "hw": "packaging", "pos": "n.", "zh": "包裝材料", "ex": "We changed our packaging to save money.", "ipa": "/ˈpækɪdʒɪŋ/"}], "en": {"point": ["The missing object is a thing: <em>which<\/em>.", "缺的受詞是事物：用 which。"], "why": ["<em>Brenvale Foods acquired<\/em> has no object. The missing object is <em>The Dunmore plant<\/em>, which is a thing. After the comma, the word is <em>which<\/em>.", "Brenvale Foods acquired 後面沒有受詞；缺的正是 The Dunmore plant，是事物。逗號後用 which。"]}}, {"id": "g-pronoun-01", "type": "grammar", "format": "gap", "unit": "pronoun", "level": 1, "source": "hand", "reviewed": true, "v": 1, "stem": "Venlow Logistics has updated ______ return policy to allow exchanges within 60 days of delivery.", "options": ["it", "its", "theirs", "itself"], "answer": 1, "explain": {"point": "所有格放在名詞前；單數的公司用 its（它的）", "why": "空格後面是名詞 return policy，要表示「它的」退貨政策，指的是單數的 Venlow Logistics，所以用所有格 its。", "wrong": ["it 是主格或受格，不能直接放在名詞前面", null, "theirs 是所有代名詞，要單獨使用，後面不能再接名詞", "反身代名詞不能放在名詞前面當所有格用"], "zh": "Venlow 物流更新了自家的退貨政策，允許在到貨後 60 天內換貨。", "vocab": [["return policy", "退貨政策"], ["exchange", "換貨"], ["delivery", "送達、到貨"]]}, "gloss": [{"w": "return policy", "hw": "return policy", "pos": "n.", "zh": "退貨政策", "ex": "Our return policy is posted on the website.", "ipa": "/rɪˈtɜrn ˈpɑːləsi/"}, {"w": "exchanges", "hw": "exchange", "pos": "n.", "zh": "換貨", "ex": "We accept exchanges within two weeks.", "ipa": "/ɪksˈtʃeɪndʒ/"}], "en": {"point": ["A possessive goes before a noun: <em>its<\/em>.", "所有格放在名詞前：its。"], "why": ["<em>Return policy<\/em> is a noun, so the blank needs a possessive. <em>Venlow Logistics<\/em> is one company, so the word is <em>its<\/em>.", "return policy 是名詞，空格要用所有格；Venlow Logistics 是單數的公司，所以用 its。"]}}, {"id": "g-pronoun-02", "type": "grammar", "format": "gap", "unit": "pronoun", "level": 2, "source": "hand", "reviewed": true, "v": 1, "stem": "The delivery times offered by Tarrow Freight are considerably shorter than ______ of its main competitors.", "options": ["that", "these", "those", "them"], "answer": 2, "explain": {"point": "代替前面的名詞：複數用 those of，單數用 that of", "why": "比的是運送時間和運送時間，代替複數的 delivery times 要用 those：those of its main competitors。", "wrong": ["that 代替單數名詞，delivery times 是複數", "these 不用來接 of 代替前面提過的名詞", null, "受格 them 不能接 of 來代替前面的名詞"], "zh": "Tarrow 貨運的運送時間比它主要競爭對手的短得多。", "vocab": [["delivery time", "運送時間、交期"], ["freight", "貨運"], ["competitor", "競爭對手"]]}, "gloss": [{"w": "delivery times", "hw": "delivery time", "pos": "n.", "zh": "運送時間、交期", "ex": "Our delivery times are now much shorter.", "ipa": "/dɪˈlɪvəri taɪm/"}, {"w": "considerably", "hw": "considerably", "pos": "adv.", "zh": "相當多地", "ex": "Prices rose considerably last year.", "ipa": "/kənˈsɪdərəbli/"}, {"w": "competitors", "hw": "competitor", "pos": "n.", "zh": "競爭對手", "ex": "Our main competitor lowered its prices.", "ipa": "/kəmˈpetətər/"}], "en": {"point": ["<em>those of<\/em> stands for a plural noun already named.", "those of 代替前面已出現的複數名詞。"], "why": ["The sentence compares <em>delivery times<\/em> with the delivery times of competitors. To avoid saying a plural noun twice, use <em>those<\/em>: <em>those of its main competitors<\/em>.", "句子比的是運送時間和競爭對手的運送時間。為了不重複複數名詞，用 those：those of its main competitors。"]}}, {"id": "g-pronoun-03", "type": "grammar", "format": "gap", "unit": "pronoun", "level": 2, "source": "hand", "reviewed": true, "v": 1, "stem": "Mr. Patel's reimbursement request was approved within a day, but ______ took almost two weeks because a receipt was missing.", "options": ["mine", "my", "me

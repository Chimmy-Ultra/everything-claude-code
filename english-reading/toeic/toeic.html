So the answer is <em>to postpone<\/em>.", "decided 後面接 to + 動詞，不接 -ing。所以答案是 to postpone。"]}}, {"id": "g-toing-02", "type": "grammar", "format": "gap", "unit": "toing", "level": 2, "source": "hand", "reviewed": true, "v": 1, "stem": "In addition to ______ the monthly newsletter, Ms. Hollis manages the company's social media accounts.", "options": ["edit", "editing", "edited", "have edited"], "answer": 1, "explain": {"point": "in addition to 的 to 是介系詞，後面接 Ving", "why": "in addition to 的 to 是介系詞（後面可以放名詞），動詞要改成 Ving：editing。", "wrong": ["把 to 當成不定詞；介系詞 to 後面不接原形", null, "過去分詞不能當介系詞的受詞", "介系詞後面不接 have + p.p."], "zh": "除了編輯每月的電子報之外，Hollis 女士也負責管理公司的社群媒體帳號。", "vocab": [["newsletter", "電子報"], ["in addition to", "除了……之外（還）"]]}, "gloss": [{"w": "In addition to", "hw": "in addition to", "pos": "phr.", "zh": "除了……之外（還）", "ex": "In addition to salary, we offer training.", "ipa": "/ɪn əˈdɪʃən tuː/"}, {"w": "newsletter", "hw": "newsletter", "pos": "n.", "zh": "電子報、通訊", "ex": "Our newsletter goes out every month.", "ipa": "/ˈnuːzˌletər/"}, {"w": "manages", "hw": "manage", "pos": "v.", "zh": "管理", "ex": "She manages a team of six people.", "ipa": "/ˈmænədʒ/"}], "en": {"point": ["<em>in addition to<\/em>: <em>to<\/em> is a preposition, so use -ing.", "in addition to 的 to 是介系詞，後面接 -ing。"], "why": ["In <em>in addition to<\/em>, the word <em>to<\/em> is a preposition. A verb after a preposition takes -ing: <em>editing the monthly newsletter<\/em>.", "in addition to 的 to 是介系詞，介系詞後面的動詞用 -ing：editing the monthly newsletter。"]}}, {"id": "g-toing-03", "type": "grammar", "format": "gap", "unit": "toing", "level": 1, "source": "hand", "reviewed": true, "v": 1, "stem": "Ms. Brandt let the two new technicians ______ the server upgrade on their own last weekend.", "options": ["carry out", "to carry out", "carrying out", "carried out"], "answer": 0, "explain": {"point": "使役動詞 let + 受詞 + 原形動詞", "why": "let 是使役動詞，受詞 the two new technicians 後面接原形：carry out。", "wrong": [null, "let 後面不接 to；allow 才接 to V", "let + 受詞後面不接 Ving", "技術人員是執行的人，不能用過去分詞"], "zh": "上週末 Brandt 女士讓兩位新來的技術人員自己完成伺服器升級。", "vocab": [["technician", "技術人員"], ["carry out", "執行、完成"], ["on one's own", "獨自、自己"]]}, "gloss": [{"w": "technicians", "hw": "technician", "pos": "n.", "zh": "技術人員", "ex": "A technician will visit the office today.", "ipa": "/tekˈnɪʃən/"}, {"w": "server upgrade", "hw": "server upgrade", "pos": "n.", "zh": "伺服器升級", "ex": "The server upgrade is planned for Sunday.", "ipa": "/ˈsɜrvər əpˈɡreɪd/"}, {"w": "on their own", "hw": "on their own", "pos": "phr.", "zh": "自己、獨自", "ex": "They solved it on their own.", "ipa": "/ɑːn ðer oʊn/"}], "en": {"point": ["<em>let<\/em> + object + base verb.", "let + 受詞 + 原形動詞。"], "why": ["<em>Let<\/em> is followed by an object and a base verb, without <em>to<\/em>. After <em>the two new technicians<\/em>, the verb is <em>carry out<\/em>.", "let 後面接受詞加原形動詞，不加 to。在 the two new technicians 後面，動詞用 carry out。"]}}, {"id": "g-compare-01", "type": "grammar", "format": "gap", "unit": "compare", "level": 1, "source": "hand", "reviewed": true, "v": 1, "stem": "For large orders, shipping by rail is much ______ than shipping by air.", "options": ["cheap", "cheapest", "cheaper", "more cheaply"], "answer": 2, "explain": {"point": "看到 than → 比較級；much 可以加強比較級", "why": "空格後面有 than，要用比較級；前面的 much 用來加強比較級：much cheaper。", "wrong": ["原級不能接 than", "最高級不和 than 連用", null, "這裡 is 後面要用形容詞描述 shipping，more cheaply 是副詞"], "zh": "大量訂單用鐵路運送，比空運便宜得多。", "vocab": [["shipping", "運送、出貨"], ["by rail", "以鐵路運輸"]]}, "gloss": [{"w": "shipping", "hw": "shipping", "pos": "n.", "zh": "運送、出貨", "ex": "Shipping takes three days.", "ipa": "/ˈʃɪpɪŋ/"}, {"w": "by rail", "hw": "by rail", "pos": "phr.", "zh": "以鐵路運輸", "ex": "The goods travel by rail to the port.", "ipa": "/baɪ reɪl/"}], "en": {"point": ["<em>than<\/em> needs a comparative.", "than 前面要用比較級。"], "why": ["<em>Than<\/em> follows the blank, so use a comparative adjective. <em>Much<\/em> only makes it stronger: <em>much cheaper<\/em>.", "空格後面有 than，要用比較級形容詞；much 只是加強語氣：much cheaper。"]}}, {"id": "g-compare-02", "type": "grammar", "format": "gap", "unit": "compare", "level": 2, "source": "hand", "reviewed": true, "v": 1, "stem": "The earlier the invitations are sent out, ______ guests are likely to attend the product launch.", "options": ["more", "the most", "most", "the more"], "answer": 3, "explain": {"point": "the + 比較級, the + 比較級：越……越……", "why": "前半句是 The earlier ...，後半句要對應 the + 比較級：the more guests，意思是「寄得越早，來的人越多」。", "wrong": ["少了 the，接不上前半句的 The earlier", "最高級不能用在「越……越……」句型", "most 是「大部分」，接不上 The earlier 的句型", null], "zh": "邀請函寄得越早，可能出席產品發表會的來賓就越多。", "vocab": [["invitation", "邀請函"], ["product launch", "產品發表會"]]}, "gloss": [{"w": "invitations", "hw": "invitation", "pos": "n.", "zh": "邀請函", "ex": "We mailed the invitations on Monday.", "ipa": "/ˌɪnvɪˈteɪʃən/"}, {"w": "sent out", "hw": "send out", "pos": "phr.", "zh": "寄出、發出", "ex": "We will send out the notices today.", "ipa": "/send aʊt/"}, {"w": "product launch", "hw": "product launch", "pos": "n.", "zh": "產品發表會", "ex": "The product launch is in May.", "ipa": "/ˈprɑːdəkt lɔːntʃ/"}], "en": {"point": ["<em>the<\/em> + comparative, <em>the<\/em> + comparative.", "the + 比較級, the + 比較級。"], "why": ["<em>The earlier<\/em> starts a pair, so the second half needs <em>the<\/em> + comparative: <em>the more<\/em> guests. The earlier the invitations are sent, the more guests are likely to come.", "The earlier 開啟對應句型，後半句要用 the + 比較級：the more guests。意思是邀請函寄得越早，可能來的人越多。"]}}, {"id": "g-compare-03", "type": "grammar", "format": "gap", "unit": "compare", "level": 2, "source": "hand", "reviewed": true, "v": 1, "stem": "In the customer survey, the battery life of the Dorvan X5 tablet was rated superior ______ that of every competing model.", "options": ["than", "to", "from", "as"], "answer": 1, "explain": {"point": "superior 後面接 to，不接 than", "why": "superior 本身就是「比……好」，後面固定接 to：superior to that of every competing model。", "wrong": ["superior 雖然有比較的意思，但不接 than", null, "superior 不和 from 搭配", "as 用在 as ... as 原級比較，不接 superior"], "zh": "在顧客調查中，Dorvan X5 平板的電池續航力被評為優於所有競爭機型。", "vocab": [["superior to", "優於"], ["battery life", "電池續航力"], ["competing", "競爭的"]]}, "gloss": [{"w": "battery life", "hw": "battery life", "pos": "n.", "zh": "電池續航力", "ex": "This phone has a long battery life.", "ipa": "/ˈbætəri laɪf/"}, {"w": "rated", "hw": "rate", "pos": "v.", "zh": "評為、評價", "ex": "Customers rated the service as excellent.", "ipa": "/reɪt/"}, {"w": "competing", "hw": "competing", "pos": "adj.", "zh": "競爭的", "ex": "We compared three competing products.", "ipa": "/kəmˈpiːtɪŋ/"}], "en": {"point": ["<em>superior<\/em> is followed by <em>to<\/em>.", "superior 後面接 to。"], "why": ["<em>Superior<\/em> already means 'better', so it takes <em>to<\/em>, not <em>than<\/em>: <em>superior to that of every competing model<\/em>.", "superior 本身就有「比較好」的意思，後面接 to，不接 than：superior to that of every competing model。"]}}, {"id": "g-quantity-01", "type": "grammar", "format": "gap", "unit": "quantity", "level": 1, "source": "hand", "reviewed": true, "v": 1, "stem": "We have not received ______ information about the new parking rules from the building management office.", "options": ["much", "many", "several", "a few"], "answer": 0, "explain": {"point": "不可數名詞前用 much；many、several、a few 接複數", "why": "information 是不可數名詞，選項中只有 much 能接；not ... much 表示「沒收到多少」。", "wrong": [null, "many 接複數可數名詞，information 不可數", "several 是「好幾個」，只接複數名詞", "a few 接複數名詞；不可數要用 a little"], "zh": "關於新的停車規定，我們還沒從大樓管理處收到多少資訊。", "vocab": [["building management office", "大樓管理處"], ["parking rules", "停車規定"]]}, "gloss": [{"w": "parking rules", "hw": "parking rule", "pos": "n.", "zh": "停車規定", "ex": "The parking rules changed last month.", "ipa": "/ˈpɑːrkɪŋ ruːl/"}, {"w": "building management office", "hw": "building management office", "pos": "n.", "zh": "大樓管理處", "ex": "Ask the building management office about keys.", "ipa": "/ˈbɪldɪŋ ˈmænədʒmənt ˈɔːfɪs/"}], "en": {"point": ["Uncountable noun: use <em>much<\/em>.", "不可數名詞：用 much。"], "why": ["<em>Information<\/em> is uncountable. It has no plural form, so it takes <em>much<\/em>: <em>not … much information<\/em>.", "information 是不可數名詞，沒有複數形，所以用 much：not … much information。"]}}, {"id": "g-quantity-02", "type": "grammar", "format": "gap", "unit": "quantity", "level": 1, "source": "hand", "reviewed": true, "v": 1, "stem": "______ of the applicants for the graphic designer position currently live outside Linden Falls.", "options": ["Almost", "Every", "Most", "Much"], "answer": 2, "explain": {"point": "most of the + 複數名詞；almost 是副詞，不能直接接 of", "why": "空格後面是 of the applicants，選項中能接 of the 加複數名詞的只有 Most：大部分應徵者。", "wrong": ["almost 是副詞，要說 almost all of", "every 後面直接接單數名詞，不能接 of", null, "much 接不可數名詞，applicants 可數"], "zh": "應徵平面設計師職缺的人，大部分目前住在 Linden Falls 以外的地方。", "vocab": [["applicant", "應徵者"], ["position", "職位、職缺"]]}, "gloss": [{"w": "applicants", "hw": "applicant", "pos": "n.", "zh": "應徵者", "ex": "Each applicant sent a short resume.", "ipa": "/ˈæplɪkənt/"}, {"w": "position", "hw": "position", "pos": "n.", "zh": "職位、職缺", "ex": "She applied for a sales position.", "ipa": "/pəˈzɪʃən/"}], "en": {"point": ["<em>most of the<\/em> + plural noun.", "most of the + 複數名詞。"], "why": ["<em>Of the applicants<\/em> follows the blank, so the word must go before <em>of the<\/em> + a plural noun. <em>Most<\/em> does: <em>most of the applicants<\/em> means the larger part of them.", "空格後面是 of the applicants，空格的字要能接 of the + 複數名詞。Most 可以：most of the applicants 是「大部分應徵者」。"]}}, {"id": "g-quantity-03", "type": "grammar", "format": "gap", "unit": "quantity", "level": 2, "source": "hand", "reviewed": true, "v": 1, "stem": "Halvern Medical ordered ______ new laboratory equipment last month, and most of it has already been installed.", "options": ["several", "many", "a number of", "a great deal of"], "answer": 3, "explain": {"point": "equipment 不可數：a great deal of + 不可數名詞", "why": "equipment 是不可數名詞（後面 most of it 也用單數 it），選項中只有 a great deal of 接不可數名詞。", "wrong": ["several 要接複數名詞，equipment 沒有複數形", "many 只接可數複數名詞，equipment 不可數", "a number of 接可數複數；不可數用 an amount of", null], "zh": "Halvern 醫療上個月訂購了大量新的實驗室設備，其中大部分已經安裝好了。", "vocab": [["laboratory", "實驗室"], ["equipment", "設備（不可數）"], ["install", "安裝"]]}, "gloss": [{"w": "laboratory equipment", "hw": "laboratory equipment", "pos": "n.", "zh": "實驗室設備", "ex": "The laboratory equipment arrived on Tuesday.", "ipa": "/ˈlæbrəˌtɔːri ɪˈkwɪpmənt/"}, {"w": "installed", "hw": "install", "pos": "v.", "zh": "安裝", "ex": "A technician installed the new printer.", "ipa": "/ˌɪnˈstɔːl/"}], "en": {"point": ["Uncountable noun: <em>a great deal of<\/em>.", "不可數名詞：a great deal of。"], "why": ["<em>Equipment<\/em> is uncountable, and the later words <em>most of it<\/em> treat it as one mass. So the quantity phrase must fit an uncountable noun: <em>a great deal of<\/em>.", "equipment 是不可數名詞，後面的 most of it 也把它當成單數。所以數量詞要能接不可數名詞：a great deal of。"]}}, {"id": "g-parallel-01", "type": "grammar", "format": "gap", "unit": "parallel", "level": 1, "source": "hand", "reviewed": true, "v": 1, "stem": "According to staff feedback, the new office chairs are both comfortable ______ easy to adjust.", "options": ["or", "and", "nor", "but"], "answer": 1, "explain": {"point": "both A and B：both 固定搭配 and", "why": "前面有 both，後面固定用 and 連接兩個形容詞：both comfortable and easy to adjust。", "wrong": ["or 搭配 either，不搭配 both", null, "nor 搭配 neither，不搭配 both", "but (also) 搭配 not only，不搭配 both"], "zh": "根據員工的意見，新的辦公椅既舒適又容易調整。", "vocab": [["feedback", "意見、回饋"], ["adjust", "調整"]]}, "gloss": [{"w": "feedback", "hw": "feedback", "pos": "n.", "zh": "意見、回饋", "ex": "We asked customers for feedback.", "ipa": "/ˈfiːdˌbæk/"}, {"w": "adjust", "hw": "adjust", "pos": "v.", "zh": "調整", "ex": "You can adjust the height of the desk.", "ipa": "/əˈdʒʌst/"}], "en": {"point": ["<em>both<\/em> + A + <em>and<\/em> + B.", "both A and B：both 搭配 and。"], "why": ["<em>Both<\/em> always pairs with <em>and<\/em>. Here it joins two descriptions of the chairs: <em>both comfortable and easy to adjust<\/em>.", "both 一定搭配 and。這裡 and 連接兩個描述椅子的形容詞：both comfortable and easy to adjust。"]}}, {"id": "g-parallel-02", "type": "grammar", "format": "gap", "unit": "parallel", "level": 2, "source": "hand", "reviewed": true, "v": 1, "stem": "The regional director has ______ approved the budget requests from the sales and marketing departments nor explained why they are on hold.", "options": ["neither", "either", "both", "not only"], "answer": 0, "explain": {"point": "看到 nor，前面跟它成對的是 neither", "why": "句子後段的 nor explained 要跟 neither 成對；中間 sales and marketing 的 and 只連接兩個部門，不是 both 的另一半。", "wrong": [null, "either 要配 or，這句後面是 nor", "both 要配 and；這裡的 and 只連接兩個部門，後面還有 nor", "not only 要配 but also，不配 nor"], "zh": "地區總監既沒有核准業務部和行銷部的預算申請，也沒有說明這些申請為什麼被擱置。", "vocab": [["regional director", "地區總監"], ["budget request", "預算申請"], ["on hold", "暫緩、擱置"]]}, "gloss": [{"w": "regional director", "hw": "regional director", "pos": "n.", "zh": "地區總監", "ex": "The regional director visits each office yearly.", "ipa": "/ˈriːdʒənəl dərˈektər/"}, {"w": "budget requests", "hw": "budget request", "pos": "n.", "zh": "預算申請", "ex": "Send your budget request to finance.", "ipa": "/ˈbʌdʒɪt rɪˈkwest/"}, {"w": "on hold", "hw": "on hold", "pos": "phr.", "zh": "暫緩、擱置", "ex": "The hiring plan is on hold.", "ipa": "/ɑːn hoʊld/"}], "en": {"point": ["<em>neither<\/em> pairs with <em>nor<\/em>.", "neither 搭配 nor。"], "why": ["<em>Nor explained<\/em> is the second half of a pair. The first half is <em>neither approved<\/em>. The <em>and<\/em> in <em>sales and marketing<\/em> only joins two departments.", "nor explained 是成對句型的後半；前半就是 neither approved。sales and marketing 的 and 只是連接兩個部門。"]}}, {"id": "g-parallel-03", "type": "grammar", "format": "gap", "unit": "parallel", "level": 2, "source": "hand", "reviewed": true, "v": 1, "stem": "Customers who want the extended warranty must register the product online within 30 days of purchase and ______ the original receipt.", "options": ["to keep", "keeping", "keep", "kept"], "answer": 2, "explain": {"point": "and 連接的兩個動詞共用 must，都要用原形", "why": "and 連接的是 register 和空格，兩個動詞都接在 must 後面，所以用原形 keep；within 30 days of purchase 只是插在中間的修飾語。", "wrong": ["must 後面接原形，不接 to V；也跟 register 不平行", "跟 register 不平行；and 連接的不是前面的 purchase", null, "過去式不能接在 must 後面，也跟 register 不平行"], "zh": "想享有延長保固的顧客，必須在購買後 30 天內上網登錄產品，並保留原始收據。", "vocab": [["extended warranty", "延長保固"], ["register", "登錄、註冊"], ["receipt", "收據"]]}, "gloss": [{"w": "extended warranty", "hw": "extended warranty", "pos": "n.", "zh": "延長保固", "ex": "An extended warranty covers repairs for five years.", "ipa": "/ɪkˈstendəd ˈwɔːrənti/"}, {"w": "register", "hw": "register", "pos": "v.", "zh": "登錄、註冊", "ex": "Please register your product online.", "ipa": "/ˈredʒɪstər/"}, {"w": "purchase", "hw": "purchase", "pos": "n.", "zh": "購買", "ex": "Keep the receipt as proof of purchase.", "ipa": "/ˈpɜrtʃəs/"}], "en": {"point": ["Joined by <em>and<\/em>, both verbs take the same form.", "and 連接的兩個動詞，形式要相同。"], "why": ["<em>And<\/em> joins <em>register<\/em> and the blank. Both verbs follow <em>must<\/em>, so both are base forms: <em>register … and keep<\/em>. The phrase <em>within 30 days of purchase<\/em> just sits between them.", "and 連接 register 和空格，兩個動詞都接在 must 後面，所以都用原形：register … and keep。within 30 days of purchase 只是插在中間。"]}}, {"id": "g-mandative-01", "type": "grammar", "format": "gap", "unit": "mandative", "level": 1, "source": "hand", "reviewed": true, "v": 1, "stem": "The finance director has requested that each department head ______ a revised budget by March 15.", "options": ["submitting", "will submit", "to submit", "submit"], "answer": 3, "explain": {"point": "request that + 主詞 + 原形動詞", "why": "requested that 表示要求，that 子句的動詞用原形；主詞 each department head 雖是單數，仍用 submit。", "wrong": ["Ving 不能當 that 子句的動詞", "要求的內容用原形，不加 will", "that 子句不用 to V；拿掉 that 才能接人 + to V", null], "zh": "財務總監要求每位部門主管在 3 月 15 日前提交修訂後的預算。", "vocab": [["finance director", "財務總監"], ["department head", "部門主管"], ["submit", "提交"]]}, "gloss": [{"w": "finance director", "hw": "finance director", "pos": "n.", "zh": "財務總監", "ex": "The finance director approved the plan.", "ipa": "/fəˈnæns dərˈektər/"}, {"w": "department head", "hw": "department head", "pos": "n.", "zh": "部門主管", "ex": "Each department head attends the weekly meeting.", "ipa": "/dɪˈpɑːrtmənt hed/"}, {"w": "revised", "hw": "revised", "pos": "adj.", "zh": "修訂過的", "ex": "Please read the revised schedule.", "ipa": "/rɪˈvaɪzd/"}], "en": {"point": ["<em>request that<\/em> + subject + base verb.", "request that + 主詞 + 原形動詞。"], "why": ["<em>Requested that<\/em> asks for an action, so the verb in the <em>that<\/em> clause is the base form. <em>Each department head<\/em> is singular, but the verb stays <em>submit<\/em>.", "requested that 表示要求，that 子句的動詞用原形。each department head 雖是單數，動詞仍是 submit。"]}}, {"id": "g-mandative-02", "type": "grammar", "format": "gap", "unit": "mandative", "level": 3, "source": "hand", "reviewed": true, "v": 1, "stem": "It is essential that the draft agreement ______ shared with anyone outside the company before it is signed.", "options": ["not be", "not being", "will not be", "not to be"], "answer": 0, "explain": {"point": "essential that + 原形；否定加 not：not be p.p.", "why": "It is essential that 表示必要，that 子句用原形；否定直接在前面加 not，被動就是 not be shared。", "wrong": [null, "Ving 不能當 that 子句的動詞", "表示必要的 that 子句用原形，不加 will", "that 子句不用 to V；要說 for ... not to be"], "zh": "合約草案在簽署之前，務必不能和公司以外的任何人分享。", "vocab": [["draft agreement", "合約草案"], ["essential", "必要的、非常重要的"]]}, "gloss": [{"w": "draft agreement", "hw": "draft agreement", "pos": "n.", "zh": "合約草案", "ex": "Please review the draft agreement today.", "ipa": "/dræft əˈɡriːmənt/"}, {"w": "essential", "hw": "essential", "pos": "adj.", "zh": "必要的", "ex": "Clear signs are essential in a large building.", "ipa": "/eˈsenʃəl/"}], "en": {"point": ["<em>essential that<\/em> + base verb; put <em>not<\/em> before it.", "essential that + 原形動詞；否定把 not 放前面。"], "why": ["<em>It is essential that<\/em> asks for something, so the verb is a base form. To make it negative, put <em>not<\/em> before it. The draft agreement is the thing shared, so the verb is passive: <em>not be shared<\/em>.", "It is essential that 表示必要，動詞用原形；否定就在前面加 not。草案是被分享的，所以用被動：not be shared。"]}}, {"id": "g-conditional-01", "type": "grammar", "format": "gap", "unit": "conditional", "level": 2, "source": "hand", "reviewed": true, "v": 1, "stem": "______ the supplier notified us of the delay earlier, we would have found another vendor in time.", "options": ["Should", "Had", "Were", "Unless"], "answer": 1, "explain": {"point": "與過去事實相反的倒裝：Had + 主詞 + p.p.", "why": "主句是 would have found，與過去事實相反；if 子句是 had notified，省略 if 就倒裝成 Had the supplier notified。", "wrong": ["Should 後面接原形，也不配 would have", null, "Were 後面不能接帶受詞的過去式 notified us", "unless 是「除非」，語意不通，也不配 would have"], "zh": "要是供應商早點通知我們會延誤，我們就能及時找到另一家廠商了。", "vocab": [["supplier", "供應商"], ["vendor", "廠商"], ["in time", "及時"]]}, "gloss": [{"w": "supplier", "hw": "supplier", "pos": "n.", "zh": "供應商", "ex": "Our supplier ships every Monday.", "ipa": "/səˈplaɪər/"}, {"w": "notified us of", "hw": "notify of", "pos": "phr.", "zh": "通知我們……", "ex": "Please notify us of any changes.", "ipa": "/ˈnoʊtəˌfaɪ ʌv/"}, {"w": "vendor", "hw": "vendor", "pos": "n.", "zh": "廠商", "ex": "We chose a new vendor for office supplies.", "ipa": "/ˈvendər/"}, {"w": "in time", "hw": "in time", "pos": "phr.", "zh": "及時", "ex": "The parts arrived in time for the launch.", "ipa": "/ɪn taɪm/"}], "en": {"point": ["<em>Had<\/em> + subject + past participle = <em>if … had<\/em>.", "Had + 主詞 + p.p. = if … had。"], "why": ["<em>We would have found<\/em> shows an imagined past. The matching <em>if<\/em> clause is <em>if the supplier had notified us<\/em>. Drop <em>if<\/em> and put <em>had<\/em> first: <em>Had the supplier notified us<\/em>.", "we would have found 表示與過去事實相反。對應的 if 子句是 if the supplier had notified us；省略 if、把 had 放前面：Had the supplier notified us。"]}}, {"id": "g-conditional-02", "type": "grammar", "format": "gap", "unit": "conditional", "level": 3, "source": "hand", "reviewed": true, "v": 1, "stem": "Not until the new inventory software was installed ______ the error rate in our warehouse begin to fall.", "options": ["was", "has", "did", "had"], "answer": 2, "explain": {"point": "Not until 放句首，主句倒裝：did + 主詞 + 原形", "why": "Not until ... 放在句首，後面的主句要倒裝；說的是過去的事，動詞又是原形 begin，所以用 did。", "wrong": ["was 後面不能接原形 begin", "has 要接 p.p.（begun），而且這是過去的事", null, "had 要接 p.p.（begun），不接原形 begin"], "zh": "直到新的庫存軟體安裝好之後，我們倉庫的出錯率才開始下降。", "vocab": [["inventory", "庫存"], ["error rate", "錯誤率"], ["warehouse", "倉庫"]]}, "gloss": [{"w": "inventory", "hw": "inventory", "pos": "n.", "zh": "庫存", "ex": "We count our inventory every month.", "ipa": "/ˌɪnvənˈtɔːri/"}, {"w": "error rate", "hw": "error rate", "pos": "n.", "zh": "錯誤率", "ex": "The error rate dropped last quarter.", "ipa": "/ˈerər reɪt/"}, {"w": "warehouse", "hw": "warehouse", "pos": "n.", "zh": "倉庫", "ex": "The warehouse is near the airport.", "ipa": "/ˈwerˌhaʊs/"}], "en": {"point": ["<em>Not until<\/em> + clause, then <em>did<\/em> + subject + base verb.", "Not until + 子句，後面接 did + 主詞 + 原形動詞。"], "why": ["The sentence starts with <em>Not until<\/em>, so the main clause flips its order. The event is in the past and the verb is <em>begin<\/em>, a base form: <em>did the error rate … begin<\/em>.", "句子以 Not until 開頭，主句要倒裝。事情發生在過去，動詞又是原形 begin：did the error rate … begin。"]}}, {"id": "g-relative-04", "type": "grammar", "format": "gap", "unit": "relative", "level": 3, "source": "hand", "reviewed": true, "v": 1, "stem": "Out of more than forty applications, the hiring committee has invited back only the three candidates ______ it believes are best qualified to run the new Dunhallow distribution center.", "options": ["whom", "who", "whose", "which"], "answer": 1, "explain": {"point": "中間插入 it believes 時，先拿掉再看缺什麼", "why": "拿掉插入的 it believes，就是 candidates ___ are best qualified；關係代名詞當 are 的主詞，要用主格 who。", "wrong": ["受格，但它是後面 are 的主詞，不是 believes 的受詞", null, "whose 後面要接名詞，這裡接的是 it believes", "先行詞 candidates 是人，不能用 which"], "wrongMore": ["candidates whom it believes 讀起來像「委員會相信的人」，但 believes 後面接的是子句 (that) they are best qualified；子句缺的是 are 的主詞，所以用 who。", null, null, null], "zh": "在四十多份申請中，招聘委員會只請三位人選回來參加下一輪；委員會認為他們最有資格經營 Dunhallow 新的物流中心。", "vocab": [["hiring committee", "招聘委員會"], ["candidate", "人選、候選人"], ["qualified", "有資格的、能勝任的"]]}, "gloss": [{"w": "hiring committee", "hw": "hiring committee", "pos": "n.", "zh": "招聘委員會", "ex": "The hiring committee meets on Thursday.", "ipa": "/ˈhaɪrɪŋ kəˈmɪti/"}, {"w": "candidates", "hw": "candidate", "pos": "n.", "zh": "人選、候選人", "ex": "We interviewed five candidates this week.", "ipa": "/ˈkændədeɪt/"}, {"w": "qualified", "hw": "qualified", "pos": "adj.", "zh": "有資格的、能勝任的", "ex": "She is qualified for the manager role.", "ipa": "/ˈkwɑːləˌfaɪd/"}, {"w": "distribution center", "hw": "distribution center", "pos": "n.", "zh": "物流中心", "ex": "The distribution center ships orders daily.", "ipa": "/ˌdɪstrəˈbjuːʃən ˈsentər/"}], "en": {"point": ["Remove <em>it believes<\/em>, then see what is missing.", "先拿掉 it believes，再看缺什麼。"], "why": ["Take out <em>it believes<\/em>: <em>the three candidates … are best qualified<\/em>. The blank is the subject of <em>are<\/em>, and the candidates are people, so it is <em>who<\/em>.", "拿掉 it believes 後是 the three candidates … are best qualified。空格是 are 的主詞，先行詞是人，所以用 who。"]}}, {"id": "g-agree-04", "type": "grammar", "format": "gap", "unit": "agree", "level": 2, "source": "hand", "reviewed": true, "v": 1, "stem": "Each of the regional sales offices, including the three that opened in Asia last year, ______ required to submit a quarterly budget report to head office.", "options": ["are", "have", "is", "being"], "answer": 2, "explain": {"point": "each of the + 複數名詞：主詞是 each，動詞用單數", "why": "主詞是句首的 Each，不是 offices 或 the three；each 是單數，被動 be required 要用 is。", "wrong": ["被 offices 和 the three 帶偏；主詞 Each 是單數", "have required 缺 been；主詞 Each 也要配單數", null, "分詞不能當主要動詞，句子會缺動詞"], "wrongMore": ["空格前的 the three 和 offices 都讓人想用複數；但真正的主詞是句首的 Each，of the regional sales offices 和逗號之間的 including ... 都只是修飾和插入語。", null, null, null], "zh": "每一個區域業務辦事處，包括去年在亞洲新開的三個，都必須向總公司提交季度預算報告。", "vocab": [["regional sales office", "區域業務辦事處"], ["quarterly", "每季的"], ["head office", "總公司"]]}, "gloss": [{"w": "including", "hw": "including", "pos": "prep.", "zh": "包括", "ex": "Everyone, including interns, must attend.", "ipa": "/ˌɪnˈkluːdɪŋ/"}, {"w": "quarterly", "hw": "quarterly", "pos": "adj.", "zh": "每季的", "ex": "We publish a quarterly report.", "ipa": "/ˈkwɔːrtərli/"}, {"w": "head office", "hw": "head office", "pos": "n.", "zh": "總公司", "ex": "Send the forms to the head office.", "ipa": "/hed ˈɔːfɪs/"}], "en": {"point": ["<em>each of<\/em> + plural noun: the verb is singular.", "each of + 複數名詞：動詞用單數。"], "why": ["The subject is <em>Each<\/em>, not <em>offices<\/em> or <em>the three<\/em>. <em>Including … last year<\/em> is extra information. <em>Each<\/em> is singular, so the passive uses <em>is required<\/em>.", "主詞是 Each，不是 offices 或 the three；including … last year 只是補充。each 是單數，被動用 is required。"]}}, {"id": "g-quantity-04", "type": "grammar", "format": "gap", "unit": "quantity", "level": 1, "source": "hand", "reviewed": true, "v": 1, "stem": "Since the warehouse switched to barcode scanning in March, customers have reported ______ shipping and billing errors than they did in all of last year.", "options": ["less", "fewer", "fewest", "little"], "answer": 1, "explain": {"point": "可數複數的「較少」用 fewer，不可數用 less", "why": "有 than 要用比較級；被修飾的中心名詞是可數複數的 errors（shipping and billing 只是修飾），所以用 fewer。", "wrong": ["less 接不可數；正式書面語的可數複數用 fewer", null, "最高級不和 than 連用", "原級不能接 than，而且只接不可數名詞"], "wrongMore": ["空格後先看到 shipping，像不可數名詞，容易選 less；但被修飾的中心名詞是 errors（可數複數）。口語常聽到 less errors，正式書面英文要用 fewer。", null, null, null], "zh": "自從倉庫三月改用條碼掃描以來，顧客回報的出貨和帳單錯誤，已經比去年一整年還少。", "vocab": [["barcode scanning", "條碼掃描"], ["billing error", "帳單錯誤"], ["report", "回報、通報"]]}, "gloss": [{"w": "barcode scanning", "hw": "barcode scanning", "pos": "n.", "zh": "條碼掃描", "ex": "Barcode scanning speeds up our checkout.", "ipa": ""}, {"w": "billing errors", "hw": "billing error", "pos": "n.", "zh": "帳單錯誤", "ex": "A billing error delayed the payment.", "ipa": "/ˈbɪlɪŋ ˈerər/"}, {"w": "reported", "hw": "report", "pos": "v.", "zh": "回報、通報", "ex": "Staff report any problems to the manager.", "ipa": "/riˈpɔːrt/"}], "en": {"point": ["<em>fewer<\/em> + plural countable noun.", "fewer + 可數複數名詞。"], "why": ["<em>Than<\/em> needs a comparative. The main noun is <em>errors<\/em>, which you can count, and <em>shipping and billing<\/em> only describe it. So the word is <em>fewer<\/em>.", "有 than 要用比較級。中心名詞是可數的 errors，shipping and billing 只是修飾它，所以用 fewer。"]}}, {"id": "g-mandative-03", "type": "grammar", "format": "gap", "unit": "mandative", "level": 2, "source": "hand", "reviewed": true, "v": 1, "stem": "In light of several duplicate payments last year, the external auditors have strongly recommended in their final report that the accounts payable team ______ every invoice over $5,000 against the original purchase order.", "options": ["checking", "checked", "is checking", "check"], "answer": 3, "explain": {"point": "recommend that + 主詞 + 原形動詞", "why": "recommended 後面接的是 that 子句，子句要有自己的動詞；建議的內容用原形，主詞 the accounts payable team 是單數也用 check。", "wrong": ["recommend 可直接接 Ving，但接了 that + 主詞就要用原形", "過去式，建議的內容要用原形", "進行式講正在做，不是建議的做法", null], "wrongMore": ["recommend checking every invoice（直接接 Ving）是對的說法，所以 checking 看起來很眼熟；但這句是 recommended that + 主詞，that 子句要有動詞，the team checking 不成句，建議的內容要用原形 check。", null, null, null], "zh": "鑑於去年發生了幾筆重複付款，外部稽核人員在最終報告中強烈建議，應付帳款小組要把每張超過五千美元的發票和原始採購單逐一核對。", "vocab": [["external auditor", "外部稽核人員"], ["accounts payable", "應付帳款"], ["purchase order", "採購單"]]}, "gloss": [{"w": "In light of", "hw": "in light of", "pos": "phr.", "zh": "鑑於", "ex": "In light of the delay, we changed plans.", "ipa": "/ɪn laɪt ʌv/"}, {"w": "external auditors", "hw": "external auditor", "pos": "n.", "zh": "外部稽核人員", "ex": "The external auditors visit every spring.", "ipa": "/ɪkˈstɜrnəl ˈɔːdɪtər/"}, {"w": "accounts payable", "hw": "accounts payable", "pos": "n.", "zh": "應付帳款", "ex": "The accounts payable team pays all bills.", "ipa": "/əˈkaʊnts ˈpeɪəbəl/"}, {"w": "invoice", "hw": "invoice", "pos": "n.", "zh": "發票、請款單", "ex": "Please send the invoice by email.", "ipa": "/ˈɪnvɔɪs/"}], "en": {"point": ["<em>recommend that<\/em> + subject + base verb.", "recommend that + 主詞 + 原形動詞。"], "why": ["<em>Recommended … that<\/em> opens a clause with its own subject, <em>the accounts payable team<\/em>. A recommended action takes the base form, even with a singular subject: <em>check<\/em>.", "recommended … that 後面是有自己主詞的子句，主詞是 the accounts payable team。建議的內容用原形，即使主詞是單數：check。"]}}, {"id": "g-compare-04", "type": "grammar", "format": "gap", "unit": "compare", "level": 2, "source": "hand", "reviewed": true, "v": 1, "stem": "Although it weighs about the same, the new Quelsa X2 vacuum cleaner is nearly twice ______ powerful as the model it replaces.", "options": ["more", "so", "as", "much"], "answer": 2, "explain": {"point": "倍數 + as + 原級 + as：twice as powerful as", "why": "空格後面是 powerful as the model，要湊成 as ... as；倍數 twice 放在第一個 as 前面：twice as powerful as。", "wrong": ["more 要配 than；後面是 as，不是 than", "so ... as 只用在否定句 not so ... as", null, "much 修飾比較級，不能夾在 twice 和原級之間"], "wrongMore": ["twice more powerful 單看很順，但要讀到後面的 as the model 才知道句型是 as ... as；more 要配 than，不配 as。", null, null, null], "zh": "雖然重量差不多，新的 Quelsa X2 吸塵器吸力卻幾乎是舊機型的兩倍。", "vocab": [["vacuum cleaner", "吸塵器"], ["powerful", "（機器）強力的"], ["replace", "取代"]]}, "gloss": [{"w": "vacuum cleaner", "hw": "vacuum cleaner", "pos": "n.", "zh": "吸塵器", "ex": "The vacuum cleaner is in the closet.", "ipa": "/ˈvækjum ˈkliːnər/"}, {"w": "weighs", "hw": "weigh", "pos": "v.", "zh": "重量為", "ex": "The box weighs five kilograms.", "ipa": "/weɪ/"}, {"w": "replaces", "hw": "replace", "pos": "v.", "zh": "取代", "ex": "The new model replaces the old one.", "ipa": "/ˌriːˈpleɪs/"}], "en": {"point": ["multiple + <em>as<\/em> + adjective + <em>as<\/em>.", "倍數 + as + 形容詞 + as。"], "why": ["<em>Powerful as the model<\/em> follows the blank, so the pattern is <em>as … as<\/em>. A multiple like <em>twice<\/em> goes before the first <em>as<\/em>: <em>twice as powerful as<\/em>.", "空格後面是 powerful as the model，句型是 as … as。twice 這類倍數放在第一個 as 前面：twice as powerful as。"]}}, {"id": "g-toing-04", "type": "grammar", "format": "gap", "unit": "toing", "level": 3, "source": "hand", "reviewed": true, "v": 1, "stem": "The automated sorting machines installed at the Tamberly warehouse last spring have contributed significantly ______ the time it takes to process customer returns.", "options": ["to reduce", "reducing", "for reducing", "to reducing"], "answer": 3, "explain": {"point": "contribute to 的 to 是介系詞，後面接 Ving", "why": "contribute to 的 to 是介系詞（可說 contribute to the drop），後面的動詞要用 Ving：to reducing。", "wrong": ["把 to 當成不定詞；contribute to 的 to 是介系詞", "少了 to；contribute 要說 contribute to", "contribute 不接 for", null], "wrongMore": ["中間隔了 significantly，to reduce the time 單看像「為了縮短時間」；但這個 to 是前面 contributed 帶的介系詞，機器是「有助於縮短」，要用 to reducing。", null, null, null], "zh": "去年春天在 Tamberly 倉庫裝設的自動分揀機，大幅縮短了處理顧客退貨所需的時間。", "vocab": [["sorting machine", "分揀機"], ["contribute to", "有助於、促成"], ["customer return", "顧客退貨"]]}, "gloss": [{"w": "sorting machines", "hw": "sorting machine", "pos": "n.", "zh": "分揀機", "ex": "Two sorting machines handle all the parcels.", "ipa": "/ˈsɔːrtɪŋ məˈʃiːn/"}, {"w": "contributed", "hw": "contribute", "pos": "v.", "zh": "有助於、促成", "ex": "Better training contributed to our success.", "ipa": "/kənˈtrɪbjut/"}, {"w": "significantly", "hw": "significantly", "pos": "adv.", "zh": "大幅地", "ex": "Sales rose significantly last quarter.", "ipa": "/sɪɡˈnɪfɪkəntli/"}, {"w": "customer returns", "hw": "customer return", "pos": "n.", "zh": "顧客退貨", "ex": "Customer returns are checked on arrival.", "ipa": "/ˈkʌstəmər rɪˈtɜrn/"}], "en": {"point": ["<em>contribute to<\/em>: <em>to<\/em> is a preposition, so use -ing.", "contribute to 的 to 是介系詞，後面接 -ing。"], "why": ["<em>Contributed … to<\/em> uses <em>to<\/em> as a preposition, even with <em>significantly<\/em> between them. A verb after it takes -ing: <em>to reducing the time<\/em>.", "contributed … to 的 to 是介系詞，中間隔了 significantly 也一樣。後面的動詞用 -ing：to reducing the time。"]}}, {"id": "g-pronoun-04", "type": "grammar", "format": "gap", "unit": "pronoun", "level": 2, "source": "hand", "reviewed": true, "v": 1, "stem": "______ who registered for the leadership workshop before the early deadline of May 3 are entitled to a 20 percent discount on the printed course materials.", "options": ["Those", "Anyone", "Whoever", "Them"], "answer": 0, "explain": {"point": "those who + 複數動詞：「……的那些人」", "why": "句子的主要動詞是 are，主詞要是複數；those who 表示「……的那些人」，所以用 Those。", "wrong": [null, "anyone 是單數，要配 is，不配 are", "whoever 本身就含 who，後面不能再接 who", "受格不能當主詞，them who 也不成立"], "wrongMore": [null, "Anyone who registered ... 前半句完全通順，要讀到隔了一長串的 are entitled 才知道主詞要複數；用 anyone 就要說 anyone who registered ... is entitled。", null, null], "zh": "在 5 月 3 日早鳥截止日前報名領導力工作坊的人，購買紙本課程教材可享八折優惠。", "vocab": [["register for", "報名"], ["early deadline", "早鳥截止日"], ["be entitled to", "有權享有"]]}, "gloss": [{"w": "registered for", "hw": "register for", "pos": "phr.", "zh": "報名", "ex": "Over fifty people registered for the course.", "ipa": "/ˈredʒɪstər fɔːr/"}, {"w": "early deadline", "hw": "early deadline", "pos": "n.", "zh": "早鳥截止日", "ex": "The early deadline is next Friday.", "ipa": "/ˈɜrli ˈdedˌlaɪn/"}, {"w": "are entitled to", "hw": "be entitled to", "pos": "phr.", "zh": "有權享有", "ex": "Members will be entitled to a discount.", "ipa": "/biː enˈtaɪtəld tuː/"}], "en": {"point": ["<em>those who<\/em> + plural verb: the people who.", "those who + 複數動詞：……的那些人。"], "why": ["The main verb is <em>are entitled<\/em>, so the subject is plural. <em>Those who registered<\/em> means 'the people who registered': <em>Those<\/em>.", "主要動詞是 are entitled，所以主詞要是複數。Those who registered 是「報名的那些人」：Those。"]}}, {"id": "g-conditional-03", "type": "grammar", "format": "gap", "unit": "conditional", "level": 2, "source": "hand", "reviewed": true, "v": 1, "stem": "______ you have any questions about your new account, please contact our customer service team, which is available from 9 a.m. to 6 p.m. on weekdays.", "options": ["Should", "Would", "Unless", "Had"], "answer": 0, "explain": {"point": "Should + 主詞 + 原形 = If ... should，信件常用", "why": "省略 If 的倒裝：If you should have any questions → Should you have any questions。", "wrong": [null, "Would you have ... 是問句，接不上 please contact", "變成「除非有問題，否則請聯絡」，意思顛倒", "Had 倒裝要接 p.p.，不接原形 have"], "wrongMore": [null, "Would you have any questions about your new account 前半像一個問句，但後面沒有問號，還接了 please contact 的祈使句，兩句接不起來；條件句倒裝只能用 Should。", null, null], "zh": "如果您對新帳戶有任何疑問，請聯絡我們的客服團隊，服務時間為平日上午九點到下午六點。", "vocab": [["account", "帳戶"], ["customer service", "客服"], ["weekday", "平日"]]}, "gloss": [{"w": "customer service", "hw": "customer service", "pos": "n.", "zh": "客服", "ex": "Customer service answers calls all day.", "ipa": "/ˈkʌstəmər ˈsɜrvəs/"}, {"w": "weekdays", "hw": "weekday", "pos": "n.", "zh": "平日", "ex": "The store is closed on weekdays.", "ipa": "/ˈwiːkˌdeɪ/"}], "en": {"point": ["<em>Should<\/em> + subject + base verb = <em>If … should<\/em>.", "Should + 主詞 + 原形 = If … should。"], "why": ["<em>If you should have any questions<\/em> drops <em>if<\/em> and puts <em>should<\/em> first: <em>Should you have any questions<\/em>. It is a polite way to say 'if you have questions' before <em>please contact<\/em>.", "If you should have any questions 省略 if、把 should 放前面：Should you have any questions。是信件裡禮貌的「如果有疑問」，後面接 please contact。"]}}, {"id": "v-collocation-01", "type": "vocab", "format": "gap", "unit": "collocation", "level": 1, "source": "hand", "reviewed": true, "v": 1, "stem": "Our printing supplier worked late every night to ______ the deadline for the trade show brochures.", "options": ["meet", "match", "catch", "suit"], "answer": 0, "explain": {"point": "搭配詞：meet a deadline（趕上期限）", "why": "deadline 的動詞搭配是 meet；meet the deadline 就是在期限內完成。", "wrong": [null, "match 是「和…相配」，不和 deadline 搭配", "catch 搭 the bus、the train，不說 catch a deadline", "suit 是「適合某人」，不和 deadline 搭配"], "zh": "我們的印刷廠每天晚上都加班，好趕上商展手冊的交件期限。", "vocab": [["deadline", "截止期限"], ["trade show", "商展"], ["brochure", "宣傳手冊"]]}, "gloss": [{"w": "trade show", "hw": "trade show", "pos": "n.", "zh": "商展", "ex": "We booked a booth at the trade show.", "ipa": "/treɪd ʃoʊ/"}, {"w": "brochures", "hw": "brochure", "pos": "n.", "zh": "宣傳手冊", "ex": "The brochure lists all our services.", "ipa": "/broʊˈʃʊr/"}, {"w": "supplier", "hw": "supplier", "pos": "n.", "zh": "供應商", "ex": "Our supplier delivers every Monday.", "ipa": "/səˈplaɪər/"}], "en": {"point": ["<em>meet<\/em> a deadline.", "meet a deadline：趕上期限。"], "why": ["The supplier <em>worked late every night<\/em> so the brochures would be ready on time. The verb that goes with <em>the deadline<\/em> is <em>meet<\/em>.", "印刷廠每晚加班，是為了讓手冊準時完成。和 the deadline 搭配的動詞是 meet。"], "usage": [null, ["<em>match<\/em> means to go well with something, or to be equal to it. <em>The new curtains match the carpet.<\/em>", "match 是「和…相配」或「與…相等」。例：<em>The new curtains match the carpet.<\/em>"], ["<em>catch<\/em> a bus, a train or a flight; also to notice something. <em>She ran to catch the 8:15 train.<\/em>", "catch 搭 bus、train、flight，也有「注意到」的意思。例：<em>She ran to catch the 8:15 train.<\/em>"], ["<em>suit<\/em> someone means to be right or convenient for them. <em>Does Thursday at ten suit you?<\/em>", "suit 某人是「適合、方便某人」。例：<em>Does Thursday at ten suit you?<\/em>"]]}}, {"id": "v-collocation-02", "type": "vocab", "format": "gap", "unit": "collocation", "level": 2, "source": "hand", "reviewed": true, "v": 1, "stem": "The revised travel policy will ______ effect on July 1, so trips booked after that date must follow the new rules.", "options": ["come", "take", "go", "make"], "answer": 1, "explain": {"point": "搭配詞：take effect（生效）", "why": "規定「開始生效」固定說 take effect；come、go 也能表示生效，但要說 come／go into effect，這裡沒有 into。", "wrong": ["要說 come into effect，少了 into", null, "要說 go into effect，少了 into", "make 不和 effect 搭配成「生效」"], "zh": "修訂後的差旅規定將於 7 月 1 日生效，因此在那天之後預訂的出差行程都必須遵守新規則。", "vocab": [["take effect", "生效"], ["revised", "修訂過的"], ["policy", "規定、政策"]]}, "gloss": [{"w": "revised", "hw": "revise", "pos": "adj.", "zh": "修訂過的", "ex": "Please read the revised contract.", "ipa": "/rɪˈvaɪz/"}, {"w": "policy", "hw": "policy", "pos": "n.", "zh": "規定、政策", "ex": "The policy covers all full-time staff.", "ipa": "/ˈpɑːləsi/"}, {"w": "booked", "hw": "book", "pos": "v.", "zh": "預訂", "ex": "We booked the conference room for Friday.", "ipa": "/bʊk/"}], "en": {"point": ["<em>take<\/em> effect.", "take effect：生效。"], "why": ["The policy starts to apply <em>on July 1<\/em>. The fixed phrase for this is <em>take effect<\/em>, and the sentence has no <em>into<\/em>.", "規定從 7 月 1 日起適用。固定說法是 take effect，而這句裡沒有 into。"], "usage": [["<em>come into effect<\/em> means the same, but it needs <em>into<\/em>. <em>The new law comes into effect next month.<\/em>", "come into effect 意思相同，但一定要有 into。例：<em>The new law comes into effect next month.<\/em>"], null, ["<em>go into effect<\/em> also means to start applying. <em>The ban goes into effect on Monday.<\/em>", "go into effect 也是「開始生效」。例：<em>The ban goes into effect on Monday.<\/em>"], ["<em>make<\/em> goes with <em>a decision, an effort, a profit<\/em>. <em>We made a decision before lunch.<\/em>", "make 搭 a decision、an effort、a profit。例：<em>We made a decision before lunch.<\/em>"]]}}, {"id": "v-collocation-03", "type": "vocab", "format": "gap", "unit": "collocation", "level": 1, "source": "hand", "reviewed": true, "v": 1, "stem": "The office manager will ______ an order for new printer cartridges before the end of the day.", "options": ["set", "lay", "place", "position"], "answer": 2, "explain": {"point": "搭配詞：place an order（下訂單）", "why": "下訂單的固定說法是 place an order，後面用 for 接訂購的東西。", "wrong": ["set 搭配 a goal、a date；訂貨不說 set an order", "lay 是「放平、鋪」，不和 order 搭配", null, "position 是「把東西擺到定位」，不和 order 搭配"], "zh": "辦公室經理今天下班前會下單訂購新的印表機墨水匣。", "vocab": [["order", "訂單"], ["cartridge", "墨水匣、碳粉匣"]]}, "gloss": [{"w": "cartridges", "hw": "cartridge", "pos": "n.", "zh": "墨水匣、碳粉匣", "ex": "The printer needs a new cartridge.", "ipa": "/ˈkɑːrtrədʒ/"}, {"w": "before the end of the day", "hw": "before the end of the day", "pos": "phr.", "zh": "今天下班前", "ex": "Please send the files before the end of the day.", "ipa": "/bɪˈfɔːr ðə end ʌv ðə deɪ/"}], "en": {"point": ["<em>place<\/em> an order.", "place an order：下訂單。"], "why": ["The manager needs new printer cartridges, so she will order them. The fixed phrase is <em>place an order for<\/em>, and the sentence continues with <em>for new printer cartridges<\/em>.", "經理需要新的墨水匣，所以要訂購。固定說法是 place an order for，句子接著就是 for new printer cartridges。"], "usage": [["<em>set<\/em> a goal, a date or a price: you decide it. <em>We set a date for the launch.<\/em>", "set 搭 goal、date、price，是「訂定」。例：<em>We set a date for the launch.<\/em>"], ["<em>lay<\/em> something down means to put it flat; <em>lay off<\/em> means to dismiss workers. <em>Please lay the documents on my desk.<\/em>", "lay 是「把東西平放」；lay off 是「裁員」。例：<em>Please lay the documents on my desk.<\/em>"], null, ["<em>position<\/em> something means to put it in a particular place. <em>The designer positioned the logo at the top.<\/em>", "position 是「把東西放在特定位置」。例：<em>The designer positioned the logo at the top.<\/em>"]]}}, {"id": "v-collocation-04", "type": "vocab", "format": "gap", "unit": "collocation", "level": 2, "source": "hand", "reviewed": true, "v": 1, "stem": "Our accountant recommends that we ______ a close eye on cash flow during the slow summer months.", "options": ["hold", "take", "set", "keep"], "answer": 3, "explain": {"point": "搭配詞：keep a close eye on（密切注意）", "why": "「密切注意某事」固定說 keep a close eye on，on 後面接要注意的事，這裡是 cash flow。", "wrong": ["hold 搭配 a meeting，不說 hold an eye on", "take 搭配 a look at，不說 take an eye on", "set eyes on 是「看見」，不能加 a close", null], "zh": "我們的會計師建議，在生意清淡的夏季幾個月裡要密切注意現金流。", "vocab": [["accountant", "會計師"], ["cash flow", "現金流"]]}, "gloss": [{"w": "accountant", "hw": "accountant", "pos": "n.", "zh": "會計師", "ex": "Our accountant checks the books monthly.", "ipa": "/əˈkaʊntənt/"}, {"w": "recommends", "hw": "recommend", "pos": "v.", "zh": "建議", "ex": "The consultant recommends a smaller budget.", "ipa": "/ˌrekəˈmend/"}, {"w": "cash flow", "hw": "cash flow", "pos": "n.", "zh": "現金流", "ex": "Cash flow is tight this quarter.", "ipa": "/kæʃ floʊ/"}], "en": {"point": ["<em>keep<\/em> a close eye on.", "keep a close eye on：密切注意。"], "why": ["The accountant wants the team to watch <em>cash flow<\/em> carefully during <em>the slow summer months<\/em>. The fixed phrase is <em>keep a close eye on<\/em>.", "會計師要團隊在生意清淡的夏季密切注意 cash flow。固定說法是 keep a close eye on。"], "usage": [["<em>hold<\/em> a meeting, an event or a position. <em>We hold a staff meeting every Monday.<\/em>", "hold 搭 meeting、event、position。例：<em>We hold a staff meeting every Monday.<\/em>"], ["<em>take<\/em> a look at something, or <em>take<\/em> a break. <em>Can you take a look at this contract?<\/em>", "take 搭 a look at、a break。例：<em>Can you take a look at this contract?<\/em>"], ["<em>set eyes on<\/em> means to see, usually for the first time. <em>She loved the house the moment she set eyes on it.<\/em>", "set eyes on 是「看見」，通常指第一次看到。例：<em>She loved the house the moment she set eyes on it.<\/em>"], null]}}, {"id": "v-collocation-05", "type": "vocab", "format": "gap", "unit": "collocation", "level": 2, "source": "hand", "reviewed": true, "v": 1, "stem": "The new flexible schedule aims to ______ a balance between client visits and time in the office.", "options": ["pull", "run", "strike", "lift"], "answer": 2, "explain": {"point": "搭配詞：strike a balance（取得平衡）", "why": "「在 A 和 B 之間取得平衡」固定說 strike a balance between A and B；pull、run、lift 都沒有這個用法。", "wrong": ["pull 是「拉」，不說 pull a balance", "run 搭 a business，不說 run a balance between", null, "lift 搭 a ban（解除禁令），不和 balance 搭配"], "zh": "新的彈性班表是為了在拜訪客戶和待在辦公室的時間之間取得平衡。", "vocab": [["flexible schedule", "彈性班表"], ["strike a balance", "取得平衡"], ["client visit", "拜訪客戶"]]}, "gloss": [{"w": "flexible", "hw": "flexible", "pos": "adj.", "zh": "彈性的", "ex": "We offer flexible working hours.", "ipa": "/ˈfleksəbəl/"}, {"w": "aims to", "hw": "aim to", "pos": "phr.", "zh": "目標是、旨在", "ex": "We aim to reply within one business day.", "ipa": "/eɪm tuː/"}, {"w": "client visits", "hw": "client visit", "pos": "n.", "zh": "拜訪客戶", "ex": "Client visits take up most of my week.", "ipa": "/ˈklaɪənt ˈvɪzɪt/"}], "en": {"point": ["<em>strike<\/em> a balance between…", "strike a balance between…：在…之間取得平衡。"], "why": ["The new schedule balances two things: <em>client visits<\/em> and <em>time in the office<\/em>. The fixed phrase is <em>strike a balance between<\/em>, so the verb is <em>strike<\/em>.", "新班表要平衡兩件事：client visits 和 time in the office。固定說法是 strike a balance between，所以動詞是 strike。"], "usage": [["<em>pull<\/em> means to draw something toward you. <em>He pulled the door open.<\/em>", "pull 是「拉」。例：<em>He pulled the door open.<\/em>"], ["<em>run<\/em> a business, a team or a test. <em>She runs a small design studio.<\/em>", "run 搭 business、team、test，是「經營、執行」。例：<em>She runs a small design studio.<\/em>"], null, ["<em>lift<\/em> something up, or <em>lift<\/em> a ban or a restriction. <em>The city lifted the parking ban.<\/em>", "lift 是「舉起」，或「解除」禁令、限制。例：<em>The city lifted the parking ban.<\/em>"]]}}, {"id": "v-collocation-06", "type": "vocab", "format": "gap", "unit": "collocation", "level": 2, "source": "hand", "reviewed": true, "v": 1, "stem": "The plan to open a second branch was approved by an ______ majority of shareholders at Tuesday's meeting.", "options": ["overflowing", "overpowering", "overriding", "overwhelming"], "answer": 3, "explain": {"point": "搭配詞：overwhelming majority（壓倒性多數）", "why": "「壓倒性多數」固定說 overwhelming majority；其他三個字各有自己的搭配。", "wrong": ["overflowing 是「滿出來」，搭 inbox、crowd", "overpowering 形容氣味或感覺太強烈", "overriding 是「首要的」，搭 concern", null], "zh": "開設第二家分店的計畫在星期二的會議上以壓倒性多數獲得股東通過。", "vocab": [["branch", "分店、分行"], ["majority", "多數"], ["shareholder", "股東"]]}, "gloss": [{"w": "branch", "hw": "branch", "pos": "n.", "zh": "分店、分行", "ex": "The bank opened a new branch downtown.", "ipa": "/bræntʃ/"}, {"w": "majority", "hw": "majority", "pos": "n.", "zh": "多數", "ex": "A majority of staff prefer the new schedule.", "ipa": "/məˈdʒɔːrəti/"}, {"w": "shareholders", "hw": "shareholder", "pos": "n.", "zh": "股東", "ex": "Shareholders will vote on the merger.", "ipa": "/ˈʃerˌhoʊldər/"}], "en": {"point": ["<em>overwhelming<\/em> majority.", "overwhelming majority：壓倒性多數。"], "why": ["Most of the shareholders voted yes at the meeting, a very large majority. The fixed phrase for that is <em>an overwhelming majority<\/em>.", "會議上絕大多數股東投贊成票。形容這種多數的固定說法是 an overwhelming majority。"], "usage": [["<em>overflowing<\/em> means so full that things spill out. <em>The overflowing bin needs to be emptied.<\/em>", "overflowing 是「滿到溢出來」。例：<em>The overflowing bin needs to be emptied.<\/em>"], ["<em>overpowering<\/em> describes a smell, feeling or force that is too strong. <em>The overpowering smell of paint filled the room.<\/em>", "overpowering 形容氣味、感覺或力量太強烈。例：<em>The overpowering smell of paint filled the room.<\/em>"], ["<em>overriding<\/em> means more important than anything else. <em>Safety is our overriding concern.<\/em>", "overriding 是「比什麼都重要的」。例：<em>Safety is our overriding concern.<\/em>"], null]}}, {"id": "v-collocation-07", "type": "vocab", "format": "gap", "unit": "collocation", "level": 2, "source": "hand", "reviewed": true, "v": 1, "stem": "Although online orders rose sharply in the second quarter, total revenue still ______ short of the target that the board had set in January.", "options": ["ran", "fell", "cut", "drew"], "answer": 1, "explain": {"point": "搭配詞：fall short of（未達到）", "why": "「未達到目標、預期」固定說 fall short of；Although 帶出「訂單大增，營收卻仍沒達標」。", "wrong": ["run short of 是「某物不夠用」，受詞是存貨、現金", null, "cut ... short 是「提前打斷」，要先接受詞", "draw 沒有 draw short of 的說法"], "wrongMore": ["run short of 後面接快用完的東西（run short of cash、run short of paper）；target 不是會用完的東西，所以不通。", null, null, null], "zh": "雖然第二季的網路訂單大幅成長，總營收仍未達到董事會一月訂下的目標。", "vocab": [["fall short of", "未達到"], ["revenue", "營收"], ["quarter", "季度"]]}, "gloss": [{"w": "sharply", "hw": "sharply", "pos": "adv.", "zh": "大幅地", "ex": "Prices rose sharply last month.", "ipa": "/ˈʃɑːrpli/"}, {"w": "revenue", "hw": "revenue", "pos": "n.", "zh": "營收", "ex": "Revenue grew by five percent.", "ipa": "/ˈrevəˌnuː/"}, {"w": "quarter", "hw": "quarter", "pos": "n.", "zh": "季度", "ex": "Sales were strong in the first quarter.", "ipa": "/ˈkwɔːrtər/"}], "en": {"point": ["<em>fall short of<\/em> a target.", "fall short of：未達到目標。"], "why": ["<em>Although<\/em> orders rose sharply, revenue still did not reach <em>the target<\/em>. The phrase for missing a goal is <em>fall short of<\/em>; the past form is <em>fell<\/em>.", "雖然訂單大增，營收仍沒達到 the target。未達目標的說法是 fall short of，過去式是 fell。"], "usage": [["<em>run short of<\/em> something means to have too little of it left. <em>We are running short of printer paper.<\/em>", "run short of 是「某物快不夠用」。例：<em>We are running short of printer paper.<\/em>"], null, ["<em>cut<\/em> something <em>short<\/em> means to end it early. <em>A fire alarm cut the meeting short.<\/em>", "cut … short 是「提前結束」。例：<em>A fire alarm cut the meeting short.<\/em>"], ["<em>draw<\/em> attention, a conclusion or a picture. <em>The new ad drew a lot of attention.<\/em>", "draw 搭 attention、conclusion、picture。例：<em>The new ad drew a lot of attention.<\/em>"]]}}, {"id": "v-collocation-08", "type": "vocab", "format": "gap", "unit": "collocation", "level": 2, "source": "hand", "reviewed": true, "v": 1, "stem": "Customers who wish to ______ a formal complaint about a damaged delivery should do so in writing within fourteen days, attaching photographs of the packaging if possible.", "options": ["house", "host", "lodge", "board"], "answer": 2, "explain": {"point": "搭配詞：lodge a complaint（正式提出申訴）", "why": "lodge 除了「住宿」，也有「正式提出」的意思，固定搭 a complaint、an appeal；也可說 file a complaint。", "wrong": ["house 是「提供住處、容納」，不接 complaint", "host 搭 an event、a guest，是「主辦、招待」", null, "board 是「登上（車、機）」或「寄宿」"], "wrongMore": ["house、host、board、lodge 都跟住宿有關，是刻意的陷阱；只有 lodge 另有「正式提出（申訴、上訴）」的意思。", null, null, null], "zh": "想對受損貨品提出正式申訴的顧客，應在十四天內以書面提出，可以的話請附上包裝的照片。", "vocab": [["lodge a complaint", "提出申訴"], ["in writing", "以書面"], ["packaging", "包裝"]]}, "gloss": [{"w": "in writing", "hw": "in writing", "pos": "phr.", "zh": "以書面", "ex": "Please confirm the offer in writing.", "ipa": "/ɪn ˈraɪtɪŋ/"}, {"w": "attaching", "hw": "attach", "pos": "v.", "zh": "附上", "ex": "Attach the receipt to your claim form.", "ipa": "/əˈtætʃ/"}, {"w": "packaging", "hw": "packaging", "pos": "n.", "zh": "包裝", "ex": "The packaging protects the glass.", "ipa": "/ˈpækɪdʒɪŋ/"}], "en": {"point": ["<em>lodge<\/em> a complaint.", "lodge a complaint：正式提出申訴。"], "why": ["Customers with a damaged delivery must make a formal complaint <em>in writing<\/em>. <em>Lodge<\/em> means to submit something officially, and it goes with <em>a formal complaint<\/em>.", "貨品受損的顧客必須以書面正式提出申訴。lodge 是「正式提出」，和 a formal complaint 搭配。"], "usage": [["<em>house<\/em> means to provide a home or space for someone or something. <em>The new building will house our legal team.<\/em>", "house 當動詞是「為…提供住處或空間」。例：<em>The new building will house our legal team.<\/em>"], ["<em>host<\/em> an event or a party: to organize it for guests. <em>The hotel will host the awards dinner.<\/em>", "host 搭 event、party，是「主辦」並招待賓客。例：<em>The hotel will host the awards dinner.<\/em>"], null, ["<em>board<\/em> a plane, a train or a ship: to get on it. <em>Passengers may board the train now.<\/em>", "board 是「登上」飛機、火車或船。例：<em>Passengers may board the train now.<\/em>"]]}}, {"id": "v-collocation-09", "type": "vocab", "format": "gap", "unit": "collocation", "level": 1, "source": "hand", "reviewed": true, "v": 1, "stem": "Please ______ in mind that the visitor parking garage will be closed on Saturday for repairs, so guests attending the open house should use the lot on Carver Street.", "options": ["bear", "take", "put", "carry"], "answer": 0, "explain": {"point": "搭配詞：bear in mind（記住、留意）", "why": "「請記得、請留意」固定說 bear in mind 或 keep in mind，後面用 that 子句接要記住的事。", "wrong": [null, "take 搭 into account，不說 take in mind", "沒有 put in mind that 的說法", "carry 和 bear 都有「攜帶」之意，但不說 carry in mind"], "zh": "請留意，訪客停車場星期六因維修關閉，參加開放參觀日的來賓請改停 Carver 街上的停車場。", "vocab": [["bear in mind", "記住、留意"], ["open house", "開放參觀日"], ["lot", "（露天）停車場，parking lot 的簡稱"]]}, "gloss": [{"w": "open house", "hw": "open house", "pos": "n.", "zh": "開放參觀日", "ex": "The school holds an open house in May.", "ipa": "/ˈoʊpən haʊs/"}, {"w": "attending", "hw": "attend", "pos": "v.", "zh": "參加", "ex": "Over fifty guests are attending the dinner.", "ipa": "/əˈtend/"}, {"w": "lot", "hw": "lot", "pos": "n.", "zh": "停車場", "ex": "Please park in the lot behind the office.", "ipa": "/lɑːt/"}], "en": {"point": ["<em>bear<\/em> in mind that…", "bear in mind that…：記住、留意。"], "why": ["The writer asks guests to keep one fact in mind: <em>the visitor parking garage will be closed on Saturday<\/em>. The phrase is <em>bear in mind that<\/em>, and <em>that<\/em> introduces the fact.", "作者要來賓記住一件事：訪客停車場星期六關閉。說法是 bear in mind that，that 後面接要記住的事。"], "usage": [null, ["<em>take<\/em> something <em>into account<\/em> means to consider it. <em>Please take the cost into account.<\/em>", "take … into account 是「把…納入考量」。例：<em>Please take the cost into account.<\/em>"], ["<em>put<\/em> means to place something somewhere. <em>Please put the boxes in the storage room.<\/em>", "put 是「把東西放在某處」。例：<em>Please put the boxes in the storage room.<\/em>"], ["<em>carry<\/em> means to hold and move something, or to have it with you. <em>Staff must carry their ID badges.<\/em>", "carry 是「攜帶、搬運」。例：<em>Staff must carry their ID badges.<\/em>"]]}}, {"id": "v-synonym-01", "type": "vocab", "format": "gap", "unit": "synonym", "level": 1, "source": "hand", "reviewed": true, "v": 1, "stem": "Sales representatives earn a ______ of 4 percent on every contract they sign, in addition to their base salary.", "options": ["wage", "pension", "commission", "allowance"], "answer": 2, "explain": {"point": "commission 佣金：按成交金額抽成", "why": "每簽一份合約就抽 4%，這種按業績計算的錢是佣金 commission；底薪 base salary 另外算。", "wrong": ["wage 是按時數或按週計的固定工資，不按合約抽成", "pension 是退休後才領的退休金，不按合約抽成", null, "allowance 是交通、住房等固定津貼，不按合約抽成"], "zh": "業務代表除了底薪之外，每簽一份合約還能拿到 4% 的佣金。", "vocab": [["sales representative", "業務代表"], ["commission", "佣金"], ["base salary", "底薪"]]}, "gloss": [{"w": "Sales representatives", "hw": "sales representative", "pos": "n.", "zh": "業務代表", "ex": "Each sales representative covers one region.", "ipa": "/seɪlz ˌreprəˈzentətɪv/"}, {"w": "base salary", "hw": "base salary", "pos": "n.", "zh": "底薪", "ex": "Her base salary is paid monthly.", "ipa": "/beɪs ˈsæləri/"}, {"w": "in addition to", "hw": "in addition to", "pos": "phr.", "zh": "除了…之外", "ex": "In addition to salary, staff get a bonus.", "ipa": "/ɪn əˈdɪʃən tuː/"}], "en": {"point": ["<em>commission<\/em>: pay as a share of sales.", "commission 佣金：按成交金額抽成。"], "why": ["Reps get <em>4 percent on every contract they sign<\/em>, on top of <em>their base salary<\/em>. Pay that is a share of each sale is a <em>commission<\/em>.", "業務每簽一份合約抽 4%，另外還有底薪。按每筆成交抽成的錢是 commission。"], "usage": [["<em>wage<\/em> is pay for hours or days worked, often paid weekly. <em>The hourly wage rose to $18.<\/em>", "wage 是按時數或天數計的工資。例：<em>The hourly wage rose to $18.<\/em>"], ["<em>pension<\/em> is money paid regularly after someone retires. <em>He receives a pension from his former employer.<\/em>", "pension 是退休後定期領的退休金。例：<em>He receives a pension from his former employer.<\/em>"], null, ["<em>allowance<\/em> is a set amount given for a cost such as travel or housing. <em>The company pays a monthly travel allowance.<\/em>", "allowance 是為交通、住房等費用給的固定津貼。例：<em>The company pays a monthly travel allowance.<\/em>"]]}}, {"id": "v-synonym-02", "type": "vocab", "format": "gap", "unit": "synonym", "level": 1, "source": "hand", "reviewed": true, "v": 2, "stem": "The IT department ______ laptops and projectors to staff who meet clients off-site, and borrowers must return the equipment within two weeks.", "options": ["returns", "lends", "borrows", "donates"], "answer": 1, "explain": {"point": "lend 借出；borrow 借入；return 歸還", "why": "資訊部把設備交給員工用、兩週內要還；後句稱員工為 borrowers（借用人），所以是借出 lends。", "wrong": ["return 是歸還原主；設備是資訊部的，要歸還的是員工", null, "borrow 是向別人借入，方向相反", "donate 是捐出不收回，和「兩週內歸還」矛盾"], "zh": "資訊部會把筆電和投影機借給到外面見客戶的員工，借用人必須在兩週內歸還設備。", "vocab": [["off-site", "在公司以外的地點"], ["borrower", "借用人"], ["equipment", "設備"]]}, "gloss": [{"w": "off-site", "hw": "off-site", "pos": "adj.", "zh": "在公司以外的地點", "ex": "The team held an off-site workshop.", "ipa": "/ɔːf saɪt/"}, {"w": "borrowers", "hw": "borrower", "pos": "n.", "zh": "借用人", "ex": "Borrowers must sign for each item.", "ipa": "/ˈbɑːroʊər/"}, {"w": "projectors", "hw": "projector", "pos": "n.", "zh": "投影機", "ex": "The projector in room B is broken.", "ipa": "/prəˈdʒektər/"}], "en": {"point": ["<em>lend<\/em> = give for a time; <em>borrow<\/em> = take for a time.", "lend 借出；borrow 借入。"], "why": ["The IT department gives laptops to staff and wants them back <em>within two weeks<\/em>. The next clause calls staff <em>borrowers<\/em>, so the department <em>lends<\/em> the equipment.", "資訊部把筆電交給員工，兩週內要收回。後句稱員工為 borrowers，所以資訊部是借出，用 lends。"], "usage": [["<em>return<\/em> means to give something back, or to come back. <em>Please return the projector to the IT desk.<\/em>", "return 是「歸還」或「回來」。例：<em>Please return the projector to the IT desk.<\/em>"], null, ["<em>borrow<\/em> means to take something from someone for a short time. <em>May I borrow your charger?<\/em>", "borrow 是「向人借入」。例：<em>May I borrow your charger?<\/em>"], ["<em>donate<\/em> means to give something for free, with nothing coming back. <em>The firm donated old computers to a school.<\/em>", "donate 是「捐出」，不會收回。例：<em>The firm donated old computers to a school.<\/em>"]]}}, {"id": "v-synonym-03", "type": "vocab", "format": "gap", "unit": "synonym", "level": 2, "source": "hand", "reviewed": true, "v": 1, "stem": "Guests who ______ additional charges, such as room service or minibar purchases, must settle them at checkout.", "options": ["suffer", "undergo", "endure", "incur"], "answer": 3, "explain": {"point": "incur charges／expenses：產生（費用）", "why": "房客自己消費而產生費用，固定說 incur charges；suffer、undergo、endure 雖然都有「承受」之意，都不接 charges。", "wrong": ["suffer 搭 losses、damage 等不幸遭受的事，不接消費", "undergo 搭 surgery、training 等過程，不接費用", "endure 是「忍受」痛苦或延誤，不接費用", null], "zh": "有額外消費（例如客房服務或迷你吧）的房客，必須在退房時結清。", "vocab": [["incur", "產生、招致（費用）"], ["minibar", "（客房）迷你吧"], ["settle", "結清（帳款）"]]}, "gloss": [{"w": "room service", "hw": "room service", "pos": "n.", "zh": "客房送餐服務", "ex": "We ordered room service for breakfast.", "ipa": "/ruːm ˈsɜrvəs/"}, {"w": "minibar", "hw": "minibar", "pos": "n.", "zh": "（客房）迷你吧", "ex": "The minibar is stocked with drinks.", "ipa": ""}, {"w": "settle", "hw": "settle", "pos": "v.", "zh": "結清（帳款）", "ex": "Please settle your bill at the front desk.", "ipa": "/ˈsetəl/"}, {"w": "checkout", "hw": "checkout", "pos": "n.", "zh": "退房", "ex": "Checkout is at eleven in the morning.", "ipa": "/ˈtʃeˌkaʊt/"}], "en": {"point": ["<em>incur<\/em> charges or costs.", "incur charges：產生費用。"], "why": ["Guests who use <em>room service or minibar<\/em> create extra charges that they must pay. The verb for bringing a cost on yourself is <em>incur<\/em>.", "使用 room service 或 minibar 的房客會產生額外費用，要自己付。「招致費用」的動詞是 incur。"], "usage": [["<em>suffer<\/em> a loss, an injury or a delay: something bad happens to you. <em>The company suffered a heavy loss last year.<\/em>", "suffer 搭 loss、injury、delay，是「遭受」不好的事。例：<em>The company suffered a heavy loss last year.<\/em>"], ["<em>undergo<\/em> a process, test or change. <em>All new staff undergo a week of training.<\/em>", "undergo 搭 process、test、change，是「經歷」。例：<em>All new staff undergo a week of training.<\/em>"], ["<em>endure<\/em> means to put up with something painful or difficult. <em>Travelers endured a long delay at the airport.<\/em>", "endure 是「忍受」痛苦或困難。例：<em>Travelers endured a long delay at the airport.<\/em>"], null]}}, {"id": "v-synonym-04", "type": "vocab", "format": "gap", "unit": "synonym", "level": 2, "source": "hand", "reviewed": true, "v": 2, "stem": "The new advisory committee ______ five managers, each from a different department of the company.", "options": ["consists", "comprises", "conforms", "constitutes"], "answer": 1, "explain": {"point": "comprise = consist of（由…組成）", "why": "主詞是整體、後面直接接成員，用 comprises；consists 要加 of。", "wrong": ["要說 consists of five managers，少了 of", null, "conform 是「符合」，要接 to，與組成無關", "constitute 方向相反，是成員構成整體"], "wrongMore": [null, null, null, "constitute 的主詞是成員、受詞是整體：Five managers constitute the committee，和這句方向相反。"], "zh": "新的顧問委員會由五位經理組成，每人來自公司不同的部門。", "vocab": [["advisory committee", "顧問委員會"], ["department", "部門"]]}, "gloss": [{"w": "advisory committee", "hw": "advisory committee", "pos": "n.", "zh": "顧問委員會", "ex": "The advisory committee meets every quarter.", "ipa": "/ædˈvaɪzəri kəˈmɪti/"}, {"w": "department", "hw": "department", "pos": "n.", "zh": "部門", "ex": "The marketing department is on the third floor.", "ipa": "/dɪˈpɑːrtmənt/"}], "en": {"point": ["<em>comprise<\/em> = consist of.", "comprise = consist of：由…組成。"], "why": ["The sentence names the whole, <em>the new advisory committee<\/em>, and puts its members, <em>five managers<\/em>, right after the verb. With no <em>of<\/em>, the verb is <em>comprises<\/em>.", "句子先說整體 the new advisory committee，成員 five managers 緊接在動詞後。沒有 of，所以用 comprises。"], "usage": [["<em>consist of<\/em> means to be made up of; it needs <em>of<\/em>. <em>The team consists of six engineers.<\/em>", "consist of 是「由…組成」，要有 of。例：<em>The team consists of six engineers.<\/em>"], null, ["<em>conform to<\/em> means to follow a rule or standard. <em>All products must conform to safety standards.<\/em>", "conform to 是「符合」規定或標準。例：<em>All products must conform to safety standards.<\/em>"], ["<em>constitute<\/em> means to make up a whole, so the members are the subject. <em>Women constitute half of our workforce.<\/em>", "constitute 是「構成」整體，主詞是成員。例：<em>Women constitute half of our workforce.<\/em>"]]}}, {"id": "v-synonym-05", "type": "vocab", "format": "gap", "unit": "synonym", "level": 2, "source": "hand", "reviewed": true, "v": 1, "stem": "Showroom visits ______ increased after the renovation, jumping 40 percent in the first week and staying at that level for the rest of the year.", "options": ["markedly", "slightly", "steadily", "temporarily"], "answer": 0, "explain": {"point": "副詞看全句：markedly 明顯地、大幅地", "why": "跳升 40% 是大幅增加；第一週就跳上去、之後維持到年底，所以不是 slightly、steadily 或 temporarily，而是 markedly。", "wrong": [null, "slightly 是「稍微」，但 40% 不是小幅", "steadily 是穩定逐步上升，但這裡是一週內跳升後持平", "temporarily 是暫時，但之後到年底都維持在那個水準"], "zh": "展示間整修後來客數明顯增加，第一週就跳升 40%，而且那一年剩下的時間都維持在這個水準。", "vocab": [["showroom", "展示間"], ["renovation", "整修"], ["markedly", "明顯地"]]}, "gloss": [{"w": "Showroom", "hw": "showroom", "pos": "n.", "zh": "展示間", "ex": "The showroom displays our newest models.", "ipa": "/ˈʃoʊˌrʊm/"}, {"w": "renovation", "hw": "renovation", "pos": "n.", "zh": "整修", "ex": "The renovation took three months.", "ipa": "/ˌrenəˈveɪʃən/"}, {"w": "jumping", "hw": "jump", "pos": "v.", "zh": "跳升", "ex": "Orders jumped after the new ad ran.", "ipa": "/dʒʌmp/"}], "en": {"point": ["Read the whole sentence: <em>markedly<\/em> = by a large amount.", "看全句：markedly 是明顯地、大幅地。"], "why": ["Visits went up by 40 percent (<em>jumping 40 percent<\/em>) in the first week, a large rise, and stayed <em>at that level<\/em> for the rest of the year. So the adverb is <em>markedly<\/em>.", "來客數跳升 40%，是大幅增加，而且之後維持在那個水準到年底。所以副詞是 markedly。"], "usage": [null, ["<em>slightly<\/em> means by a small amount. <em>Prices rose slightly in March.<\/em>", "slightly 是「稍微」。例：<em>Prices rose slightly in March.<\/em>"], ["<em>steadily<\/em> means at an even pace over time. <em>Sales have grown steadily since January.<\/em>", "steadily 是「穩定、逐步地」。例：<em>Sales have grown steadily since January.<\/em>"], ["<em>temporarily<\/em> means for a short time only. <em>The store is temporarily closed for cleaning.<\/em>", "temporarily 是「暫時地」。例：<em>The store is temporarily closed for cleaning.<\/em>"]]}}, {"id": "v-synonym-06", "type": "vocab", "format": "gap", "unit": "synonym", "level": 1, "source": "hand", "reviewed": true, "v": 1, "stem": "The landlord has agreed to ______ our lease for another two years at the same monthly rent.", "options": ["extend", "expand", "enlarge", "stretch"], "answer": 0, "explain": {"point": "extend 延長時間；expand／enlarge 擴大範圍", "why": "for another two years 是期限往後延，只有 extend 能指延長租約。", "wrong": [null, "expand 是規模或範圍擴大，不是延長期限", "enlarge 是尺寸放大，用在照片、空間", "stretch 用在預算、布料，不說延租約"], "zh": "房東同意以同樣的月租再把我們的租約延長兩年。", "vocab": [["landlord", "房東"], ["lease", "租約"], ["rent", "租金"]]}, "gloss": [{"w": "landlord", "hw": "landlord", "pos": "n.", "zh": "房東", "ex": "The landlord fixed the heating.", "ipa": "/ˈlændˌlɔːrd/"}, {"w": "lease", "hw": "lease", "pos": "n.", "zh": "租約", "ex": "We signed a three-year lease.", "ipa": "/liːs/"}], "en": {"point": ["<em>extend<\/em> a period of time.", "extend 延長時間。"], "why": ["The rent stays the same <em>for another two years<\/em>, so the lease gets longer in time. The verb for making a period longer is <em>extend<\/em>.", "租金不變，租約再多兩年，也就是期限變長。讓期間變長的動詞是 extend。"], "usage": [null, ["<em>expand<\/em> means to grow bigger in size, amount or reach. <em>The firm plans to expand into Asia.<\/em>", "expand 是規模、數量或範圍變大。例：<em>The firm plans to expand into Asia.<\/em>"], ["<em>enlarge<\/em> means to make something bigger, such as a photo or a room. <em>We enlarged the photo for the poster.<\/em>", "enlarge 是把照片、空間等放大。例：<em>We enlarged the photo for the poster.<\/em>"], ["<em>stretch<\/em> means to pull something longer, or to make it last. <em>We must stretch the budget to cover repairs.<\/em>", "stretch 是「拉長」，或讓預算等撐久一點。例：<em>We must stretch the budget to cover repairs.<\/em>"]]}}, {"id": "v-synonym-07", "type": "vocab", "format": "gap", "unit": "synonym", "level": 3, "source": "hand", "reviewed": true, "v": 1, "stem": "All subcontractors working at the Varrick site must ______ by the safety rules posted at the entrance, and anyone found without a hard hat will be asked to leave.", "options": ["comply", "adhere", "abide", "conform"], "answer": 2, "explain": {"point": "遵守：abide by／comply with／adhere to", "why": "四個都是「遵守」，差在後面的介系詞：空格後是 by，只有 abide 說 abide by the rules。", "wrong": ["comply 要接 with：comply with the rules", "adhere 要接 to：adhere to the rules", null, "conform 要接 to：conform to the rules"], "zh": "所有在 Varrick 工地施工的分包商都必須遵守入口張貼的安全規定，沒戴安全帽的人會被請離現場。", "vocab": [["subcontractor", "分包商"], ["abide by", "遵守"], ["hard hat", "安全帽"]]}, "gloss": [{"w": "subcontractors", "hw": "subcontractor", "pos": "n.", "zh": "分包商", "ex": "The subcontractor finished the wiring.", "ipa": "/səbˈkɑːnˌtræktər/"}, {"w": "posted", "hw": "post", "pos": "v.", "zh": "張貼", "ex": "Notices are posted on the wall.", "ipa": "/poʊst/"}, {"w": "hard hat", "hw": "hard hat", "pos": "n.", "zh": "安全帽", "ex": "Visitors must wear a hard hat.", "ipa": "/hɑːrd hæt/"}], "en": {"point": ["<em>abide by<\/em> the rules.", "abide by the rules：遵守規定。"], "why": ["The blank is followed by <em>by the safety rules<\/em>. Of the four words that mean to obey, only <em>abide<\/em> takes <em>by<\/em>: <em>abide by<\/em>.", "空格後面是 by the safety rules。四個「遵守」的字裡，只有 abide 接 by：abide by。"], "usage": [["<em>comply with<\/em> a rule, request or law. <em>All vendors must comply with the new regulations.<\/em>", "comply with 是「遵守」規則、要求或法律。例：<em>All vendors must comply with the new regulations.<\/em>"], ["<em>adhere to<\/em> a rule, plan or schedule. <em>Please adhere to the agreed timeline.<\/em>", "adhere to 是「遵守」規則、計畫或時程。例：<em>Please adhere to the agreed timeline.<\/em>"], null, ["<em>conform to<\/em> a rule or standard. <em>The packaging must conform to export standards.<\/em>", "conform to 是「符合」規則或標準。例：<em>The packaging must conform to export standards.<\/em>"]]}}, {"id": "v-synonym-08", "type": "vocab", "format": "gap", "unit": "synonym", "level": 2, "source": "hand", "reviewed": true, "v": 1, "stem": "The Corvale plant will ______ production for two weeks in August while the new packaging line is installed, and normal operations will resume on September 1.", "options": ["terminate", "abandon", "conclude", "suspend"], "answer": 3, "explain": {"point": "suspend 暫停（之後會恢復）", "why": "for two weeks 和後句的 resume 都說明停工是暫時的、之後會恢復，所以用 suspend。", "wrong": ["terminate 是終止，之後不會 resume", "abandon 是放棄，之後不會再恢復", "conclude 是完成、結束，不是中途暫停", null], "zh": "Corvale 工廠八月將停產兩週以安裝新的包裝線，9 月 1 日恢復正常營運。", "vocab": [["suspend", "暫停"], ["packaging line", "包裝生產線"], ["resume", "恢復、重新開始"]]}, "gloss": [{"w": "packaging line", "hw": "packaging line", "pos": "n.", "zh": "包裝生產線", "ex": "The packaging line runs two shifts.", "ipa": "/ˈpækɪdʒɪŋ laɪn/"}, {"w": "installed", "hw": "install", "pos": "v.", "zh": "安裝", "ex": "The technician installed the new printer.", "ipa": "/ˌɪnˈstɔːl/"}, {"w": "resume", "hw": "resume", "pos": "v.", "zh": "恢復、重新開始", "ex": "Work will resume on Monday.", "ipa": "/rɪˈzuːm/"}], "en": {"point": ["<em>suspend<\/em> = stop for a time.", "suspend 暫停（之後會恢復）。"], "why": ["The plant stops production <em>for two weeks<\/em>, and <em>normal operations will resume on September 1<\/em>. A stop that ends and then restarts is <em>suspend<\/em>.", "工廠停產兩週，9 月 1 日正常營運恢復。先停下來、之後再恢復的是 suspend。"], "usage": [["<em>terminate<\/em> means to end something for good, such as a contract. <em>The company terminated the agreement.<\/em>", "terminate 是「終止」，例如合約。例：<em>The company terminated the agreement.<\/em>"], ["<em>abandon<\/em> means to give something up completely. <em>They abandoned the project after the budget was cut.<\/em>", "abandon 是「完全放棄」。例：<em>They abandoned the project after the budget was cut.<\/em>"], ["<em>conclude<\/em> means to finish, or to reach a decision. <em>The talks concluded on Friday.<\/em>", "conclude 是「結束」或「下結論」。例：<em>The talks concluded on Friday.<\/em>"], null]}}, {"id": "v-synonym-09", "type": "vocab", "format": "gap", "unit": "synonym", "level": 2, "source": "hand", "reviewed": true, "v": 1, "stem": "The hotel has agreed to ______ the cancellation fee for guests whose flights were canceled because of the storm, provided that they submit written confirmation from their airline.", "options": ["waive", "exempt", "spare", "relieve"], "answer": 0, "explain": {"point": "waive + 費用／規定：免除", "why": "空格後直接接被免掉的費用 the cancellation fee，只有 waive 以費用當受詞；其他三個的受詞是被免除的人。", "wrong": [null, "exempt 受詞是人：exempt guests from the fee", "spare 要先接人：spare guests the fee", "relieve 受詞是人：relieve guests of a burden"], "wrongMore": [null, "四個字都有「讓人免於…」的意思；差別在受詞：exempt、spare、relieve 後面先接人，waive 後面直接接費用或規定（waive a fee、waive a requirement）。", null, null], "zh": "飯店同意，航班因暴風雨取消的房客只要提出航空公司的書面證明，就免收取消費。", "vocab": [["waive", "免除（費用、規定）"], ["cancellation fee", "取消費"], ["provided that", "只要、前提是"]]}, "gloss": [{"w": "cancellation fee", "hw": "cancellation fee", "pos": "n.", "zh": "取消費", "ex": "A cancellation fee applies after Monday.", "ipa": "/ˌkænsəˈleɪʃən fiː/"}, {"w": "provided that", "hw": "provided that", "pos": "phr.", "zh": "只要、前提是", "ex": "You may enter provided that you sign in.", "ipa": "/prəˈvaɪdɪd ðæt/"}, {"w": "written confirmation", "hw": "written confirmation", "pos": "n.", "zh": "書面證明", "ex": "We need written confirmation of the order.", "ipa": "/ˈrɪtən ˌkɑːnfərˈmeɪʃən/"}], "en": {"point": ["<em>waive<\/em> a fee or a rule.", "waive + 費用／規定：免除。"], "why": ["The blank is followed directly by the thing that is dropped: <em>the cancellation fee<\/em>. Only <em>waive<\/em> takes a fee as its object; the hotel agrees not to charge it.", "空格後直接接被免掉的東西：the cancellation fee。只有 waive 以費用當受詞；飯店同意不收這筆費用。"], "usage": [null, ["<em>exempt<\/em> someone <em>from<\/em> a rule or charge. <em>The law exempts small firms from this tax.<\/em>", "exempt 人 from 規定或費用。例：<em>The law exempts small firms from this tax.<\/em>"], ["<em>spare<\/em> someone something unpleasant. <em>The early flight spared us a long wait.<\/em>", "spare 人 + 麻煩事，是「讓人免去」。例：<em>The early flight spared us a long wait.<\/em>"], ["<em>relieve<\/em> someone <em>of<\/em> a duty or burden; also to ease pain. <em>The assistant relieved the manager of routine tasks.<\/em>", "relieve 人 of 責任或負擔；也有「緩解」之意。例：<em>The assistant relieved the manager of routine tasks.<\/em>"]]}}, {"id": "v-business-01", "type": "vocab", "format": "gap", "unit": "business", "level": 2, "source": "hand", "reviewed": true, "v": 1, "stem": "Your flight times and the address of each hotel are listed in the ______ the travel agent sent today.", "options": ["inventory", "itinerary", "agenda", "warranty"], "answer": 1, "explain": {"point": "itinerary：行程表（航班、住宿）", "why": "旅行社寄來、列出航班時間和飯店地址的，是行程表 itinerary。", "wrong": ["inventory 是庫存清單，不會列航班和飯店", null, "agenda 是會議議程，不列航班", "warranty 是產品保固書，跟行程無關"], "zh": "你的航班時間和每間飯店的地址，都列在旅行社今天寄來的行程表裡。", "vocab": [["itinerary", "行程表"], ["travel agent", "旅行社（人員）"]]}, "gloss": [{"w": "travel agent", "hw": "travel agent", "pos": "n.", "zh": "旅行社人員", "ex": "Our travel agent booked the flights.", "ipa": "/ˈtrævəl ˈeɪdʒənt/"}, {"w": "listed", "hw": "list", "pos": "v.", "zh": "列出", "ex": "All fees are listed on the form.", "ipa": "/lɪst/"}], "en": {"point": ["<em>itinerary<\/em>: a plan of a trip.", "itinerary：行程表。"], "why": ["The document came from the travel agent and lists <em>flight times and the address of each hotel<\/em>. A trip plan with times and places is an <em>itinerary<\/em>.", "這份文件來自旅行社，列出航班時間和每間飯店的地址。列出時間與地點的旅程計畫就是 itinerary。"], "usage": [["<em>inventory<\/em> is the list or stock of goods a business holds. <em>We count our inventory every December.<\/em>", "inventory 是公司持有的庫存或庫存清單。例：<em>We count our inventory every December.<\/em>"], null, ["<em>agenda<\/em> is the list of topics for a meeting. <em>The agenda has five items.<\/em>", "agenda 是會議的議程。例：<em>The agenda has five items.<\/em>"], ["<em>warranty<\/em> is a written promise to repair or replace a product. <em>The printer has a two-year warranty.<\/em>", "warranty 是產品的保固。例：<em>The printer has a two-year warranty.<\/em>"]]}}, {"id": "v-business-02", "type": "vocab", "format": "gap", "unit": "business", "level": 2, "source": "hand", "reviewed": true, "v": 1, "stem": "The furniture supplier has sent us the ______ for the 40 office chairs, and it is payable within 30 days.", "options": ["receipt", "estimate", "refund", "invoice"], "answer": 3, "explain": {"point": "invoice：請款單（付款前寄的）", "why": "payable within 30 days 表示還沒付、要在期限內付，這張單據是請款單 invoice。", "wrong": ["receipt 是付款後的收據，不會再「應付」", "estimate 是估價單，不是付款依據", "refund 是退款，不是要付的錢", null], "zh": "家具供應商已經寄來 40 張辦公椅的請款單，須在 30 天內付款。", "vocab": [["supplier", "供應商"], ["invoice", "請款單、帳單"], ["payable", "應付的"]]}, "gloss": [{"w": "supplier", "hw": "supplier", "pos": "n.", "zh": "供應商", "ex": "Our supplier delivers every Monday.", "ipa": "/səˈplaɪər/"}, {"w": "payable", "hw": "payable", "pos": "adj.", "zh": "應付的", "ex": "The fee is payable by check.", "ipa": "/ˈpeɪəbəl/"}], "en": {"point": ["<em>invoice<\/em>: a bill sent before payment.", "invoice：付款前寄出的請款單。"], "why": ["The supplier sent the document for the 40 chairs, and it is <em>payable within 30 days<\/em>. A bill that asks you to pay is an <em>invoice<\/em>.", "供應商寄來 40 張椅子的單據，要在 30 天內付款。要求你付款的單據是 invoice。"], "usage": [["<em>receipt<\/em> is proof that you have already paid. <em>Keep the receipt in case you return the item.<\/em>", "receipt 是已付款的收據。例：<em>Keep the receipt in case you return the item.<\/em>"], ["<em>estimate<\/em> is an approximate price given before work begins. <em>The contractor gave us a written estimate.<\/em>", "estimate 是開工前給的概略報價。例：<em>The contractor gave us a written estimate.<\/em>"], ["<em>refund<\/em> is money given back to a customer. <em>She asked for a refund after the order arrived damaged.<\/em>", "refund 是退還給顧客的錢。例：<em>She asked for a refund after the order arrived damaged.<\/em>"], null]}}, {"id": "v-business-03", "type": "vocab", "format": "gap", "unit": "business", "level": 1, "source": "hand", "reviewed": true, "v": 1, "stem": "Because of the storm warning, the product launch has been ______ until next Thursday.", "options": ["postponed", "abandoned", "expired", "concluded"], "answer": 0, "explain": {"point": "postpone … until：延期到某時", "why": "until next Thursday 表示改到之後的日期再辦，這是延期 postponed。", "wrong": [null, "abandon 是放棄，不會有新的日期", "expire 是證件、合約到期，不用在活動", "conclude 是結束，不接 until 未來日期"], "zh": "由於暴風雨警報，新產品發表會延到下星期四舉行。", "vocab": [["storm warning", "暴風雨警報"], ["product launch", "產品發表會"]]}, "gloss": [{"w": "storm warning", "hw": "storm warning", "pos": "n.", "zh": "暴風雨警報", "ex": "A storm warning is in effect tonight.", "ipa": "/stɔːrm ˈwɔːrnɪŋ/"}, {"w": "product launch", "hw": "product launch", "pos": "n.", "zh": "產品發表會", "ex": "The product launch drew many reporters.", "ipa": "/ˈprɑːdəkt lɔːntʃ/"}], "en": {"point": ["<em>postpone<\/em> … <em>until<\/em>: move to a later date.", "postpone … until：延期到某時。"], "why": ["The launch is moved to <em>next Thursday<\/em>, a later date, because of <em>the storm warning<\/em>. Moving an event to a later time is <em>postponed<\/em>.", "因為 the storm warning，發表會改到 next Thursday。把活動挪到之後舉行就是 postponed。"], "usage": [null, ["<em>abandon<\/em> means to give something up completely. <em>The firm abandoned the plan to open a new store.<\/em>", "abandon 是「完全放棄」。例：<em>The firm abandoned the plan to open a new store.<\/em>"], ["<em>expire<\/em> means to reach the end of a valid period. <em>My passport expires in May.<\/em>", "expire 是證件、合約等「到期」。例：<em>My passport expires in May.<\/em>"], ["<em>conclude<\/em> means to finish, or to end a talk or deal. <em>The meeting concluded at noon.<\/em>", "conclude 是「結束」會議或交易。例：<em>The meeting concluded at noon.<\/em>"]]}}, {"id": "v-business-04", "type": "vocab", "format": "gap", "unit": "business", "level": 2, "source": "hand", "reviewed": true, "v": 1, "stem": "The cost of your staff uniform will be ______ from your first month's salary.", "options": ["reduced", "declined", "deducted", "devoted"], "answer": 2, "explain": {"point": "deduct A from B：從 B 扣除 A", "why": "費用從薪水裡扣掉，說 be deducted from your salary；from 是線索。", "wrong": ["reduce 是「減少」，不說把費用從薪水 reduce", "decline 是「下降」（不及物）或「婉拒」，都不是扣錢", null, "devote 是「奉獻」，要接 to"], "zh": "你的員工制服費用會從第一個月的薪水中扣除。", "vocab": [["uniform", "制服"], ["deduct", "扣除"], ["salary", "薪水"]]}, "gloss": [{"w": "staff uniform", "hw": "staff uniform", "pos": "n.", "zh": "員工制服", "ex": "The staff uniform includes a name badge.", "ipa": "/stæf ˈjuːnəˌfɔːrm/"}, {"w": "salary", "hw": "salary", "pos": "n.", "zh": "薪水", "ex": "Her salary is paid on the 25th.", "ipa": "/ˈsæləri/"}], "en": {"point": ["<em>deduct<\/em> A <em>from<\/em> B.", "deduct A from B：從 B 扣除 A。"], "why": ["The uniform cost is taken <em>from your first month's salary<\/em>. The word <em>from<\/em> points to <em>deducted<\/em>: <em>be deducted from<\/em>.", "制服費用從第一個月的薪水中扣。from 是線索，指向 deducted：be deducted from。"], "usage": [["<em>reduce<\/em> means to make something smaller or less. <em>We reduced our energy use by ten percent.<\/em>", "reduce 是「減少」。例：<em>We reduced our energy use by ten percent.<\/em>"], ["<em>decline<\/em> means to say no politely, or to become lower. <em>She declined the invitation.<\/em>", "decline 是「婉拒」或「下降」。例：<em>She declined the invitation.<\/em>"], null, ["<em>devote<\/em> time or effort <em>to<\/em> something. <em>He devoted the morning to the budget.<\/em>", "devo

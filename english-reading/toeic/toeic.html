行"], "wrongMore": ["and to manage the monthly budget 單看很自然（職責是去管理）。但往前看，include 後的前兩項是 ordering supplies、scheduling repairs，第三項要同形式：managing。", null, null, null], "zh": "Rao 女士擔任新分行辦公室經理的職責，包括訂購用品、和外部包商安排維修，以及管理每月的清潔與維護預算。", "vocab": [["contractor", "包商"], ["maintenance", "維修、保養"]]}, "gloss": [{"w": "scheduling", "hw": "schedule", "pos": "v.", "zh": "安排時程", "ex": "Please schedule the meeting for Friday.", "ipa": "/ˈskedʒʊl/"}, {"w": "contractors", "hw": "contractor", "pos": "n.", "zh": "包商", "ex": "The contractor finished the work on time.", "ipa": "/ˈkɑːnˌtræktər/"}, {"w": "maintenance", "hw": "maintenance", "pos": "n.", "zh": "維修、保養", "ex": "Maintenance staff check the lifts weekly.", "ipa": "/ˈmeɪntənəns/"}], "en": {"point": ["A list uses the same form for every item.", "列舉的每一項用相同的形式。"], "why": ["<em>include<\/em> lists three items. The first two are <em>ordering supplies<\/em> and <em>scheduling repairs<\/em>, both Ving. The third must match: <em>managing<\/em>.", "include 後面列出三項。前兩項 ordering supplies 和 scheduling repairs 都是 Ving。第三項要相同：managing。"]}}, {"id": "v-collocation-10", "type": "vocab", "format": "gap", "unit": "collocation", "level": 2, "source": "hand", "reviewed": true, "v": 1, "stem": "Most of the concerns about parking and noise that tenants ______ at last month's residents' meeting have already been passed on to the property management company.", "options": ["spoke", "commented", "raised", "complained"], "answer": 2, "explain": {"point": "搭配詞：raise concerns（提出疑慮）", "why": "that tenants ______ 這個關係子句缺受詞，受詞是七個字前的 concerns；只有 raise 能直接接 concerns。", "wrong": ["spoke at the meeting 局部通，但 speak 不接 concerns", "comment 要接 on，不能直接接 concerns", null, "complain 要接 about，不能直接接 concerns"], "wrongMore": ["tenants spoke at last month's meeting 單獨讀完全正確；但 that 前面的 concerns 是這個關係子句的受詞，speak 不能直接接 concerns（要說 speak about）。", null, null, "complain 意思最接近，但它是不及物動詞（complain about sth）或接 that 子句；concerns that tenants complained 少了 about，要用及物的 raise。"], "zh": "上個月住戶大會上，住戶提出的停車與噪音問題，大部分都已經轉交給物業管理公司了。", "vocab": [["tenant", "房客、住戶"], ["residents' meeting", "住戶大會"], ["property management company", "物業管理公司"]]}, "ldbs": {"L": true, "D": true, "B": true, "S": true}, "gloss": [{"w": "tenants", "hw": "tenant", "pos": "n.", "zh": "房客、住戶", "ex": "Each tenant pays rent on the first day.", "ipa": "/ˈtenənt/"}, {"w": "passed on", "hw": "pass on", "pos": "phr.", "zh": "轉交、轉達", "ex": "Please pass on my thanks to the team.", "ipa": "/pæs ɑːn/"}, {"w": "property management company", "hw": "property management company", "pos": "phr.", "zh": "物業管理公司", "ex": "The property management company fixed the heating.", "ipa": "/ˈprɑːpərti ˈmænədʒmənt ˈkʌmpəˌniː/"}], "en": {"point": ["<em>raise<\/em> concerns.", "raise concerns（提出疑慮）。"], "why": ["<em>tenants ______<\/em> needs an object, and that object is <em>concerns<\/em>, earlier in the sentence. Only <em>raised<\/em> takes <em>concerns<\/em> directly.", "tenants ______ 缺受詞，受詞是前面的 concerns。只有 raised 能直接接 concerns。"], "usage": [["<em>speak<\/em> about a topic, or speak at an event; it cannot take <em>concerns<\/em> directly. <em>Two tenants spoke about the noise.<\/em>", "speak about 主題，或在場合中發言；不能直接接 concerns。"], ["<em>comment<\/em> on something. <em>Several tenants commented on the new parking rules.<\/em>", "comment on 某事。"], null, ["<em>complain<\/em> about something, or complain that…; it needs <em>about<\/em> before the problem. <em>Tenants complained about the noise.<\/em>", "complain about 某事，或接 that 子句；問題前面要有 about。"]]}}, {"id": "v-collocation-11", "type": "vocab", "format": "gap", "unit": "collocation", "level": 2, "source": "hand", "reviewed": true, "v": 1, "stem": "The vacancy that opened in the purchasing department when Ms. Okafor transferred to the Brockfield office will be ______ by an internal candidate rather than advertised outside the company.", "options": ["held", "filled", "occupied", "assumed"], "answer": 1, "explain": {"point": "搭配詞：fill a vacancy（補上職缺）", "why": "will be ______ 的主詞是句首的 The vacancy，中間隔了兩個子句；職缺是被「補上」：be filled by。", "wrong": ["a post is held by 某人，但空缺不能被 hold", null, "office will be occupied 局部通，但主詞是 vacancy", "assume 搭 a role、a post，不搭 vacancy"], "wrongMore": ["hold a post／a position 是真的搭配（the post is held by…），所以眼熟；但 vacancy 是「空著的職位」，空缺只能被填補，不能被「擔任」。", null, "空格前最近的名詞是 the Brockfield office，office will be occupied by 讀起來很對；但它在 when 子句裡，will be ______ 的主詞是句首的 The vacancy，職缺只能 be filled。", null], "zh": "Okafor 女士調到 Brockfield 分公司後，採購部空出來的職缺將由內部人選遞補，不會對外招募。", "vocab": [["vacancy", "職缺"], ["purchasing department", "採購部"], ["internal candidate", "內部人選"]]}, "ldbs": {"L": true, "D": true, "B": true, "S": true}, "gloss": [{"w": "vacancy", "hw": "vacancy", "pos": "n.", "zh": "職缺", "ex": "We have a vacancy in the sales team.", "ipa": "/ˈveɪkənsi/"}, {"w": "transferred", "hw": "transfer", "pos": "v.", "zh": "調職", "ex": "She transferred to the Boston office last year.", "ipa": "/trænsˈfɜr/"}, {"w": "internal candidate", "hw": "internal candidate", "pos": "phr.", "zh": "內部人選", "ex": "We interviewed one internal candidate for the job.", "ipa": "/ˌɪnˈtɜrnəl ˈkændədeɪt/"}], "en": {"point": ["<em>fill<\/em> a vacancy.", "fill a vacancy（補上職缺）。"], "why": ["The subject of <em>will be ______<\/em> is <em>The vacancy<\/em> at the start, not <em>office<\/em>. A vacancy is an empty job, so it gets filled <em>by an internal candidate<\/em>.", "will be ______ 的主詞是句首的 The vacancy，不是 office。職缺是空的，要被補上：filled by an internal candidate。"], "usage": [["<em>hold<\/em> a post or a position: someone keeps a job that is already theirs. <em>She holds the senior buyer position.<\/em>", "hold a post／position：擔任已經屬於自己的職位。"], null, ["<em>occupy<\/em> a room, a building or a position; people take up a space. <em>Three departments occupy the second floor.<\/em>", "occupy 房間、樓層或職位：占用空間。"], ["<em>assume<\/em> a role or a responsibility: take it on. <em>He assumed the role of team leader in May.<\/em>", "assume a role／responsibility：接下角色或責任。"]]}}, {"id": "v-collocation-12", "type": "vocab", "format": "gap", "unit": "collocation", "level": 1, "source": "hand", "reviewed": true, "v": 1, "stem": "Because the assistant store manager resigned at such short ______, the regional manager had to cover two of her shifts himself while the agency looked for a replacement.", "options": ["warning", "time", "alert", "notice"], "answer": 3, "explain": {"point": "搭配詞：at short notice（臨時才通知）", "why": "「臨時、事前沒什麼時間通知」固定說 at short notice；空格前的 at such short 已經鎖定 notice。", "wrong": ["意思接近，但不說 at short warning", "「時間很短」不說 at short time", "alert 是警報，不和 at short 搭配", null], "wrongMore": ["warning 和 notice 都有「事先告知」的意思，所以很像；但固定說法是 at short notice（美式也說 on short notice），warning 只說 without warning、with little warning。", null, null, null], "zh": "因為副店長這麼臨時才辭職，區經理在人力仲介找到接替人選之前，只好自己代了她兩個班。", "vocab": [["resign", "辭職"], ["cover a shift", "代班"], ["agency", "人力仲介公司"]]}, "ldbs": {"L": true, "D": false, "B": true, "S": false}, "gloss": [{"w": "resigned", "hw": "resign", "pos": "v.", "zh": "辭職", "ex": "He resigned to start his own firm.", "ipa": "/rɪˈzaɪn/"}, {"w": "shifts", "hw": "shift", "pos": "n.", "zh": "班次", "ex": "She works the night shift on Fridays.", "ipa": "/ʃɪft/"}, {"w": "agency", "hw": "agency", "pos": "n.", "zh": "人力仲介公司", "ex": "We hired a temp agency for the summer.", "ipa": "/ˈeɪdʒənsi/"}], "en": {"point": ["<em>at short notice<\/em>: with little warning.", "at short notice（臨時才通知）。"], "why": ["The fixed phrase is <em>at short notice<\/em>, meaning with very little time to prepare. <em>At such short<\/em> leads straight to <em>notice<\/em>.", "固定說法是 at short notice，指事前幾乎沒時間準備。at such short 後面直接接 notice。"], "usage": [["<em>warning<\/em> is a signal of possible trouble: <em>without warning<\/em>, <em>a warning sign<\/em>. <em>The storm came without warning.<\/em>", "warning 是可能有麻煩的預告：without warning、a warning sign。"], ["<em>time<\/em> is used in <em>on time<\/em>, <em>in time<\/em> and <em>at the same time<\/em>. <em>The bus arrived on time.<\/em>", "time 用在 on time、in time、at the same time。"], ["<em>alert<\/em> is a signal or message about danger or news. <em>The app sent an alert about the delay.<\/em>", "alert 是關於危險或消息的警示訊息。"], null]}}, {"id": "v-collocation-13", "type": "vocab", "format": "gap", "unit": "collocation", "level": 1, "source": "hand", "reviewed": true, "v": 1, "stem": "Given that the container ship carrying our order is still waiting to unload at a congested port overseas, it is ______ unlikely that the replacement parts will reach the workshop before the end of the month.", "options": ["highly", "strongly", "greatly", "heavily"], "answer": 0, "explain": {"point": "搭配詞：highly unlikely（非常不可能）", "why": "加強 likely／unlikely 的副詞用 highly；strongly、greatly、heavily 都不修飾 unlikely。", "wrong": [null, "strongly 搭動詞（strongly recommend），不搭 unlikely", "greatly 修飾動詞或比較級，不搭 unlikely", "heavily 搭 rely、invest，不搭 unlikely"], "wrongMore": [null, "strongly 和 highly 在 strongly／highly recommend 裡可以互換，所以容易以為這裡也行；但修飾 likely、unlikely 只說 highly（或 very、extremely）。", null, null], "zh": "載著我們訂貨的貨櫃輪還在海外一個壅塞的港口等著卸貨，所以替換零件要在月底前送到維修廠，可能性非常低。", "vocab": [["container ship", "貨櫃輪"], ["unload", "卸貨"], ["congested", "壅塞的"]]}, "ldbs": {"L": true, "D": false, "B": true, "S": false}, "gloss": [{"w": "container ship", "hw": "container ship", "pos": "phr.", "zh": "貨櫃輪", "ex": "The container ship reached the harbor on Monday.", "ipa": "/kənˈteɪnər ʃɪp/"}, {"w": "unload", "hw": "unload", "pos": "v.", "zh": "卸貨", "ex": "Workers unload the truck every morning.", "ipa": "/ənˈloʊd/"}, {"w": "congested", "hw": "congested", "pos": "adj.", "zh": "壅塞的", "ex": "The congested road delayed our delivery.", "ipa": "/kənˈdʒestəd/"}], "en": {"point": ["<em>highly<\/em> unlikely.", "highly unlikely（非常不可能）。"], "why": ["The blank comes before <em>unlikely<\/em>. The adverb that strengthens <em>likely<\/em> or <em>unlikely<\/em> is <em>highly<\/em>: <em>highly unlikely<\/em>.", "空格在 unlikely 前面。加強 likely／unlikely 的副詞是 highly：highly unlikely。"], "usage": [null, ["<em>strongly<\/em> goes with verbs of opinion or feeling: recommend, believe, disagree. <em>We strongly recommend booking early.<\/em>", "strongly 搭表示意見或感受的動詞：recommend、believe、disagree。"], ["<em>greatly<\/em> adds force to a verb or a comparison: <em>greatly improved<\/em>, <em>greatly reduced<\/em>. <em>Sales have greatly improved.<\/em>", "greatly 加強動詞或比較：greatly improved、greatly reduced。"], ["<em>heavily<\/em> goes with <em>rely<\/em>, <em>invest<\/em> and <em>depend<\/em>. <em>The firm relies heavily on one supplier.<\/em>", "heavily 搭 rely、invest、depend。"]]}}, {"id": "v-synonym-10", "type": "vocab", "format": "gap", "unit": "synonym", "level": 3, "source": "hand", "reviewed": true, "v": 1, "stem": "The revised security policy ______ all staff in the billing department, whether permanent or temporary, to keep copies of customers' card numbers on their own laptops or phones.", "options": ["prohibits", "prevents", "bans", "forbids"], "answer": 3, "explain": {"point": "forbid 人 to V；prohibit／ban 人 from Ving", "why": "四個都是「禁止」，差在結構：插入語 whether … temporary 之後是 to keep，只有 forbid 接「人＋to V」。", "wrong": ["prohibits all staff 局部通，但要接 from keeping", "prevent 人 要接 from Ving，不接 to V", "ban 人 要接 from Ving，不接 to V", null], "wrongMore": ["prohibit 和 forbid 意思幾乎一樣，prohibits all staff 也對；但 prohibit 的句型是 prohibit 人 from Ving，句尾的 to keep 只能配 forbid（forbid 人 to V／from Ving 都可以）。", null, null, null], "zh": "修訂後的資安規定禁止帳務部所有員工（不論正職或臨時）把客戶的卡號副本存在自己的筆電或手機上。", "vocab": [["billing department", "帳務部"], ["permanent", "正職的"], ["temporary", "臨時的"]]}, "ldbs": {"L": true, "D": true, "B": true, "S": true}, "gloss": [{"w": "billing department", "hw": "billing department", "pos": "phr.", "zh": "帳務部", "ex": "The billing department sends invoices on Fridays.", "ipa": "/ˈbɪlɪŋ dɪˈpɑːrtmənt/"}, {"w": "permanent", "hw": "permanent", "pos": "adj.", "zh": "正職的", "ex": "She became a permanent employee in June.", "ipa": "/ˈpɜrmənənt/"}, {"w": "temporary", "hw": "temporary", "pos": "adj.", "zh": "臨時的", "ex": "We hired temporary staff for the sale.", "ipa": "/ˈtempərˌeri/"}], "en": {"point": ["<em>forbid<\/em> someone <em>to<\/em> do something.", "forbid 人 to V。"], "why": ["All four mean roughly “not allow.” The difference is what follows the person. After <em>whether permanent or temporary<\/em> comes <em>to keep<\/em>, and only <em>forbid<\/em> takes someone + <em>to<\/em> do.", "四個都是「禁止」，差在人後面接什麼。whether permanent or temporary 之後是 to keep，只有 forbid 接「人＋to V」。"], "usage": [["<em>prohibit<\/em> someone <em>from<\/em> doing something. <em>The rules prohibit staff from eating at their desks.<\/em>", "prohibit 人 from Ving。"], ["<em>prevent<\/em> someone <em>from<\/em> doing something; it means stopping it from happening, not a rule. <em>The fence prevents visitors from entering the site.<\/em>", "prevent 人 from Ving；意思是阻止事情發生，不是規定。"], ["<em>ban<\/em> something, or <em>ban<\/em> someone <em>from<\/em> doing something. <em>The airline bans passengers from smoking on board.<\/em>", "ban 某事，或 ban 人 from Ving。"], null]}}, {"id": "v-synonym-11", "type": "vocab", "format": "gap", "unit": "synonym", "level": 3, "source": "hand", "reviewed": true, "v": 1, "stem": "Because several guests had mentioned nut allergies when they registered, the caterer ______ a platter of fresh seasonal fruit for the almond cake that had originally been planned as dessert.", "options": ["replaced", "substituted", "exchanged", "removed"], "answer": 1, "explain": {"point": "substitute A for B：用 A 取代 B", "why": "六個字後是 for the almond cake：新的（水果）在前、被換掉的（蛋糕）在 for 後，只有 substitute 是這個方向。", "wrong": ["replaced a platter 局部通，但要說 replace B with A", null, "exchange A for B 是交出 A 換回 B，方向反了", "remove 不接 for 表示「換成」"], "wrongMore": ["replace 是最直覺的「替換」，replaced a platter of fruit 單看也通；但 replace 的句型是 replace 舊的 with 新的（replaced the cake with fruit）；句中的 for the almond cake 只配 substitute。", null, "exchange 也接 for，所以看起來對；但 exchange A for B 是「交出 A、換回 B」，句子就變成外燴交出水果、換來杏仁蛋糕，跟堅果過敏的語境相反。", null], "zh": "因為好幾位來賓報名時提到自己對堅果過敏，外燴業者把原本預定當甜點的杏仁蛋糕換成了一盤新鮮的當季水果。", "vocab": [["allergy", "過敏"], ["caterer", "外燴業者"], ["platter", "大淺盤"]]}, "ldbs": {"L": true, "D": true, "B": true, "S": true}, "gloss": [{"w": "allergies", "hw": "allergy", "pos": "n.", "zh": "過敏", "ex": "He has an allergy to shellfish.", "ipa": "/ˈælərdʒi/"}, {"w": "caterer", "hw": "caterer", "pos": "n.", "zh": "外燴業者", "ex": "The caterer arrived two hours before the party.", "ipa": "/ˈkeɪtərər/"}, {"w": "platter", "hw": "platter", "pos": "n.", "zh": "大淺盤、拼盤", "ex": "She served a cheese platter at the reception.", "ipa": "/ˈplætər/"}], "en": {"point": ["<em>substitute<\/em> A <em>for<\/em> B.", "substitute A for B：用 A 取代 B。"], "why": ["The new item comes first and the old one after <em>for<\/em>: <em>a platter of fresh seasonal fruit for the almond cake<\/em>. Only <em>substituted<\/em> fits that pattern.", "新的在前、舊的在 for 後：a platter of fresh seasonal fruit for the almond cake。只有 substituted 符合這個句型。"], "usage": [["<em>replace<\/em> the old thing <em>with<\/em> the new one. <em>The hotel replaced its old carpets with wooden floors.<\/em>", "replace 舊的 with 新的。"], null, ["<em>exchange<\/em> A <em>for<\/em> B: give A and get B back, often in a shop. <em>She exchanged the shirt for a larger size.<\/em>", "exchange A for B：交出 A、換回 B，常見於商店。"], ["<em>remove<\/em> something from a place or a list; it does not say what takes its place. <em>Staff removed the old sign from the door.<\/em>", "remove 某物 from 某處；沒有說換成什麼。"]]}}, {"id": "v-synonym-12", "type": "vocab", "format": "gap", "unit": "synonym", "level": 2, "source": "hand", "reviewed": true, "v": 1, "stem": "The repairs that the roofing contractor carried out on the east warehouse after the March storms ______ the company nearly $8,000, almost twice the original estimate.", "options": ["charged", "spent", "cost", "paid"], "answer": 2, "explain": {"point": "事物 cost 人 金額；收錢的人 charge 人 金額", "why": "空格的主詞是句首的 The repairs，不是關係子句裡的 contractor；「某事花了某人多少錢」用 cost。", "wrong": ["charged the company 局部通，但主詞是 repairs", "spend 的主詞是花錢的人：spend money on", null, "pay 的主詞是付錢的人，修繕不會付錢"], "wrongMore": ["charged the company nearly $8,000 單看很順，關係子句裡也剛好有收錢的 the roofing contractor；但 charge 的主詞要是收錢的人，這句的主詞是句首的 The repairs，「修繕花了公司多少錢」只能用 cost。", null, null, null], "zh": "三月暴風雨過後，屋頂包商替東側倉庫做的修繕花了公司將近八千美元，幾乎是原本估價的兩倍。", "vocab": [["contractor", "承包商"], ["warehouse", "倉庫"], ["estimate", "估價"]]}, "ldbs": {"L": true, "D": true, "B": true, "S": true}, "gloss": [{"w": "roofing contractor", "hw": "roofing contractor", "pos": "phr.", "zh": "屋頂包商", "ex": "We hired a roofing contractor for the repairs.", "ipa": "/ˈruːfɪŋ ˈkɑːnˌtræktər/"}, {"w": "carried out", "hw": "carry out", "pos": "phr.", "zh": "執行、進行", "ex": "Staff carried out the survey in May.", "ipa": "/ˈkæri aʊt/"}, {"w": "estimate", "hw": "estimate", "pos": "n.", "zh": "估價", "ex": "The estimate was higher than we expected.", "ipa": "/ˈestəmət/"}], "en": {"point": ["A thing <em>costs<\/em> someone an amount.", "事物 cost 人 金額。"], "why": ["The subject of the blank is <em>The repairs<\/em>, not <em>contractor<\/em>. When something takes money from someone, the verb is <em>cost<\/em>: <em>cost the company nearly $8,000<\/em>.", "空格的主詞是 The repairs，不是 contractor。某事讓某人花掉多少錢，動詞用 cost：cost the company nearly $8,000。"], "usage": [["<em>charge<\/em> someone an amount: the seller asks for the money. <em>The plumber charged us $200 for the visit.<\/em>", "charge 人 金額：收錢的人開價。"], ["<em>spend<\/em> money <em>on<\/em> something; the subject is the person paying. <em>The firm spent $5,000 on new signs.<\/em>", "spend 錢 on 某事；主詞是花錢的人。"], null, ["<em>pay<\/em> someone, or pay for something; the subject is the person giving money. <em>The company paid the contractor last week.<\/em>", "pay 人，或 pay for 某物；主詞是付錢的人。"]]}}, {"id": "v-synonym-13", "type": "vocab", "format": "gap", "unit": "synonym", "level": 2, "source": "hand", "reviewed": true, "v": 1, "stem": "According to figures released by the bank, letting customers book branch appointments online has ______, within the first six months alone, in a sharp drop in the number of people waiting in line.", "options": ["resulted", "led", "caused", "produced"], "answer": 0, "explain": {"point": "result in（導致）；lead 接 to，cause 直接接受詞", "why": "拿掉插入語 within the first six months alone，空格後接的是 in a sharp drop；只有 result 接 in。", "wrong": [null, "has led 局部通，但 lead 要接 to", "cause 直接接受詞，中間不能有 in", "produce 直接接受詞，不接 in"], "wrongMore": [null, "lead to 和 result in 意思一樣，has led 後面先接插入語，看起來很自然；但拿掉插入語後是 has led in a sharp drop，lead 只能配 to。", "cause 也是「造成」，但它是及物動詞：has caused a sharp drop，中間不能多一個 in。", null], "zh": "根據銀行公布的數字，開放客戶線上預約分行服務後，光是前六個月，排隊的人數就大幅下降。", "vocab": [["figures", "數字、數據"], ["branch", "分行"], ["sharp drop", "大幅下降"]]}, "ldbs": {"L": true, "D": true, "B": true, "S": true}, "gloss": [{"w": "figures", "hw": "figure", "pos": "n.", "zh": "數字、數據", "ex": "Sales figures rose in the third quarter.", "ipa": "/ˈfɪɡjər/"}, {"w": "branch", "hw": "branch", "pos": "n.", "zh": "分行、分店", "ex": "The bank opened a branch downtown.", "ipa": "/bræntʃ/"}, {"w": "sharp drop", "hw": "sharp drop", "pos": "phr.", "zh": "大幅下降", "ex": "There was a sharp drop in orders.", "ipa": "/ʃɑːrp drɑːp/"}], "en": {"point": ["<em>result in<\/em> something.", "result in（導致）。"], "why": ["Take out <em>within the first six months alone<\/em>, and the blank is followed by <em>in a sharp drop<\/em>. Only <em>resulted<\/em> takes <em>in<\/em>: <em>has resulted in a sharp drop<\/em>.", "拿掉 within the first six months alone，空格後面是 in a sharp drop。只有 resulted 接 in：has resulted in a sharp drop。"], "usage": [null, ["<em>lead to<\/em> something; it takes <em>to<\/em>, not <em>in<\/em>. <em>The delay led to several complaints.<\/em>", "lead to 某事；接 to，不接 in。"], ["<em>cause<\/em> something directly, with no preposition. <em>The storm caused a power cut.<\/em>", "cause 直接接受詞，不加介系詞。"], ["<em>produce<\/em> something directly: make it or bring it about. <em>The new process produced fewer errors.<\/em>", "produce 直接接受詞：製造或帶來某結果。"]]}}, {"id": "v-business-09", "type": "vocab", "format": "gap", "unit": "business", "level": 2, "source": "hand", "reviewed": true, "v": 1, "stem": "Because the ______ on the firm's vehicle insurance policy is $1,000, the insurer paid only $600 of the $1,600 bill for repairing the delivery van that was damaged in a minor accident last month.", "options": ["premium", "surcharge", "rebate", "deductible"], "answer": 3, "explain": {"point": "deductible：理賠時自己先付的額度（自負額）", "why": "句尾：帳單 1,600、保險公司只付 600，差額 1,000 正是空格的金額，由公司自付，那是自負額。", "wrong": ["premium 是定期繳的保費，不決定這次賠多少", "surcharge 是額外加收的費用，不會讓理賠變少", "rebate 是退回的錢，不會讓理賠變少", null], "wrongMore": ["premium 和 deductible 都是保單上的金額，the premium on the policy 單看完全通；但保費是定期繳給保險公司的錢，跟這次理賠扣掉多少無關；1,600 − 600 = 1,000，扣掉的正好是自負額。", null, null, null], "zh": "因為公司車險保單的自負額是 1,000 美元，上個月在小擦撞中受損的送貨車修理費 1,600 美元，保險公司只付了 600 美元。", "vocab": [["insurer", "保險公司"], ["insurance policy", "保單"], ["minor accident", "小擦撞"]]}, "ldbs": {"L": true, "D": true, "B": false, "S": true}, "gloss": [{"w": "insurer", "hw": "insurer", "pos": "n.", "zh": "保險公司", "ex": "The insurer approved the claim in two days.", "ipa": "/ˌɪnˈʃʊrər/"}, {"w": "insurance policy", "hw": "insurance policy", "pos": "phr.", "zh": "保單", "ex": "Our insurance policy covers water damage.", "ipa": "/ˌɪnˈʃʊrəns ˈpɑːləsi/"}, {"w": "minor accident", "hw": "minor accident", "pos": "phr.", "zh": "小擦撞", "ex": "A minor accident delayed the delivery.", "ipa": "/ˈmaɪnər ˈæksədənt/"}], "en": {"point": ["<em>deductible<\/em>: the amount you pay first on a claim.", "deductible：理賠時自己先付的額度（自負額）。"], "why": ["The bill was <em>$1,600<\/em> and the insurer paid <em>only $600<\/em>. The missing $1,000 is what the company pays itself before cover starts: the <em>deductible<\/em>.", "帳單 1,600，保險公司只付了 600。差的 1,000 是公司在保險給付前自己先付的額度：deductible。"], "usage": [["<em>premium<\/em> is the regular payment for an insurance policy. <em>The company pays its insurance premium every month.<\/em>", "premium 是為保單定期繳的保費。"], ["<em>surcharge<\/em> is an extra fee added to a price. <em>The airline added a fuel surcharge.<\/em>", "surcharge 是加在價格上的額外費用。"], ["<em>rebate<\/em> is money paid back after you have paid. <em>Buyers get a $50 rebate on this printer.<\/em>", "rebate 是付款後退回的錢。"], null]}}, {"id": "v-business-10", "type": "vocab", "format": "gap", "unit": "business", "level": 2, "source": "hand", "reviewed": true, "v": 1, "stem": "Vendors who withdraw from the summer craft market after the stall assignments have been published will ______ their deposit, whereas those who withdraw before that date get the full amount back within ten days.", "options": ["reclaim", "forfeit", "refund", "redeem"], "answer": 1, "explain": {"point": "forfeit：因違反條件而失去（訂金）", "why": "whereas 後面說較早退出的人能全額拿回；對比之下，晚退出的人拿不回訂金：forfeit。", "wrong": ["reclaim 是拿回來，跟 whereas 的對比相反", null, "refund 是退錢給別人，主詞應是主辦單位", "redeem 是兌換禮券、點數，不用在訂金"], "wrongMore": ["will reclaim their deposit 單看很合理；但 whereas 表示對比，後半句說早退出的人 get the full amount back，前半句的晚退出者就是拿不回來。", null, "refund 常和 deposit 一起出現，但方向反了：refund 的主詞是退錢的一方（the organizers refund the deposit），攤商是付訂金的人。", null], "zh": "在攤位分配公布之後才退出夏季手作市集的攤商，訂金將不予退還；在那之前退出的人則會在十天內拿回全額。", "vocab": [["vendor", "攤商、廠商"], ["withdraw", "退出"], ["stall", "攤位"]]}, "ldbs": {"L": true, "D": true, "B": true, "S": true}, "gloss": [{"w": "Vendors", "hw": "vendor", "pos": "n.", "zh": "攤商、廠商", "ex": "Several vendors sell fresh bread at the fair.", "ipa": "/ˈvendər/"}, {"w": "withdraw", "hw": "withdraw", "pos": "v.", "zh": "退出", "ex": "She had to withdraw from the contest.", "ipa": "/wɪðˈdrɔː/"}, {"w": "stall", "hw": "stall", "pos": "n.", "zh": "攤位", "ex": "Each vendor rents a stall at the market.", "ipa": "/stɔːl/"}], "en": {"point": ["<em>forfeit<\/em>: lose something as a penalty.", "forfeit：因違反條件而失去。"], "why": ["<em>Whereas<\/em> sets two groups against each other. Vendors who withdraw early <em>get the full amount back<\/em>, so those who withdraw late lose the deposit: <em>forfeit<\/em>.", "whereas 把兩組人對比。早退出的人 get the full amount back，所以晚退出的人失去訂金：forfeit。"], "usage": [["<em>reclaim<\/em> something: collect or get back what is yours. <em>Passengers reclaim their luggage after landing.<\/em>", "reclaim：取回屬於自己的東西。"], null, ["<em>refund<\/em> money to someone; the one who received the payment gives it back. <em>The shop refunded the customer in full.<\/em>", "refund：收款的一方把錢退還給對方。"], ["<em>redeem<\/em> a voucher, coupon or points: exchange it for goods. <em>She redeemed the coupon at the checkout.<\/em>", "redeem 禮券、優惠券或點數：兌換成商品。"]]}}, {"id": "v-business-11", "type": "vocab", "format": "gap", "unit": "business", "level": 3, "source": "hand", "reviewed": true, "v": 1, "stem": "Until the March invoice from its packaging supplier has been paid in full, the company must keep that supplier on the list of ______ that the finance director reviews every Friday.", "options": ["debtors", "investors", "creditors", "auditors"], "answer": 2, "explain": {"point": "creditor：債權人（公司欠錢的對象）", "why": "句首說供應商開來的發票還沒付清，表示公司欠供應商錢，所以供應商是公司的 creditor。", "wrong": ["debtor 是欠公司錢的人，方向反了", "發票沒付清不會讓供應商變成投資人", null, "auditor 是查帳的人，跟欠款無關"], "wrongMore": ["debtors 和 creditors 常出現在同一份報表，list of debtors 單看也通；但發票是供應商開給公司的，未付清時欠錢的是公司，供應商是債權人（creditor），不是債務人（debtor）。", null, null, null], "zh": "在包裝供應商三月份的發票全額付清之前，公司都必須把這家供應商留在財務總監每週五檢查的債權人名單上。", "vocab": [["invoice", "發票、請款單"], ["in full", "全額"], ["finance director", "財務總監"]]}, "ldbs": {"L": true, "D": true, "B": true, "S": true}, "gloss": [{"w": "invoice", "hw": "invoice", "pos": "n.", "zh": "發票、請款單", "ex": "Please send the invoice by email.", "ipa": "/ˈɪnvɔɪs/"}, {"w": "in full", "hw": "in full", "pos": "phr.", "zh": "全額", "ex": "Please pay the invoice in full.", "ipa": "/ɪn fʊl/"}, {"w": "finance director", "hw": "finance director", "pos": "phr.", "zh": "財務總監", "ex": "The finance director approved the new budget.", "ipa": "/fəˈnæns dərˈektər/"}], "en": {"point": ["<em>creditor<\/em>: a person or firm the company owes.", "creditor：債權人（公司欠錢的對象）。"], "why": ["Until the invoice <em>has been paid in full<\/em>, the company still owes the supplier money. A business that is owed money is a <em>creditor<\/em>.", "發票 has been paid in full 之前，公司還欠供應商錢。被欠錢的一方是 creditor。"], "usage": [["<em>debtor<\/em> is a person or firm that owes money. <em>The bank listed three debtors who were late with payments.<\/em>", "debtor 是欠錢的人或公司。"], ["<em>investor<\/em> puts money into a company to earn a return. <em>Investors bought shares in the new firm.<\/em>", "investor 是投資公司以求回報的人。"], null, ["<em>auditor<\/em> checks a company's accounts. <em>The auditors will review our records in April.<\/em>", "auditor 是查核公司帳目的人。"]]}}, {"id": "v-family-09", "type": "vocab", "format": "gap", "unit": "family", "level": 2, "source": "hand", "reviewed": true, "v": 1, "stem": "According to the maintenance log, nearly all of last year's breakdowns on the packing line were ______, since each one was traced to a worn belt that should have been replaced months earlier.", "options": ["preventable", "preventive", "prevented", "preventing"], "answer": 0, "explain": {"point": "preventable（可預防的）≠ preventive（預防性的）", "why": "since 之後說每次故障都查到一條早該換的皮帶：故障真的發生了，但本來可以避免，所以是 preventable。", "wrong": [null, "preventive 是「用來預防的」，如 preventive maintenance", "were prevented 表示沒發生，與句尾矛盾", "were preventing 後面缺受詞"], "wrongMore": [null, "preventive 和 preventable 同字根同詞性，最容易混；preventive 修飾用來預防的東西（preventive maintenance），故障本身不會是「預防性的」。", "breakdowns were prevented 局部完全通；但句尾 each one was traced to a worn belt 表示每次故障都真的發生了，所以不是「被預防了」，而是「本來可以預防」。", null], "zh": "根據維修紀錄，去年包裝線的故障幾乎都是可以避免的，因為每一次都查到是一條幾個月前就該更換的磨損皮帶造成的。", "vocab": [["maintenance log", "維修紀錄"], ["packing line", "包裝線"], ["worn", "磨損的"]]}, "ldbs": {"L": true, "D": true, "B": true, "S": true}, "gloss": [{"w": "breakdowns", "hw": "breakdown", "pos": "n.", "zh": "故障", "ex": "A breakdown stopped the line for an hour.", "ipa": "/ˈbreɪkˌdaʊn/"}, {"w": "worn", "hw": "worn", "pos": "adj.", "zh": "磨損的", "ex": "The worn tires need to be replaced.", "ipa": "/wɔːrn/"}, {"w": "traced to", "hw": "trace to", "pos": "phr.", "zh": "追查出原因是", "ex": "The fault was traced to a loose cable.", "ipa": "/treɪs tuː/"}], "en": {"point": ["<em>preventable<\/em>: can be avoided.", "preventable（可預防的）。"], "why": ["Each breakdown <em>was traced to a worn belt that should have been replaced months earlier<\/em>. The breakdowns did happen, but they could have been avoided: <em>preventable<\/em>.", "每次故障都 was traced to a worn belt that should have been replaced months earlier。故障確實發生了，但本來可以避免：preventable。"], "usage": [null, ["<em>preventive<\/em> describes action taken to stop problems: <em>preventive maintenance<\/em>. <em>The plant schedules preventive checks every month.<\/em>", "preventive 形容用來預防問題的做法：preventive maintenance。"], ["<em>prevented<\/em> is the past of <em>prevent<\/em>: stopped before it happened. <em>Early checks prevented a longer shutdown.<\/em>", "prevented 是 prevent 的過去式：在事情發生前就阻止。"], ["<em>preventing<\/em> needs an object after it: <em>preventing accidents<\/em>. <em>Preventing delays is the supervisor's main job.<\/em>", "preventing 後面要接受詞：preventing accidents。"]]}}, {"id": "v-family-10", "type": "vocab", "format": "gap", "unit": "family", "level": 2, "source": "hand", "reviewed": true, "v": 1, "stem": "Because the old freight elevator in the north building has never been ______, staff who need to move heavy equipment between floors usually book the one in the south building instead.", "options": ["dependent", "depending", "depended", "dependable"], "answer": 3, "explain": {"point": "dependable（可靠的）≠ dependent（依賴的）", "why": "後半句說員工搬重物通常改訂南棟那台，表示北棟這台不可靠：dependable。", "wrong": ["dependent 是「依賴別人的」，要接 on", "has never been depending 不成句，缺 on 和受詞", "被動要說 been depended on，少了 on", null], "wrongMore": ["很多人把 dependent 當成「可依靠的」；其實它是「依賴（別人）的」，要說 dependent on sth。「可以依靠的」是 dependable；has never been dependent 後面沒有 on，意思也不完整。", null, null, null], "zh": "因為北棟那台舊貨梯一直都不可靠，需要在樓層間搬運重型設備的員工通常改訂南棟的那一台。", "vocab": [["freight elevator", "貨梯"], ["h <script>
"use strict";
// ================================================================ data
const DATA = JSON.parse(document.getElementById("bank").textContent);
const UNITS = DATA.units;                     // id -> {zh, group, en}
const GRAMMAR_URL = "https://claude.ai/artifact/1KZ2F1miJtZxSMpeZLknDQ";
const INTERVALS = [1, 3, 7, 14];              // review spacing in days per level (our own setting, not a research number)
const WEAK = 0.7;                             // chapters under this accuracy come up more often (our setting)
const SIZES = [13.5, 14.5, 15.5, 16.5, 18];
const L = "ABCD";
const PARTS = [["grammar", "Part One", "Grammar"], ["vocab", "Part Two", "Vocabulary"], ["listen", "Part Three", "Listening"]];
const CIRCLE = '<svg viewBox="0 0 48 40" aria-hidden="true"><path pathLength="1" d="M31 5C17 3 5 10 5 21c0 10 12 15 23 14 11-1 16-8 15-16C42 10 34 5 23 6"/></svg>';

let ITEMS = DATA.items.slice();               // hand-written items, plus Claude-added ones merged at load
let BY = {};
function index() { BY = Object.fromEntries(ITEMS.map(x => [x.id, x])); }
index();

// ================================================================ helpers
const $ = s => document.querySelector(s);
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function btn(cls, text, fn) { const b = el("button", cls, text); b.type = "button"; if (fn) b.onclick = fn; return b; }
function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
function wait(ms) { return new Promise(r => setTimeout(r, ms)); }
function day(d = new Date()) { const z = n => String(n).padStart(2, "0"); return d.getFullYear() + "-" + z(d.getMonth() + 1) + "-" + z(d.getDate()); }
function addDays(n) { const d = new Date(); d.setDate(d.getDate() + n); return day(d); }
function shortDay(s) { const d = new Date(s + "T00:00"); return d.toLocaleDateString("en-GB", { day: "numeric", month: "short" }); }
function fmtS(ms) { return ms == null ? "–" : Math.round(ms / 1000) + " s"; }
function pct(a, b) { return b ? Math.round(a / b * 100) + "%" : "–"; }
function toast(t) { const e = $("#toast"); e.textContent = t; e.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => e.hidden = true, 1800); }
function hash(s) { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function seeded(seed) { let a = seed; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function shuffle(a, rnd = Math.random) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function unitName(u) { return (UNITS[u] && (UNITS[u].en || UNITS[u].zh)) || u; }
function isGap(item) { return item.format === "gap"; }
function qKeys(item) { return isGap(item) || item.format === "qr" ? [item.id] : item.questions.map((_, i) => item.id + ":" + i); }
function qOf(key) { const [id, q] = key.split(":"); const item = BY[id]; if (!item) return null; return { item, qi: q == null ? 0 : Number(q) }; }
function unitOfKey(key) { const x = qOf(key); return x ? x.item.unit : ""; }
function qCount(x) { return x.format === "gap" || x.format === "qr" ? 1 : x.questions.length; }

// ================================================================ storage: db when this is the owner in claude.ai, else localStorage
const Store = {
  mode: "local", db: null, queue: {},
  lsGet(coll) { try { return JSON.parse(localStorage.getItem("toeic:" + coll) || "{}"); } catch { return {}; } },
  lsPut(coll, map) { try { localStorage.setItem("toeic:" + coll, JSON.stringify(map)); } catch {} },
  async init() {
    if (!window.claude?.use) return;
    try {
      const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
      if (db && user && await user.isOwner()) { this.db = db; this.mode = "db"; }
    } catch {}
  },
  async list(coll) {
    if (this.mode === "local") return this.lsGet(coll);
    const snap = await this.db.collection(coll).get();
    return Object.fromEntries(snap.docs.map(d => [d.id, d.data()]));
  },
  async getProfile() {
    if (this.mode === "local") return this.lsGet("profile").main || null;
    const s = await this.db.doc("toeic/profile").get();
    return s.exists ? s.data() : null;
  },
  put(coll, id, data) {           // one write at a time per document
    const key = coll + "/" + id;
    if (this.mode === "local") { const m = this.lsGet(coll); m[id] = data; this.lsPut(coll, m); return Promise.resolve(); }
    const prev = this.queue[key] || Promise.resolve();
    const path = coll === "profile" ? "toeic/profile" : coll + "/" + id;
    const p = prev.then(() => this.db.doc(path).set(JSON.parse(JSON.stringify(data)))).catch(e => {
      if (e && e.code === "quota_exceeded") toast("Your account storage is full; this wasn't saved.");
      else if (e && e.code === "unavailable") return wait(800 + Math.random() * 800).then(() => this.db.doc(path).set(data)).catch(() => toast("Couldn't save. Check your connection."));
      else toast("Couldn't save. Check your connection.");
    });
    this.queue[key] = p; return p;
  },
};
// collections (db paths are owner-only, see capabilities): toeic/profile, toeic_bank/<key>, toeic_attempts/<session>, toeic_marks/<itemId>, toeic_added/<itemId>

let P = null;    // profile
let B = {};      // review shelf, key -> entry
let M = {};      // marks, itemId -> {starred, note, flagged, flagNote, at}
function freshProfile() { return { settings: { pace: 0, listenSpeed: 1, strictListen: false, theme: "system", size: 1, sound: true }, totals: { n: 0, ok: 0, unsure: 0 }, units: {}, streak: { days: 0, lastDay: "" }, seen: {} }; }
function saveProfile() { return Store.put("profile", "main", P); }
function saveBank(key) { return Store.put("toeic_bank", key, B[key]); }
function saveMark(id) { M[id].at = Date.now(); return Store.put("toeic_marks", id, M[id]); }

async function load() {
  await Store.init();
  try {
    P = await Store.getProfile();
    B = await Store.list("toeic_bank");
    M = await Store.list("toeic_marks");
    const added = await Store.list("toeic_added");
    for (const [id, x] of Object.entries(added)) {
      if (x.retired || BY[id] || !x.type || !x.explain && !x.questions) continue;
      ITEMS.push({ ...x, id, source: x.source || "claude", reviewed: false });
    }
    index();
  } catch (e) {
    Store.mode = "local"; P = Store.lsGet("profile").main || null; B = Store.lsGet("toeic_bank"); M = Store.lsGet("toeic_marks");
  }
  P = Object.assign(freshProfile(), P || {});
  P.settings = Object.assign(freshProfile().settings, P.settings || {});
  P.totals.unsure = P.totals.unsure ?? P.totals.guess ?? 0;
  applyTheme();
  if (Store.mode === "db" && !Object.keys(B).length && !P.totals.n) {
    const lp = Store.lsGet("profile").main, lb = Store.lsGet("toeic_bank");
    if ((lp && lp.totals && lp.totals.n) || Object.keys(lb).length) importOffer = { lp, lb, lm: Store.lsGet("toeic_marks") };
  }
}
let importOffer = null;
async function doImport() {
  const { lp, lb, lm } = importOffer; importOffer = null;
  if (lp) { P = Object.assign(freshProfile(), lp); await saveProfile(); }
  for (const [k, v] of Object.entries(lb)) { B[k] = v; await saveBank(k); }
  for (const [k, v] of Object.entries(lm || {})) { M[k] = v; await saveMark(k); }
  toast("Imported."); home();
}
function applyTheme() {
  const t = P.settings.theme;
  if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  else document.documentElement.removeAttribute("data-theme");
}

// ================================================================ sound: one soft tone per answer
let actx = null;
function tone(ok) {
  if (!P.settings.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const t = actx.currentTime, g = actx.createGain(), o = actx.createOscillator();
    o.type = "sine"; o.frequency.value = ok ? 880 : 392;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(ok ? 0.07 : 0.05, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + (ok ? 0.45 : 0.25));
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t + 0.5);
  } catch {}
}

// ================================================================ audio: one element for the whole page
const au = new Audio(); au.preload = "auto";
let playTok = null, playDone = null;
function stopAudio() { playTok = null; au.pause(); if (playDone) { const d = playDone; playDone = null; d(false); } }
function playOne(src) {
  return new Promise(res => {
    playDone = res;
    au.onended = () => { playDone = null; res(true); };
    au.onerror = () => { playDone = null; res(false); };
    au.src = src; au.playbackRate = P.settings.listenSpeed;
    au.play().catch(() => { playDone = null; res(false); });
  });
}
async function playLines(item, idxs, gap, onLine) {
  stopAudio();
  const tok = playTok = {};
  let okAll = true;
  for (let n = 0; n < idxs.length; n++) {
    const i = idxs[n], ln = item.audio.lines[i];
    onLine && onLine(i);
    const ok = await playOne(item.audio.dir + "/" + ln.file);
    if (playTok !== tok) { onLine && onLine(-1); return null; }
    if (!ok) okAll = false;
    if (n < idxs.length - 1) { await wait(gap); if (playTok !== tok) { onLine && onLine(-1); return null; } }
  }
  playTok = null; onLine && onLine(-1);
  return okAll;
}

// ================================================================ views
let view = "home";
function show(v) {
  view = v; stopAudio(); clearInterval(paceTimer); $("#tip").hidden = true; window.scrollTo(0, 0);
  const app = $("#app"), ses = $("#session");
  app.textContent = ""; ses.textContent = "";
  const dk = $("#dock"); dk.hidden = true; dk.dataset.card = ""; $("#dkTools").textContent = ""; $("#dkPanel").textContent = ""; $("#dkNext").textContent = "";
  app.hidden = v === "session"; ses.hidden = v !== "session";
  return v === "session" ? ses : app;
}
function head(host, left, right) {

// ================================================================ building a session
let S = null;
function newSession(cards, label, opts = {}) {

// never seen first, then seen longest ago; weak chapters come up earlier; items on the review shelf wait for review
function pick(filter, n, countQs) {
  const pool = ITEMS.filter(x => filter(x) && !qKeys(x).every(activeBank));
  const scored = pool.map(x => {
    const seen = Math.max(0, ...qKeys(x).map(k => P.seen[k] || 0));
    const s = unitStat(x.unit), weak = s.n >= 3 && s.ok / s.n < WEAK;
    return { x, score: (seen ? 1 : 0) * 1e13 + seen - (weak ? 7 * 864e5 : 0) + Math.random() * 36e5 };
  }).sort((a, b) => a.score - b.score);
  const out = []; let count = 0;
  for (const { x } of scored) { if (count >= n) break; out.push(x); count += countQs ? qCount(x) : 1; }

}

  const items = pick(f, n, type === "listen" || (unit && UNITS[unit]?.group === "listen"));
  if (!items.length) { toast("Everything here is on your review shelf."); return; }
  newSession(shuffle(items).map(x => cardFor(x)), label);
}
function startMixed() {
  const g = pick(x => x.type === "grammar", 10), v = pick(x => x.type === "vocab", 6), l = pick(x => x.type === "listen", 4, true);
  const gv = shuffle(g.concat(v));

}
function startList(ids, label) { newSession(ids.filter(id => BY[id]).map(id => cardFor(BY[id])), label); }

  for (const k of keys) { const x = qOf(k); if (!x) continue; (byItem[x.item.id] = byItem[x.item.id] || []).push(x.qi); }
  newSession(shuffle(Object.entries(byItem).map(([id, qs]) => cardFor(BY[id], qs.sort()))), "Review", { review: true });

// Ask Claude: the strongest tier the viewer's plan allows; shown only when the page may use Claude

function askForm(item, ctx) {

}

  player.append(play, state, speed); left.append(player);
  if (item.graphic) left.append(graphicTable(item.graphic));
  state.textContent = qr ? "A question, then three responses." : "You can read the questions while you listen.";
  if (strict) state.textContent += " One play only.";
  let played = false, playing = false, answeredAll = false, qrButtons = [];
  const all = item.audio.lines.map((_, i) => i), qs = card.qs, done = {}, blocks = [];
  async function run() {
    if (playing) { stopAudio(); return; }
    if (strict && played && !answeredAll) return;
    playing = true; play.textContent = "■ Stop";
    const ok = await playLines(item, all, item.audio.gapMs || 600, i => {
      if (qr) qrButtons.forEach((b, k) => b.classList.toggle("now", i === k + 1));
      state.textContent = i < 0 ? "" : qr ? (i === 0 ? "Question" : "Response " + L[i - 1]) : "Line " + (i + 1) + " of " + all.length;
    });
    playing = false; play.textContent = "▸ Play again";
    if (ok === false) state.textContent = "Some audio didn't load. Try again.";
    else if (ok) state.textContent = "";
    if (ok !== null || !strict) { played = true; qrButtons.forEach(b => { if (!b.dataset.done) b.disabled = false; }); }
    if (strict && !answeredAll && ok !== false) play.disabled = true;
  }
  play.onclick = run;
  keys.replay = () => !play.disabled && run();
  for (const qi of qs) {
    const q = item.questions[qi], blk = el("div", qr ? "qr" : "");
    if (!qr) { const p = el("p", "lq"); p.append(el("span", "n", qs.length > 1 ? (qs.indexOf(qi) + 1) + "." : ""), q.q); blk.append(p); }
    const order = qr ? [0, 1, 2] : optionOrder(item, qi, S.id), ol = el("ol", "opts"), buttons = [];
    order.forEach((oi, pos) => {
      const li = el("li"), bt = btn("opt"); bt.innerHTML = `<span class="l">${L[pos]}</span>` + (qr ? "" : `<span class="w">${esc(q.options[oi])}</span>`);
      bt.dataset.oi = oi; bt.onclick = () => answerQ(oi); if (qr) bt.disabled = true; li.append(bt); ol.append(li); buttons.push(bt);
    });
    if (qr) qrButtons = buttons;
    const un = el("div", "unsure"), ub = btn(null, "I'm not sure", () => answerQ(-1)); un.append(ub);
    blk.append(ol, un); left.append(blk);
    blocks.push({ qi, buttons, ub });
    function answerQ(oi) {
      if (done[qi] != null) return;
      done[qi] = oi;
      const ok = oi === q.answer, unsure = oi < 0;
      markOptions(buttons, q.answer, oi); buttons.forEach(b => b.dataset.done = "1"); un.hidden = true;
      if (!unsure) tone(ok);
      record(item, qi, oi, ok, unsure, null, false);
      const box = notesFor(item, q, oi, order);
      if (qs.length > 1) box.prepend(el("p", "qn sc", "Question " + (qs.indexOf(qi) + 1)));
      const optText = i => qr ? item.audio.lines[i + 1].text : q.options[i];
      right.append(box);
      dockFor(item, { qi, chosenText: unsure ? null : optText(oi) });
      if (Object.keys(done).length === qs.length) finishListen();
    }
  }
  keys.answer = pos => { const nb = blocks.find(b => done[b.qi] == null); nb && nb.buttons[pos] && !nb.buttons[pos].disabled && nb.buttons[pos].click(); };
  keys.unsure = () => { const nb = blocks.find(b => done[b.qi] == null); nb && nb.ub.click(); };
  function finishListen() {
    answeredAll = true; play.disabled = false;
    const ev = new Set(qs.flatMap(qi => item.questions[qi].explain?.evidence || []));
    const wrap = el("div", "ann"); wrap.append(el("p", "qn sc", "Transcript"));
    const ul = el("ol", "script"), used = new Set();
    item.audio.lines.forEach((ln, i) => {
      const li = el("li", ev.has(i) ? "ev" : "");
      const t = el("span", "t"); t.innerHTML = glossify(ln.text, item.gloss, used);
      const z = el("span", "zh", (item.transcriptZh || [])[i] || ""); z.hidden = true; t.append(z);
      const rp = btn("rp", "▸"); rp.setAttribute("aria-label", "Play this line"); rp.onclick = () => playLines(item, [i], 0);
      li.append(el("span", "who sc", qr ? (i === 0 ? "Q" : L[i - 1]) : ln.who), t, rp); ul.append(li);
    });
    wrap.append(ul); right.append(wrap);
    nextLink();
  }
}
function graphicTable(g) {
  const box = el("div", "graphic"), t = el("table");
  if (g.caption) t.append(el("caption", null, g.caption));
  const hr = el("tr"); for (const h of g.head || []) hr.append(el("th", null, h)); const th = el("thead"); th.append(hr); t.append(th);
  const tb = el("tbody"); for (const r of g.rows || []) { const tr = el("tr"); for (const c of r) tr.append(el("td", null, c)); tb.append(tr); } t.append(tb);
  box.append(t); return box;
}

// ================================================================ recording an answer (chosen -1 = "I'm not sure")
function record(item, qi, chosen, ok, unsure, ms, timedOut) {
  const key = qKeys(item)[isGap(item) || item.format === "qr" ? 0 : qi];
  const res = { key, id: item.id, qi, unit: item.unit, type: item.type, chosen, ok, unsure, ms, timedOut, v: item.v || 1, source: item.source };
  S.results.push(res);
  P.seen[key] = Date.now();
  const u = P.units[item.unit] = unitStat(item.unit); P.units[item.unit] = u;
  u.n++; if (ok) u.ok++; if (unsure) u.unsure++; if (ms != null) { u.msSum += ms; u.msN++; }
  P.totals.n++; if (ok) P.totals.ok++; if (unsure) P.totals.unsure++;
  const now = Date.now(), e = B[key];
  const hist = { at: now, ok, chosen, unsure };
  if (e && !e.graduatedAt && !e.removedAt) {
    if (ok) { if (e.level >= 3) { e.graduatedAt = now; res.graduated = true; } else { e.level++; e.due = addDays(INTERVALS[e.level]); } }
    else { e.level = 0; e.due = addDays(INTERVALS[0]); if (!unsure) e.wrongCount = (e.wrongCount || 0) + 1; res.banked = true; }
    e.lastAt = now; e.v = res.v; e.history = (e.history || []).concat(hist).slice(-10);
    res.review = true; saveBank(key);
  } else if (!ok) {
    B[key] = { reason: unsure ? "unsure" : "wrong", level: 0, due: addDays(INTERVALS[0]), wrongCount: unsure ? 0 : 1, enteredAt: now, lastAt: now, v: res.v, history: [hist] };
    res.banked = true; saveBank(key);
  }
  saveSession();
  if (S.results.length % 5 === 0) saveAttempt(false);
  return res;
}
function saveAttempt(final) {
  const r = S.results;
  return Store.put("toeic_attempts", S.id, { startedAt: S.startedAt, endedAt: final ? Date.now() : null, mode: S.label, items: r.map(x => ({ id: x.key, ok: x.ok, chosen: x.chosen, unsure: !!x.unsure, ms: x.ms == null ? null : Math.round(x.ms), timedOut: x.timedOut, v: x.v })), summary: { n: r.length, ok: r.filter(x => x.ok).length } });
}
function nextLink() {
  const b = btn(null, S.i + 1 < S.cards.length ? "Next →" : "Finish →", () => { S.i++; saveSession(); runCard(); });
  $("#dkNext").textContent = ""; $("#dkNext").append(b);
  keys.next = () => b.click();
}

// ================================================================ end of a set
function summary() {
  const app = show("summary");
  clearSession();
  const r = S.results, t = day();
  if (P.streak.lastDay !== t) { P.streak.days = P.streak.lastDay === addDays(-1) ? P.streak.days + 1 : 1; P.streak.lastDay = t; }
  saveProfile(); saveAttempt(true);
  head(app, backTo("Contents", home));
  app.append(el("h1", "small", S.label));
  const ok = r.filter(x => x.ok).length, sc = el("p", "score"); sc.append(ok + " of " + r.length, el("small", null, Math.max(1, Math.round((Date.now() - S.startedAt) / 60000)) + " min"));
  app.append(sc);
  const wrong = r.filter(x => !x.ok && !x.unsure), unsure = r.filter(x => x.unsure);
  if (wrong.length) { app.append(sectionH("Wrong")); app.append(resultList(wrong)); }
  if (unsure.length) { app.append(sectionH("Not sure")); app.append(resultList(unsure)); }
  const again = wrong.concat(unsure), p = el("p", "note");
  if (again.length) p.append(btn("link", "Practise these again", () => { const cards = {}; for (const x of again) (cards[x.id] = cards[x.id] || []).push(x.qi); newSession(Object.entries(cards).map(([id, qs]) => cardFor(BY[id], qs)), "Again"); }), "  ·  ");
  p.append(btn("link", "Contents", home)); app.append(p);
}
function sectionH(t) { const h = el("h3"); h.append(el("span", "sc", t)); return h; }
function resultList(rs) { const ul = el("ul", "list"); for (const x of rs) { const item = BY[x.id]; if (item) ul.append(itemRow(item, x.qi, { chosen: x.chosen, meta: unitName(item.unit) })); } return ul; }
function stemText(item, qi) {
  if (isGap(item)) return item.stem.replace("______", item.options[item.answer]);
  if (item.format === "qr") return item.audio.lines[0].text;
  return item.questions[qi].q;
}
function itemRow(item, qi, { chosen, meta, bankKey }) {
  const li = el("li"), hd = btn("hd"), body = el("div", "body"); body.hidden = true;
  hd.append(el("span", "s", stemText(item, qi)), el("span", "m", meta || ""));
  hd.onclick = () => { body.hidden = !body.hidden; if (!body.hidden && !body.childNodes.length) fillRow(body, item, qi, chosen, bankKey); };
  li.append(hd, body); return li;
}
function fillRow(body, item, qi, chosen, bankKey) {
  tipItem = item;
  const q = isGap(item) ? null : item.questions[qi];
  if (!isGap(item)) {
    const ans = item.format === "qr" ? item.audio.lines[q.answer + 1].text : q.options[q.answer];
    const p = el("p", "quiet"); p.innerHTML = `<em>${esc(ans)}</em>`; body.append(p);
  }
  const box = notesFor(item, q, chosen ?? -1, isGap(item) ? optionOrder(item, 0) : [0, 1, 2, 3]);
  box.append(footFor(item, box, { qi, chosenText: null }));
  body.append(box);
  const n = el("div", "notes"), ta = el("textarea"); ta.id = "note-" + item.id + "-" + qi; ta.placeholder = "Your notes"; ta.value = (M[item.id] || {}).note || "";
  let t = null; ta.oninput = () => { clearTimeout(t); t = setTimeout(() => { M[item.id] = Object.assign(M[item.id] || {}, { note: ta.value }); saveMark(item.id); }, 1000); };
  n.append(ta); body.append(n);
  if (bankKey && activeBank(bankKey)) body.append(btn("link small", "Take off the shelf", ev => { B[bankKey].removedAt = Date.now(); saveBank(bankKey); ev.target.replaceWith(el("span", "small faint", "Taken off. It's still under All.")); }));
}

// ================================================================ review shelf
let bankFilter = "due", bankGroup = "unit", bankQuery = "";
function bankView() {
  const app = show("bank");
  head(app, backTo("Contents", home));
  app.append(el("h1", "small", "Review shelf"));
  const tabs = el("div", "tabs sc");
  for (const [k, t] of [["due", "Due"], ["all", "All"], ["unsure", "Not sure"], ["grad", "Learned"]]) { const c = btn(null, t, () => { bankFilter = k; bankView(); }); c.setAttribute("aria-pressed", String(bankFilter === k)); tabs.append(c); }
  const by = el("span", "faint"); by.style.marginLeft = "auto"; by.append("by ");
  for (const [k, t] of [["unit", "chapter"], ["date", "date"]]) { const c = btn(null, t, () => { bankGroup = k; bankView(); }); c.setAttribute("aria-pressed", String(bankGroup === k)); by.append(c, " "); }
  tabs.append(by); app.append(tabs);
  const s = el("input", "search"); s.type = "search"; s.id = "bank-search"; s.placeholder = "Search questions, notes, chapters"; s.value = bankQuery;
  const host = el("div"); app.append(s, host);
  const render = () => {
    host.textContent = "";
    const t = day(), q = bankQuery.toLowerCase();
    let ks = Object.keys(B).filter(k => qOf(k)).filter(k => { const e = B[k];
      if (bankFilter === "due") return !e.graduatedAt && !e.removedAt && e.due <= t;
      if (bankFilter === "unsure") return !e.graduatedAt && !e.removedAt && (e.reason === "unsure" || e.reason === "guess");
      if (bankFilter === "grad") return !!e.graduatedAt;
      return true; });
    if (q) ks = ks.filter(k => { const { item, qi } = qOf(k); return (stemText(item, qi) + " " + ((M[item.id] || {}).note || "") + " " + unitName(item.unit)).toLowerCase().includes(q); });
    if (!ks.length) { host.append(el("p", "empty", bankFilter === "due" ? "Nothing due today." : "Nothing here.")); return; }
    if (bankFilter === "due") { const p = el("p", "note"); p.append(btn("link", "Review these " + ks.length, () => startReview(ks))); host.append(p); }
    const rowFor = k => { const { item, qi } = qOf(k), e = B[k];
      const meta = e.graduatedAt ? "learned" : e.removedAt ? "off the shelf" : "next " + shortDay(e.due);
      return itemRow(item, qi, { meta: bankGroup === "date" ? unitName(item.unit) + " · " + meta : meta, bankKey: k, chosen: -1 }); };
    if (bankGroup === "date") { const ul = el("ul", "list"); ks.sort((a, b) => B[b].enteredAt - B[a].enteredAt).forEach(k => ul.append(rowFor(k))); host.append(ul); }
    else {
      const groups = {}; for (const k of ks) (groups[unitOfKey(k)] = groups[unitOfKey(k)] || []).push(k);
      for (const [u, g] of Object.entries(groups).sort((a, b) => b[1].length - a[1].length)) {
        host.append(el("p", "grp", unitName(u) + " · " + g.length));
        const ul = el("ul", "list"); g.forEach(k => ul.append(rowFor(k))); host.append(ul);
      }
    }
  };
  s.oninput = () => { bankQuery = s.value; render(); };
  render();
}

// ================================================================ statistics
function statsView() {
  const app = show("stats");
  head(app, backTo("Contents", home));
  app.append(el("h1", "small", "Statistics"));
  const t = P.totals, sc = el("p", "score"); sc.append(pct(t.ok, t.n), el("small", null, "right of " + t.n + " answered"));
  app.append(sc);
  const line = [];
  if (t.unsure) line.push(t.unsure + " marked not sure");
  if (P.streak.days) line.push(P.streak.days + (P.streak.days > 1 ? " days" : " day") + " in a row");
  if (line.length) app.append(el("p", "quiet small", line.join(" · ")));
  for (const [g, part, title] of PARTS) {
    const us = unitsIn(g); if (!us.length) continue;
    app.append(sectionH(title));
    const w = el("div", "tblwrap"), table = el("table", "stat");
    table.innerHTML = "<thead><tr><th>Chapter</th><th>Answered</th><th>Right</th><th>Not sure</th><th>Avg</th></tr></thead>";
    const body = el("tbody");
    for (const u of us) { const s = unitStat(u), tr = el("tr"); tr.append(el("td", null, unitName(u)), el("td", null, String(s.n)), el("td", null, pct(s.ok, s.n)), el("td", null, String(s.unsure)), el("td", null, s.msN ? fmtS(s.msSum / s.msN) : "–")); body.append(tr); }
    table.append(body); w.append(table); app.append(w);
  }
}

// ================================================================ settings
function settingsView() {
  const app = show("settings");
  head(app, backTo("Contents", home));
  app.append(el("h1", "small", "Settings"));
  const box = el("div"); box.style.marginTop = "1.2em";
  const set = (label, desc, control) => { const d = el("div", "set"), l = el("label", null, label); if (control.id) l.htmlFor = control.id; d.append(l, control); if (desc) d.append(el("p", null, desc)); box.append(d); };
  const pace = el("select"); pace.id = "set-pace";
  for (const [v, t] of [[0, "Off"], [20, "20 s"], [30, "30 s"], [45, "45 s"]]) { const o = el("option", null, t); o.value = v; if (P.settings.pace === v) o.selected = true; pace.append(o); }
  pace.onchange = () => { P.settings.pace = Number(pace.value); saveProfile(); };
  set("Pace line", "A thin line under grammar and vocabulary questions that runs out after this many seconds. Nothing happens when it does.", pace);
  const strict = el("input"); strict.type = "checkbox"; strict.id = "set-strict"; strict.checked = P.settings.strictListen;
  strict.onchange = () => { P.settings.strictListen = strict.checked; saveProfile(); };
  set("One play only", "Listening audio plays once, as in the test. You can replay it after answering.", strict);
  const snd = el("input"); snd.type = "checkbox"; snd.id = "set-sound"; snd.checked = P.settings.sound;
  snd.onchange = () => { P.settings.sound = snd.checked; saveProfile(); };
  set("Answer sound", null, snd);
  const theme = el("select"); theme.id = "set-theme";
  for (const [v, t] of [["system", "System"], ["light", "Light"], ["dark", "Dark"]]) { const o = el("option", null, t); o.value = v; if (P.settings.theme === v) o.selected = true; theme.append(o); }
  theme.onchange = () => { P.settings.theme = theme.value; applyTheme(); saveProfile(); };
  set("Appearance", null, theme);
  app.append(box);
  const info = el("div", "small quiet"); info.style.marginTop = "2em";
  info.append(el("p", null, "Saved " + (Store.mode === "db" ? "to your claude.ai account, so your phone and computer share it." : "in this browser only.")),
    el("p", null, "Every question is original, not from a past test: " + DATA.items.length + " in all. The listening voices are synthetic American and British speakers; the real test also uses Australian and Canadian accents."),
    el("p", null, "Keys on a computer: 1–4 or A–D to answer, N for not sure, Enter for next, R to replay, S to star."));
  app.append(info);
}

// ================================================================ keyboard (desktop)
const keys = {};
document.addEventListener("keydown", e => {
  if (view !== "session" || e.target.closest("textarea,input,select") || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  const pos = "1234".indexOf(k) >= 0 ? "1234".indexOf(k) : "abcd".indexOf(k);
  if (pos >= 0 && keys.answer) { keys.answer(pos); e.preventDefault(); }
  else if (k === "enter" && keys.next) { keys.next(); e.preventDefault(); }
  else if (k === "n" && keys.unsure) keys.unsure();
  else if (k === "r" && keys.replay) keys.replay();
  else if (k === "s" && keys.star) keys.star();
});

// ================================================================ start
(async () => {
  $("#app").append(el("p", "empty", "Loading…"));
  await load();
  home();
  if (window.claude?.use) claude.use("sample").then(s => { sample = s || null; }).catch(() => {});
})();
</script>

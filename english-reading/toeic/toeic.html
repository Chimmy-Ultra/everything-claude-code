// ================================================================ ask Claude (only on a tap; marked as unreviewed)
let sample = null;
function askBox(item, ctx) {
  const box = el("div", "ask"), ta = el("textarea"); ta.id = "ask-" + item.id + "-" + (ctx.qi || 0);
  ta.placeholder = "還想問什麼？例如：為什麼 C 不行？";
  const out = el("div", "ans"); out.hidden = true;
  const note = el("span", "badge claude", "Claude 即時回答・未審核");
  const go = btn("btn primary sm", "問", async () => {
    const q = ta.value.trim(); if (!q) return;
    go.disabled = true; out.hidden = false; out.textContent = "思考中…";
    const prompt = [
      "你是多益老師。學生剛做完一題，想問一個問題。用繁體中文（台灣用語）回答，三句以內，只回答他問的事，不要推翻下面的標準答案；如果你認為標準答案有問題，只說「這題可能有爭議，建議按『有問題』回報」並說明原因。",
      "題目資料：" + JSON.stringify(ctx.qi != null && !isGap(item) ? { transcript: item.audio.lines.map(l => l.who + ": " + l.text), question: item.questions[ctx.qi] } : { stem: item.stem, options: item.options, answer: item.options[item.answer], explain: item.explain }),
      "學生選的是：" + (ctx.chosenText || (ctx.chosen != null && item.options ? item.options[ctx.chosen] : "（未記錄）")),
      "學生的問題：" + q,
    ].join("\n");
    try {
      await sample(prompt, { modelTier: "quick", cache: false, onText: ({ text }) => { out.textContent = text; } });
    } catch (e) {
      out.textContent = e && e.text ? e.text : (e && e.code === "rate_limited" ? "Claude 現在比較忙，等一下再問。" : e && (e.code === "not_granted" || e.code === "sampling_disabled") ? "這個頁面沒有被允許使用 Claude。" : "這次沒有問到，再試一次。");
      if (e && (e.code === "not_granted" || e.code === "sampling_disabled")) sample = null;
    }
    go.disabled = false;
  });
  const r = el("div", "row"); r.append(note, el("span", "sp"), go);
  box.append(ta, r, out);
  setTimeout(() => ta.focus(), 0);
  return box;
}

// ================================================================ listening card
function listenCard(app, item, card) {
  const strict = P.settings.strictListen;
  const player = el("div", "player"), play = btn("play"); play.innerHTML = PLAY; play.setAttribute("aria-label", "播放");
  const state = el("div", "state");
  const speed = el("div", "speed");
  for (const v of [0.85, 1, 1.15]) { const b = btn(null, v + "×"); b.setAttribute("aria-pressed", String(P.settings.listenSpeed === v)); b.onclick = () => { P.settings.listenSpeed = v; au.playbackRate = v; saveProfile(); speed.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x === b))); }; speed.append(b); }
  player.append(play, state, speed);
  app.append(player);
  const qr = item.format === "qr";
  let played = false, playing = false, answeredAll = false;
  state.textContent = qr ? "按播放，聽一句話和三個回應。" : "按播放。題目和選項可以邊聽邊看。";
  if (strict) state.textContent += " 嚴格模式：只能播一次。";
  const all = item.audio.lines.map((_, i) => i);
  const qs = card.qs, done = {};
  const blocks = [];
  let qrButtons = [];
  async function run() {
    if (playing) { stopAudio(); return; }
    if (strict && played && !answeredAll) return;
    playing = true; play.innerHTML = STOP; play.setAttribute("aria-label", "停止");
    const ok = await playLines(item, all, item.audio.gapMs || 600, i => {
      if (qr) qrButtons.forEach((b, k) => b.classList.toggle("now", i === k + 1));
      state.textContent = i < 0 ? "" : qr ? (i === 0 ? "問句" : "回應 " + L[i - 1]) : "第 " + (i + 1) + " / " + all.length + " 句";
    });
    playing = false; play.innerHTML = PLAY; play.setAttribute("aria-label", "重播");
    if (ok === false) state.textContent = "有音檔沒有載入。可以再按一次播放。";
    else if (ok) state.textContent = strict && !answeredAll ? "播完了，請作答。" : "播完了，可以重播。";
    if (ok !== null || !strict) { played = true; qrButtons.forEach(b => { if (!b.dataset.done) b.disabled = false; }); }
    if (strict && !answeredAll && ok !== false) { play.disabled = true; }
  }
  play.onclick = run;
  keys.replay = () => !play.disabled && run();
  const t0 = performance.now();
  for (const qi of qs) {
    const q = item.questions[qi], blk = el("div");
    if (!qr) { const p = el("p", "lq en"); p.append(el("span", "n", (qs.length > 1 ? (qs.indexOf(qi) + 1) + "." : "")), q.q); blk.append(p); }
    const g = guessToggle(); blk.append(g.el);
    const opts = el("div", "opts" + (qr ? " qr-opts" : "")), buttons = [];
    const order = qr ? [0, 1, 2] : optionOrder(item, qi, S.id);
    order.forEach((oi, pos) => {
      const b = btn("opt"); b.append(el("span", "l", L[pos])); if (!qr) b.append(el("span", "en", q.options[oi]));
      b.dataset.oi = oi; b.onclick = () => answerQ(oi); if (qr) b.disabled = true; opts.append(b); buttons.push(b);
    });
    if (qr) qrButtons = buttons;
    blk.append(opts);
    const after = el("div"); blk.append(after);
    blocks.push({ qi, buttons, g });
    app.append(blk);
    function answerQ(oi) {
      if (done[qi] != null) return;
      done[qi] = oi;
      const ok = oi === q.answer, guess = g.value();
      for (const b of buttons) { b.disabled = true; b.dataset.done = "1"; const x = Number(b.dataset.oi); b.classList.remove("now"); b.classList.add(x === q.answer ? "right" : x === oi ? "wrong" : "dim"); }
      g.el.remove();
      const rec = record(item, qi, oi, ok, guess, null, false);
      const letterOf = i => L[order.indexOf(i)];
      const box = el("div", "exp");
      const top = el("div"); top.append(el("span", "k", "考點 · " + unitName(item.unit)), zh(el("p", "rule", q.explain.point)));
      const optText = i => qr ? item.audio.lines[i + 1].text : q.options[i];
      const why = el("div"); why.append(el("span", "k", "為什麼是 (" + letterOf(q.answer) + ")" + (qr ? "" : " " + q.options[q.answer])), zh(el("p", null, q.explain.why)));
      const others = el("div"); others.append(el("span", "k", "其他選項"), wrongList([...Array(order.length).keys()].map(optText), q.explain.wrong, q.answer, oi, letterOf));
      box.append(top, why, others, moreRow(item, box, { qi, vocab: q.explain.vocab, chosenText: optText(oi) }));
      after.append(resultLine(item, ok, null, rec), box);
      if (Object.keys(done).length === qs.length) finishListen();
      else keys.answer = pos => { const nb = blocks.find(b => done[b.qi] == null); nb && nb.buttons[pos] && !nb.buttons[pos].disabled && nb.buttons[pos].click(); };
    }
  }
  keys.answer = pos => { const nb = blocks.find(b => done[b.qi] == null); nb && nb.buttons[pos] && !nb.buttons[pos].disabled && nb.buttons[pos].click(); };
  keys.guess = () => { const nb = blocks.find(b => done[b.qi] == null); nb && nb.g.toggle(); };
  const tail = el("div"); app.append(tail);
  function finishListen() {
    answeredAll = true; play.disabled = false;
    const ev = new Set(qs.flatMap(qi => item.questions[qi].explain.evidence || []));
    const h = el("div", "row"); h.style.margin = "18px 0 8px";
    const zb = btn("btn sm ghost", "顯示中文 ▾");
    h.append(el("b", null, "逐字稿"), el("span", "sp"), zb);
    const ul = el("ul", "script");
    item.audio.lines.forEach((ln, i) => {
      const li = el("li", ev.has(i) ? "ev" : "");
      const t = el("div", "t en"); t.append(ln.text); const z = zh(el("small", null, (item.transcriptZh || [])[i] || "")); z.hidden = true; t.append(z);
      const lab = qr ? (i === 0 ? "Q" : L[i - 1]) : ln.who;
      const mb = btn("mini"); mb.innerHTML = PLAY; mb.setAttribute("aria-label", "重播這一句"); mb.onclick = () => playLines(item, [i], 0);
      li.append(el("span", "who", lab), t, mb); ul.append(li);
    });
    zb.onclick = () => { const on = zb.textContent.includes("▾"); ul.querySelectorAll("small").forEach(s => s.hidden = !on); zb.textContent = on ? "隱藏中文 ▴" : "顯示中文 ▾"; };
    tail.append(h, ul);
    if (ev.size) tail.append(el("p", "small muted", "黃底的句子是答案的根據。"));
    nextButton(tail);
  }
}

// ================================================================ recording an answer
function record(item, qi, chosen, ok, guess, ms, timedOut) {
  const key = qKeys(item)[isGap(item) || item.format === "qr" ? 0 : qi];
  const res = { key, id: item.id, qi, unit: item.unit, type: item.type, chosen, ok, guess, ms, timedOut, v: item.v || 1, source: item.source };
  S.results.push(res);
  P.seen[key] = Date.now();
  const u = P.units[item.unit] = P.units[item.unit] || { n: 0, ok: 0, guess: 0, msSum: 0, msN: 0 };
  u.n++; if (ok) u.ok++; if (ok && guess) u.guess++; if (ms != null) { u.msSum += ms; u.msN++; }
  P.totals.n++; if (ok) P.totals.ok++; if (ok && guess) P.totals.guess++;
  // wrong bank
  const now = Date.now(), e = B[key], solid = ok && !guess;
  const hist = { at: now, ok, chosen, guess };
  if (e && !e.graduatedAt && !e.removedAt) {
    if (solid) { if (e.level >= 3) { e.graduatedAt = now; res.graduated = true; } else { e.level++; e.due = addDays(INTERVALS[e.level]); } }
    else { e.level = 0; e.due = addDays(INTERVALS[0]); if (!ok) e.wrongCount = (e.wrongCount || 0) + 1; res.banked = true; }
    e.lastAt = now; e.v = res.v; e.history = (e.history || []).concat(hist).slice(-10);
    res.review = true; saveBank(key);
  } else if (!ok || guess) {          // wrong, or right but guessed; right on time or late but sure stays out
    B[key] = { reason: ok ? "guess" : "wrong", level: 0, due: addDays(INTERVALS[0]), wrongCount: ok ? 0 : 1, enteredAt: now, lastAt: now, v: res.v, history: [hist] };
    res.banked = true; saveBank(key);
  }
  saveSession();
  if (S.results.length % 5 === 0) saveAttempt(false);
  return res;
}
function saveAttempt(final) {
  const r = S.results;
  return Store.put("toeic_attempts", S.id, { startedAt: S.startedAt, endedAt: final ? Date.now() : null, mode: S.label, items: r.map(x => ({ id: x.key, ok: x.ok, chosen: x.chosen, guess: x.guess, ms: x.ms == null ? null : Math.round(x.ms), timedOut: x.timedOut, v: x.v })), summary: { n: r.length, ok: r.filter(x => x.ok).length } });
}

function nextButton(host) {
  const nb = el("div", "nextbar");
  const b = btn("btn primary", S.i + 1 < S.cards.length ? "下一題 →" : "看總結 →", () => { S.i++; saveSession(); runCard(); });
  nb.append(b); host.append(nb);
  keys.next = () => b.click();
  setTimeout(() => b.scrollIntoView({ block: "nearest", behavior: "smooth" }), 50);
}

// ================================================================ summary
function summary() {
  show("summary");
  clearSession();
  const r = S.results;
  const t = day();
  if (P.streak.lastDay !== t) { P.streak.days = P.streak.lastDay === addDays(-1) ? P.streak.days + 1 : 1; P.streak.lastDay = t; }
  saveProfile(); saveAttempt(true);
  bar(back("首頁", home), S.label, null);
  const app = $("#app");
  const ok = r.filter(x => x.ok).length;
  const sc = el("div", "score"); sc.append(el("b", null, ok + " / " + r.length), el("span", null, "用時 " + Math.max(1, Math.round((Date.now() - S.startedAt) / 60000)) + " 分鐘"));
  app.append(sc);
  const avg = type => { const xs = r.filter(x => x.type === type && x.ms != null); return xs.length ? fmtS(xs.reduce((s, x) => s + x.ms, 0) / xs.length) : null; };
  const line = [["文法", avg("grammar")], ["字彙", avg("vocab")]].filter(x => x[1]).map(x => x[0] + "平均 " + x[1]).join(" · ");
  if (line) app.append(el("p", "muted small", line));
  const banked = r.filter(x => x.banked && !x.review).length, timed = r.filter(x => x.timedOut).length;
  const notes = [];
  if (banked) notes.push("已加入錯題庫 " + banked + " 題");
  if (timed) notes.push("超過自訂節奏 " + timed + " 題");
  if (notes.length) app.append(el("p", "small", notes.join(" · ")));

  const wrong = r.filter(x => !x.ok), guessed = r.filter(x => x.ok && x.guess);
  if (wrong.length) { app.append(el("h2", null, "錯的題")); app.append(resultList(wrong)); }
  if (guessed.length) { app.append(el("h2", null, "猜對的題")); app.append(resultList(guessed)); }

  const byUnit = {};
  for (const x of r) { const u = byUnit[x.unit] = byUnit[x.unit] || [0, 0]; u[1]++; if (x.ok) u[0]++; }
  app.append(el("h2", null, "這場的考點"));
  const tb = el("div", "tbl"), table = el("table");
  table.innerHTML = '<thead><tr><th>考點</th><th class="n">對 / 總</th></tr></thead>';
  const body = el("tbody");
  for (const [u, [a, n]] of Object.entries(byUnit)) { const tr = el("tr"); tr.append(el("td", null, unitName(u)), el("td", "n", a + " / " + n)); body.append(tr); }
  table.append(body); tb.append(table); app.append(tb);

  const row = el("div", "row"); row.style.marginTop = "22px";
  const again = wrong.concat(guessed);
  if (again.length) row.append(btn("btn primary", "再練這場錯的", () => { const cards = {}; for (const x of again) (cards[x.id] = cards[x.id] || []).push(x.qi); newSession(Object.entries(cards).map(([id, qs]) => cardFor(BY[id], qs)), "再練錯的"); }));
  row.append(btn("btn", "回首頁", home));
  app.append(row);
}
function resultList(rs) {
  const ul = el("ul", "list");
  for (const x of rs) {
    const item = BY[x.id]; if (!item) continue;
    ul.append(itemRow(item, x.qi, { chosen: x.chosen, meta: [unitName(item.unit)] }));
  }
  return ul;
}
function stemText(item, qi) {
  if (isGap(item)) return item.stem.replace("______", "[" + item.options[item.answer] + "]");
  if (item.format === "qr") return item.audio.lines[0].text;
  return item.questions[qi].q;
}
function itemRow(item, qi, { chosen, meta, bankKey }) {
  const li = el("li"), head = btn("head");
  const s = el("span", "s en", stemText(item, qi));
  const m = el("span", "m"); for (const t of meta) m.append(el("span", "badge", t));
  if (item.source !== "hand") m.append(el("span", "badge claude", "Claude 出題・未審核"));
  if ((M[item.id] || {}).note) m.append(el("span", null, "📝"));
  const ch = el("span", "ch", "▾");
  head.append(s, ch, m);
  const body = el("div", "body"); body.hidden = true;
  head.onclick = () => {
    body.hidden = !body.hidden; ch.textContent = body.hidden ? "▾" : "▴";
    if (!body.hidden && !body.childNodes.length) fillRowBody(body, item, qi, chosen, bankKey);
  };
  li.append(head, body);
  return li;
}
function fillRowBody(body, item, qi, chosen, bankKey) {
  if (isGap(item)) body.append(explainGap(item, chosen ?? -1));
  else {
    const q = item.questions[qi], box = el("div", "exp");
    if (item.format !== "qr") { const p = el("p", "en"); p.append(q.q); box.append(p); }
    box.append(el("span", "k", "考點 · " + unitName(item.unit)), zh(el("p", "rule", q.explain.point)));
    const ans = item.format === "qr" ? item.audio.lines[q.answer + 1].text : q.options[q.answer];
    const w = el("div"); w.append(el("span", "k", "答案 · " + ans), zh(el("p", null, q.explain.why))); box.append(w);
    const ul = el("ul", "script");
    item.audio.lines.forEach((ln, i) => { const li = el("li", (q.explain.evidence || []).includes(i) ? "ev" : ""); const t = el("div", "t en", ln.text); const mb = btn("mini"); mb.innerHTML = PLAY; mb.onclick = () => playLines(item, [i], 0); li.append(el("span", "who", item.format === "qr" ? (i ? L[i - 1] : "Q") : ln.who), t, mb); ul.append(li); });
    box.append(ul);
    body.append(box);
  }
  const note = el("div", "note"), ta = el("textarea"); ta.id = "note-" + item.id + "-" + qi; ta.placeholder = "筆記（自動儲存）";
  ta.value = (M[item.id] || {}).note || "";
  let t = null;
  ta.oninput = () => { clearTimeout(t); t = setTimeout(() => { M[item.id] = Object.assign(M[item.id] || {}, { note: ta.value }); saveMark(item.id); }, 1000); };
  note.append(ta); body.append(note);
  if (bankKey && B[bankKey] && !B[bankKey].removedAt && !B[bankKey].graduatedAt) {
    body.append(btn("btn sm ghost", "移出錯題庫", ev => { B[bankKey].removedAt = Date.now(); saveBank(bankKey); ev.target.replaceWith(el("span", "small muted", "已移出。在「全部」裡還找得到。")); }));
  }
}

// ================================================================ wrong bank
let bankFilter = "due", bankGroup = "unit", bankQuery = "";
function bankView() {
  show("bank");
  bar(back("首頁", home), "錯題庫", null);
  const app = $("#app");
  const f = el("div", "filters");
  for (const [k, t] of [["due", "待複習"], ["all", "全部"], ["guess", "猜對的"], ["grad", "已畢業"]]) { const c = btn("chip", t, () => { bankFilter = k; bankView(); }); c.setAttribute("aria-pressed", String(bankFilter === k)); f.append(c); }
  f.append(el("span", "sp")); f.lastChild.style.flex = "1";
  for (const [k, t] of [["unit", "依考點"], ["date", "依日期"]]) { const c = btn("chip", t, () => { bankGroup = k; bankView(); }); c.setAttribute("aria-pressed", String(bankGroup === k)); f.append(c); }
  app.append(f);
  const s = el("input", "search"); s.type = "search"; s.id = "bank-search"; s.placeholder = "搜尋題目、筆記、考點"; s.value = bankQuery;
  app.append(s);
  const listHost = el("div"); app.append(listHost);
  const render = () => {
    listHost.textContent = "";
    const t = day(), q = bankQuery.toLowerCase();
    let keys_ = Object.keys(B).filter(k => qOf(k));
    keys_ = keys_.filter(k => { const e = B[k];
      if (bankFilter === "due") return !e.graduatedAt && !e.removedAt && e.due <= t;
      if (bankFilter === "guess") return !e.graduatedAt && !e.removedAt && e.reason === "guess";
      if (bankFilter === "grad") return !!e.graduatedAt;
      return true; });
    if (q) keys_ = keys_.filter(k => { const { item, qi } = qOf(k); return (stemText(item, qi) + " " + ((M[item.id] || {}).note || "") + " " + unitName(item.unit)).toLowerCase().includes(q); });
    if (!keys_.length) { listHost.append(el("p", "empty", bankFilter === "due" ? "沒有到期的題。" : "這裡沒有題。")); return; }
    const rowFor = k => { const { item, qi } = qOf(k), e = B[k];
      const meta = [e.wrongCount ? "錯 " + e.wrongCount + " 次" : "猜對", e.graduatedAt ? "已畢業" : e.removedAt ? "已移出" : "下次 " + e.due.slice(5).replace("-", "/")];
      if (bankGroup === "date") meta.unshift(unitName(item.unit));
      return itemRow(item, qi, { meta, bankKey: k }); };
    if (bankGroup === "date") {
      const ul = el("ul", "list"); keys_.sort((a, b) => B[b].enteredAt - B[a].enteredAt).forEach(k => ul.append(rowFor(k))); listHost.append(ul);
    } else {
      const groups = {}; for (const k of keys_) (groups[unitOfKey(k)] = groups[unitOfKey(k)] || []).push(k);
      for (const [u, ks] of Object.entries(groups).sort((a, b) => b[1].length - a[1].length)) {
        const last = Math.max(...ks.map(k => B[k].lastAt || 0));
        listHost.append(el("div", "group-h", unitName(u) + "　" + ks.length + " 題 · 最近 " + day(new Date(last)).slice(5).replace("-", "/")));
        const ul = el("ul", "list"); ks.forEach(k => ul.append(rowFor(k))); listHost.append(ul);
      }
    }
  };
  s.oninput = () => { bankQuery = s.value; render(); };
  render();
}

// ================================================================ keyboard (desktop)
const keys = {};
document.addEventListener("keydown", e => {
  if (view !== "session" || e.target.closest("textarea,input,select") || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  const pos = "1234".indexOf(k) >= 0 ? "1234".indexOf(k) : "abcd".indexOf(k);
  if (pos >= 0 && keys.answer) { keys.answer(pos); e.preventDefault(); }
  else if (k === "enter" && keys.next && document.querySelector(".nextbar")) { keys.next(); e.preventDefault(); }
  else if (k === "g" && keys.guess) keys.guess();
  else if (k === "r" && keys.replay) keys.replay();
  else if (k === "s" && keys.star) keys.star();
});
const _runCard = runCard;
runCard = function () { for (const k of Object.keys(keys)) delete keys[k]; return _runCard(); };

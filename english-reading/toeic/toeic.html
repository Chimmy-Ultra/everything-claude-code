te 時間或心力 to 某事。例：<em>He devoted the morning to the budget.<\/em>"]]}}, {"id": "v-business-05", "type": "vocab", "format": "gap", "unit": "business", "level": 2, "source": "hand", "reviewed": true, "v": 1, "stem": "Staff who drive their own cars to client meetings will be ______ for fuel at a fixed rate.", "options": ["rewarded", "reimbursed", "recruited", "reserved"], "answer": 1, "explain": {"point": "reimburse：歸還員工代墊的費用", "why": "員工先自付油錢、公司再按固定費率還錢，這是 reimbursed（報銷）。", "wrong": ["reward 是獎勵表現，不是歸還代墊的錢", null, "recruit 是招募人才，跟油錢無關", "reserve 是預訂或保留，不是還錢"], "zh": "開自己的車去拜訪客戶的員工，油錢會按固定費率報銷。", "vocab": [["reimburse", "報銷、償還"], ["fuel", "燃料、油錢"], ["fixed rate", "固定費率"]]}, "gloss": [{"w": "fuel", "hw": "fuel", "pos": "n.", "zh": "燃料、油錢", "ex": "Fuel costs rose again this year.", "ipa": "/ˈfjuːəl/"}, {"w": "fixed rate", "hw": "fixed rate", "pos": "n.", "zh": "固定費率", "ex": "We charge a fixed rate per hour.", "ipa": "/fɪkst reɪt/"}], "en": {"point": ["<em>reimburse<\/em>: pay back money someone spent.", "reimburse：歸還員工代墊的費用。"], "why": ["Staff pay for <em>fuel<\/em> with their own cars, and the company pays them back <em>at a fixed rate<\/em>. Paying back money an employee spent is <em>reimbursed<\/em>.", "員工開自己的車、先付油錢，公司再按固定費率還給他們。把員工代墊的錢還回去就是 reimbursed。"], "usage": [["<em>reward<\/em> means to give something for good work. <em>The firm rewarded her for finding the error.<\/em>", "reward 是「獎勵」表現好。例：<em>The firm rewarded her for finding the error.<\/em>"], null, ["<em>recruit<\/em> means to find and hire new people. <em>We plan to recruit ten engineers.<\/em>", "recruit 是「招募」新人。例：<em>We plan to recruit ten engineers.<\/em>"], ["<em>reserve<\/em> means to book something in advance, or to keep it for someone. <em>I reserved a table for six.<\/em>", "reserve 是「預訂」或「保留」。例：<em>I reserved a table for six.<\/em>"]]}}, {"id": "v-business-06", "type": "vocab", "format": "gap", "unit": "business", "level": 3, "source": "hand", "reviewed": true, "v": 1, "stem": "Since the delay was caused by its own error, the shipping company agreed to ______ the extra cost.", "options": ["absorb", "adopt", "attach", "acquire"], "answer": 0, "explain": {"point": "absorb the cost：自行吸收費用", "why": "延誤是物流公司自己的錯，所以由它吸收多出來的費用：absorb the extra cost。", "wrong": [null, "adopt 接 policy、plan，是「採用」", "attach 接 file，是「附上」", "acquire 接公司、技能，是「取得」"], "zh": "由於延誤是物流公司自己的錯，他們同意自行吸收額外的費用。", "vocab": [["shipping company", "物流公司"], ["absorb", "吸收（費用）"]]}, "gloss": [{"w": "shipping company", "hw": "shipping company", "pos": "n.", "zh": "物流公司", "ex": "The shipping company delivers overnight.", "ipa": "/ˈʃɪpɪŋ ˈkʌmpəˌniː/"}, {"w": "was caused by", "hw": "cause", "pos": "phr.", "zh": "是由…造成", "ex": "The delay was caused by heavy snow.", "ipa": "/kɑːz/"}], "en": {"point": ["<em>absorb<\/em> a cost: pay it yourself.", "absorb the cost：自行吸收費用。"], "why": ["The delay was <em>its own error<\/em>, so the shipping company takes the <em>extra cost<\/em> on itself instead of charging the customer. That is <em>absorb<\/em>.", "延誤是物流公司自己的錯，所以多出來的費用由它自己承擔，不向客戶收。這就是 absorb。"], "usage": [null, ["<em>adopt<\/em> means to start using a plan, policy or method. <em>The firm adopted a new return policy.<\/em>", "adopt 是「採用」計畫、政策或方法。例：<em>The firm adopted a new return policy.<\/em>"], ["<em>attach<\/em> a file or document to an email or a form. <em>Please attach your resume to the form.<\/em>", "attach 是把檔案或文件「附上」。例：<em>Please attach your resume to the form.<\/em>"], ["<em>acquire<\/em> means to get a company, a skill or an asset. <em>The firm acquired a smaller rival.<\/em>", "acquire 是「取得」公司、技能或資產。例：<em>The firm acquired a smaller rival.<\/em>"]]}}, {"id": "v-business-07", "type": "vocab", "format": "gap", "unit": "business", "level": 1, "source": "hand", "reviewed": true, "v": 1, "stem": "Under the terms of the contract, Pellham Logistics will receive a ______ of 15 percent of the purchase price when the agreement is signed, with the balance due upon delivery.", "options": ["dividend", "rebate", "premium", "deposit"], "answer": 3, "explain": {"point": "deposit 訂金：先付一部分，餘款後付", "why": "簽約時先收價款的 15%，其餘 the balance（餘款）交貨時再付，這筆先付的錢是訂金 deposit。", "wrong": ["dividend 是公司發給股東的股利", "rebate 是買方付款後退回的部分款項", "premium 是保費或額外加價，不是價款的一部分", null], "wrongMore": [null, "rebate 也常以百分比表示，所以很像答案；但它是付清後退還給買方的錢，這裡是簽約先收、交貨再收 the balance（餘款），是先付的訂金，不是退款。", null, null], "zh": "依照合約條款，Pellham 物流在簽約時會先收到購買價格 15% 的訂金，餘款在交貨時支付。", "vocab": [["deposit", "訂金"], ["balance", "餘款"], ["upon delivery", "交貨時"]]}, "gloss": [{"w": "Under the terms of", "hw": "under the terms of", "pos": "phr.", "zh": "依照…的條款", "ex": "Under the terms of the lease, rent is monthly.", "ipa": "/ˈʌndər ðə tɜrmz ʌv/"}, {"w": "balance", "hw": "balance", "pos": "n.", "zh": "餘款", "ex": "Please pay the balance by Friday.", "ipa": "/ˈbæləns/"}, {"w": "upon delivery", "hw": "upon delivery", "pos": "phr.", "zh": "交貨時", "ex": "Payment is due upon delivery.", "ipa": "/əˈpɑːn dɪˈlɪvəri/"}], "en": {"point": ["<em>deposit<\/em>: part of the price paid first.", "deposit 訂金：先付一部分。"], "why": ["Pellham receives <em>15 percent of the purchase price when the agreement is signed<\/em>, and <em>the balance<\/em> is due on delivery. A first part-payment is a <em>deposit<\/em>.", "Pellham 在簽約時先收價款的 15%，餘款 the balance 交貨時付。先付的一部分款項是 deposit。"], "usage": [["<em>dividend<\/em> is a share of profit paid to shareholders. <em>The company paid a quarterly dividend.<\/em>", "dividend 是公司發給股東的股利。例：<em>The company paid a quarterly dividend.<\/em>"], ["<em>rebate<\/em> is part of the price returned to the buyer after payment. <em>Buyers get a rebate on qualifying purchases.<\/em>", "rebate 是付款後退還給買方的一部分錢。例：<em>Buyers get a rebate on qualifying purchases.<\/em>"], ["<em>premium<\/em> is the regular payment for insurance, or an extra charge. <em>The insurance premium rises every year.<\/em>", "premium 是保費，或額外加價。例：<em>The insurance premium rises every year.<\/em>"], null]}}, {"id": "v-business-08", "type": "vocab", "format": "gap", "unit": "business", "level": 2, "source": "hand", "reviewed": true, "v": 1, "stem": "At the end of each month, the accounts team must ______ the company's bank statements with its internal ledger and investigate any discrepancies before the books are closed.", "options": ["consolidate", "reconcile", "liquidate", "appraise"], "answer": 1, "explain": {"point": "reconcile A with B：核對兩份帳使其相符", "why": "把銀行對帳單和內部帳本逐筆比對、查出 discrepancies（不符之處），會計上叫 reconcile。", "wrong": ["consolidate 是把多份帳「合併」，不是比對找差異", null, "liquidate 是清算、變賣資產", "appraise 是替資產估價，不接 with"], "wrongMore": ["consolidate 也能接 with，所以很像答案；但它是把幾份帳合成一份（如合併報表），後面要 investigate any discrepancies，表示是在比對兩份紀錄。", null, null, null], "zh": "每個月底，會計組都必須把公司的銀行對帳單和內部帳本逐一核對，並在結帳前查明任何不符之處。", "vocab": [["reconcile", "核對（帳目）"], ["ledger", "分類帳"], ["discrepancy", "不一致、差異"], ["close the books", "結帳"]]}, "gloss": [{"w": "ledger", "hw": "ledger", "pos": "n.", "zh": "分類帳", "ex": "Enter each payment in the ledger.", "ipa": "/ˈledʒər/"}, {"w": "discrepancies", "hw": "discrepancy", "pos": "n.", "zh": "不一致、差異", "ex": "We found a discrepancy in the totals.", "ipa": "/dɪˈskrepənsi/"}, {"w": "bank statements", "hw": "bank statement", "pos": "n.", "zh": "銀行對帳單", "ex": "The bank statement arrives monthly.", "ipa": "/bæŋk ˈsteɪtmənt/"}], "en": {"point": ["<em>reconcile<\/em> A <em>with<\/em> B: check that two records match.", "reconcile A with B：核對兩份帳使其相符。"], "why": ["The team compares <em>bank statements<\/em> with <em>its internal ledger<\/em> and looks into <em>any discrepancies<\/em>. Checking that two sets of records agree is <em>reconcile<\/em>.", "會計組把 bank statements 和 internal ledger 比對，並查明任何不符之處。確認兩份紀錄一致就是 reconcile。"], "usage": [["<em>consolidate<\/em> means to combine several things into one. <em>The firm consolidated three offices into one.<\/em>", "consolidate 是把幾個合併成一個。例：<em>The firm consolidated three offices into one.<\/em>"], null, ["<em>liquidate<\/em> means to sell assets for cash, or to close a business and pay its debts. <em>The owner liquidated the stock.<\/em>", "liquidate 是變賣資產，或清算結束公司。例：<em>The owner liquidated the stock.<\/em>"], ["<em>appraise<\/em> means to judge the value of something. <em>An expert will appraise the building.<\/em>", "appraise 是替東西估價。例：<em>An expert will appraise the building.<\/em>"]]}}, {"id": "v-family-01", "type": "vocab", "format": "gap", "unit": "family", "level": 1, "source": "hand", "reviewed": true, "v": 2, "stem": "Until the merger is formally announced, employees involved in the negotiations must keep every detail of the deal strictly ______.", "options": ["confident", "confidential", "confiding", "confided"], "answer": 1, "explain": {"point": "confidential 機密的；confident 有信心的", "why": "正式宣布前細節不能外洩；keep + 受詞 + strictly confidential 是「嚴格保密」。", "wrong": ["confident 是「有信心的」，形容人的感覺", null, "confiding 是「信任人、愛吐露心事的」，形容人", "confide 是把祕密告訴某人，不當 keep 的補語"], "zh": "在合併案正式宣布之前，參與協商的員工必須對這筆交易的所有細節嚴格保密。", "vocab": [["merger", "合併"], ["negotiation", "協商、談判"], ["confidential", "機密的"]]}, "gloss": [{"w": "merger", "hw": "merger", "pos": "n.", "zh": "合併", "ex": "The merger created a larger firm.", "ipa": "/ˈmɜrdʒər/"}, {"w": "negotiations", "hw": "negotiation", "pos": "n.", "zh": "協商、談判", "ex": "Negotiations lasted three weeks.", "ipa": "/nɪˌɡoʊʃiˈeɪʃən/"}, {"w": "strictly", "hw": "strictly", "pos": "adv.", "zh": "嚴格地", "ex": "Smoking is strictly forbidden here.", "ipa": "/ˈstrɪktli/"}], "en": {"point": ["<em>confidential<\/em> = secret; <em>confident<\/em> = sure.", "confidential 機密的；confident 有信心的。"], "why": ["Details of the merger must not leak before it is announced. <em>Keep … strictly confidential<\/em> means to keep every detail strictly secret.", "合併案公布前，細節不能外洩。keep … strictly confidential 是把每個細節嚴格保密。"], "usage": [["<em>confident<\/em> means sure of yourself or of something. <em>She is confident that the team will win.<\/em>", "confident 是「有信心的」。例：<em>She is confident that the team will win.<\/em>"], null, ["<em>confiding<\/em> describes someone who shares private feelings with others. <em>She spoke in a confiding tone.<\/em>", "confiding 形容人愛吐露心事、信任別人。例：<em>She spoke in a confiding tone.<\/em>"], ["<em>confided<\/em> is the past of <em>confide<\/em>: to tell a secret to someone. <em>She confided her plans to her manager.<\/em>", "confided 是 confide 的過去式，是向人透露祕密。例：<em>She confided her plans to her manager.<\/em>"]]}}, {"id": "v-family-02", "type": "vocab", "format": "gap", "unit": "family", "level": 2, "source": "hand", "reviewed": true, "v": 1, "stem": "Please keep this folder locked because it contains ______ information about employee salaries.", "options": ["sensible", "sensory", "senseless", "sensitive"], "answer": 3, "explain": {"point": "sensitive 敏感的；sensible 明智的", "why": "薪資資料不能外流、要鎖起來，是「敏感的」資訊，用 sensitive。", "wrong": ["sensible 是「明智的、合理的」，不表示要保密", "sensory 是「感官的」，如視覺、聽覺", "senseless 是「無意義的」，跟要鎖起來無關", null], "zh": "請把這個資料夾鎖好，因為裡面有員工薪資的敏感資料。", "vocab": [["folder", "資料夾"], ["salary", "薪資"]]}, "gloss": [{"w": "locked", "hw": "lock", "pos": "v.", "zh": "上鎖", "ex": "Please keep the cabinet locked.", "ipa": "/lɑːk/"}, {"w": "salaries", "hw": "salary", "pos": "n.", "zh": "薪資", "ex": "Salaries are paid on the 25th.", "ipa": "/ˈsæləri/"}], "en": {"point": ["<em>sensitive<\/em> = private or delicate; <em>sensible<\/em> = wise.", "sensitive 敏感的；sensible 明智的。"], "why": ["The folder holds <em>employee salaries<\/em> and must be kept <em>locked<\/em>. Private information that should not be shared is <em>sensitive<\/em>.", "這個資料夾裡有 employee salaries，必須上鎖。不該外流的私密資料就是 sensitive。"], "usage": [["<em>sensible<\/em> means wise and practical. <em>Wearing a hard hat is a sensible precaution.<\/em>", "sensible 是「明智、合理的」。例：<em>Wearing a hard hat is a sensible precaution.<\/em>"], ["<em>sensory<\/em> relates to the senses, such as sight and hearing. <em>The exhibit offers a sensory experience.<\/em>", "sensory 是「感官的」，如視覺、聽覺。例：<em>The exhibit offers a sensory experience.<\/em>"], ["<em>senseless<\/em> means without sense or purpose. <em>The delay was a senseless waste of time.<\/em>", "senseless 是「沒有意義的」。例：<em>The delay was a senseless waste of time.<\/em>"], null]}}, {"id": "v-family-03", "type": "vocab", "format": "gap", "unit": "family", "level": 3, "source": "hand", "reviewed": true, "v": 1, "stem": "After the break, Ms. Lin and Mr. Hale will present the sales figures for their ______ regions.", "options": ["respective", "respectful", "respectable", "respected"], "answer": 0, "explain": {"point": "respective 各自的；respectful 有禮貌的", "why": "兩人各自報告自己負責地區的業績，「各自的」用 respective。", "wrong": [null, "respectful 是「有禮貌的」，形容人或態度", "respectable 是「體面的、像樣的」，不表示「各自的」", "respected 是「受尊敬的」，形容人"], "zh": "休息過後，林女士和 Hale 先生會分別報告各自地區的業績數字。", "vocab": [["sales figures", "業績數字"], ["region", "地區、區域"]]}, "gloss": [{"w": "sales figures", "hw": "sales figure", "pos": "n.", "zh": "業績數字", "ex": "The sales figures look strong this month.", "ipa": "/seɪlz ˈfɪɡjər/"}, {"w": "regions", "hw": "region", "pos": "n.", "zh": "地區", "ex": "Our largest region is the north.", "ipa": "/ˈriːdʒən/"}], "en": {"point": ["<em>respective<\/em> = each person's own.", "respective 各自的。"], "why": ["Ms. Lin and Mr. Hale each present figures for <em>their<\/em> own region. <em>Respective<\/em> means each person's own, so it fits <em>their respective regions<\/em>.", "林女士和 Hale 先生各自報告自己地區的數字。respective 是「各自的」，所以用 their respective regions。"], "usage": [null, ["<em>respectful<\/em> means showing respect to others. <em>The staff were respectful to all customers.<\/em>", "respectful 是「有禮貌、尊重人的」。例：<em>The staff were respectful to all customers.<\/em>"], ["<em>respectable<\/em> means good enough to be approved of. <em>The firm posted a respectable profit.<\/em>", "respectable 是「像樣、體面的」。例：<em>The firm posted a respectable profit.<\/em>"], ["<em>respected<\/em> means admired by others. <em>She is a respected scientist.<\/em>", "respected 是「受人尊敬的」。例：<em>She is a respected scientist.<\/em>"]]}}, {"id": "v-family-04", "type": "vocab", "format": "gap", "unit": "family", "level": 2, "source": "hand", "reviewed": true, "v": 1, "stem": "The supervisor praised the new interns for being ______ and always finishing their tasks ahead of schedule.", "options": ["industrial", "industrialized", "industrious", "industrializing"], "answer": 2, "explain": {"point": "industrious 勤奮的；industrial 工業的", "why": "稱讚實習生總是提前完成工作，是說他們「勤奮」，用 industrious。", "wrong": ["industrial 是「工業的」，形容區域、設備", "industrialized 是「已工業化的」，形容國家", null, "industrializing 是「工業化中的」，形容國家"], "zh": "主管稱讚新來的實習生很勤奮，總是提前完成工作。", "vocab": [["supervisor", "主管"], ["intern", "實習生"], ["ahead of schedule", "提前"]]}, "gloss": [{"w": "praised", "hw": "praise", "pos": "v.", "zh": "稱讚", "ex": "The manager praised her careful work.", "ipa": "/preɪz/"}, {"w": "interns", "hw": "intern", "pos": "n.", "zh": "實習生", "ex": "Two interns joined the team in June.", "ipa": "/ˈɪntərn/"}, {"w": "ahead of schedule", "hw": "ahead of schedule", "pos": "phr.", "zh": "提前", "ex": "The project finished ahead of schedule.", "ipa": "/əˈhed ʌv ˈskedʒʊl/"}], "en": {"point": ["<em>industrious<\/em> = hardworking; <em>industrial<\/em> = of industry.", "industrious 勤奮的；industrial 工業的。"], "why": ["The interns <em>always finish their tasks ahead of schedule<\/em>, which shows they work hard. The word for hardworking people is <em>industrious<\/em>.", "實習生總是提前完成工作，表示他們工作很努力。形容勤奮的人用 industrious。"], "usage": [["<em>industrial<\/em> means related to industry and factories. <em>The company runs an industrial park.<\/em>", "industrial 是「工業的」。例：<em>The company runs an industrial park.<\/em>"], ["<em>industrialized<\/em> describes a country with many factories and industries. <em>Japan is an industrialized country.<\/em>", "industrialized 形容「已工業化的」國家。例：<em>Japan is an industrialized country.<\/em>"], null, ["<em>industrializing<\/em> describes a country that is building up its industries. <em>Many industrializing economies need new roads.<\/em>", "industrializing 形容「工業化中的」國家。例：<em>Many industrializing economies need new roads.<\/em>"]]}}, {"id": "v-family-05", "type": "vocab", "format": "gap", "unit": "family", "level": 2, "source": "hand", "reviewed": true, "v": 1, "stem": "The safety manual was rewritten in plain language so that it would be ______ to every new employee.", "options": ["comprehensive", "comprehending", "comprehensible", "comprehended"], "answer": 2, "explain": {"point": "comprehensible 易懂的；comprehensive 全面的", "why": "用淺白的語言改寫，是為了讓新人看得懂；「對某人來說易懂」是 comprehensible to。", "wrong": ["comprehensive 是「全面的」，而且不接 to 某人", "comprehending 是「正在理解」，主詞要是人", null, "comprehended 是被動「被理解」，不接 to"], "zh": "安全手冊用淺白的語言重寫，好讓每位新員工都看得懂。", "vocab": [["manual", "手冊"], ["plain language", "淺白的語言"]]}, "gloss": [{"w": "rewritten", "hw": "rewrite", "pos": "v.", "zh": "改寫", "ex": "The report was rewritten for clarity.", "ipa": "/riˈraɪt/"}, {"w": "plain language", "hw": "plain language", "pos": "n.", "zh": "淺白的語言", "ex": "The contract uses plain language.", "ipa": "/pleɪn ˈlæŋɡwədʒ/"}], "en": {"point": ["<em>comprehensible to<\/em> someone: easy to understand.", "comprehensible to 某人：易懂的。"], "why": ["The manual was rewritten <em>in plain language<\/em> so that every new employee can understand it. <em>Comprehensible to<\/em> means easy for someone to understand.", "手冊用淺白的語言重寫，好讓每位新員工看得懂。comprehensible to 是「對某人來說易懂」。"], "usage": [["<em>comprehensive<\/em> means complete and covering everything. <em>The report gives a comprehensive review of sales.<\/em>", "comprehensive 是「全面的」。例：<em>The report gives a comprehensive review of sales.<\/em>"], ["<em>comprehending<\/em> is the -ing form of <em>comprehend<\/em>, to understand. <em>Comprehending the rules took her a week.<\/em>", "comprehending 是 comprehend（理解）的 -ing 形。例：<em>Comprehending the rules took her a week.<\/em>"], null, ["<em>comprehended<\/em> is the past form of <em>comprehend<\/em>, to understand. <em>She quickly comprehended the problem.<\/em>", "comprehended 是 comprehend 的過去式。例：<em>She quickly comprehended the problem.<\/em>"]]}}, {"id": "v-family-06", "type": "vocab", "format": "gap", "unit": "family", "level": 3, "source": "hand", "reviewed": true, "v": 1, "stem": "The hardware store stocks screws in every ______ size, so builders rarely have to order parts.", "options": ["imaginative", "imaginary", "imagining", "imaginable"], "answer": 3, "explain": {"point": "imaginable 想得到的；imaginative 有創意的", "why": "every imaginable size 是「所有想得到的尺寸」，強調貨色齊全。", "wrong": ["imaginative 是「有想像力的」，形容人或設計", "imaginary 是「虛構的」，但店裡真的有貨", "imagining 是動詞 -ing，不當形容詞用", null], "zh": "這家五金行的螺絲什麼尺寸都有，所以營造商很少需要另外訂零件。", "vocab": [["hardware store", "五金行"], ["stock", "有庫存、進貨"], ["screw", "螺絲"]]}, "gloss": [{"w": "stocks", "hw": "stock", "pos": "v.", "zh": "備有庫存", "ex": "The store stocks over a thousand items.", "ipa": "/stɑːk/"}, {"w": "screws", "hw": "screw", "pos": "n.", "zh": "螺絲", "ex": "Please order two boxes of screws.", "ipa": "/skruː/"}, {"w": "rarely", "hw": "rarely", "pos": "adv.", "zh": "很少", "ex": "Our trains are rarely late.", "ipa": "/ˈrerli/"}], "en": {"point": ["<em>every imaginable<\/em> + noun: every possible kind.", "every imaginable：所有想得到的。"], "why": ["The store carries screws in <em>every<\/em> size one could think of, so builders <em>rarely have to order parts<\/em>. <em>Every imaginable size<\/em> means every size you can think of.", "這家店的螺絲什麼尺寸都有，所以營造商很少要另外訂零件。every imaginable size 是所有想得到的尺寸。"], "usage": [["<em>imaginative<\/em> means full of new, creative ideas. <em>The team came up with an imaginative design.<\/em>", "imaginative 是「有想像力、有創意的」。例：<em>The team came up with an imaginative design.<\/em>"], ["<em>imaginary<\/em> means not real; it exists only in the mind. <em>The map shows an imaginary line between the two regions.<\/em>", "imaginary 是「虛構的」，只存在於想像中。例：<em>The map shows an imaginary line between the two regions.<\/em>"], ["<em>imagine<\/em> means to form a picture in your mind; <em>imagining<\/em> is its -ing form. <em>I am imagining a bigger office.<\/em>", "imagining 是 imagine（想像）的 -ing 形。例：<em>I am imagining a bigger office.< d", "reviewed": true, "v": 1, "accent": "us", "audio": {"dir": "audio/l-talk-03", "gapMs": 500, "lines": [{"file": "01.mp3", "who": "W", "voice": "af_bella", "text": "Good morning, everyone. As you know, our store is switching to a new inventory system at the end of the month."}, {"file": "02.mp3", "who": "W", "voice": "af_bella", "text": "Everyone must complete a training session before then, and on the schedule I handed out, you'll see that each session lasts six hours. That's not a typo."}, {"file": "03.mp3", "who": "W", "voice": "af_bella", "text": "The trainer from the software company wants to cover everything, from ordering to returns, in a single day."}, {"file": "04.mp3", "who": "W", "voice": "af_bella", "text": "Sessions are on the 12th, 14th, and 19th. Please sign up for one on the sheet by the break room door by Friday.", "say": "Sessions are on the twelfth, fourteenth, and nineteenth. Please sign up for one on the sheet by the break room door by Friday."}, {"file": "05.mp3", "who": "W", "voice": "af_bella", "text": "Since you'll be off the sales floor all day, I'll make sure the store stays covered."}, {"file": "06.mp3", "who": "W", "voice": "af_bella", "text": "And lunch that day is on us."}]}, "transcriptZh": ["大家早。大家都知道，我們店月底要換成新的庫存系統。", "在那之前每個人都要上完一場訓練；在我發下去的時間表上，你們會看到每一場要六個小時。那不是打錯字。", "軟體公司派來的講師想在一天之內把所有東西都教完，從訂貨到退貨都包括在內。", "訓練在 12 號、14 號和 19 號。請在星期五前，到休息室門邊的登記表上報名其中一場。", "因為你們那天整天都不在賣場，我會確保店裡有人顧。", "還有，那天的午餐由公司請客。"], "questions": [{"q": "Who most likely are the listeners?", "options": ["Software trainers", "Store employees", "Job applicants", "Regular customers"], "answer": 1, "explain": {"point": "身分題：從 our store 和 sales floor 推", "why": "our store 要換系統、you'll be off the sales floor → 聽眾是在店裡賣場工作的人，即 store employees。", "evidence": [0, 4], "wrong": ["同字陷阱：trainer 是軟體公司派來的人", null, "她是對現有員工說要受訓，不是應徵者", "沒有任何對顧客說話的線索"], "vocab": [["inventory", "庫存"], ["sales floor", "賣場"]]}, "en": {"point": ["Infer the audience from 'our store'.", "身分題：從 our store 推聽眾。"], "why": ["She says <em>our store is switching to a new inventory system<\/em> and <em>you'll be off the sales floor all day<\/em>. The listeners work in the store.", "她說 <em>our store is switching to a new inventory system<\/em> 和 <em>you'll be off the sales floor all day<\/em>。聽眾是店裡的員工。"]}}, {"q": "What does the speaker mean when she says, \"That's not a typo\"?", "options": ["A printing error will be fixed", "The sessions really will last that long", "The training dates might change", "The new system is easy to learn"], "answer": 1, "explain": {"point": "引句題：not a typo＝看起來像打錯，其實是真的", "why": "六小時長得出奇，她先說 not a typo，再解釋講師要一天教完全部 → 意思是真的要上那麼久。", "evidence": [1, 2], "wrong": ["字面陷阱：她說的是「不是」打錯字", null, "日期是固定的三天，沒說會改", "要花一整天教完，暗示內容很多"], "vocab": [["typo", "打錯字"], ["cover", "涵蓋、講到"]]}, "en": {"point": ["A quote that denies a mistake.", "引句題：這句話否認出錯。"], "why": ["Six hours looks like an error, so she says <em>That's not a typo<\/em> and explains the trainer wants to cover everything <em>in a single day<\/em>. The sessions really are that long.", "六小時看起來像寫錯，所以她說 <em>That's not a typo<\/em>，並解釋講師要 <em>in a single day<\/em> 教完所有內容。課真的那麼長。"]}}, {"q": "What are listeners asked to do by Friday?", "options": ["Complete their training", "Choose a session date", "Test the new system", "Turn in their work schedules"], "answer": 1, "explain": {"point": "細節題：鎖定題目裡的 by Friday", "why": "說 please sign up for one（三個日期選一場）by Friday → 改述成 choose a session date。", "evidence": [3], "wrong": ["期限錯置：上完訓練的期限是月底", null, "沒有要他們先試用系統", "顧店的安排由她處理，不用員工交班表"], "wrongMore": ["complete a training session before then 的 then 指月底換系統的時候；星期五只是報名的期限。", null, null, null], "vocab": [["sign up", "報名、登記"], ["break room", "員工休息室"]]}, "en": {"point": ["Find the deadline word 'by Friday'.", "細節題：找 by Friday。"], "why": ["She says <em>Please sign up for one on the sheet… by Friday<\/em>. There are three dates, so signing up means choosing a session date.", "她說 <em>Please sign up for one on the sheet … by Friday<\/em>。要在三個日期中選一場，也就是選場次日期。"]}}], "gloss": [{"w": "inventory system", "hw": "inventory system", "pos": "n.", "zh": "庫存系統", "ex": "The inventory system tracks every item.", "ipa": "/ˌɪnvənˈtɔːri ˈsɪstəm/"}, {"w": "typo", "hw": "typo", "pos": "n.", "zh": "打字錯誤", "ex": "I found a typo in the title.", "ipa": "/ˈtaɪpoʊ/"}, {"w": "sales floor", "hw": "sales floor", "pos": "n.", "zh": "賣場", "ex": "Staff are needed on the sales floor.", "ipa": "/seɪlz flɔːr/"}, {"w": "sign up", "hw": "sign up", "pos": "phr.", "zh": "報名", "ex": "Please sign up for the workshop.", "ipa": "/saɪn ʌp/"}, {"w": "stays covered", "hw": "stay covered", "pos": "phr.", "zh": "有人頂班", "ex": "The desk stays covered at lunch.", "ipa": "/steɪ ˈkʌvərd/"}]}, {"id": "g-pos-09", "type": "grammar", "format": "gap", "unit": "pos", "level": 2, "source": "hand", "reviewed": true, "v": 1, "ldbs": "L D B S", "stem": "The new layout of the Pellridge warehouse makes the items that customers order most often far more ______ to the pickers working on the early shift.", "options": ["access", "accessibly", "accessible", "accessibility"], "answer": 2, "explain": {"point": "make + 受詞 + 形容詞補語；受詞很長也一樣", "why": "makes 的受詞是 the items that customers order most often，後面缺補語，要形容詞 accessible。", "wrong": ["more access to 像名詞片語；但 make 的補語要形容詞", "副詞不能當受詞補語", null, "名詞不能補述 the items 的狀態"], "wrongMore": ["far more access to the pickers 單看是通順的名詞片語（更多取用管道）。但往前找會看到 makes the items…，空格是 make 的受詞補語，說明 items 變得怎樣，只能用形容詞。", null, null, null], "zh": "Pellridge 倉庫的新配置，讓顧客最常訂購的商品對早班揀貨員來說好拿得多。", "vocab": [["layout", "配置、布局"], ["picker", "揀貨員"], ["shift", "班次"]]}, "gloss": [{"w": "layout", "hw": "layout", "pos": "n.", "zh": "配置、布局", "ex": "We changed the layout of the lobby.", "ipa": "/ˈleɪˌaʊt/"}, {"w": "pickers", "hw": "picker", "pos": "n.", "zh": "揀貨員", "ex": "Each picker carries a handheld scanner.", "ipa": "/ˈpɪkər/"}, {"w": "shift", "hw": "shift", "pos": "n.", "zh": "班次", "ex": "She works the night shift on Fridays.", "ipa": "/ʃɪft/"}], "en": {"point": ["<em>make<\/em> + object + adjective.", "make + 受詞 + 形容詞。"], "why": ["The object of <em>makes<\/em> is the whole phrase <em>the items that customers order most often<\/em>. The blank says what those items become, so it needs an adjective: <em>accessible<\/em>.", "makes 的受詞是整段 the items that customers order most often。空格說明這些商品變得怎樣，所以要形容詞：accessible。"]}}, {"id": "g-pos-10", "type": "grammar", "format": "gap", "unit": "pos", "level": 2, "source": "hand", "reviewed": true, "v": 1, "ldbs": "L D", "stem": "______ for the assistant branch manager position, which will be based at our new office on Corliss Avenue, will be accepted through the online portal until the end of the month.", "options": ["Applications", "Apply", "Applying", "Applied"], "answer": 0, "explain": {"point": "句子已有主要動詞，空格要當主詞 → 名詞", "why": "主要動詞是遠處的 will be accepted，空格到 Avenue 整段是主詞，要名詞 Applications。", "wrong": [null, "像祈使句開頭；但後面的 will be accepted 缺主詞", "像分詞片語開頭；「申請這個動作」不會被受理", "過去式或 p.p. 都不能當主詞"], "wrongMore": [null, "Apply for the … position 是徵才廣告常見的祈使句，前半句單看完全對。但讀到逗號後的 will be accepted，就知道它需要主詞；祈使句沒有位置給這個動詞。", "Applying for … 單看像分詞構句或動名詞主詞。當主詞時意思是「申請這個動作會被受理」，不通；被受理的是申請書。", null], "zh": "副分行經理一職（工作地點在我們位於 Corliss Avenue 的新辦公室）的申請，在本月底前都可透過線上系統送出。", "vocab": [["assistant branch manager", "副分行經理"], ["portal", "入口網站、線上系統"]]}, "gloss": [{"w": "assistant branch manager", "hw": "assistant branch manager", "pos": "phr.", "zh": "副分行經理", "ex": "The assistant branch manager signs the daily reports.", "ipa": "/əˈsɪstənt bræntʃ ˈmænədʒər/"}, {"w": "portal", "hw": "portal", "pos": "n.", "zh": "入口網站、線上系統", "ex": "Log in to the employee portal to check your pay.", "ipa": "/ˈpɔːrtəl/"}], "en": {"point": ["The blank is the subject: use a noun.", "空格是主詞：用名詞。"], "why": ["The main verb comes late: <em>will be accepted<\/em>. Everything from the blank to <em>Avenue<\/em> is the subject. What gets accepted? <em>Applications<\/em>.", "主要動詞出現得很晚：will be accepted。從空格到 Avenue 都是主詞。什麼會被受理？Applications。"]}}, {"id": "g-tense-07", "type": "grammar", "format": "gap", "unit": "tense", "level": 2, "source": "hand", "reviewed": true, "v": 1, "ldbs": "L D B", "stem": "The Wexley Road call center, which now handles more than ten thousand calls a week, ______ without any scheduling software for nearly two years when Ms. Ferrante was hired to manage it.", "options": ["has been operating", "will have been operating", "is operating", "had been operating"], "answer": 3, "explain": {"point": "到過去某時點為止持續的動作 → had been + Ving", "why": "句尾 when Ms. Ferrante was hired 是過去時點，到那時已持續近兩年，用 had been operating。", "wrong": ["配 for 很順，但句尾 was hired 是過去時點", "未來完成，和過去的 was hired 不合", "現在進行式不能配 for … when 過去", null], "wrongMore": ["for nearly two years 加上前面的 now handles，很容易選現在完成進行式。但句尾 when Ms. Ferrante was hired 把時間點定在過去：是「她被雇用時已經持續兩年」，要往前推一層成 had been operating。", null, null, null], "zh": "Wexley Road 客服中心現在每週處理一萬多通電話；Ferrante 女士受雇來管理它的時候，它已經在沒有任何排班軟體的情況下運作了將近兩年。", "vocab": [["call center", "客服中心"], ["scheduling software", "排班軟體"]]}, "gloss": [{"w": "call center", "hw": "call center", "pos": "phr.", "zh": "客服中心", "ex": "She works at a call center downtown.", "ipa": "/kɔːl ˈsentər/"}, {"w": "handles", "hw": "handle", "pos": "v.", "zh": "處理", "ex": "Two clerks handle all customer complaints.", "ipa": "/ˈhændəl/"}, {"w": "scheduling software", "hw": "scheduling software", "pos": "phr.", "zh": "排班軟體", "ex": "The scheduling software saves us hours each week.", "ipa": "/ˈskedʒʊlɪŋ ˈsɔːfˌtwer/"}], "en": {"point": ["An action lasting up to a past time: <em>had been<\/em> + Ving.", "持續到過去某時點的動作：had been + Ving。"], "why": ["The sentence ends with <em>when Ms. Ferrante was hired<\/em>, a moment in the past. Before that moment, the center had run <em>for nearly two years<\/em>. So the form is <em>had been operating<\/em>.", "句尾 when Ms. Ferrante was hired 是過去的時點。在那之前，客服中心已經運作了 for nearly two years。所以用 had been operating。"]}}, {"id": "g-tense-08", "type": "grammar", "format": "gap", "unit": "tense", "level": 2, "source": "hand", "reviewed": true, "v": 1, "ldbs": "L D B", "stem": "Revenue from the company's online store, which has grown steadily every month since the website was redesigned, ______ the combined revenue of its four retail branches for the first time last quarter.", "options": ["has surpassed", "surpassed", "had surpassed", "will surpass"], "answer": 1, "explain": {"point": "明確的過去時間（last quarter）→ 過去式", "why": "句尾 for the first time last quarter 是已結束的過去時間，要用過去式 surpassed。", "wrong": ["被 has grown since 帶走；但 last quarter 不配現在完成", null, "句中沒有更早的過去時點可以對照", "未來式和 last quarter 矛盾"], "wrongMore": ["前面的 has grown … since 和 for the first time 都讓人想用現在完成式。但現在完成式不能和 last quarter 這種明確的過去時間連用；超越發生在上一季，用過去式。", null, null, null], "zh": "公司網路商店的營收自網站改版後每個月穩定成長，上一季首度超過四家實體分店的營收總和。", "vocab": [["revenue", "營收"], ["redesign", "重新設計、改版"], ["retail branch", "實體分店"]]}, "gloss": [{"w": "Revenue", "hw": "revenue", "pos": "n.", "zh": "營收", "ex": "Revenue rose by ten percent this year.", "ipa": "/ˈrevəˌnuː/"}, {"w": "retail branches", "hw": "retail branch", "pos": "phr.", "zh": "實體分店", "ex": "Each retail branch opens at nine.", "ipa": "/ˈriːˌteɪl bræntʃ/"}, {"w": "redesigned", "hw": "redesign", "pos": "v.", "zh": "重新設計", "ex": "They redesigned the website last spring.", "ipa": "/ˌriːdɪˈzaɪn/"}], "en": {"point": ["A finished past time (<em>last quarter<\/em>): simple past.", "已結束的過去時間（last quarter）：過去式。"], "why": ["<em>last quarter<\/em> is a finished time in the past. The revenue passed the branches' total then, so use the simple past: <em>surpassed<\/em>.", "last quarter 是已結束的過去時間。營收就是在那時超過分店總和，所以用過去式：surpassed。"]}}, {"id": "g-voice-04", "type": "grammar", "format": "gap", "unit": "voice", "level": 3, "source": "hand", "reviewed": true, "v": 1, "ldbs": "L D B S", "stem": "The two interns the head of the payroll department ______ to the benefits project last month have both been offered full-time positions starting in January.", "options": ["was assigned", "has been assigned", "assigning", "assigned"], "answer": 3, "explain": {"point": "省略關係代名詞的子句：先行詞是受詞 → 主動", "why": "interns 後省略了 that；主管 assigned (the interns) to the project，受詞就是 interns，用主動。", "wrong": ["局部像「主管被派去」，但 interns 就沒有位置了", "被動，而且 last month 不配現在完成", "子句缺動詞，Ving 不能當述語", null], "wrongMore": ["the head of the payroll department was assigned to… 單看是完整句子。但 The two interns 的動詞是後面的 have been offered，中間是修飾 interns 的子句；interns 是被指派的人，主管是「指派」的一方：assigned。", null, null, null], "zh": "薪資部主管上個月指派到福利專案的那兩位實習生，都已獲得一月起的正職職位。", "vocab": [["intern", "實習生"], ["payroll department", "薪資部"], ["benefits", "員工福利"]]}, "gloss": [{"w": "interns", "hw": "intern", "pos": "n.", "zh": "實習生", "ex": "Our intern helped with the spring survey.", "ipa": "/ˈɪntərn/"}, {"w": "payroll department", "hw": "payroll department", "pos": "phr.", "zh": "薪資部", "ex": "The payroll department closes its books on Friday.", "ipa": "/ˈpeɪˌroʊl dɪˈpɑːrtmənt/"}, {"w": "benefits", "hw": "benefit", "pos": "n.", "zh": "員工福利", "ex": "The company offers good benefits to all staff.", "ipa": "/ˈbenəfɪt/"}], "en": {"point": ["A clause with <em>that<\/em> left out: the verb is active.", "省略 that 的子句：動詞用主動。"], "why": ["The subject of <em>have been offered<\/em> is <em>The two interns<\/em>. In between is a clause with <em>that<\/em> left out: the head of the payroll department <em>assigned<\/em> the interns. The head acts, so the verb is active: <em>assigned<\/em>.", "have been offered 的主詞是 The two interns。中間是省略了 that 的子句：薪資部主管 assigned 了實習生。主管是做動作的人，所以用主動：assigned。"]}}, {"id": "g-participle-06", "type": "grammar", "format": "gap", "unit": "participle", "level": 2, "source": "hand", "reviewed": true, "v": 1, "ldbs": "L D S", "stem": "______ only two days' notice of the elevator repairs, the tenants on the upper floors had to arrange for their furniture deliveries to be carried up by hand.", "options": ["Given", "Giving", "Having given", "To give"], "answer": 0, "explain": {"point": "分詞構句的主詞＝主句主詞；收到通知用 p.p.", "why": "主詞是逗號後的 the tenants；房客是「被給予」通知的一方，用 Given。", "wrong": [null, "主動，等於房客發出通知，和 had to arrange 不合", "完成式主動，一樣是房客發出通知", "表目的不通：房客不是為了發通知"], "wrongMore": [null, "Giving only two days' notice of … 單看很自然（某人只給兩天通知）。但分詞構句的主詞就是主句主詞 the tenants；房客是收到通知、只好臨時安排的人，要用表被動的 Given。", "Having given 比 Giving 多了「先做完」的意思，但仍是主動：房客先發出通知。房客是收到通知的人，要用被動的 Given。", null], "zh": "電梯維修只提前兩天通知，高樓層的房客只好安排讓送來的家具用人力搬上樓。", "vocab": [["notice", "（事先）通知"], ["tenant", "房客、承租人"]]}, "gloss": [{"w": "notice", "hw": "notice", "pos": "n.", "zh": "（事先）通知", "ex": "We gave staff a week's notice.", "ipa": "/ˈnoʊtəs/"}, {"w": "tenants", "hw": "tenant", "pos": "n.", "zh": "房客、承租人", "ex": "The tenants pay rent on the first.", "ipa": "/ˈtenənt/"}, {"w": "by hand", "hw": "by hand", "pos": "phr.", "zh": "用人力、手工", "ex": "Please wash these glasses by hand.", "ipa": "/baɪ hænd/"}], "en": {"point": ["An opening participle shares the main subject: passive uses p.p.", "句首分詞的主詞就是主句主詞：被動用 p.p."], "why": ["The subject of the main clause is <em>the tenants<\/em>. They did not give the notice; they received <em>only two days' notice<\/em>. So the opening word is passive: <em>Given<\/em>.", "主句的主詞是 the tenants。他們不是發出通知的人，而是收到 only two days' notice 的人。所以句首用被動：Given。"]}}, {"id": "g-participle-07", "type": "grammar", "format": "gap", "unit": "participle", "level": 2, "source": "hand", "reviewed": true, "v": 1, "ldbs": "L D", "stem": "Employees ______ to transfer to the new Corran Street office when it opens in October should inform their department heads in writing by the end of June.", "options": ["wish", "wishing", "wished", "are wishing"], "answer": 1, "explain": {"point": "名詞後的 Ving 修飾語＝ who + 動詞", "why": "主要動詞是遠處的 should inform；空格到 October 是主詞，用 wishing 修飾 Employees。", "wrong": ["Employees wish… 單看完整，但 should inform 就沒主詞", null, "過去式當動詞，和後面的 should inform 撞", "也是完整動詞，和 should inform 撞"], "wrongMore": ["Employees wish to transfer to … 單看是完整句子。但讀到 should inform 就知道主要動詞在後面；前面整段是主詞，空格只能是修飾 Employees 的分詞 wishing（＝ who wish）。", null, null, null], "zh": "希望調到十月啟用的 Corran Street 新辦公室的員工，應在六月底前以書面通知所屬部門主管。", "vocab": [["transfer", "調職、轉調"], ["department head", "部門主管"], ["in writing", "以書面方式"]]}, "gloss": [{"w": "transfer", "hw": "transfer", "pos": "v.", "zh": "調職", "ex": "She asked to transfer to the Boston office.", "ipa": "/trænsˈfɜr/"}, {"w": "department heads", "hw": "department head", "pos": "n.", "zh": "部門主管", "ex": "Each department head approves leave requests.", "ipa": "/dɪˈpɑːrtmənt hed/"}, {"w": "in writing", "hw": "in writing", "pos": "phr.", "zh": "以書面方式", "ex": "Please confirm your request in writing.", "ipa": "/ɪn ˈraɪtɪŋ/"}], "en": {"point": ["A noun + Ving: the Ving phrase describes the noun.", "名詞 + Ving：Ving 片語修飾前面的名詞。"], "why": ["The main verb is the distant <em>should inform<\/em>. Everything from <em>Employees<\/em> to <em>October<\/em> is the subject. <em>Wishing<\/em> describes <em>Employees<\/em>, like <em>who wish<\/em>.", "主要動詞是遠處的 should inform。從 Employees 到 October 都是主詞。wishing 修飾 Employees，相當於 who wish。"]}}, {"id": "g-connect-07", "type": "grammar", "format": "gap", "unit": "connect", "level": 3, "source": "hand", "reviewed": true, "v": 1, "ldbs": "L D B S", "stem": "______ the revised safety regulations that the city council passed in March, all scaffolding on our construction sites must now be inspected by a certified engineer every week.", "options": ["Because", "Even though", "In light of", "Therefore"], "answer": 2, "explain": {"point": "空格後只有名詞片語、沒有主要動詞 → 介系詞", "why": "逗號前的 the revised … in March 是名詞片語，passed 屬於 that 子句，要用介系詞 In light of。", "wrong": ["意思對，但連接詞要接子句，這裡沒有主要動詞", "連接詞要接子句，讓步語氣也不對", null, "連接副詞不能帶名詞片語"], "wrongMore": ["Because the revised safety regulations that the city council passed… 一路都像子句，passed 也像動詞。但 passed 屬於 that 子句；拿掉它，逗號前只剩名詞片語 the regulations，沒有主要動詞，所以要介系詞。", null, null, null], "zh": "鑑於市議會三月通過的修訂安全法規，我們各工地的鷹架現在每週都必須由合格工程師檢查。", "vocab": [["regulation", "法規"], ["scaffolding", "鷹架"], ["certified", "經認證的、合格的"]]}, "gloss": [{"w": "regulations", "hw": "regulation", "pos": "n.", "zh": "法規", "ex": "New regulations take effect next month.", "ipa": "/ˌreɡjəˈleɪʃən/"}, {"w": "scaffolding", "hw": "scaffolding", "pos": "n.", "zh": "鷹架", "ex": "Workers put up scaffolding around the building.", "ipa": "/ˈskæfəldɪŋ/"}, {"w": "certified", "hw": "certified", "pos": "adj.", "zh": "經認證的、合格的", "ex": "She is a certified public accountant.", "ipa": "/ˈsɜrtəˌfaɪd/"}], "en": {"point": ["Only a noun phrase follows: use a preposition.", "後面只有名詞片語：用介系詞。"], "why": ["<em>the revised safety regulations that the city council passed in March<\/em> is only a noun phrase. <em>Passed<\/em> belongs to the <em>that<\/em> clause. There is no main verb before the comma, so the blank needs a preposition: <em>In light of<\/em>.", "the revised safety regulations that the city council passed in March 只是名詞片語。passed 屬於 that 子句。逗號前沒有主要動詞，所以空格要介系詞：In light of。"]}}, {"id": "g-connect-08", "type": "grammar", "format": "gap", "unit": "connect", "level": 2, "source": "hand", "reviewed": true, "v": 1, "ldbs": "L D B S", "stem": "______ the merger is approved by shareholders at next month's annual meeting or not, the two firms will continue to share the distribution center they jointly lease.", "options": ["If", "Unless", "Either", "Whether"], "answer": 3, "explain": {"point": "whether … or not ＝ 不論是否；if 不能這樣用", "why": "句中的 or not 跟 Whether 成對：不論併購是否通過，兩家公司都會繼續共用物流中心。", "wrong": ["局部是很通的條件句，但 if 不引導 … or not 的讓步", "unless 不和 or not 成對，邏輯也不通", "either 要配 or + 另一個完整選項", null], "wrongMore": ["If the merger is approved by shareholders… 單看是很自然的條件句。但讀到 or not, 就知道這是「不論是否」的讓步；if 只能在間接問句裡代替 whether，不能引導這種副詞子句。", null, null, null], "zh": "不論下個月的年度股東會是否通過這項併購，兩家公司都會繼續共用它們合租的物流中心。", "vocab": [["merger", "併購"], ["shareholder", "股東"], ["jointly", "共同地"]]}, "gloss": [{"w": "merger", "hw": "merger", "pos": "n.", "zh": "併購", "ex": "The merger created the largest bank in town.", "ipa": "/ˈmɜrdʒər/"}, {"w": "shareholders", "hw": "shareholder", "pos": "n.", "zh": "股東", "ex": "Each shareholder received a copy of the report.", "ipa": "/ˈʃerˌhoʊldər/"}, {"w": "distribution center", "hw": "distribution center", "pos": "phr.", "zh": "物流中心", "ex": "The distribution center ships orders every morning.", "ipa": "/ˌdɪstrəˈbjuːʃən ˈsentər/"}], "en": {"point": ["<em>Whether … or not<\/em> means 'no matter if'.", "Whether … or not 表示「不論是否」。"], "why": ["<em>or not<\/em> pairs with <em>Whether<\/em>. The firms <em>will continue to share<\/em> the center, no matter whether the merger is approved or not. The blank is <em>Whether<\/em>.", "or not 和 Whether 成對。句子說的是：不論併購是否通過，兩家公司 will continue to share 物流中心。空格是 Whether。"]}}, {"id": "g-agree-05", "type": "grammar", "format": "gap", "unit": "agree", "level": 3, "source": "hand", "reviewed": true, "v": 1, "ldbs": "L D B S", "stem": "The chief financial officer, as well as the two external auditors who reviewed last year's accounts, ______ expected to answer questions from the board at Thursday's budget review.", "options": ["is", "are", "have been", "being"], "answer": 0, "explain": {"point": "A, as well as B, + 動詞 → 跟 A 一致", "why": "拿掉兩個逗號間的 as well as … accounts，主詞是單數的 The chief financial officer，用 is。", "wrong": [null, "被 auditors 帶走；as well as 不等於 and", "複數動詞，主詞是單數的 officer", "沒有限定動詞，句子缺主要動詞"], "wrongMore": [null, "auditors are expected 單看完全對，而且 and 連接兩個主詞時確實用複數。但 as well as 帶出的是插入語，不改變主詞；拿掉兩個逗號之間那段，剩 The chief financial officer is expected。", null, null], "zh": "財務長，以及審查去年帳目的兩位外部稽核人員，預計在星期四的預算審查會上回答董事會的提問。", "vocab": [["chief financial officer", "財務長"], ["external auditor", "外部稽核人員"], ["accounts", "帳目"]]}, "gloss": [{"w": "chief financial officer", "hw": "chief financial officer", "pos": "phr.", "zh": "財務長", "ex": "The chief financial officer presented the budget.", "ipa": "/tʃiːf fəˈnænʃəl ˈɔːfəsər/"}, {"w": "external auditors", "hw": "external auditor", "pos": "phr.", "zh": "外部稽核人員", "ex": "The external auditor checks our accounts yearly.", "ipa": "/ɪkˈstɜrnəl ˈɔːdɪtər/"}, {"w": "budget review", "hw": "budget review", "pos": "phr.", "zh": "預算審查", "ex": "The budget review starts at ten.", "ipa": "/ˈbʌdʒɪt ˌriːˈvjuː/"}], "en": {"point": ["<em>A, as well as B,<\/em> + verb: agree with A.", "A, as well as B, + 動詞：跟 A 一致。"], "why": ["Take out the part between the commas: <em>as well as the two external auditors … accounts<\/em>. The subject is <em>The chief financial officer<\/em>, which is singular, so the verb is <em>is<\/em>.", "拿掉兩個逗號之間的 as well as the two external auditors … accounts。主詞是單數的 The chief financial officer，所以動詞用 is。"]}}, {"id": "g-agree-06", "type": "grammar", "format": "gap", "unit": "agree", "level": 3, "source": "hand", "reviewed": true, "v": 1, "ldbs": "L D S", "stem": "One of the courier vans that deliver to our downtown branches ______ been out of service since Tuesday, so some orders will arrive a day late this week.", "options": ["have", "has", "having", "to have"], "answer": 1, "explain": {"point": "One of the + 複數名詞 + 動詞 → 跟 One，用單數", "why": "主詞是句首的 One；that deliver … branches 修飾 vans，主要動詞跟 One：has been。", "wrong": ["被 branches 和 deliver 帶走；主詞是 One", null, "Ving 不能當主要動詞", "不定詞不能當主要動詞"], "wrongMore": ["branches have been out of service 局部通，而且子句裡的 deliver 是複數（跟 vans 一致），更容易讓人選複數。但整句的主詞是句首的 One，主要動詞要用單數 has。", null, null, null], "zh": "送貨到我們市區各分店的快遞車中，有一輛從星期二起就停用了，所以本週有些訂單會晚一天送達。", "vocab": [["courier van", "快遞車、送貨車"], ["out of service", "停用、無法使用"]]}, "gloss": [{"w": "courier vans", "hw": "courier van", "pos": "phr.", "zh": "快遞車、送貨車", "ex": "The courier van leaves the depot at seven.", "ipa": "/ˈkɜriər væn/"}, {"w": "downtown", "hw": "downtown", "pos": "adj.", "zh": "市中心的", "ex": "The bank has a downtown branch.", "ipa": "/ˈdaʊnˈtaʊn/"}, {"w": "out of service", "hw": "out of service", "pos": "phr.", "zh": "停用、無法使用", "ex": "The copier is out of service today.", "ipa": "/aʊt ʌv ˈsɜrvəs/"}], "en": {"point": ["<em>One of the<\/em> + plural noun: the verb agrees with <em>One<\/em>.", "One of the + 複數名詞：動詞跟 One 一致。"], "why": ["The subject is <em>One<\/em>. <em>that deliver to our downtown branches<\/em> only describes <em>vans<\/em>. <em>One<\/em> is singular, so the verb is <em>has<\/em>: <em>has been out of service<\/em>.", "主詞是 One。that deliver to our downtown branches 只是修飾 vans。One 是單數，所以動詞用 has：has been out of service。"]}}, {"id": "g-relative-05", "type": "grammar", "format": "gap", "unit": "relative", "level": 2, "source": "hand", "reviewed": true, "v": 1, "ldbs": "L D B S", "stem": "The firm has hired two outside consultants, both of ______ have advised major retailers on store design, to help plan the layout of its new flagship location.", "options": ["them", "who", "whom", "which"], "answer": 2, "explain": {"point": "逗號後「數量 + of + 關係代名詞」，指人用 whom", "why": "句子已有主要動詞 has hired，後面還接 to help plan，中間要關係代名詞：both of whom。", "wrong": ["both of them have… 局部通，但會變成兩句硬接", "介系詞 of 後面要用受格", null, "先行詞 consultants 是人"], "wrongMore": ["both of them have advised major retailers 本身是完整句子。但前面已有 The firm has hired…，兩個子句之間只有逗號、沒有連接詞，就是逗號連接錯誤；換成 whom，後半變成修飾 consultants 的關係子句。", null, null, null], "zh": "公司聘請了兩位外部顧問來協助規劃新旗艦店的配置，兩人都曾為大型零售商提供店面設計建議。", "vocab": [["consultant", "顧問"], ["retailer", "零售商"], ["flagship", "旗艦（店）"]]}, "gloss": [{"w": "consultants", "hw": "consultant", "pos": "n.", "zh": "顧問", "ex": "We hired a consultant to review our costs.", "ipa": "/kənˈsʌltənt/"}, {"w": "retailers", "hw": "retailer", "pos": "n.", "zh": "零售商", "ex": "Large retailers order goods in bulk.", "ipa": "/ˈriːˌteɪlər/"}, {"w": "flagship", "hw": "flagship", "pos": "adj.", "zh": "旗艦的", "ex": "The flagship store opens in May.", "ipa": "/ˈflæɡˌʃɪp/"}], "en": {"point": ["<em>both of<\/em> + relative word for people: <em>whom<\/em>.", "both of + 指人的關係代名詞：whom。"], "why": ["The firm <em>has hired<\/em> already has its main verb. The clause <em>have advised major retailers<\/em> must describe <em>two outside consultants<\/em>. After <em>of<\/em>, the relative word for people is <em>whom<\/em>.", "The firm has hired 已有主要動詞。have advised major retailers 這一句必須修飾 two outside consultants。of 後面指人的關係代名詞是 whom。"]}}, {"id": "g-relative-06", "type": "grammar", "format": "gap", "unit": "relative", "level": 2, "source": "hand", "reviewed": true, "v": 1, "ldbs": "L D B S", "stem": "The hotel ______ the members of our regional sales team stayed during last year's conference has offered us a reduced rate if we book thirty rooms by the end of May.", "options": ["which", "where", "what", "who"], "answer": 1, "explain": {"point": "關係子句完整、不缺受詞 → 關係副詞 where", "why": "子句 the members … stayed 已完整，stay 不及物、後面沒有 at，不缺受詞，用 where（= at which）。", "wrong": ["局部像受格關係子句，但 stayed 後沒有 at", null, "what 前面不接先行詞", "先行詞 hotel 不是人"], "wrongMore": ["The hotel which the members of… 局部像受格關係子句（which 當受詞）。但往後讀到 stayed during last year's conference：stay 不及物，後面也沒有 at，子句不缺受詞，which 沒有位置；要說 where 或 at which。", null, null, null], "zh": "我們區域業務團隊成員去年開會時住的那家飯店表示，只要我們在五月底前訂三十間房，就給我們優惠價。", "vocab": [["regional sales team", "區域業務團隊"], ["reduced rate", "優惠價"]]}, "gloss": [{"w": "regional sales team", "hw": "regional sales team", "pos": "phr.", "zh": "區域業務團隊", "ex": "The regional sales team meets every Monday.", "ipa": "/ˈriːdʒənəl seɪlz tiːm/"}, {"w": "reduced rate", "hw": "reduced rate", "pos": "phr.", "zh": "優惠價", "ex": "Groups get a reduced rate on weekdays.", "ipa": "/rəˈduːst reɪt/"}, {"w": "book", "hw": "book", "pos": "v.", "zh": "預訂", "ex": "Please book a table for six.", "ipa": "/bʊk/"}], "en": {"point": ["A complete clause with no missing object: use <em>where<\/em>.", "子句完整、不缺受詞：用 where。"], "why": ["In <em>the members of our regional sales team stayed during last year's conference<\/em>, nothing is missing. <em>Stayed<\/em> takes no object. The clause tells the place, so use <em>where<\/em>, meaning <em>at which<\/em>.", "the members of our regional sales team stayed during last year's conference 裡什麼都不缺。stayed 不接受詞。這個子句說明地點，所以用 where，意思是 at which。"]}}, {"id": "g-pronoun-05", "type": "grammar", "format": "gap", "unit": "pronoun", "level": 2, "source": "hand", "reviewed": true, "v": 1, "ldbs": "L D B S", "stem": "Ms. Kwon has asked the sales associates who joined the Linnet Street store this month to familiarize ______ with the return policy before the holiday sale begins.", "options": ["them", "their own", "they", "themselves"], "answer": 3, "explain": {"point": "familiarize oneself with：受詞是動作者自己 → 反身", "why": "familiarize 的動作者是遠處的 the sales associates，熟悉的是自己，要用 themselves。", "wrong": ["局部通，但 them 不能指動作者自己", "所有格後面要接名詞", "主格不能當受詞", null], "wrongMore": ["familiarize them with the return policy 單看是對的（讓他們熟悉）。但 to familiarize 的動作者就是 asked 的受詞 the sales associates；受詞和動作者是同一群人時，要用反身代名詞 themselves。", null, null, null], "zh": "Kwon 女士已要求這個月到 Linnet Street 分店報到的店員，在假日特賣開始前先熟悉退貨政策。", "vocab": [["sales associate", "店員、銷售人員"], ["familiarize", "使熟悉"], ["return policy", "退貨政策"]]}, "gloss": [{"w": "sales associates", "hw": "sales associate", "pos": "phr.", "zh": "店員、銷售人員", "ex": "Each sales associate wears a name badge.", "ipa": "/seɪlz əˈsoʊsiət/"}, {"w": "familiarize", "hw": "familiarize", "pos": "v.", "zh": "使熟悉", "ex": "Please familiarize yourself with the safety rules.", "ipa": "/fəˈmɪljərˌaɪz/"}, {"w": "return policy", "hw": "return policy", "pos": "phr.", "zh": "退貨政策", "ex": "Our return policy allows refunds within thirty days.", "ipa": "/rɪˈtɜrn ˈpɑːləsi/"}], "en": {"point": ["<em>familiarize<\/em> + reflexive pronoun + <em>with<\/em>.", "familiarize + 反身代名詞 + with。"], "why": ["The doer of <em>to familiarize<\/em> is <em>the sales associates<\/em>. They are the ones who learn the policy, so the object is the same people: <em>themselves<\/em>.", "to familiarize 的動作者是 the sales associates。要熟悉政策的就是他們自己，所以受詞用反身代名詞：themselves。"]}}, {"id": "g-pronoun-06", "type": "grammar", "format": "gap", "unit": "pronoun", "level": 2, "source": "hand", "reviewed": true, "v": 1, "ldbs": "L D", "stem": "The company looked at two buildings near the airport for its new claims-processing office, but ______ had enough parking for the evening shift, so it signed a lease on a third.", "options": ["neither", "both", "each", "either"], "answer": 0, "explain": {"point": "兩者都不：neither；看句尾的結果判斷", "why": "句尾 so it signed a lease on a third 表示兩棟都不合用，用 neither。", "wrong": [null, "局部通，但兩棟都夠就不必改租第三棟", "每棟都夠，就和句尾改租第三棟矛盾", "肯定句的 either 是「哪棟都行」，和句尾矛盾"], "wrongMore": [null, "but both had enough parking 單看完全合文法。但句尾 so it signed a lease on a third 說公司最後租了第三棟，表示前兩棟都不合用；能和 but、so 接起來的只有 neither。", null, null], "zh": "公司為新的理賠處理辦公室看了機場附近的兩棟大樓，但兩棟都沒有足夠的停車位給夜班使用，所以最後租了第三棟。", "vocab": [["claims-processing", "理賠處理"], ["lease", "租約"], ["evening shift", "夜班"]]}, "gloss": [{"w": "claims-processing", "hw": "claims-processing", "pos": "adj.", "zh": "理賠處理的", "ex": "The claims-processing team works on weekdays.", "ipa": "/kleɪmz ˈprɑːsesɪŋ/"}, {"w": "lease", "hw": "lease", "pos": "n.", "zh": "租約", "ex": "The lease runs for five years.", "ipa": "/liːs/"}, {"w": "evening shift", "hw": "evening shift", "pos": "phr.", "zh": "夜班", "ex": "He works the evening shift on Fridays.", "ipa": "/ˈiːvnɪŋ ʃɪft/"}], "en": {"point": ["<em>Neither<\/em> means 'not one of the two'.", "neither 表示「兩者都不」。"], "why": ["The sentence ends with <em>so it signed a lease on a third<\/em>. So the company did not use either of the <em>two buildings<\/em>. Neither one <em>had enough parking<\/em>: <em>neither<\/em>.", "句尾是 so it signed a lease on a third。所以公司沒有選那 two buildings 的任何一棟。兩棟都沒有 had enough parking：neither。"]}}, {"id": "g-prep-08", "type": "grammar", "format": "gap", "unit": "prep", "level": 3, "source": "hand", "reviewed": true, "v": 1, "ldbs": "L D B S", "stem": "The project manager blamed the three-week delay in completing the east wing of the hospital chiefly ______ the late arrival of steel beams from the supplier.", "options": ["for", "to", "on", "with"], "answer": 2, "explain": {"point": "blame 結果 on 原因／blame 責任者 for 結果", "why": "遠處 blamed 的受詞是結果 the delay，原因 the late arrival 前面要用 on。", "wrong": ["blame … for 是真用法，但 for 後要接結果", "attribute 才配 to，blame 不用 to", null, "blame 不和 with 搭配"], "wrongMore": ["blame … for 是真的用法，但那是 blame 責任者 for 結果（blamed the supplier for the delay）。這裡 blamed 的受詞是結果 the delay，原因放後面，要用 blame 結果 on 原因。", "chiefly to the late arrival 局部像 due chiefly to，但 due 或 attribute 才配 to；blame 只有 for 與 on 兩種用法。", null, null], "zh": "專案經理把醫院東翼延後三週完工，主要歸咎於供應商的鋼梁晚到。", "vocab": [["east wing", "東翼（建築）"], ["steel beam", "鋼梁"]]}, "gloss": [{"w": "blamed", "hw": "blame", "pos": "v.", "zh": "歸咎", "ex": "Don't blame the driver for the traffic.", "ipa": "/bleɪm/"}, {"w": "east wing", "hw": "east wing", "pos": "phr.", "zh": "東翼（建築）", "ex": "The east wing has a new lobby.", "ipa": "/iːst wɪŋ/"}, {"w": "steel beams", "hw": "steel beam", "pos": "phr.", "zh": "鋼梁", "ex": "Steel beams hold up the roof.", "ipa": "/stiːl biːm/"}], "en": {"point": ["<em>blame<\/em> the result <em>on<\/em> the cause.", "blame 結果 on 原因。"], "why": ["<em>Blamed<\/em> already has its object: <em>the three-week delay<\/em>. The cause comes next, <em>the late arrival of steel beams<\/em>, so the word before it is <em>on<\/em>.", "blamed 已有受詞：the three-week delay。接著是原因 the late arrival of steel beams，所以前面用 on。"]}}, {"id": "g-prep-09", "type": "grammar", "format": "gap", "unit": "prep", "level": 2, "source": "hand", "reviewed": true, "v": 1, "ldbs": "L D", "stem": "The new security software prevents employees who have not yet completed the annual data protection training ______ opening files stored in the client database.", "options": ["by", "for", "with", "from"], "answer": 3, "explain": {"point": "prevent + 人 + from + Ving", "why": "空格前很遠的 prevents 決定介系詞：prevents employees … from opening。", "wrong": ["by opening 局部像「藉由」，但 prevent 要配 from", "prevent 不配 for", "prevent 不配 with", null], "wrongMore": ["training by opening files 單看像「靠開檔案完成訓練」。但往前看，受詞 employees 前面是 prevents；prevent 人 from Ving 是固定結構，受詞再長也一樣。", null, null, null], "zh": "新的資安軟體會阻止尚未完成年度資料保護訓練的員工開啟客戶資料庫裡的檔案。", "vocab": [["data protection", "資料保護"], ["database", "資料庫"]]}, "gloss": [{"w": "prevents", "hw": "prevent", "pos": "v.", "zh": "阻止", "ex": "Locks prevent thieves from entering the shop.", "ipa": "/prɪˈvent/"}, {"w": "data protection", "hw": "data protection", "pos": "phr.", "zh": "資料保護", "ex": "New data protection rules start in May.", "ipa": "/ˈdeɪtə prəˈtekʃən/"}, {"w": "client database", "hw": "client database", "pos": "phr.", "zh": "客戶資料庫", "ex": "Only managers can edit the client database.", "ipa": "/ˈklaɪənt ˈdeɪtəˌbeɪs/"}], "en": {"point": ["<em>prevent<\/em> + person + <em>from<\/em> + Ving.", "prevent + 人 + from + Ving。"], "why": ["The verb <em>prevents<\/em> comes before a long object: <em>employees who have not yet completed the annual data protection training<\/em>. After that object, <em>prevent<\/em> needs <em>from<\/em>: <em>from opening<\/em>.", "動詞 prevents 後面接很長的受詞：employees who have not yet completed the annual data protection training。受詞之後，prevent 要配 from：from opening。"]}}, {"id": "g-toing-05", "type": "grammar", "format": "gap", "unit": "toing", "level": 2, "source": "hand", "reviewed": true, "v": 1, "ldbs": "L D B S", "stem": "To cut costs, the committee is considering, among several other measures proposed by the finance department, ______ the branch office on Morrow Lane when its lease expires.", "options": ["to close", "closing", "close", "closed"], "answer": 1, "explain": {"point": "consider + Ving（不接 to V）", "why": "空格是遠處 is considering 的受詞；拿掉插入的 among … department，就是 considering closing。", "wrong": ["measures to close 局部通，但 consider 不接 to V", null, "原形不能當 considering 的受詞", "p.p. 不能當 considering 的受詞"], "wrongMore": ["measures … department, to close the branch office 局部像「關閉分行的措施」，句首的 To cut costs 也讓 to V 顯得順。但逗號把插入語隔開，空格其實是 is considering 的受詞；consider 後面接 Ving。", null, null, null], "zh": "為了降低成本，委員會正在考慮財務部提出的幾項措施，其中之一是在 Morrow Lane 分行租約到期時將它關閉。", "vocab": [["measure", "措施"], ["branch office", "分行、分公司"], ["expire", "到期"]]}, "gloss": [{"w": "cut costs", "hw": "cut costs", "pos": "phr.", "zh": "降低成本", "ex": "We must cut costs this year.", "ipa": "/kʌt kɑːsts/"}, {"w": "measures", "hw": "measure", "pos": "n.", "zh": "措施", "ex": "The firm took new security measures.", "ipa": "/ˈmeʒər/"}, {"w": "expires", "hw": "expire", "pos": "v.", "zh": "到期", "ex": "My passport expires in May.", "ipa": "/ɪkˈspaɪr/"}], "en": {"point": ["<em>consider<\/em> + Ving.", "consider 後面接 Ving。"], "why": ["The blank is the object of <em>is considering<\/em>. Take out <em>among several other measures proposed by the finance department<\/em>, and you get <em>considering closing<\/em>.", "空格是 is considering 的受詞。拿掉插入的 among several other measures proposed by the finance department，就是 considering closing。"]}}, {"id": "g-toing-06", "type": "grammar", "format": "gap", "unit": "toing", "level": 3, "source": "hand", "reviewed": true, "v": 1, "ldbs": "L D B S", "stem": "After months of stalled negotiations, the two shipping firms are now closer than they have been at any point in the past three years ______ a long-term agreement on shared port facilities.", "options": ["to sign", "for signing", "to signing", "signing"], "answer": 2, "explain": {"point": "close to + Ving：這個 to 是介系詞", "why": "空格前很遠的 closer 決定這個 to 是介系詞：closer … to signing。", "wrong": ["局部像不定詞，但 close to 的 to 是介系詞", "close 不配 for", null, "少了 close 要接的 to"], "wrongMore": ["past three years to sign a long-term agreement 單看像不定詞。但往前找，這個 to 是 closer … to 的 to（接近某事），是介系詞，後面要接名詞或 Ving。", null, null, null], "zh": "經過數月停滯的談判，這兩家航運公司現在比過去三年中任何時候都更接近簽下共用港口設施的長期協議。", "vocab": [["stalled", "停滯的"], ["negotiation", "談判"], ["port facilities", "港口設施"]]}, "gloss": [{"w": "stalled", "hw": "stalled", "pos": "adj.", "zh": "停滯的", "ex": "The stalled talks resumed on Monday.", "ipa": "/stɔːld/"}, {"w": "negotiations", "hw": "negotiation", "pos": "n.", "zh": "談判", "ex": "The negotiation lasted three days.", "ipa": "/nɪˌɡoʊʃiˈeɪʃən/"}, {"w": "port facilities", "hw": "port facility", "pos": "phr.", "zh": "港口設施", "ex": "The port facility handles large ships.", "ipa": "/pɔːrt fəˈsɪlɪti/"}], "en": {"point": ["<em>close to<\/em> + Ving: this <em>to<\/em> is a preposition.", "close to + Ving：這個 to 是介系詞。"], "why": ["The word <em>closer<\/em> sits far before the blank. <em>Closer … to<\/em> means near to something, and this <em>to<\/em> is a preposition. A preposition takes Ving: <em>to signing<\/em>.", "closer 離空格很遠。closer … to 表示接近某事，這個 to 是介系詞。介系詞後面接 Ving：to signing。"]}}, {"id": "g-mandative-04", "type": "grammar", "format": "gap", "unit": "mandative", "level": 3, "source": "hand", "reviewed": true, "v": 1, "ldbs": "L D B S", "stem": "The supply agreement requires, in the clause on late deliveries, that any shipment arriving more than two days behind schedule ______ at a ten percent discount.", "options": ["be invoiced", "will be invoiced", "being invoiced", "to be invoiced"], "answer": 0, "explain": {"point": "require … that + 主詞 + 原形；被動是 be + p.p.", "why": "遠處的 requires … that 要求子句用原形；貨物是被開發票的一方，用 be invoiced。", "wrong": [null, "局部很通，但 require that 子句不用 will", "子句缺動詞，Ving 不能當述語", "that 子句裡不能用 to V"], "wrongMore": [null, "any shipment … will be invoiced at a discount 單看是正常的未來式。但它是 requires, in the clause…, that 帶出的子句：要求、規定的內容用原形，被動就是 be + p.p.。", null, null], "zh": "供貨合約在延遲交貨的條款中規定，凡是比預定時間晚超過兩天到貨的貨物，都必須以九折開立發票。", "vocab": [["supply agreement", "供貨合約"], ["clause", "條款"], ["behind schedule", "落後進度"]]}, "gloss": [{"w": "clause", "hw": "clause", "pos": "n.", "zh": "條款", "ex": "The contract has a clause on late payment.", "ipa": "/klɔːz/"}, {"w": "behind schedule", "hw": "behind schedule", "pos": "phr.", "zh": "落後進度", "ex": "The project is two weeks behind schedule.", "ipa": "/bɪˈhaɪnd ˈskedʒʊl/"}, {"w": "shipment", "hw": "shipment", "pos": "n.", "zh": "（一批）貨物", "ex": "The shipment arrived two days early.", "ipa": "/ˈʃɪpmənt/"}], "en": {"point": ["<em>require that<\/em> + subject + base verb.", "require that + 主詞 + 原形動詞。"], "why": ["<em>requires … that<\/em> sets up a demand, so the verb after <em>any shipment<\/em> stays in the base form. The shipment gets invoiced, so it is passive: <em>
